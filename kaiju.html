<title>Kaiju Clash</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #f3e7df;
    --dim: #a38f86;
    --ground: #120a0a;
    --panel: #1f1212;
    --line: #4a2a26;
    --fire: #ff8a3d;
    --volt: #7fe3ff;
    --font: "DotGothic16", "MS Gothic", "Osaka-Mono", ui-monospace, monospace;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 15px;
    padding-inline: 16px; padding-block: 16px 24px; box-sizing: border-box; }
  .wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 22px; font-weight: 400; letter-spacing: 0.08em; }
  h1 .a { color: var(--fire); } h1 .b { color: var(--volt); }
  .sub { color: var(--dim); font-size: 13px; }
  .screen { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; background: #000; border: 1px solid var(--line); }
  #view { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  .row { display: grid; grid-template-columns: 1fr minmax(0, 320px); gap: 14px; align-items: start; }
  @media (max-width: 760px) { .row { grid-template-columns: 1fr; } }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .label { color: var(--dim); font-size: 12px; letter-spacing: 0.1em; }
  button, select { font-family: var(--font); font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); padding: 6px 10px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--fire); color: var(--fire); }
  button.a { border-color: #7a3a1a; } button.b { border-color: #1f5a6e; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--volt); outline-offset: 2px; }
  button:disabled { opacity: 0.5; cursor: wait; }
  input[type="range"] { accent-color: var(--fire); width: 110px; }
  .log { margin: 0; padding: 10px 12px; list-style: none; background: var(--panel); border: 1px solid var(--line); min-height: 150px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .log li { display: flex; gap: 8px; }
  .log time { color: var(--dim); font-variant-numeric: tabular-nums; flex: none; }
  .log li.a { color: var(--fire); } .log li.b { color: var(--volt); } .log li.sys { color: #ffe08a; }
  #status { color: var(--volt); font-size: 13px; min-height: 1.2em; }
  .out { display: flex; flex-direction: column; gap: 8px; }
  .out img, .out video { max-width: 100%; image-rendering: pixelated; border: 1px solid var(--line); }
  .hint { color: var(--dim); font-size: 12px; line-height: 1.6; margin: 0; }
</style>

<div class="wrap">
  <header>
    <h1><span class="a">ボルガ</span> 対 <span class="b">ジンライ</span></h1>
    <span class="sub">怪獣大決戦 / 320×180 ピクセル / 自動バトル</span>
  </header>
  <div class="screen"><canvas id="view" width="1280" height="720"></canvas></div>
  <div class="row">
    <div class="controls">
      <div class="group">
        <button id="sound" aria-pressed="false">音を出す</button>
        <button id="bgm" aria-pressed="true">BGM</button>
        <label class="label" for="vol">音量</label>
        <input id="vol" type="range" min="0" max="100" value="70">
      </div>
      <div class="group" role="group" aria-label="技を出させる">
        <span class="label">技</span>
        <button class="a" data-m="A:breath">火炎放射</button>
        <button class="a" data-m="A:tail">尻尾</button>
        <button class="b" data-m="B:beam">雷撃ビーム</button>
        <button class="b" data-m="B:grab">投げ</button>
        <button class="b" data-m="B:rock">ビル投げ</button>
        <button data-m="X:special">必殺技</button>
      </div>
      <div class="group">
        <button id="slow" aria-pressed="false">スロー</button>
        <button id="pause" aria-pressed="false">一時停止</button>
        <button id="again">もう一戦</button>
      </div>
      <div class="group">
        <label class="label" for="gifsec">GIF</label>
        <select id="gifsec"><option value="4">4秒</option><option value="8" selected>8秒</option><option value="12">12秒</option></select>
        <select id="gifscale" aria-label="GIFサイズ"><option value="1">320×180</option><option value="2" selected>640×360</option></select>
        <button id="gif">GIFを作る</button>
        <button id="webm">動画を録画</button>
      </div>
      <p class="hint">溶岩怪獣ボルガ（火炎放射・尻尾・マグマノヴァ）と雷獣ジンライ（剛腕パンチ・投げ・ビル投げ・雷撃ビーム・天雷招来）が街で自動で戦います。ヒットストップ、画面の揺れ、フラッシュ、擬音、崩れるビル、戦闘機や戦車の攻撃付き。技ボタンで次の技を指定できます。音はすべてブラウザ内で合成しています。</p>
    </div>
    <ul class="log" id="log" aria-live="polite"></ul>
  </div>
  <div id="status" role="status"></div>
  <div class="out" id="out"></div>
</div>

<script>
(() => {
  "use strict";
  const W = 320, H = 180, GY = 148, WORLD = 760;
  const low = document.createElement("canvas"); low.width = W; low.height = H;
  const ctx = low.getContext("2d", { willReadFrequently: true });
  ctx.imageSmoothingEnabled = false;
  const view = document.getElementById("view"), vctx = view.getContext("2d");
  vctx.imageSmoothingEnabled = false;
  const FONT = '"DotGothic16", "MS Gothic", monospace';
  if (document.fonts && document.fonts.load) document.fonts.load(`12px ${FONT}`).catch(() => {});

  // ---------- helpers ----------
  function hash(i) { let h = Math.imul((i | 0) ^ 0x9e3779b9, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
  const mod = (a, n) => ((a % n) + n) % n;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${clamp(a, 0, 1).toFixed(3)})`;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[(Math.random() * a.length) | 0];
  function rect(x, y, w, h, c) {
    const x0 = Math.round(x), y0 = Math.round(y), x1 = Math.round(x + w), y1 = Math.round(y + h);
    ctx.fillStyle = typeof c === "string" ? c : rgb(c);
    ctx.fillRect(x0, y0, Math.max(1, x1 - x0), Math.max(1, y1 - y0));
  }
  const px = (x, y, c) => { ctx.fillStyle = typeof c === "string" ? c : rgb(c); ctx.fillRect(Math.round(x), Math.round(y), 1, 1); };
  function pxLine(x0, y0, x1, y1, style, t = 1) {
    ctx.fillStyle = typeof style === "string" ? style : rgb(style);
    const dx = x1 - x0, dy = y1 - y0, n = Math.max(Math.abs(dx), Math.abs(dy)) | 0;
    for (let i = 0; i <= n; i++) { const f = n ? i / n : 0; ctx.fillRect(Math.round(x0 + dx * f), Math.round(y0 + dy * f), t, t); }
  }
  function glow(x, y, r, c, a) {
    if (r < 0.5 || a <= 0.01) return;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, rgba(c, a)); g.addColorStop(0.35, rgba(c, a * 0.35)); g.addColorStop(1, rgba(c, 0));
    const prev = ctx.globalCompositeOperation; ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.globalCompositeOperation = prev;
  }

  // ---------- state ----------
  const S = {
    time: 0, camX: 200, trauma: 0, hitstop: 0, slow: 1, userSlow: false, flash: 0, flashCol: [255, 255, 255], impact: 0,
    round: 1, phase: "intro", phaseT: 0, damage: 0, collapsed: 0, wins: [0, 0],
    parts: [], texts: [], projs: [], jets: [], cars: [], tanks: [], people: [], bolts: [], cutin: null,
    nextJet: 12, paused: false, dither: true, heli: { x: 300, t: 0 },
  };
  const logEl = document.getElementById("log");
  function log(msg, cls = "") {
    const li = document.createElement("li"); li.className = cls;
    const t = document.createElement("time"); const s = Math.floor(S.time); t.textContent = `R${S.round} ${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
    const sp = document.createElement("span"); sp.textContent = msg;
    li.append(t, sp); logEl.prepend(li);
    while (logEl.children.length > 8) logEl.lastChild.remove();
  }

  // ---------- city ----------
  let buildings = [], skyline = [];
  function buildCity() {
    buildings = [];
    let x = 6, i = 0;
    while (x < WORLD - 20) {
      const w = Math.round(rnd(18, 40)), tall = Math.random() < 0.18;
      const h = Math.round(tall ? rnd(80, 112) : rnd(26, 70));
      const hue = pick([[44, 44, 60], [56, 50, 58], [40, 52, 64], [62, 58, 52], [48, 40, 46]]);
      buildings.push({ x, w, h, hp: w * h * 0.06, max: w * h * 0.06, col: hue, seed: (Math.random() * 1e6) | 0, state: "ok", burn: 0, fallT: 0, glass: 0,
        roof: pick(["none", "antenna", "tank", "sign", "none"]), signCol: pick([[255, 80, 150], [80, 220, 255], [255, 210, 80], [140, 255, 120]]) });
      x += w + Math.round(rnd(2, 12)); i++;
    }
    skyline = [];
    for (let sx = 0; sx < 1200; ) { const w = rnd(10, 26), h = rnd(20, 70); skyline.push({ x: sx, w, h, seed: (Math.random() * 1e6) | 0 }); sx += w + rnd(0, 4); }
    S.cars = []; for (let j = 0; j < 7; j++) S.cars.push(newCar(rnd(0, WORLD)));
    S.tanks = [0.2, 0.5, 0.8].map(f => ({ x: WORLD * f + rnd(-40, 40), cd: rnd(1, 4), dead: 0 }));
    S.people = [];
  }
  function newCar(x) {
    const lane = Math.random() < 0.5 ? 0 : 1;
    return { x, lane, v: (lane ? -1 : 1) * rnd(25, 45), col: pick([[200, 60, 50], [230, 230, 220], [60, 110, 180], [230, 200, 70], [40, 40, 44]]), dead: 0 };
  }

  // ---------- kaiju ----------
  const KAIJU = {
    A: { name: "ボルガ", cls: "a", col: [255, 140, 60] },
    B: { name: "ジンライ", cls: "b", col: [120, 220, 255] },
  };
  function makeKaiju(id, x, face) {
    return { id, x, y: 0, vx: 0, vy: 0, face, hp: 100, hpTrail: 100, state: "idle", st: 0, think: 0.8, flash: 0, elec: 0,
      walkPh: 0, stepAcc: 0, pose: { arm: 0, mouth: 0, head: 0, tail: 0, crouch: 0, rot: 0, lift: 0 }, sub: 0, hit: false,
      special: false, forced: null, combo: 0, spin: 0, glowT: 0 };
  }
  let K = [makeKaiju("A", 260, 1), makeKaiju("B", 460, -1)];
  const other = k => (k === K[0] ? K[1] : K[0]);

  // ---------- particles & texts ----------
  function part(p) { if (S.parts.length < 1800) S.parts.push(Object.assign({ t: 0, grav: 0, drag: 0, size: 1 }, p)); }
  function sparks(x, y, n, col, sp = 120) { for (let i = 0; i < n; i++) { const a = rnd(0, Math.PI * 2), v = rnd(sp * 0.4, sp); part({ type: "spark", x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rnd(0.15, 0.35), col, drag: 3 }); } }
  function dust(x, y, n, spread = 30, big = 1) { for (let i = 0; i < n; i++) part({ type: "dust", x: x + rnd(-spread, spread), y: y - rnd(0, 4), vx: rnd(-30, 30) * big, vy: rnd(-20, -2) * big, life: rnd(0.8, 1.6), size: rnd(3, 7) * big, drag: 1.5 }); }
  function debris(x, y, n, col, sp = 90) { for (let i = 0; i < n; i++) part({ type: "debris", x, y, vx: rnd(-sp, sp), vy: rnd(-sp * 1.4, -sp * 0.2), life: rnd(1, 2.2), grav: 320, col: mix(col, [0, 0, 0], rnd(0, 0.4)), size: rnd(1, 3) | 0 }); }
  function smoke(x, y, n, dark = 1) { for (let i = 0; i < n; i++) part({ type: "smoke", x: x + rnd(-4, 4), y, vx: rnd(-6, 6) + 6, vy: rnd(-22, -10), life: rnd(1.5, 3), size: rnd(3, 6), dark }); }
  function flame(x, y, vx, vy, life = 0.6, owner = null) { part({ type: "fire", x, y, vx, vy, life, drag: 0.8, owner, size: rnd(2, 4) }); }
  function text(str, x, y, col, size = 16, life = 0.9) { const t = { str, x, y, col, size, life, t: 0, rot: rnd(-0.18, 0.18) }; S.texts.push(t); return t; }
  function shake(a) { S.trauma = Math.min(1, S.trauma + a); }
  function flashScreen(a, col = [255, 255, 255]) { S.flash = Math.max(S.flash, a); S.flashCol = col; }

  // ---------- combat ----------
  const alive = k => k.state !== "ko";
  const grounded = k => k.y >= 0 && k.state !== "flying";
  function bodyBox(k) { return { x0: k.x - 17, x1: k.x + 17, y0: GY + k.y - 58, y1: GY + k.y }; }
  function inBody(k, x, y, pad = 0) { const b = bodyBox(k); return x > b.x0 - pad && x < b.x1 + pad && y > b.y0 - pad && y < b.y1 + pad; }
  function hit(att, def, dmg, kb, o = {}) {
    if (!alive(def) || S.phase !== "fight") return false;
    if ((def.state === "down" || def.state === "flying" || def.state === "getup") && !o.otg) return false;
    def.hp = Math.max(0, def.hp - dmg);
    def.flash = 0.12;
    def.vx = att.face * kb;
    S.hitstop = Math.max(S.hitstop, o.stop ?? 0.09);
    shake(o.shake ?? 0.35);
    const hx = def.x - att.face * 10, hy = GY + def.y - (o.h ?? 34);
    if (o.tick) { sparks(hx, hy, 3, o.col || [255, 240, 180], 90); if (Math.random() < 0.15) sfx("hit", 0.4); }
    else {
      sparks(hx, hy, o.big ? 26 : 14, o.col || [255, 240, 180], o.big ? 180 : 120);
      part({ type: "ring", x: hx, y: hy, life: 0.25, r0: 3, r1: o.big ? 30 : 16, col: o.col || [255, 255, 255] });
      sfx(o.big ? "heavy" : "hit", 1);
    }
    if (o.word) text(o.word, hx + rnd(-8, 8), hy - 12, o.col || [255, 240, 120], o.big ? 22 : 16);
    if (o.big) { flashScreen(0.35); S.impact = 0.05; }
    if (def.hp <= 0) { ko(def, att); return true; }
    if (o.launch) { def.state = "flying"; def.st = 0; def.vy = -o.launch; def.spin = att.face * 7; }
    else if (o.down) { def.state = "down"; def.st = 0; }
    else { def.state = "hurt"; def.st = 0; def.sub = o.stun ?? 0.3; }
    return true;
  }
  function ko(def, att) {
    def.state = "ko"; def.st = 0; def.vx = att.face * 120; def.vy = -120; def.y = Math.min(def.y, -2);
    S.phase = "ko"; S.phaseT = 0; S.slow = 0.22;
    flashScreen(0.9); S.impact = 0.12; shake(1);
    text("K.O.!!", 0, 0, [255, 230, 90], 40, 3.5).center = true;
    S.wins[att.id === "A" ? 0 : 1]++;
    log(`${KAIJU[def.id].name}、ダウン！ ${KAIJU[att.id].name}の勝利！`, "sys");
    sfx("ko", 1);
  }

  // ---------- buildings damage ----------
  function buildingsAt(x0, x1) { return buildings.filter(b => b.state !== "rubble" && b.state !== "collapsing" && b.x < x1 && b.x + b.w > x0); }
  function damageBuilding(b, amt, cause) {
    if (b.state === "rubble" || b.state === "collapsing") return;
    b.hp -= amt;
    if (cause === "fire" && b.state === "ok" && Math.random() < 0.35) { b.state = "burning"; }
    if (cause === "hit" || cause === "beam") { if (b.glass < 0.5) sfx("glass", 1); b.glass = 1; for (let i = 0; i < 6; i++) part({ type: "glass", x: b.x + rnd(0, b.w), y: GY - rnd(8, b.h), vx: rnd(-40, 40), vy: rnd(-60, 0), grav: 260, life: rnd(0.6, 1.2) }); }
    if (b.hp <= 0) collapse(b);
  }
  function collapse(b) {
    b.state = "collapsing"; b.fallT = 0; S.collapsed++;
    const cost = Math.round(b.w * b.h * 0.9);
    S.damage += cost;
    shake(0.45); sfx("collapse", 1);
    text("ガラガラ…", b.x + b.w / 2, GY - b.h * 0.6, [220, 220, 220], 14, 1.4);
    dust(b.x + b.w / 2, GY, 22, b.w / 2, 1.3);
    if (Math.random() < 0.5) log(`ビルが倒壊！（被害 ${cost}億円）`);
  }

  // ---------- AI & moves ----------
  function decide(k, o) {
    const d = Math.abs(o.x - k.x) - 30;
    if (k.forced) { const m = k.forced; k.forced = null; return start(k, m); }
    if (!k.special && k.hp < 40 && Math.random() < 0.6) return start(k, "special");
    const w = {};
    if (d < 22) { w.punch = 3; w.combo = 2.5; w.stomp = 1; if (k.id === "A") w.tail = 2.2; else w.grab = 2.2; w.back = 0.8; }
    else if (d < 95) { w.charge = 1.6; w.walk = 2.4; w.roar = 0.3; if (k.id === "A") w.breath = 2.4; else { w.beam = 2.2; w.rock = nearBuilding(k) ? 1.3 : 0; } }
    else { w.walk = 3.2; w.roar = 0.4; if (k.id === "A") w.breath = 1.2; else { w.beam = 1.4; w.rock = nearBuilding(k) ? 1.6 : 0; } w.charge = 0.8; }
    let r = Math.random() * Object.values(w).reduce((a, b) => a + b, 0), m = "walk";
    for (const [n, v] of Object.entries(w)) if ((r -= v) <= 0) { m = n; break; }
    start(k, m);
  }
  function nearBuilding(k) { return buildingsAt(k.x - 50, k.x + 50).find(b => b.h > 24); }
  function start(k, m) {
    if (m === "special") { k.special = true; startSpecial(k); return; }
    k.state = m; k.st = 0; k.sub = 0; k.hit = false; k.combo = 0;
    if (m === "walk") k.sub = rnd(0.8, 1.8);
    if (m === "back") k.sub = rnd(0.5, 0.9);
    if (m === "roar") { sfx(k.id === "A" ? "roarA" : "roarB", 1); text(k.id === "A" ? "グオオオ!!" : "ギャオオン!!", k.x + k.face * 12, GY - 80, KAIJU[k.id].col, 16, 1.2); }
    if (m === "breath") log("ボルガの火炎放射！", "a");
    if (m === "beam") log("ジンライの雷撃ビーム！", "b");
    if (m === "rock") log("ジンライがビルを引き抜いた！", "b");
  }
  function startSpecial(k) {
    k.state = "special"; k.st = 0; k.hit = false;
    const nm = k.id === "A" ? "マグマ・ノヴァ" : "天雷招来";
    S.cutin = { k, name: nm, t: 0 };
    log(`${KAIJU[k.id].name}の必殺技「${nm}」！`, k.id === "A" ? "a" : "b");
    sfx("cutin", 1);
  }

  function updateKaiju(k, dt) {
    const o = other(k), P = k.pose;
    k.st += dt; k.flash = Math.max(0, k.flash - dt); k.elec = Math.max(0, k.elec - dt);
    // relax pose
    P.arm = lerp(P.arm, 0, dt * 8); P.mouth = lerp(P.mouth, 0, dt * 6); P.head = lerp(P.head, 0, dt * 6); P.tail = lerp(P.tail, 0, dt * 5); P.crouch = lerp(P.crouch, 0, dt * 8);
    if (k.state !== "flying" && k.state !== "ko" && k.state !== "down" && k.state !== "getup") P.rot = lerp(P.rot, 0, dt * 10);
    const face = () => { if (alive(o)) k.face = o.x > k.x ? 1 : -1; };

    switch (k.state) {
      case "idle":
        face();
        if (k.st > k.think && S.phase === "fight" && !S.cutin) { k.think = rnd(0.2, 0.7); decide(k, o); }
        break;
      case "walk": case "back": {
        face();
        const dir = k.state === "walk" ? k.face : -k.face;
        k.vx = dir * (k.id === "A" ? 30 : 34);
        k.walkPh += dt * 6;
        k.stepAcc += dt;
        if (k.stepAcc > 0.52) { k.stepAcc = 0; footstep(k); }
        if (k.st > k.sub || (k.state === "walk" && Math.abs(o.x - k.x) < 48)) { k.state = "idle"; k.st = 0; k.vx = 0; }
        break;
      }
      case "punch": case "combo": {
        const n = k.state === "combo" ? 3 : 1, per = 0.42, i = Math.min(n - 1, Math.floor(k.st / per)), ph = k.st - i * per;
        if (i !== k.combo) { k.combo = i; k.hit = false; }
        if (ph < 0.16) { P.arm = -0.4; P.crouch = 2; }
        else if (ph < 0.26) {

      if (st % 2 === 0) tone("triangle", 440 * Math.pow(2, (bass - 69 + (st % 8 === 6 ? 12 : 0)) / 12), 440 * Math.pow(2, (bass - 69) / 12), spb * 1.8, 0.12, n.bgmG, t0);
      Snd.nextBeat += spb; Snd.step++;
    }
  }

  // ---------- GIF ----------
  const PALETTE = new Uint8Array(768);
  for (let i = 0; i < 216; i++) { PALETTE[i * 3] = LEVELS[(i / 36) | 0]; PALETTE[i * 3 + 1] = LEVELS[((i / 6) | 0) % 6]; PALETTE[i * 3 + 2] = LEVELS[i % 6]; }
  function lzw(ix, out) {
    let size = 9, next = 258, cur = 0, bits = 0; const dict = new Map(), bytes = [];
    const emit = c => { cur |= c << bits; bits += size; while (bits >= 8) { bytes.push(cur & 255); cur >>>= 8; bits -= 8; } };
    emit(256); let prefix = ix[0];
    for (let i = 1; i < ix.length; i++) {
      const k = ix[i], key = prefix * 256 + k, v = dict.get(key);
      if (v !== undefined) { prefix = v; continue; }
      emit(prefix);
      if (next < 4095) { dict.set(key, next++); if (next > (1 << size) && size < 12) size++; } else { emit(256); dict.clear(); size = 9; next = 258; }
      prefix = k;
    }
    emit(prefix); emit(257); if (bits > 0) bytes.push(cur & 255);
    out.push(8);
    for (let i = 0; i < bytes.length; i += 255) { const n = Math.min(255, bytes.length - i); out.push(n); for (let j = 0; j < n; j++) out.push(bytes[i + j]); }
    out.push(0);
  }
  function upscale(ix, k) {
    if (k === 1) return ix.slice();
    const w = W * k, o = new Uint8Array(w * H * k);
    for (let y = 0; y < H * k; y++) { const sy = ((y / k) | 0) * W, row = y * w; for (let x = 0; x < w; x++) o[row + x] = ix[sy + ((x / k) | 0)]; }
    return o;
  }
  async function makeGif(seconds = 8, scale = 2, fps = 20, onProgress) {
    const n = Math.round(seconds * fps), w = W * scale, h = H * scale, delay = Math.round(100 / fps);
    const out = []; for (const ch of "GIF89a") out.push(ch.charCodeAt(0));
    out.push(w & 255, w >> 8, h & 255, h >> 8, 0xf7, 0, 0); for (let i = 0; i < 768; i++) out.push(PALETTE[i]);
    out.push(0x21, 0xff, 0x0b); for (const ch of "NETSCAPE2.0") out.push(ch.charCodeAt(0)); out.push(3, 1, 0, 0, 0);
    for (let i = 0; i < n; i++) {
      const ix = frame(1 / fps);
      out.push(0x21, 0xf9, 4, 4, delay & 255, delay >> 8, 0, 0, 0x2c, 0, 0, 0, 0, w & 255, w >> 8, h & 255, h >> 8, 0);
      lzw(upscale(ix, scale), out);
      if (i % 4 === 3) { onProgress && onProgress(i + 1, n); await new Promise(r => setTimeout(r, 0)); }
    }
    out.push(0x3b); return new Uint8Array(out);
  }

  // ---------- UI ----------
  let last = performance.now();
  function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; if (!S.paused && !busy) frame(dt); requestAnimationFrame(loop); }
  const status = document.getElementById("status"), out = document.getElementById("out");
  const sBtn = document.getElementById("sound");
  sBtn.addEventListener("click", async () => {
    if (!Snd.ac && !audioInit()) { status.textContent = "このブラウザでは音を鳴らせません。"; return; }
    Snd.on = !Snd.on;
    if (Snd.on) { await Snd.ac.resume(); Snd.nextBeat = Snd.ac.currentTime + 0.1; } else await Snd.ac.suspend();
    sBtn.setAttribute("aria-pressed", String(Snd.on)); sBtn.textContent = Snd.on ? "音を消す" : "音を出す";
  });
  const bgmBtn = document.getElementById("bgm");
  bgmBtn.addEventListener("click", () => { Snd.bgm = !Snd.bgm; bgmBtn.setAttribute("aria-pressed", String(Snd.bgm)); });
  document.getElementById("vol").addEventListener("input", e => { Snd.vol = e.target.value / 100; if (Snd.n) Snd.n.master.gain.setTargetAtTime(Snd.vol, Snd.ac.currentTime, 0.05); });
  document.querySelectorAll("[data-m]").forEach(b => b.addEventListener("click", () => {
    const [who, m] = b.dataset.m.split(":");
    if (who === "X") { const k = K.find(k2 => alive(k2) && !k2.special && k2.state === "idle") || K.find(k2 => alive(k2) && !k2.special); if (k) { k.forced = "special"; } else status.textContent = "必殺技はこのラウンドではもう使いました。"; return; }
    const k = who === "A" ? K[0] : K[1]; if (alive(k)) k.forced = m;
  }));
  const slowBtn = document.getElementById("slow");
  slowBtn.addEventListener("click", () => { S.userSlow = !S.userSlow; slowBtn.setAttribute("aria-pressed", String(S.userSlow)); });
  const pBtn = document.getElementById("pause");
  function togglePause() { S.paused = !S.paused; pBtn.setAttribute("aria-pressed", String(S.paused)); pBtn.textContent = S.paused ? "再生" : "一時停止"; }
  pBtn.addEventListener("click", togglePause);
  document.getElementById("again").addEventListener("click", () => { S.round++; resetRound(); log("新しい戦いが始まる！", "sys"); });
  window.addEventListener("keydown", e => { if (e.code === "Space" && e.target === document.body) { e.preventDefault(); togglePause(); } });
  const gifBtn = document.getElementById("gif");
  gifBtn.addEventListener("click", async () => {
    busy = true; gifBtn.disabled = true;
    try {
      const bytes = await makeGif(+document.getElementById("gifsec").value, +document.getElementById("gifscale").value, 20, (i, n) => { status.textContent = `GIF 生成中… ${i}/${n} フレーム`; });
      const img = new Image(); img.src = URL.createObjectURL(new Blob([bytes], { type: "image/gif" })); img.alt = "書き出した怪獣バトルGIF"; out.prepend(img);
      status.textContent = `GIF ができました（${(bytes.length / 1048576).toFixed(1)} MB）。右クリック／長押しで保存できます。`;
    } catch (err) { status.textContent = `GIF の生成に失敗しました: ${err.message}`; }
    finally { busy = false; gifBtn.disabled = false; last = performance.now(); }
  });
  const webmBtn = document.getElementById("webm"); let rec = null;
  webmBtn.addEventListener("click", () => {
    if (rec) { rec.stop(); return; }
    if (!view.captureStream || typeof MediaRecorder === "undefined") { status.textContent = "このブラウザは動画録画に対応していません。GIF をお使いください。"; return; }
    const chunks = [], type = ["video/webm;codecs=vp9", "video/webm", "video/mp4"].find(t => MediaRecorder.isTypeSupported(t)) || "";
    rec = new MediaRecorder(view.captureStream(30), type ? { mimeType: type, videoBitsPerSecond: 8e6 } : undefined);
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => {
      const v = document.createElement("video"); v.src = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType || "video/webm" }));
      v.controls = v.loop = v.muted = v.autoplay = true; out.prepend(v);
      status.textContent = "録画しました（映像のみ）。動画の右クリック／長押しで保存できます。"; rec = null; webmBtn.textContent = "動画を録画";
    };
    rec.start(); webmBtn.textContent = "録画を止める"; status.textContent = "録画中… もう一度押すと停止します。";
  });

  resetRound();
  log("怪獣警報発令！ 市街地に2体の怪獣が出現", "sys");
  window.Kaiju = { S, get K() { return K; }, frame, makeGif, start, startSpecial };
  requestAnimationFrame(loop);
})();
</script>
