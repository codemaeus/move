<title>Campfire Rest</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #eef0ff;
    --dim: #8f96c2;
    --ground: #06081a;
    --panel: #10163a;
    --line: #2c3a7a;
    --gold: #ffd36b;
    --sky: #9fc2ff;
    --font: "DotGothic16", "MS Gothic", "Osaka-Mono", ui-monospace, monospace;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 15px;
    padding-inline: 16px; padding-block: 16px 24px; box-sizing: border-box; }
  .wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 22px; font-weight: 400; letter-spacing: 0.08em; color: var(--gold); }
  .sub { color: var(--dim); font-size: 13px; }
  .row { display: grid; grid-template-columns: minmax(0, 640px) 1fr; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .row { grid-template-columns: 1fr; } }
  .screen { position: relative; width: 100%; aspect-ratio: 256 / 224; max-width: 100%; background: #000; border: 1px solid var(--line); }
  #view { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  .side { display: flex; flex-direction: column; gap: 12px; }
  .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .label { color: var(--dim); font-size: 12px; letter-spacing: 0.1em; }
  button, select { font-family: var(--font); font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); padding: 6px 10px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  button.play { border-color: #7a6a2a; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
  button:disabled { opacity: 0.5; cursor: wait; }
  input[type="range"] { accent-color: var(--gold); width: 110px; }
  .log { margin: 0; padding: 10px 12px; list-style: none; background: var(--panel); border: 1px solid var(--line); min-height: 170px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .log li { display: flex; gap: 8px; }
  .log time { color: var(--dim); font-variant-numeric: tabular-nums; flex: none; }
  .log li.sys { color: var(--gold); } .log li.wx { color: var(--sky); }
  #status { color: var(--sky); font-size: 13px; min-height: 1.2em; }
  .out { display: flex; flex-direction: column; gap: 8px; }
  .out img, .out video { max-width: 100%; image-rendering: pixelated; border: 1px solid var(--line); }
  .hint { color: var(--dim); font-size: 12px; line-height: 1.6; margin: 0; }
</style>

<div class="wrap">
  <header>
    <h1>焚き火の夜</h1>
    <span class="sub">RPG の野営 / 256×224 ピクセル / 16ビット風</span>
  </header>
  <div class="row">
    <div class="screen"><canvas id="view" width="1024" height="896"></canvas></div>
    <div class="side">
      <div class="group">
        <button id="music" class="play" aria-pressed="false">音楽を流す</button>
        <label class="label" for="vol">音量</label>
        <input id="vol" type="range" min="0" max="100" value="70">
        <button id="amb" aria-pressed="true">環境音</button>
      </div>
      <div class="group" role="group" aria-label="天気">
        <span class="label">天気</span>
        <button data-w="auto" aria-pressed="true">自動</button>
        <button data-w="rain" aria-pressed="false">雨あり</button>
        <button data-w="dry" aria-pressed="false">雨なし</button>
      </div>
      <div class="group" role="group" aria-label="イベントを起こす">
        <span class="label">イベント</span>
        <button data-ev="battle">魔物</button>
        <button data-ev="merchant">行商人</button>
        <button data-ev="chest">宝箱</button>
        <button data-ev="stew">シチュー</button>
        <button data-ev="save">セーブ</button>
      </div>
      <div class="group">
        <button id="stats" aria-pressed="true">ステータス</button>
        <button id="pause" aria-pressed="false">一時停止</button>
      </div>
      <div class="group">
        <label class="label" for="gifsec">GIF</label>
        <select id="gifsec"><option value="4">4秒</option><option value="8" selected>8秒</option><option value="12">12秒</option></select>
        <select id="gifscale" aria-label="GIFサイズ"><option value="1">256×224</option><option value="2" selected>512×448</option></select>
        <button id="gif">GIFを作る</button>
        <button id="webm">動画を録画</button>
      </div>
      <ul class="log" id="log" aria-live="polite"></ul>
      <p class="hint">森の空き地で焚き火を囲むオリジナルのパーティー。茂みからスライムが出て戦闘になったり、行商人が来たり、宝箱やセーブポイントが見つかったり、レベルが上がったりします。雨になると僧侶が結界を張ります。音楽は 6/8 拍子の野営のテーマを毎回ブラウザ内で作曲・合成し、戦闘・勝利・レベルアップ・アイテム入手のジングルも鳴ります。</p>
      <div id="status" role="status"></div>
      <div class="out" id="out"></div>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";
  const W = 256, H = 224, FX = 128, FY = 134;
  const low = document.createElement("canvas"); low.width = W; low.height = H;
  const ctx = low.getContext("2d", { willReadFrequently: true });
  ctx.imageSmoothingEnabled = false;
  const view = document.getElementById("view"), vctx = view.getContext("2d");
  vctx.imageSmoothingEnabled = false;
  const FONT = '"DotGothic16", "MS Gothic", monospace';
  if (document.fonts && document.fonts.load) document.fonts.load(`10px ${FONT}`).catch(() => {});

  // ---------- helpers ----------
  function hash(i) { let h = Math.imul((i | 0) ^ 0x9e3779b9, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
  const mod = (a, n) => ((a % n) + n) % n;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${clamp(a, 0, 1).toFixed(3)})`;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[(Math.random() * a.length) | 0];
  function rect(x, y, w, h, c) { ctx.fillStyle = typeof c === "string" ? c : rgb(c); ctx.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h))); }
  const px = (x, y, c) => { ctx.fillStyle = typeof c === "string" ? c : rgb(c); ctx.fillRect(Math.round(x), Math.round(y), 1, 1); };
  function disc(x, y, rx, ry, c) { ctx.fillStyle = typeof c === "string" ? c : rgb(c); for (let dy = -ry; dy <= ry; dy++) { const w = Math.round(rx * Math.sqrt(Math.max(0, 1 - (dy / (ry + 0.5)) ** 2))); ctx.fillRect(Math.round(x - w), Math.round(y + dy), w * 2 + 1, 1); } }
  function line(x0, y0, x1, y1, c) { ctx.fillStyle = typeof c === "string" ? c : rgb(c); const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) | 0; for (let i = 0; i <= n; i++) { const f = n ? i / n : 0; ctx.fillRect(Math.round(lerp(x0, x1, f)), Math.round(lerp(y0, y1, f)), 1, 1); } }
  function glow(x, y, r, c, a) {
    if (a <= 0.01) return;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, rgba(c, a)); g.addColorStop(0.4, rgba(c, a * 0.35)); g.addColorStop(1, rgba(c, 0));
    const p = ctx.globalCompositeOperation; ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.globalCompositeOperation = p;
  }

  // ---------- state ----------
  const PARTY = [
    { id: "hero", name: "レオ", job: "剣士", lv: 12, hp: 88, mhp: 120 },
    { id: "mage", name: "ミナ", job: "魔法使い", lv: 11, hp: 54, mhp: 70 },
    { id: "thief", name: "カイ", job: "盗賊", lv: 12, hp: 70, mhp: 96 },
    { id: "priest", name: "セラ", job: "僧侶", lv: 10, hp: 66, mhp: 78 },
  ];
  const S = {
    time: 0, weather: "auto", rain: 0, lastWx: 0, flash: 0, fire: 1, flick: 1,
    parts: [], drops: [], splash: [], wisps: [], events: [], nextEvent: 4, nextTalk: 6,
    dialog: [], cur: null, barrier: 0, stats: true, paused: false,
    heroAwake: 0, pupSneeze: 0, chestGlint: 0, save: 0, stew: 0, owl: 0, slime: null, merchant: null, chest: null, shoot: null,
    nums: [], lvFx: 0, gold: 342,
  };
  const logEl = document.getElementById("log");
  const clock = () => { const m = 22 * 60 + 30 + Math.floor(S.time / 12); return `${String(Math.floor(m / 60) % 24).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`; };
  function log(msg, cls = "") {
    const li = document.createElement("li"); li.className = cls;
    const t = document.createElement("time"); t.textContent = clock();
    const sp = document.createElement("span"); sp.textContent = msg;
    li.append(t, sp); logEl.prepend(li);
    while (logEl.children.length > 9) logEl.lastChild.remove();
  }
  function say(who, text, hold = 1.8) { if (S.dialog.length > 2) S.dialog.shift(); S.dialog.push({ who, text, hold }); log(who ? `${who}「${text}」` : text, who ? "" : "sys"); }

  // ---------- static background (trees, canopy, ground) ----------
  const TRUNKS = [
    { x: 30, y0: 150, w: 14, lean: 6 }, { x: 62, y0: 108, w: 10, lean: -4 }, { x: 96, y0: 96, w: 9, lean: 3 }, { x: 150, y0: 92, w: 9, lean: -3 },
    { x: 186, y0: 100, w: 11, lean: 5 }, { x: 222, y0: 124, w: 14, lean: -6 }, { x: 118, y0: 90, w: 7, lean: 2 }, { x: 242, y0: 170, w: 12, lean: -2 },
  ];
  const CANOPY = [];
  for (let i = 0; i < 26; i++) { const t = i / 25; CANOPY.push({ x: t * 280 - 12 + hash(i) * 10, y: 6 + Math.sin(t * Math.PI) * -4 + hash(i + 9) * 12, r: 18 + hash(i + 3) * 14 }); }
  CANOPY.push({ x: 8, y: 70, r: 30 }, { x: 20, y: 110, r: 26 }, { x: 250, y: 64, r: 30 }, { x: 240, y: 100, r: 22 }, { x: -4, y: 150, r: 20 });
  const BUSHES = [];
  for (let i = 0; i < 18; i++) BUSHES.push({ x: -6 + i * 16 + hash(i * 7) * 6, y: 214 - Math.sin(i / 17 * Math.PI) * 6 + hash(i) * 8, r: 12 + hash(i * 3) * 8 });
  BUSHES.push({ x: 4, y: 188, r: 16 }, { x: 250, y: 196, r: 16 });
  const GRASS = Array.from({ length: 60 }, (_, i) => { const a = hash(i) * Math.PI * 2, r = Math.sqrt(hash(i + 100)) ; return { x: FX + Math.cos(a) * r * 104, y: FY + 6 + Math.sin(a) * r * 58 }; }).filter(g => Math.hypot(g.x - FX, (g.y - FY) * 1.6) > 22);

  function drawTrunk(t) {
    const top = 20, lightSide = t.x < FX ? 1 : -1;
    for (let y = top; y < t.y0; y++) {
      const k = (y - top) / (t.y0 - top), w = t.w * 1.5 * (0.75 + 0.35 * k) + (k > 0.85 ? (k - 0.85) * 40 : 0);
      const cx = t.x + Math.sin(k * 3 + t.x) * 2 + t.lean * (1 - k);
      rect(cx - w / 2, y, w, 1, [54, 44, 112]);
      rect(cx - w / 2, y, 2, 1, [30, 26, 70]); rect(cx + w / 2 - 2, y, 2, 1, [30, 26, 70]);
      const hx = lightSide > 0 ? cx + w / 2 - 4 : cx - w / 2 + 1;
      rect(hx, y, 3, 1, [196, 156, 62]);
      if ((y + t.x) % 7 < 3) px(hx - lightSide, y, [110, 90, 44]);
      if ((y * 3 + t.x) % 11 === 0) rect(cx - 1, y, 2, 1, [60, 50, 110]);
    }
    // forked branches up into the canopy
    for (const s of [-1, 1]) line(t.x + t.lean, top + 20, t.x + t.lean + s * 12, top - 4, [36, 30, 80]);
  }
  function drawCanopy(list, dark, edge, edge2) {
    for (const c of list) disc(c.x, c.y, c.r, c.r * 0.8, dark);
    for (const c of list) for (let i = 0; i < c.r * 9; i++) {
      const a = hash(c.x * 13 + i) * Math.PI * 2, rr = c.r * (0.8 + hash(c.y * 7 + i) * 0.22);
      const x = c.x + Math.cos(a) * rr, y = c.y + Math.sin(a) * rr * 0.8;
      if (Math.sin(a) < 0.5) px(x, y, hash(i + c.x) > 0.4 ? edge : edge2);
    }
  }
  function drawGround() {
    const g = ctx.createRadialGradient(FX, FY + 6, 10, FX, FY + 6, 130);
    g.addColorStop(0, "rgb(40,52,120)"); g.addColorStop(1, "rgb(14,20,60)");
    ctx.fillStyle = g; ctx.fillRect(0, 60, W, H - 60);
    ctx.fillStyle = "rgb(8,10,34)"; ctx.fillRect(0, 0, W, 64);
    for (let i = 0; i < 900; i++) { const x = hash(i * 3) * W, y = 60 + hash(i * 3 + 1) * (H - 60); px(x, y, hash(i * 5) > 0.5 ? [26, 36, 96] : [48, 62, 140]); }
    for (const gr of GRASS) { for (let j = -1; j <= 1; j++) line(gr.x + j * 2, gr.y, gr.x + j * 3, gr.y - 3 - Math.abs(j), [120, 120, 70]); }
    // stones & logs to sit on
    disc(FX - 30, FY + 22, 3, 2, [90, 90, 110]); disc(FX + 34, FY + 20, 2, 2, [90, 90, 110]); disc(FX - 44, FY - 4, 2, 1, [90, 90, 110]);
  }

  // ---------- sprites (all original characters) ----------
  function hero(x, y, awake) {
    if (!awake) { // asleep on the ground, rolled in a red blanket
      rect(x - 10, y - 4, 20, 6, [170, 50, 50]); rect(x - 10, y - 4, 20, 1, [210, 90, 80]); for (let i = 0; i < 4; i++) px(x - 8 + i * 5, y - 2, [230, 200, 80]);
      rect(x + 8, y - 6, 6, 5, [240, 200, 170]); rect(x + 8, y - 8, 7, 3, [230, 120, 40]); px(x + 14, y - 8, [230, 120, 40]); px(x + 13, y - 9, [230, 120, 40]); px(x + 10, y - 4, [60, 40, 40]);
      rect(x - 16, y - 2, 6, 2, [150, 150, 170]); px(x - 17, y - 2, [230, 200, 80]);
      return;
    }
    rect(x - 4, y - 8, 8, 8, [60, 90, 170]); rect(x - 5, y - 1, 10, 2, [80, 60, 50]);
    rect(x - 3, y - 14, 7, 6, [240, 200, 170]); rect(x - 4, y - 17, 9, 4, [230, 120, 40]); px(x + 5, y - 16, [230, 120, 40]); px(x - 5, y - 15, [230, 120, 40]);
    px(x - 1, y - 11, [40, 30, 30]); px(x + 2, y - 11, [40, 30, 30]); rect(x + 5, y - 12, 1, 12, [190, 190, 210]);
  }
  function mage(x, y, cast) {
    // lying on her stomach reading a spellbook, pointed hat
    rect(x - 9, y - 4, 16, 5, [110, 60, 150]); rect(x - 9, y - 4, 16, 1, [150, 90, 190]);
    rect(x - 13, y - 2, 5, 2, [80, 50, 40]);
    rect(x + 6, y - 7, 6, 5, [240, 210, 180]); rect(x + 5, y - 8, 8, 2, [60, 70, 170]); rect(x + 7, y - 12, 4, 4, [60, 70, 170]); px(x + 10, y - 13, [60, 70, 170]); px(x + 11, y - 14, [60, 70, 170]);
    rect(x + 12, y - 5, 2, 4, [220, 180, 90]);
    rect(x + 13, y - 3, 7, 4, [240, 235, 220]); rect(x + 16, y - 3, 1, 4, [120, 90, 60]);
    if (cast) { glow(x + 16, y - 6, 10, [150, 200, 255], 0.7); px(x + 16, y - 8, [255, 255, 255]); }
  }
  function thief(x, y, t) {
    rect(x - 5, y - 9, 10, 9, [50, 110, 70]); rect(x - 6, y - 1, 12, 2, [60, 50, 40]);
    rect(x - 4, y - 15, 8, 7, [60, 130, 80]); rect(x - 2, y - 13, 5, 4, [230, 190, 150]); px(x - 1, y - 12, [30, 30, 30]); px(x + 1, y - 12, [30, 30, 30]);
    const s = Math.sin(t * 6) > 0 ? 1 : 0;
    rect(x + 4, y - 6 - s, 4, 1, [200, 200, 220]); rect(x + 3, y - 6 - s, 1, 2, [120, 80, 50]);
    if (Math.sin(t * 6) > 0.95) { px(x + 8, y - 7, [255, 255, 220]); px(x + 9, y - 8, [255, 255, 220]); }
  }
  function priest(x, y, pray) {
    rect(x - 5, y - 9, 10, 9, [230, 230, 240]); rect(x - 5, y - 9, 10, 1, [255, 255, 255]); rect(x - 1, y - 8, 2, 7, [220, 180, 80]);
    rect(x - 3, y - 15, 7, 6, [240, 210, 180]); rect(x - 4, y - 17, 9, 4, [250, 220, 110]); rect(x - 4, y - 13, 2, 5, [250, 220, 110]);
    px(x - 1, y - 12, [40, 40, 60]); px(x + 1, y - 12, [40, 40, 60]);
    rect(x - 2, y - 7, 4, 2, [240, 210, 180]);
    if (pray) glow(x, y - 8, 12, [255, 240, 180], 0.4 + 0.2 * Math.sin(S.time * 4));
  }
  function golem(x, y) {
    rect(x - 10, y - 16, 20, 16, [120, 116, 104]); rect(x - 10, y - 16, 20, 2, [160, 154, 136]);
    rect(x - 13, y - 12, 4, 10, [100, 96, 88]); rect(x + 9, y - 12, 4, 10, [100, 96, 88]);
    rect(x - 7, y - 26, 14, 10, [134, 128, 114]); rect(x - 7, y - 26, 14, 2, [170, 164, 146]);
    const blink = Math.sin(S.time * 0.8) > 0.97;
    if (!blink) { rect(x - 4, y - 22, 3, 2, [120, 220, 255]); rect(x + 1, y - 22, 3, 2, [120, 220, 255]); glow(x, y - 21, 8, [120, 220, 255], 0.35); }
    for (let i = 0; i < 5; i++) px(x - 8 + hash(i) * 16, y - 14 + hash(i + 5) * 12, [80, 140, 80]);
    px(x + 6, y - 27, [120, 180, 90]); px(x + 7, y - 28, [240, 120, 150]);
  }
  function pup(x, y) {
    const b = Math.round(Math.sin(S.time * 1.4));
    disc(x, y - 3, 6, 3 + b * 0.3, [200, 90, 70]); rect(x - 6, y - 3, 3, 2, [230, 190, 90]);
    rect(x + 4, y - 7, 5, 4, [210, 100, 76]); px(x + 8, y - 6, [40, 20, 20]); px(x + 5, y - 8, [240, 220, 180]);
    rect(x - 3, y - 7, 5, 2, [150, 60, 60]); px(x - 1, y - 8, [150, 60, 60]);
    if (S.pupSneeze > 0) { const k = 1 - S.pupSneeze / 1; for (let i = 0; i < 6; i++) px(x + 10 + i * 2 * k + rnd(-1, 1), y - 6 + rnd(-2, 2), pick([[255, 200, 60], [255, 120, 40]])); }
    else if (Math.sin(S.time * 0.9) > 0.8) { const z = mod(S.time * 8, 10); px(x + 10, y - 10 - z, [220, 230, 255]); }
  }
  function loner(x, y) {
    rect(x - 5, y - 20, 10, 20, [40, 30, 70]); rect(x - 5, y - 20, 2, 20, [60, 44, 100]);
    rect(x - 3, y - 27, 7, 7, [220, 200, 200]); rect(x - 5, y - 29, 10, 5, [200, 200, 230]); rect(x - 5, y - 24, 2, 12, [200, 200, 230]);
    if (Math.sin(S.time * 0.5) > -0.3) { px(x, y - 24, [255, 60, 60]); px(x + 2, y - 24, [255, 60, 60]); }
    rect(x + 4, y - 18, 1, 18, [150, 150, 170]);
  }
  function slime(x, y, t, flash) {
    const sq = Math.abs(Math.sin(t * 5)) * 2, c = flash ? [255, 255, 255] : [80, 170, 240];
    disc(x, y - 4 + sq * 0.5, 7 + sq * 0.4, 5 - sq * 0.4, c);
    px(x - 3, y - 7, [255, 255, 255]); px(x - 2, y - 8, [255, 255, 255]);
    rect(x - 3, y - 5 + sq * 0.5, 1, 2, [20, 30, 60]); rect(x + 2, y - 5 + sq * 0.5, 1, 2, [20, 30, 60]);
  }
  function merchant(x, y, t) {
    const st = Math.floor(t * 4) & 1;
    rect(x - 9, y - 22, 12, 16, [150, 110, 60]); rect(x - 9, y - 22, 12, 2, [190, 150, 90]); rect(x - 7, y - 26, 8, 4, [200, 80, 60]);
    rect(x - 4, y - 12, 8, 10, [100, 80, 140]); rect(x - 3, y - 18, 7, 6, [240, 200, 170]); rect(x - 4, y - 20, 9, 3, [90, 70, 50]); rect(x - 5, y - 18, 11, 1, [90, 70, 50]);
    px(x + 1, y - 15, [40, 30, 30]); rect(x - 1, y - 13, 3, 1, [180, 130, 110]);
    rect(x - 3 + st, y - 2, 2, 2, [60, 50, 40]); rect(x + 1 - st, y - 2, 2, 2, [60, 50, 40]);
  }
  function chest(x, y, open) {
    rect(x - 7, y - 8, 14, 8, [150, 90, 40]); rect(x - 7, y - 8, 14, 1, [200, 140, 70]); rect(x - 7, y - 5, 14, 1, [230, 190, 80]);
    rect(x - 1, y - 6, 2, 3, [230, 190, 80]);

    if (rec) { rec.stop(); return; }
    if (!view.captureStream || typeof MediaRecorder === "undefined") { status.textContent = "このブラウザは動画録画に対応していません。GIF をお使いください。"; return; }
    const chunks = [], type = ["video/webm;codecs=vp9", "video/webm", "video/mp4"].find(t => MediaRecorder.isTypeSupported(t)) || "";
    rec = new MediaRecorder(view.captureStream(30), type ? { mimeType: type, videoBitsPerSecond: 6e6 } : undefined);
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => {
      const v = document.createElement("video"); v.src = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType || "video/webm" }));
      v.controls = v.loop = v.muted = v.autoplay = true; out.prepend(v);
      status.textContent = "録画しました（映像のみ）。動画の右クリック／長押しで保存できます。"; rec = null; webmBtn.textContent = "動画を録画";
    };
    rec.start(); webmBtn.textContent = "録画を止める"; status.textContent = "録画中… もう一度押すと停止します。";
  });

  say("", "森の奥で 野営をすることにした。");
  for (let i = 0; i < 20; i++) step(1 / 30);
  window.Camp = { S, frame, makeGif, startEvent };
  requestAnimationFrame(loop);
})();
</script>
