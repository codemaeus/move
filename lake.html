<title>Lantern Lake</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #ece6fa;
    --dim: #9a90bd;
    --ground: #0d0a1e;
    --panel: #181335;
    --line: #34295e;
    --warm: #ffc37a;
    --cool: #9fd6ff;
    --font: "DotGothic16", "MS Gothic", "Osaka-Mono", ui-monospace, monospace;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 15px;
    padding-inline: 16px; padding-block: 16px 24px; box-sizing: border-box; }
  .wrap { max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 420px) 1fr; gap: 18px; align-items: start; }
  @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } }
  .screen { position: relative; width: 100%; aspect-ratio: 9 / 16; max-width: 100%; background: #000; border: 1px solid var(--line); }
  #view { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  .hud { position: absolute; left: 10px; top: 8px; display: flex; gap: 10px; font-size: 13px; color: var(--warm); text-shadow: 0 0 4px #000; pointer-events: none; }
  .hud span:last-child { color: var(--cool); }
  .now { position: absolute; right: 10px; bottom: 8px; font-size: 12px; color: var(--dim); text-shadow: 0 0 4px #000; pointer-events: none; }
  .side { display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0; font-size: 22px; font-weight: 400; letter-spacing: 0.08em; color: var(--warm); }
  .sub { color: var(--dim); font-size: 13px; margin: 4px 0 0; }
  .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .label { color: var(--dim); font-size: 12px; letter-spacing: 0.1em; }
  button, select { font-family: var(--font); font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); padding: 6px 10px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--warm); color: var(--warm); }
  button.play { border-color: #7a5aa8; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--cool); outline-offset: 2px; }
  button:disabled { opacity: 0.5; cursor: wait; }
  input[type="range"] { accent-color: var(--warm); width: 110px; }
  .log { margin: 0; padding: 10px 12px; list-style: none; background: var(--panel); border: 1px solid var(--line); min-height: 170px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .log li { display: flex; gap: 8px; }
  .log time { color: var(--dim); font-variant-numeric: tabular-nums; flex: none; }
  .log li.wx { color: var(--cool); } .log li.ev { color: var(--warm); }
  #status { color: var(--cool); font-size: 13px; min-height: 1.2em; }
  .out { display: flex; flex-direction: column; gap: 8px; }
  .out img, .out video { max-width: 100%; image-rendering: pixelated; border: 1px solid var(--line); }
  .hint { color: var(--dim); font-size: 12px; line-height: 1.6; margin: 0; }
</style>

<div class="wrap">
  <div class="screen">
    <canvas id="view" width="720" height="1280"></canvas>
    <div class="hud" aria-hidden="true"><span id="hud-t">23:40</span><span id="hud-w">晴れ</span></div>
    <div class="now" id="now" aria-hidden="true"></div>
  </div>
  <div class="side">
    <div>
      <h1>ランタンの湖</h1>
      <p class="sub">夜の湖に浮かぶ小さな家 / 180×320 ピクセル / 縦長</p>
    </div>
    <div class="group">
      <button id="music" class="play" aria-pressed="false">音楽を流す</button>
      <label class="label" for="vol">音量</label>
      <input id="vol" type="range" min="0" max="100" value="70">
      <button id="amb" aria-pressed="true">環境音</button>
    </div>
    <div class="group" role="group" aria-label="天気">
      <span class="label">天気</span>
      <button data-w="auto" aria-pressed="true">自動</button>
      <button data-w="rain" aria-pressed="false">雨あり</button>
      <button data-w="dry" aria-pressed="false">雨なし</button>
    </div>
    <div class="group">
      <button id="pause" aria-pressed="false">一時停止</button>
      <label class="label" for="gifsec">GIF</label>
      <select id="gifsec"><option value="4">4秒</option><option value="8" selected>8秒</option><option value="12">12秒</option></select>
      <select id="gifscale" aria-label="GIFサイズ"><option value="1">180×320</option><option value="2" selected>360×640</option></select>
      <button id="gif">GIFを作る</button>
      <button id="webm">動画を録画</button>
    </div>
    <ul class="log" id="log" aria-live="polite"></ul>
    <p class="hint">天の川と三日月の下、いかだの上の木の家。デッキでランタンを持つハリネズミ、ボートで釣りをするカエル、バルコニーで星を見るネコ、屋根の上のフクロウ。流れ星、灯籠流し、跳ねる魚、カモの親子、岸に来る鹿、オーロラなどがときどき起こります。音楽は 3 拍子のオルゴールとハープの子守歌で、毎回ブラウザ内で作曲・合成しています。</p>
    <div id="status" role="status"></div>
    <div class="out" id="out"></div>
  </div>
</div>

<script>
(() => {
  "use strict";
  const W = 180, H = 320, H0 = 140;
  const low = document.createElement("canvas"); low.width = W; low.height = H;
  const ctx0 = low.getContext("2d", { willReadFrequently: true });
  let ctx = ctx0;
  ctx0.imageSmoothingEnabled = false;
  const view = document.getElementById("view"), vctx = view.getContext("2d");
  vctx.imageSmoothingEnabled = false;
  const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d"); x.imageSmoothingEnabled = false; return [c, x]; };
  const [bgC, bgX] = mk(W, H0 + 2);
  const [mwC, mwX] = mk(W, H0);
  const [houseC, houseX] = mk(112, 100);
  const [boatC, boatX] = mk(60, 34);
  const [logC, logX] = mk(150, 24);

  // ---------- helpers ----------
  function hash(i) { let h = Math.imul((i | 0) ^ 0x9e3779b9, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
  const mod = (a, n) => ((a % n) + n) % n;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const mul = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
  const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${clamp(a, 0, 1).toFixed(3)})`;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[(Math.random() * a.length) | 0];
  function rect(x, y, w, h, c) { ctx.fillStyle = typeof c === "string" ? c : rgb(c); ctx.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h))); }
  const px = (x, y, c) => { ctx.fillStyle = typeof c === "string" ? c : rgb(c); ctx.fillRect(Math.round(x), Math.round(y), 1, 1); };
  function line(x0, y0, x1, y1, c) { ctx.fillStyle = typeof c === "string" ? c : rgb(c); const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) | 0; for (let i = 0; i <= n; i++) { const f = n ? i / n : 0; ctx.fillRect(Math.round(lerp(x0, x1, f)), Math.round(lerp(y0, y1, f)), 1, 1); } }
  function disc(x, y, r, c) { ctx.fillStyle = typeof c === "string" ? c : rgb(c); for (let dy = -r; dy <= r; dy++) { const w = Math.floor(Math.sqrt(r * r - dy * dy + r * 0.8)); ctx.fillRect(Math.round(x - w), Math.round(y + dy), w * 2 + 1, 1); } }
  function glow(x, y, r, c, a) {
    if (r < 0.5 || a <= 0.01) return;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, rgba(c, a)); g.addColorStop(0.4, rgba(c, a * 0.35)); g.addColorStop(1, rgba(c, 0));
    const p = ctx.globalCompositeOperation; ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.globalCompositeOperation = p;
  }

  // ---------- state ----------
  const S = {
    time: 0, weather: "auto", rain: 0, wet: 0, lastWx: 0, flash: 0, bolt: null,
    drops: [], rings: [], splash: [], flies: [], puffs: [], events: [], nextEvent: 3,
    boatX: 8, fishT: 0, catScope: 0, owl: null, aurora: 0, paused: false, windows: [1, 1, 1, 0, 1],
  };
  const logEl = document.getElementById("log"), nowEl = document.getElementById("now");
  const clock = () => { const m = 23 * 60 + 40 + Math.floor(S.time / 15); return `${String(Math.floor(m / 60) % 24).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`; };
  function log(msg, cls = "ev") {
    const li = document.createElement("li"); li.className = cls;
    const t = document.createElement("time"); t.textContent = clock();
    const sp = document.createElement("span"); sp.textContent = msg;
    li.append(t, sp); logEl.prepend(li);
    while (logEl.children.length > 8) logEl.lastChild.remove();
  }

  // ---------- milky way (pre-rendered once) ----------
  (function buildMilkyWay() {
    ctx = mwX;
    const band = (x, y) => { const u = (x * 0.62 + y * 0.78) - 70, v = (x * 0.78 - y * 0.62); return { u, v }; };
    for (let i = 0; i < 26; i++) { const t = i / 25, x = lerp(175, 10, t), y = lerp(18, 110, t) + Math.sin(t * 6) * 6; ctx.globalCompositeOperation = "lighter"; const g = ctx.createRadialGradient(x, y, 0, x, y, 26); const c = i % 3 === 0 ? [150, 90, 170] : [110, 90, 190]; g.addColorStop(0, rgba(c, 0.18)); g.addColorStop(1, rgba(c, 0)); ctx.fillStyle = g; ctx.fillRect(x - 26, y - 26, 52, 52); }
    ctx.globalCompositeOperation = "source-over";
    for (let i = 0; i < 1400; i++) {
      const t = hash(i * 3), off = (hash(i * 3 + 1) - 0.5) * (hash(i * 3 + 2) * 30);
      const x = lerp(178, 4, t) + off * 0.6, y = lerp(16, 112, t) + off + Math.sin(t * 6) * 6;
      const b = hash(i * 7);
      ctx.fillStyle = rgba(b > 0.92 ? [255, 240, 255] : [200, 190, 240], 0.25 + b * 0.5);
      ctx.fillRect(x | 0, y | 0, 1, 1);
    }
    for (let i = 0; i < 12; i++) { const t = hash(i * 51), x = lerp(170, 10, t), y = lerp(20, 110, t) + Math.sin(t * 6) * 6; ctx.fillStyle = "rgba(20,12,40,0.35)"; ctx.fillRect(Math.round(x - 6), Math.round(y - 1 + hash(i) * 4), 12, 2); }
    ctx = ctx0;
  })();

  // ---------- weather ----------
  function weatherTarget() {
    if (S.weather === "rain") return 0.8;
    if (S.weather === "dry") return 0;
    const c = S.time % 110;
    return c < 45 ? 0 : c < 52 ? (c - 45) / 7 * 0.8 : c < 95 ? 0.8 : Math.max(0, 0.8 - (c - 95) / 7);
  }

  // ---------- events ----------
  const add = e => { e.t = 0; S.events.push(e); return e; };
  const active = t => S.events.some(e => e.type === t);
  function spawnSpecial(t) {
    switch (t) {
      case "shooting": add({ type: t, x: rnd(60, 170), y: rnd(10, 60), dur: 0.9 }); log("流れ星！ そっと願いごと"); break;
      case "fish": { const x = rnd(20, 160), y = rnd(215, 300); add({ type: t, x, y, dur: 1.2 }); log("湖で魚がぴちゃんと跳ねた"); sfx("splash"); break; }
      case "catch": S.fishT = 4; log("カエルの釣り竿がしなった。魚が釣れた！"); setTimeout(() => sfx("splash"), 1500); break;
      case "owl": S.owl = { t: 0 }; log("フクロウが夜空を一周して戻ってきた"); sfx("hoot"); break;
      case "scope": S.catScope = 12; log("ネコが望遠鏡で星をのぞいている"); break;
      case "lanterns": for (let i = 0; i < 5; i++) add({ type: "lantern", x: 40 - i * 12, y: 222 + (i % 2) * 10 + rnd(-3, 3), v: rnd(2.2, 3.2), dur: 80 }); log("灯籠流し。小さな灯りが水面をすべっていく"); break;
      case "paperboat": add({ type: "paperboat", x: -10, y: rnd(236, 250), v: 3.5, dur: 70 }); log("紙の舟がゆっくり流れてきた"); break;
      case "ducks": add({ type: "ducks", x: 190, y: rnd(155, 170), v: -4, dur: 70 }); log("カモの親子が一列に泳いでいく"); sfx("quack"); break;
      case "deer": add({ type: "deer", dur: 20 }); log("向こう岸に鹿が水を飲みにきた"); break;
      case "aurora": S.aurora = 25; log("空にうっすらオーロラが揺れている"); break;
      case "window": { const i = (Math.random() * S.windows.length) | 0; S.windows[i] = S.windows[i] ? 0 : 1; log(S.windows[i] ? "家の窓に灯りがともった" : "窓の灯りがひとつ消えた"); break; }
      case "loon": log("遠くで水鳥が長く鳴いた"); sfx("loon"); break;
      case "bottle": add({ type: "bottle", x: 190, y: rnd(270, 285), v: -2.5, dur: 90 }); log("手紙入りの瓶がぷかぷか流れてきた"); break;
      case "wave": add({ type: "wave", dur: 8 }); log("ハリネズミがランタンを大きく振っている"); break;
    }
  }
  function trySpecial() {
    const dry = S.rain < 0.1;
    const c = [["shooting", dry ? 2.5 : 0], ["fish", 2.5], ["catch", 1.8], ["owl", 1.5], ["scope", dry ? 1.8 : 0], ["lanterns", dry ? 1.5 : 0],
      ["paperboat", 1.2], ["ducks", 1.5], ["deer", 1.2], ["aurora", dry ? 0.5 : 0], ["window", 1.5], ["loon", 1.2], ["bottle", 0.8], ["wave", 1]]
      .filter(([t, w]) => w > 0 && !active(t) && !(t === "owl" && S.owl) && !(t === "scope" && S.catScope > 0) && !(t === "aurora" && S.aurora > 0) && !(t === "catch" && S.fishT > 0) && !(t === "lanterns" && active("lantern")));
    let r = Math.random() * c.reduce((a, x) => a + x[1], 0), t = c[0][0];
    for (const [n, w] of c) if ((r -= w) <= 0) { t = n; break; }
    spawnSpecial(t);
  }

  // ---------- update ----------
  function step(dt) {
    S.time += dt;
    S.rain += (weatherTarget() - S.rain) * Math.min(1, dt * 0.5);
    S.wet = S.rain > 0.1 ? Math.min(1, S.wet + dt * 0.1) : Math.max(0, S.wet - dt * 0.03);
    if (S.lastWx === 0 && S.rain > 0.2) { S.lastWx = 1; log("しとしとと雨が降りはじめた", "wx"); }
    else if (S.lastWx === 1 && S.rain < 0.08) { S.lastWx = 0; log("雨がやんで、天の川がまた見えてきた", "wx"); }
    // rain
    const want = Math.round(S.rain * 160);
    while (S.drops.length < want) S.drops.push({ x: rnd(-10, W), y: rnd(-20, H), v: rnd(150, 210), ty: rnd(H0 + 4, H) });
    if (S.drops.length > want) S.drops.length = want;
    for (const d of S.drops) {
      d.y += d.v * dt; d.x += d.v * 0.08 * dt;
      if (d.y > d.ty) { if (d.ty > H0) S.rings.push({ x: d.x, y: d.ty, t: 0, s: 0.6 + (d.ty - H0) / 180 }); d.y = rnd(-30, -4); d.x = rnd(-10, W); d.ty = rnd(H0 + 4, H); }
    }
    for (let i = S.rings.length - 1; i >= 0; i--) { S.rings[i].t += dt; if (S.rings[i].t > 1) S.rings.splice(i, 1); }
    if (Math.random() < dt * 0.6) S.rings.push({ x: rnd(0, W), y: rnd(H0 + 10, H), t: 0, s: 0.8 + Math.random() });
    S.flash = Math.max(0, S.flash - dt * 2.5);
    if (S.rain > 0.7 && Math.random() < dt * 0.035) { S.flash = 1; const b = []; let x = rnd(20, 160), y = 0; while (y < 80) { b.push([x, y]); x += rnd(-5, 5); y += rnd(3, 6); } S.bolt = { pts: b, t: 0 }; log("遠くの空で稲妻が光った", "wx"); setTimeout(() => sfx("thunder"), 800); }
    if (S.bolt) { S.bolt.t += dt; if (S.bolt.t > 0.2) S.bolt = null; }
    // fireflies
    const wf = S.rain < 0.1 ? 16 : 0;
    while (S.flies.length < wf) S.flies.push({ x: Math.random() < 0.5 ? rnd(4, 60) : rnd(120, 176), y: Math.random() < 0.5 ? rnd(112, 140) : rnd(265, 312), ph: rnd(0, 6) });
    if (S.flies.length > wf) S.flies.length = wf;
    for (const f of S.flies) { f.x += Math.sin(S.time * 0.6 + f.ph) * dt * 3; f.y += Math.cos(S.time * 0.5 + f.ph * 2) * dt * 2.5; }
    // chimney smoke
    if (Math.random() < dt * 3) S.puffs.push({ x: 64 + 75, y: 205 - 96 + 14, t: 0 });
    for (let i = S.puffs.length - 1; i >= 0; i--) { const p = S.puffs[i]; p.t += dt; p.y -= dt * 6; p.x += dt * 2.5; if (p.t > 3) S.puffs.splice(i, 1); }
    S.boatX = 12 + Math.sin(S.time * 0.05) * 10;
    S.fishT = Math.max(0, S.fishT - dt); S.catScope = Math.max(0, S.catScope - dt); S.aurora = Math.max(0, S.aurora - dt);
    if (S.owl) { S.owl.t += dt; if (S.owl.t > 7) S.owl = null; }
    S.nextEvent -= dt; if (S.nextEvent <= 0) { S.nextEvent = rnd(5, 10); trySpecial(); }
    for (let i = S.events.length - 1; i >= 0; i--) {
      const e = S.events[i]; e.t += dt;
      if (e.v) e.x += e.v * dt;
      if (e.t > e.dur || (e.v && (e.x > W + 20 || e.x < -30))) S.events.splice(i, 1);
    }
    audioUpdate(dt);
  }

  // ---------- sky, shores, water ----------
  function drawSky() {
    ctx = bgX;
    const cloud = clamp(S.rain * 1.4, 0, 1);
    const g = ctx.createLinearGradient(0, 0, 0, H0);
    g.addColorStop(0, rgb(mix([14, 10, 42], [22, 22, 36], cloud))); g.addColorStop(0.6, rgb(mix([46, 24, 86], [40, 38, 60], cloud))); g.addColorStop(1, rgb(mix([86, 46, 120], [58, 56, 76], cloud)));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H0 + 2);
    if (S.flash > 0) { ctx.fillStyle = rgba([200, 190, 240], S.flash * 0.4); ctx.fillRect(0, 0, W, H0); }
    ctx.globalAlpha = 1 - cloud; ctx.drawImage(mwC, 0, 0); ctx.globalAlpha = 1;
    for (let i = 0; i < 90; i++) {
      const x = hash(i * 5) * W, y = hash(i * 5 + 1) * (H0 - 20), tw = hash(i * 5 + 2);
      const a = (1 - cloud) * (0.35 + 0.65 * Math.abs(Math.sin(S.time * (0.4 + tw * 1.8) + i)));
      if (tw > 0.93) { const c = rgba([255, 245, 220], a); px(x, y, c); px(x - 1, y, rgba([255, 245, 220], a * 0.5)); px(x + 1, y, rgba([255, 245, 220], a * 0.5)); px(x, y - 1, rgba([255, 245, 220], a * 0.5)); px(x, y + 1, rgba([255, 245, 220], a * 0.5)); }
      else px(x, y, rgba([230, 225, 255], a * 0.7));
    }
    if (S.aurora > 0) {
      const a = Math.min(1, S.aurora / 3, (25 - S.aurora) / 3) * (1 - cloud);
      for (let x = 0; x < W; x += 2) { const h = 20 + Math.sin(x * 0.07 + S.time * 0.8) * 10 + Math.sin(x * 0.19 - S.time) * 5, y0 = 40 + Math.sin(x * 0.05 + S.time * 0.3) * 8; const gr = ctx.createLinearGradient(0, y0, 0, y0 + h); gr.addColorStop(0, rgba([120, 255, 180], 0)); gr.addColorStop(0.7, rgba([120, 255, 180], 0.25 * a)); gr.addColorStop(1, rgba([180, 120, 255], 0)); ctx.fillStyle = gr; ctx.fillRect(x, y0, 2, h); }
    }
    // crescent moon
    const mx = 76, my = 94, ma = 1 - cloud * 0.7;
    glow(mx, my, 34, [210, 190, 255], 0.25 * ma);
    ctx.globalAlpha = ma; disc(mx, my, 10, [248, 240, 255]); ctx.globalAlpha = 1; disc(mx + 5, my - 3, 9, mix(mix([46, 24, 86], [86, 46, 120], 0.2), mix([40, 38, 60], [58, 56, 76], 0.2), cloud));
    // clouds
    for (let i = 0; i < 7; i++) {
      const w = 40 + hash(i * 7) * 50, x = mod(hash(i * 11) * 320 + S.time * (1.5 + hash(i)), 320) - 70, y = 8 + hash(i * 13) * 70;
      ctx.fillStyle = rgba(mix([60, 40, 100], [52, 50, 70], cloud), 0.25 + cloud * 0.6);
      ctx.fillRect(Math.round(x + 5), Math.round(y), Math.round(w - 10), 3); ctx.fillRect(Math.round(x), Math.round(y + 3), Math.round(w), 6); ctx.fillRect(Math.round(x + 3), Math.round(y + 9), Math.round(w - 6), 2);

    } catch (err) { status.textContent = `GIF の生成に失敗しました: ${err.message}`; }
    finally { busy = false; gifBtn.disabled = false; last = performance.now(); }
  });
  const webmBtn = document.getElementById("webm"); let rec = null;
  webmBtn.addEventListener("click", () => {
    if (rec) { rec.stop(); return; }
    if (!view.captureStream || typeof MediaRecorder === "undefined") { status.textContent = "このブラウザは動画録画に対応していません。GIF をお使いください。"; return; }
    const chunks = [], type = ["video/webm;codecs=vp9", "video/webm", "video/mp4"].find(t => MediaRecorder.isTypeSupported(t)) || "";
    rec = new MediaRecorder(view.captureStream(30), type ? { mimeType: type, videoBitsPerSecond: 6e6 } : undefined);
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => {
      const v = document.createElement("video"); v.src = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType || "video/webm" }));
      v.controls = v.loop = v.muted = v.autoplay = true; out.prepend(v);
      status.textContent = "録画しました（映像のみ）。動画の右クリック／長押しで保存できます。"; rec = null; webmBtn.textContent = "動画を録画";
    };
    rec.start(); webmBtn.textContent = "録画を止める"; status.textContent = "録画中… もう一度押すと停止します。";
  });

  log("湖に浮かぶ家に灯りがともる夜", "wx");
  for (let i = 0; i < 20; i++) step(1 / 30);
  window.Lake = { S, frame, makeGif, spawnSpecial };
  requestAnimationFrame(loop);
})();
</script>
