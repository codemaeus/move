<title>Spirit Bathhouse</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #f3e9ee;
    --dim: #a894ae;
    --ground: #0d0914;
    --panel: #1b1222;
    --line: #3e2842;
    --gold: #f2c070;
    --cool: #9fd0ff;
    --font: "DotGothic16", "MS Gothic", "Osaka-Mono", ui-monospace, monospace;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 15px;
    padding-inline: 16px; padding-block: 16px 24px; box-sizing: border-box; }
  .wrap { max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 420px) 1fr; gap: 18px; align-items: start; }
  @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } }
  .screen { position: relative; width: 100%; aspect-ratio: 9 / 16; max-width: 100%; background: #000; border: 1px solid var(--line); }
  #view { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  .hud { position: absolute; left: 10px; top: 8px; display: flex; gap: 10px; font-size: 13px; color: var(--gold); text-shadow: 0 0 4px #000; pointer-events: none; }
  .hud span:last-child { color: var(--cool); }
  .side { display: flex; flex-direction: column; gap: 12px; }
  h1 { margin: 0; font-size: 22px; font-weight: 400; letter-spacing: 0.08em; color: var(--gold); }
  .sub { color: var(--dim); font-size: 13px; margin: 4px 0 0; }
  .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .label { color: var(--dim); font-size: 12px; letter-spacing: 0.1em; }
  button, select { font-family: var(--font); font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); padding: 6px 10px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  button.play { border-color: #8a4a3a; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--cool); outline-offset: 2px; }
  button:disabled { opacity: 0.5; cursor: wait; }
  input[type="range"] { accent-color: var(--gold); width: 110px; }
  .log { margin: 0; padding: 10px 12px; list-style: none; background: var(--panel); border: 1px solid var(--line); min-height: 170px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .log li { display: flex; gap: 8px; }
  .log time { color: var(--dim); font-variant-numeric: tabular-nums; flex: none; }
  .log li.wx { color: var(--cool); } .log li.ev { color: var(--gold); } .log li.yo { color: #e0a0ff; }
  #status { color: var(--cool); font-size: 13px; min-height: 1.2em; }
  .out { display: flex; flex-direction: column; gap: 8px; }
  .out img, .out video { max-width: 100%; image-rendering: pixelated; border: 1px solid var(--line); }
  .hint { color: var(--dim); font-size: 12px; line-height: 1.6; margin: 0; }
</style>

<div class="wrap">
  <div class="screen">
    <canvas id="view" width="720" height="1280"></canvas>
    <div class="hud" aria-hidden="true"><span id="hud-t">20:00</span><span id="hud-w">晴れ</span></div>
  </div>
  <div class="side">
    <div>
      <h1>海の上の湯屋</h1>
      <p class="sub">八百万の客が集う湯屋 / 180×320 ピクセル / 縦長</p>
    </div>
    <div class="group">
      <button id="music" class="play" aria-pressed="false">音を出す</button>
      <label class="label" for="vol">音量</label>
      <input id="vol" type="range" min="0" max="100" value="70">
      <button id="bgm" aria-pressed="true">音楽</button>
    </div>
    <div class="group" role="group" aria-label="天気">
      <span class="label">天気</span>
      <button data-w="auto" aria-pressed="true">自動</button>
      <button data-w="rain" aria-pressed="false">雨あり</button>
      <button data-w="dry" aria-pressed="false">雨なし</button>
    </div>
    <div class="group" role="group" aria-label="出来事を起こす">
      <span class="label">出来事</span>
      <button data-ev="open">開店の太鼓</button>
      <button data-ev="train">海原電車</button>
      <button data-ev="feast">大広間の宴</button>
      <button data-ev="fireworks">花火</button>
      <button data-ev="boiler">釜焚き</button>
      <button data-ev="bucket">湯を撒く</button>
      <button data-ev="rokuro">ろくろ首</button>
      <button data-ev="ferry">渡し舟</button>
    </div>
    <div class="group">
      <button id="pause" aria-pressed="false">一時停止</button>
      <label class="label" for="gifsec">GIF</label>
      <select id="gifsec"><option value="4">4秒</option><option value="8" selected>8秒</option><option value="12">12秒</option></select>
      <select id="gifscale" aria-label="GIFサイズ"><option value="1">180×320</option><option value="2" selected>360×640</option></select>
      <button id="gif">GIFを作る</button>
      <button id="webm">動画を録画</button>
    </div>
    <ul class="log" id="log" aria-live="polite"></ul>
    <p class="hint">海に浮かぶ五層の湯屋で、湯女や蛙の番頭、狐・鬼・天狗・一つ目小僧・提灯お化けといった客たちが、廊下を歩き、階段を上り下りし、障子の奥に影となって出入りします。開店の太鼓、海の上を走る電車、大広間の宴、花火、釜焚きの煙、ろくろ首、雨の日の傘お化けなどが起こります。音楽は三味線・箏・篠笛・太鼓の響きを毎回その場で合成しています。</p>
    <div id="status" role="status"></div>
    <div class="out" id="out"></div>
  </div>
</div>

<script>
(() => {
  "use strict";
  const W = 180, H = 320, HZ = 226, WL = 252;
  const low = document.createElement("canvas"); low.width = W; low.height = H;
  const ctx0 = low.getContext("2d", { willReadFrequently: true });
  let ctx = ctx0;
  ctx0.imageSmoothingEnabled = false;
  const view = document.getElementById("view"), vctx = view.getContext("2d");
  vctx.imageSmoothingEnabled = false;
  const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d"); x.imageSmoothingEnabled = false; return [c, x]; };
  const [bgC, bgX] = mk(W, HZ + 2);
  const [bathC, bathX] = mk(W, WL);
  const [trainC, trainX] = mk(128, 18);
  const [boatC, boatX] = mk(56, 26);
  const PFONT = '"DotGothic16", "MS Gothic", monospace';
  if (document.fonts && document.fonts.load) document.fonts.load(`8px ${PFONT}`).catch(() => {});

  // ---------- helpers ----------
  function hash(i) { let h = Math.imul((i | 0) ^ 0x9e3779b9, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
  const mod = (a, n) => ((a % n) + n) % n;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const mul = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
  const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${clamp(a, 0, 1).toFixed(3)})`;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[(Math.random() * a.length) | 0];
  let SIL = null; // when set, every draw uses this silhouette colour
  const col = c => SIL || (typeof c === "string" ? c : rgb(c));
  function rect(x, y, w, h, c) { ctx.fillStyle = col(c); ctx.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h))); }
  const px = (x, y, c) => { ctx.fillStyle = col(c); ctx.fillRect(Math.round(x), Math.round(y), 1, 1); };
  function line(x0, y0, x1, y1, c) { ctx.fillStyle = col(c); const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) | 0; for (let i = 0; i <= n; i++) { const f = n ? i / n : 0; ctx.fillRect(Math.round(lerp(x0, x1, f)), Math.round(lerp(y0, y1, f)), 1, 1); } }
  function disc(x, y, r, c) { ctx.fillStyle = col(c); for (let dy = -r; dy <= r; dy++) { const w = Math.floor(Math.sqrt(r * r - dy * dy + r * 0.8)); ctx.fillRect(Math.round(x - w), Math.round(y + dy), w * 2 + 1, 1); } }
  function glow(x, y, r, c, a) {
    if (r < 0.5 || a <= 0.01) return;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, rgba(c, a)); g.addColorStop(0.4, rgba(c, a * 0.35)); g.addColorStop(1, rgba(c, 0));
    const p = ctx.globalCompositeOperation; ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.globalCompositeOperation = p;
  }

  // ---------- building layout ----------
  // F: floor line (feet), T: top of the wall, L/R: wall extent
  const FL = [
    { F: 236, T: 202, L: 22, R: 158 },
    { F: 198, T: 168, L: 28, R: 152 },
    { F: 164, T: 136, L: 34, R: 146 },
    { F: 132, T: 104, L: 40, R: 140 },
    { F: 100, T: 74, L: 56, R: 124 },
  ];
  const RANGE = [[16, 186], [26, 154], [32, 148], [38, 142], [54, 126]];
  for (const [i, f] of FL.entries()) {
    f.pillars = []; f.wins = [];
    if (i < 4) {
      const n = Math.floor((f.R - f.L - 2) / 14), off = Math.round((f.R - f.L - n * 14) / 2);
      for (let k = 0; k <= n; k++) f.pillars.push(f.L + off + k * 14 - 1);
      for (let k = 0; k < n; k++) {
        const x = f.pillars[k] + 3;
        if (i === 0 && x + 9 > 76 && x < 104) continue;
        f.wins.push({ x, y: f.T + (i === 0 ? 8 : 5), w: 9, h: f.F - f.T - (i === 0 ? 12 : 9), on: 1 });
      }
    } else {
      f.pillars = [56, 72, 107, 122];
      f.wins = [{ x: 60, y: 80, w: 9, h: 16, on: 1 }, { x: 111, y: 80, w: 9, h: 16, on: 1 }, { x: 81, y: 78, w: 18, h: 18, on: 1, round: true }];
    }
  }
  const STAIRS = [0, 1, 2, 3].map(i => { const a = FL[i], b = FL[i + 1]; return [[a.L - 2, a.F - 1], [a.L - 12, Math.round((a.F + b.F) / 2)], [b.L - 3, b.F - 1]]; });
  const LAMPS = [];
  for (let i = 0; i < 4; i++) for (let x = FL[i].L + 5; x <= FL[i].R - 4; x += 12) LAMPS.push({ x, y: FL[i].T + 4, f: i });
  for (let x = 62; x <= 118; x += 14) LAMPS.push({ x, y: 78, f: 4 });

  // ---------- state ----------
  const S = {
    time: 0, weather: "auto", rain: 0, lastWx: 0, flash: 0, bolt: null, openT: 0,
    drops: [], rings: [], smoke: [], steam: [], water: [], fw: [], wisps: [], words: [], agents: [], events: [],
    nextEvent: 6, nextGuest: 2, train: null, ferry: null, feast: 0, boiler: 0, rokuro: null, tengu: null, fwQueue: 0, fwNext: 0, paused: false,
  };
  const logEl = document.getElementById("log");
  const clock = () => { const m = 20 * 60 + Math.floor(S.time / 12); return `${String(Math.floor(m / 60) % 24).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`; };
  function log(msg, cls = "ev") {
    const li = document.createElement("li"); li.className = cls;
    const t = document.createElement("time"); t.textContent = clock();
    const sp = document.createElement("span"); sp.textContent = msg;
    li.append(t, sp); logEl.prepend(li);
    while (logEl.children.length > 9) logEl.lastChild.remove();
  }
  const word = (str, x, y, c = [255, 236, 200], life = 1.2) => S.words.push({ str, x, y, c, t: 0, life });

  // ---------- people ----------
  const WORKERS = ["yuna", "yuna", "yuna", "kaeru", "kaeru"];
  const GUESTS = ["kitsune", "oni", "hitotsume", "tengu", "tanuki", "noppera", "chochin", "kitsune", "oni"];
  function makeAgent(kind, f, x, guest) {
    const a = { kind, f, x, y: FL[f].F - 1, tx: x, dir: Math.random() < 0.5 ? -1 : 1, st: "idle", t: rnd(0, 2), spd: guest ? rnd(4, 7) : rnd(6, 10), guest, carry: null, ph: rnd(0, 6), path: null, p: 0, win: null };
    if (!guest && Math.random() < 0.5) a.carry = pick(["tray", "tray", "towel", "bucket"]);
    S.agents.push(a); return a;
  }
  function plan(a) {
    const f = FL[a.f], [lo, hi] = RANGE[a.f];
    const opts = [["walk", 3], ["idle", 1.6], ["enter", f.wins.length ? 2 : 0], ["up", a.f < 4 ? (a.f === 3 ? 0.5 : 1.2) : 0], ["down", a.f > 0 ? 1.2 : 0], ["leave", a.guest && a.f === 0 ? 0.9 : 0]];
    let r = Math.random() * opts.reduce((s, o) => s + o[1], 0), c = "walk";
    for (const [k, w] of opts) if ((r -= w) <= 0) { c = k; break; }
    a.after = null;
    if (c === "walk") { a.st = "walk"; a.tx = rnd(lo, a.f === 0 ? 170 : hi); }
    else if (c === "idle") { a.st = "idle"; a.t = rnd(0.8, 4); }
    else if (c === "enter") { a.st = "walk"; a.win = pick(f.wins); a.tx = a.win.x + 4; a.after = "enter"; }
    else if (c === "up") { a.st = "walk"; a.tx = STAIRS[a.f][0][0]; a.after = "up"; }
    else if (c === "down") { a.st = "walk"; a.tx = STAIRS[a.f - 1][2][0]; a.after = "down"; }
    else { a.st = "walk"; a.tx = 190; a.after = "leave"; }
  }
  function arrive(a) {
    const k = a.after; a.after = null;
    if (k === "enter") { a.st = "in"; a.t = rnd(4, 10); a.tx = pick(FL[a.f].wins).x + 4; }
    else if (k === "up" || k === "down") { a.st = "stair"; a.p = 0; const s = STAIRS[k === "up" ? a.f : a.f - 1]; a.path = k === "up" ? s : [...s].reverse(); a.nf = k === "up" ? a.f + 1 : a.f - 1; }
    else if (k === "leave") { a.dead = true; }
    else plan(a);
  }
  function updateAgent(a, dt) {
    a.t -= dt;
    if (a.st === "walk" || a.st === "in") {
      const d = a.tx - a.x, s = a.spd * (a.st === "in" ? 0.6 : 1) * (S.feast > 0 && a.f === 4 ? 0.3 : 1);
      if (Math.abs(d) < 0.6) {
        if (a.st === "in") { if (a.t <= 0) { a.st = "walk"; a.x = Math.round(a.x); plan(a); } else a.tx = pick(FL[a.f].wins).x + 4; }
        else arrive(a);
      } else { a.dir = Math.sign(d); a.x += a.dir * Math.min(Math.abs(d), s * dt); }
    } else if (a.st === "idle" || a.st === "throw") {
      if (a.t <= 0) plan(a);
    } else if (a.st === "stair") {
      const [p0, p1, p2] = a.path, l1 = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]), l2 = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
      a.p += (a.spd * 0.7 * dt) / (l1 + l2);
      const d = a.p * (l1 + l2);
      if (a.p >= 1) { a.f = a.nf; a.x = p2[0]; a.y = FL[a.f].F - 1; a.st = "walk"; plan(a); return; }
      const [q0, q1, k] = d < l1 ? [p0, p1, d / l1] : [p1, p2, (d - l1) / l2];
      a.x = lerp(q0[0], q1[0], k); a.y = lerp(q0[1], q1[1], k); a.dir = Math.sign(q1[0] - q0[0]) || a.dir;
      return;
    }
    a.y = FL[a.f].F - 1;
  }
  function umbrella(x, y, c1, c2) {
    for (let r = 0; r < 3; r++) rect(x - 2 - (2 - r) * 1.5, y - 13 + r, 5 + (2 - r) * 3 - (2 - r) * 0 + r * 0, 1, r === 1 ? c2 : c1);
    rect(x, y - 10, 1, 4, [110, 80, 50]);
  }
  function drawPerson(a, sil) {
    const x = Math.round(a.x), y = Math.round(a.y), d = a.dir, moving = a.st === "walk" || a.st === "stair" || a.st === "in";
    const step = moving ? Math.floor(S.time * 6 + a.ph) & 1 : 0, hop = a.kind === "kasa" || a.kind === "chochin" ? (moving ? step * 2 : 0) : 0;
    SIL = sil ? "rgba(52,24,26,0.78)" : null;
    const legs = c => { if (a.kind === "kasa") { rect(x, y - 2 - hop, 1, 3, [230, 200, 170]); return; } px(x - 1 + step, y, c); px(x + 1 - step, y, c); };
    switch (a.kind) {
      case "yuna": {
        legs([236, 210, 190]); rect(x - 2, y - 6, 4, 6, [222, 118, 132]); rect(x - 2, y - 4, 4, 1, [246, 206, 120]); rect(x - 1, y - 9, 3, 3, [238, 202, 176]); rect(x - 1, y - 9, 3, 1, [30, 22, 30]); px(x - d * 2, y - 9, [30, 22, 30]); px(x - d * 2, y - 10, [30, 22, 30]); break;
      }
      case "kaeru": {
        legs([80, 120, 60]); rect(x - 2, y - 6, 4, 6, [58, 70, 126]); rect(x - 2, y - 5, 4, 1, [230, 230, 240]); rect(x - 2, y - 9, 4, 3, [118, 168, 78]); px(x - 2, y - 10, [240, 240, 230]); px(x + 1, y - 10, [240, 240, 230]); px(x + d, y - 7, [60, 80, 40]); break;
      }
      case "kitsune": {
        legs([240, 230, 220]); rect(x - 2, y - 6, 4, 6, [168, 54, 66]); rect(x - 2, y - 3, 4, 1, [240, 200, 110]); rect(x - 1, y - 9, 3, 3, [244, 240, 232]); px(x - 1, y - 10, [244, 240, 232]); px(x + 1, y - 10, [244, 240, 232]); px(x + d, y - 8, [220, 40, 40]); px(x - d * 3, y - 4, [240, 200, 140]); px(x - d * 3, y - 5, [250, 250, 245]); break;
      }
      case "oni": {
        legs([200, 80, 60]); rect(x - 2, y - 6, 4, 6, [120, 92, 60]); rect(x - 2, y - 3, 4, 1, [240, 200, 60]); rect(x - 2, y - 9, 4, 3, [212, 78, 60]); px(x - 2, y - 10, [250, 230, 150]); px(x + 1, y - 10, [250, 230, 150]); px(x + (d > 0 ? 1 : -2), y - 8, [255, 240, 200]); break;
      }
      case "hitotsume": {
        px(x - 1 + step, y, [160, 180, 200]); px(x + step - 0, y, [160, 180, 200]); rect(x - 1, y - 4, 3, 4, [80, 100, 150]); rect(x - 1, y - 7, 3, 3, [178, 196, 214]); px(x, y - 6, [30, 20, 30]); break;
      }
      case "tengu": {
        legs([200, 70, 50]); rect(x - 2, y - 6, 4, 6, [70, 70, 84]); px(x - 1, y - 5, [240, 240, 240]); px(x + 1, y - 5, [240, 240, 240]); rect(x - 1, y - 9, 3, 3, [214, 64, 50]); px(x + d * 2, y - 8, [214, 64, 50]); px(x + d * 3, y - 8, [214, 64, 50]); rect(x - 1, y - 10, 3, 1, [30, 30, 40]); break;
      }
      case "tanuki": {
        legs([90, 70, 50]); rect(x - 2, y - 6, 5, 6, [128, 96, 66]); rect(x - 1, y - 4, 3, 3, [226, 206, 176]); rect(x - 1, y - 9, 4, 3, [128, 96, 66]); px(x - 1, y - 10, [128, 96, 66]); px(x + 2, y - 10, [128, 96, 66]); px(x + (d > 0 ? 2 : -1), y - 8, [40, 30, 26]); rect(x - 2, y - 11, 5, 1, [120, 150, 70]); break;
      }
      case "noppera": {
        legs([230, 210, 190]); rect(x - 2, y - 6, 4, 6, [74, 62, 98]); rect(x - 2, y - 4, 4, 1, [180, 150, 200]); rect(x - 1, y - 9, 3, 3, [242, 226, 214]); rect(x - d - 1, y - 10, 3, 1, [20, 16, 24]); rect(x - d * 2, y - 9, 1, 5, [20, 16, 24]); break;
      }
      case "chochin": {
        rect(x - 2, y - 9 - hop, 5, 8, SIL ? "" : mul([255, 196, 120], 0.8 + 0.2 * Math.sin(S.time * 8 + a.ph))); rect(x - 2, y - 10 - hop, 5, 1, [40, 30, 30]); rect(x - 2, y - 1 - hop, 5, 1, [40, 30, 30]);
        for (let k = 0; k < 3; k++) rect(x - 2, y - 8 + k * 2 - hop, 5, 1, [220, 150, 90]); px(x, y - 7 - hop, [30, 20, 20]); rect(x - 1, y - 4 - hop, 3, 1, [200, 40, 50]); px(x + d, y, [230, 200, 170]); break;
      }
      case "kasa": {
        legs(); for (let r = 0; r < 5; r++) rect(x - r, y - 12 + r - hop, r * 2 + 1, 1, r % 2 ? [226, 200, 150] : [190, 56, 56]); rect(x - 5, y - 7 - hop, 11, 1, [120, 40, 40]); px(x, y - 9 - hop, [255, 255, 240]); px(x + 1, y - 9 - hop, [30, 20, 20]); rect(x - 1, y - 6 - hop, 3, 1, [200, 40, 60]); break;
      }
    }

    osc("triangle", f, t0, 1.8, envG(t0, 0.003, 0.06 * vel, 1.8, d));
    osc("sine", f * 2, t0, 0.7, envG(t0, 0.002, 0.03 * vel, 0.7, d));
    osc("sine", f * 3.01, t0, 0.25, envG(t0, 0.001, 0.015 * vel, 0.25, d));
  }
  function fue(m, t0, dur) {
    const d = Snd.n.music, f = mf(m);
    const g = Snd.ac.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(0.045, t0 + 0.12); g.gain.setValueAtTime(0.04, t0 + dur * 0.7); g.gain.linearRampToValueAtTime(0.0001, t0 + dur); g.connect(d);
    const o = osc("sine", f * 0.98, t0, dur, g); o.frequency.linearRampToValueAtTime(f, t0 + 0.12);
    const v = Snd.ac.createOscillator(), vg = Snd.ac.createGain(); v.frequency.value = 5.5; vg.gain.setValueAtTime(0, t0); vg.gain.linearRampToValueAtTime(18, t0 + dur); v.connect(vg); vg.connect(o.detune); v.start(t0); v.stop(t0 + dur);
    const s = Snd.ac.createBufferSource(); s.buffer = Snd.n.white; s.loop = true; const bp = Snd.ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = f * 2; bp.Q.value = 3;
    s.connect(bp); bp.connect(envG(t0, 0.05, 0.015, dur, d)); s.start(t0); s.stop(t0 + dur);
  }
  function taiko(t0, vol, dest) {
    const o = osc("sine", 110, t0, 0.6, envG(t0, 0.003, 0.35 * vol, 0.6, dest || Snd.n.music)); o.frequency.exponentialRampToValueAtTime(52, t0 + 0.3);
    const s = Snd.ac.createBufferSource(); s.buffer = Snd.n.white; const lp = Snd.ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 500; s.connect(lp); lp.connect(envG(t0, 0.002, 0.15 * vol, 0.12, dest || Snd.n.music)); s.start(t0); s.stop(t0 + 0.15);
  }
  function clack(t0, f, vol) { osc("square", f, t0, 0.03, envG(t0, 0.001, vol, 0.04, Snd.n.master)); }
  let melIdx = 3;
  function audioUpdate(dt) {
    if (!live()) return;
    const ac = Snd.ac, n = Snd.n, t = ac.currentTime, feast = S.feast > 0;
    if (Snd.bgm) {
      const beatLen = feast ? 0.42 : 0.6;
      while (Snd.nextBeat < t + 0.3) {
        const tt = Snd.nextBeat, b = Snd.beat % 3, bar = Math.floor(Snd.beat / 3), [root, ch] = PROG[bar % 8];
        if (b === 0) { shamisen(root, tt, 1); if (bar % 4 === 0 || feast) taiko(tt, feast ? 0.8 : 0.45); }
        else { shamisen(ch[b] - 12 + 12, tt, 0.45); if (feast) { shamisen(ch[(b + 1) % 3], tt + beatLen / 2, 0.35); clack(tt, 1800, 0.02); } }
        if (Math.random() < (b === 0 ? 0.85 : 0.5) && bar % 16 < 12) {
          melIdx = clamp(melIdx + pick([-2, -1, -1, 1, 1, 2]), 0, MEL.length - 1);
          const m = b === 0 ? ch.reduce((best, c) => Math.abs(c + 12 - MEL[melIdx]) < Math.abs(best - MEL[melIdx]) ? c + 12 : best, ch[0] + 12) : MEL[melIdx];
          koto(m, tt, 0.9); if (Math.random() < 0.3) koto(m, tt + beatLen / 2, 0.6);
        }
        Snd.nextBeat += beatLen; Snd.beat++;
      }
      if (t > Snd.nextFlute) { let tt = t + 0.1; const k = 2 + ((Math.random() * 3) | 0); for (let i = 0; i < k; i++) { const d = pick([0.9, 1.2, 1.8]); fue(pick([74, 76, 77, 81, 82]), tt, d); tt += d; } Snd.nextFlute = tt + rnd(9, 16); }
    }
    const outside = S.agents.filter(a => a.st === "walk" || a.st === "stair").length;
    if (Math.random() < dt * outside * 0.35) clack(t, pick([1500, 1700, 2100]), 0.012);
    n.crowdG.gain.setTargetAtTime((0.05 + 0.03 * Math.sin(S.time * 0.7) + (feast ? 0.05 : 0)) * lampOn(0), t, 0.4);
    n.rainG.gain.setTargetAtTime(S.rain * 0.3, t, 0.3); n.hissG.gain.setTargetAtTime(S.rain * 0.035, t, 0.3);
    n.lapG.gain.setTargetAtTime(0.05 + 0.04 * Math.sin(S.time * 0.9), t, 0.2);
    if (S.rain > 0.2 && Math.random() < dt * 6) osc("sine", rnd(1400, 3200), t, 0.06, envG(t, 0.002, 0.01, 0.06, n.master));
    if (Math.random() < dt * 0.12) { const f = rnd(2400, 3000); osc("sine", f, t, 1.4, envG(t, 0.002, 0.02, 1.4, n.conv)); osc("sine", f * 2.7, t, 0.6, envG(t, 0.002, 0.008, 0.6, n.conv)); }
    if (S.train && t > Snd.trainClack) { const near = 1 - Math.abs(S.train.x + 64 - 90) / 200; clack(t, 300, 0.03 * near); clack(t + 0.12, 280, 0.03 * near); Snd.trainClack = t + 0.55; }
  }
  function sfx(kind) {
    if (!live()) return;
    const ac = Snd.ac, t0 = ac.currentTime, m = Snd.n.master, cv = Snd.n.conv;
    const noise = (type, f, q, dur, vol, dest = m, at = t0) => { const s = ac.createBufferSource(); s.buffer = Snd.n.white; const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q; s.connect(fl); fl.connect(envG(at, 0.002, vol, dur, dest)); s.start(at, Math.random()); s.stop(at + dur + 0.05); };
    switch (kind) {
      case "taiko": taiko(t0, 1.1, m); taiko(t0, 0.5, cv); break;
      case "horn": for (const [f, d] of [[440, 0], [554, 0]]) osc("triangle", f, t0 + d, 0.9, envG(t0 + d, 0.05, 0.05, 0.9, cv)); for (const f of [392, 494]) osc("triangle", f, t0 + 1, 1.2, envG(t0 + 1, 0.05, 0.05, 1.2, cv)); break;
      case "boiler": { const g = envG(t0, 0.3, 0.12, 3.5, m), lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 220; lp.connect(g); const o = osc("sawtooth", 46, t0, 3.5, lp); const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = 1.6; lg.gain.value = 8; l.connect(lg); lg.connect(o.frequency); l.start(t0); l.stop(t0 + 3.5); noise("highpass", 3000, 0.7, 2, 0.03); break; }
      case "pour": noise("bandpass", 900, 0.6, 0.8, 0.12); break;
      case "drip": noise("bandpass", 1400, 1, 0.2, 0.04); break;
      case "nyu": { const g = envG(t0, 0.2, 0.03, 2.2, cv), o = osc("sine", 300, t0, 2.2, g); o.frequency.exponentialRampToValueAtTime(900, t0 + 2); const v = ac.createOscillator(), vg = ac.createGain(); v.frequency.value = 6; vg.gain.value = 30; v.connect(vg); vg.connect(o.detune); v.start(t0); v.stop(t0 + 2.2); break; }
      case "caw": { const g = envG(t0, 0.01, 0.04, 0.25, cv), bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1200; bp.Q.value = 2; bp.connect(g); const o = osc("sawtooth", 720, t0, 0.25, bp); o.frequency.linearRampToValueAtTime(480, t0 + 0.25); break; }
      case "fwup": { const o = osc("sine", 700, t0, 0.9, envG(t0, 0.05, 0.02, 0.9, m)); o.frequency.exponentialRampToValueAtTime(2200, t0 + 0.85); break; }
      case "boom": { const s = ac.createBufferSource(); s.buffer = Snd.n.pink; const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 500; s.connect(f); f.connect(envG(t0, 0.005, 0.5, 1.6, m)); s.start(t0); s.stop(t0 + 1.7); for (let i = 0; i < 12; i++) noise("highpass", 4000, 0.7, 0.03, 0.03, m, t0 + 0.3 + Math.random() * 1.2); break; }
      case "thunder": { const s = ac.createBufferSource(); s.buffer = Snd.n.pink; const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.setValueAtTime(800, t0); f.frequency.exponentialRampToValueAtTime(100, t0 + 3); s.connect(f); f.connect(envG(t0, 0.05, 0.45, 3.5, m)); s.start(t0); s.stop(t0 + 3.6); break; }
    }
  }

  // ---------- GIF ----------
  const PALETTE = new Uint8Array(768);
  for (let i = 0; i < 216; i++) { PALETTE[i * 3] = LEVELS[(i / 36) | 0]; PALETTE[i * 3 + 1] = LEVELS[((i / 6) | 0) % 6]; PALETTE[i * 3 + 2] = LEVELS[i % 6]; }
  function lzw(ix, out) {
    let size = 9, next = 258, cur = 0, bits = 0; const dict = new Map(), bytes = [];
    const emit = c => { cur |= c << bits; bits += size; while (bits >= 8) { bytes.push(cur & 255); cur >>>= 8; bits -= 8; } };
    emit(256); let prefix = ix[0];
    for (let i = 1; i < ix.length; i++) {
      const k = ix[i], key = prefix * 256 + k, v = dict.get(key);
      if (v !== undefined) { prefix = v; continue; }
      emit(prefix);
      if (next < 4095) { dict.set(key, next++); if (next > (1 << size) && size < 12) size++; } else { emit(256); dict.clear(); size = 9; next = 258; }
      prefix = k;
    }
    emit(prefix); emit(257); if (bits > 0) bytes.push(cur & 255);
    out.push(8);
    for (let i = 0; i < bytes.length; i += 255) { const n = Math.min(255, bytes.length - i); out.push(n); for (let j = 0; j < n; j++) out.push(bytes[i + j]); }
    out.push(0);
  }
  function upscale(ix, k) {
    if (k === 1) return ix.slice();
    const w = W * k, o = new Uint8Array(w * H * k);
    for (let y = 0; y < H * k; y++) { const sy = ((y / k) | 0) * W, row = y * w; for (let x = 0; x < w; x++) o[row + x] = ix[sy + ((x / k) | 0)]; }
    return o;
  }
  async function makeGif(seconds = 8, scale = 2, fps = 20, onProgress) {
    const n = Math.round(seconds * fps), w = W * scale, h = H * scale, delay = Math.round(100 / fps);
    const out = []; for (const ch of "GIF89a") out.push(ch.charCodeAt(0));
    out.push(w & 255, w >> 8, h & 255, h >> 8, 0xf7, 0, 0); for (let i = 0; i < 768; i++) out.push(PALETTE[i]);
    out.push(0x21, 0xff, 0x0b); for (const ch of "NETSCAPE2.0") out.push(ch.charCodeAt(0)); out.push(3, 1, 0, 0, 0);
    for (let i = 0; i < n; i++) {
      const ix = frame(1 / fps);
      out.push(0x21, 0xf9, 4, 4, delay & 255, delay >> 8, 0, 0, 0x2c, 0, 0, 0, 0, w & 255, w >> 8, h & 255, h >> 8, 0);
      lzw(upscale(ix, scale), out);
      if (i % 4 === 3) { onProgress && onProgress(i + 1, n); await new Promise(r => setTimeout(r, 0)); }
    }
    out.push(0x3b); return new Uint8Array(out);
  }

  // ---------- UI ----------
  let last = performance.now();
  function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; if (!S.paused && !busy) frame(dt); requestAnimationFrame(loop); }
  const status = document.getElementById("status"), out = document.getElementById("out");
  const mBtn = document.getElementById("music");
  mBtn.addEventListener("click", async () => {
    if (!Snd.ac && !audioInit()) { status.textContent = "このブラウザでは音を鳴らせません。"; return; }
    Snd.on = !Snd.on;
    if (Snd.on) { await Snd.ac.resume(); Snd.nextBeat = Snd.ac.currentTime + 0.3; } else await Snd.ac.suspend();
    mBtn.setAttribute("aria-pressed", String(Snd.on)); mBtn.textContent = Snd.on ? "音を止める" : "音を出す";
  });
  const bgmBtn = document.getElementById("bgm");
  bgmBtn.addEventListener("click", () => { Snd.bgm = !Snd.bgm; bgmBtn.setAttribute("aria-pressed", String(Snd.bgm)); });
  document.getElementById("vol").addEventListener("input", e => { Snd.vol = e.target.value / 100; if (Snd.n) Snd.n.master.gain.setTargetAtTime(Snd.vol, Snd.ac.currentTime, 0.05); });
  const wButtons = [...document.querySelectorAll("[data-w]")];
  wButtons.forEach(b => b.addEventListener("click", () => { S.weather = b.dataset.w; wButtons.forEach(x => x.setAttribute("aria-pressed", String(x === b))); }));
  document.querySelectorAll("[data-ev]").forEach(b => b.addEventListener("click", () => startEvent(b.dataset.ev)));
  const pBtn = document.getElementById("pause");
  function togglePause() { S.paused = !S.paused; pBtn.setAttribute("aria-pressed", String(S.paused)); pBtn.textContent = S.paused ? "再生" : "一時停止"; }
  pBtn.addEventListener("click", togglePause);
  window.addEventListener("keydown", e => { if (e.code === "Space" && e.target === document.body) { e.preventDefault(); togglePause(); } });
  const gifBtn = document.getElementById("gif");
  gifBtn.addEventListener("click", async () => {
    busy = true; gifBtn.disabled = true;
    try {
      const bytes = await makeGif(+document.getElementById("gifsec").value, +document.getElementById("gifscale").value, 20, (i, n) => { status.textContent = `GIF 生成中… ${i}/${n} フレーム`; });
      const img = new Image(); img.src = URL.createObjectURL(new Blob([bytes], { type: "image/gif" })); img.alt = "書き出した湯屋のGIF"; out.prepend(img);
      status.textContent = `GIF ができました（${(bytes.length / 1048576).toFixed(1)} MB）。右クリック／長押しで保存できます。`;
    } catch (err) { status.textContent = `GIF の生成に失敗しました: ${err.message}`; }
    finally { busy = false; gifBtn.disabled = false; last = performance.now(); }
  });
  const webmBtn = document.getElementById("webm"); let rec = null;
  webmBtn.addEventListener("click", () => {
    if (rec) { rec.stop(); return; }
    if (!view.captureStream || typeof MediaRecorder === "undefined") { status.textContent = "このブラウザは動画録画に対応していません。GIF をお使いください。"; return; }
    const chunks = [], type = ["video/webm;codecs=vp9", "video/webm", "video/mp4"].find(t => MediaRecorder.isTypeSupported(t)) || "";
    rec = new MediaRecorder(view.captureStream(30), type ? { mimeType: type, videoBitsPerSecond: 6e6 } : undefined);
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => {
      const v = document.createElement("video"); v.src = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType || "video/webm" }));
      v.controls = v.loop = v.muted = v.autoplay = true; out.prepend(v);
      status.textContent = "録画しました（映像のみ）。動画の右クリック／長押しで保存できます。"; rec = null; webmBtn.textContent = "動画を録画";
    };
    rec.start(); webmBtn.textContent = "録画を止める"; status.textContent = "録画中… もう一度押すと停止します。";
  });

  // ---------- start ----------
  const pop = [[0, 5], [1, 5], [2, 4], [3, 4], [4, 2]];
  for (const [f, n] of pop) for (let i = 0; i < n; i++) { const g = Math.random() < 0.45; const a = makeAgent(g ? pick(GUESTS) : pick(WORKERS), f, rnd(RANGE[f][0] + 6, Math.min(RANGE[f][1], 160) - 4), g); plan(a); }
  log("日が暮れて、海の上の湯屋が目をさます", "wx");
  startEvent("open");
  for (let i = 0; i < 20; i++) step(1 / 30);
  window.Yuya = { S, frame, makeGif, startEvent };
  requestAnimationFrame(loop);
})();
</script>
