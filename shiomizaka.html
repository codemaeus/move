<title>汐見坂の箱庭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
  /* layout: the diorama fills the window; a title plate floats top-left, the controls sit on a rail along the bottom, a resident card slides in at the right */
  :root {
    --ink: #f4ead6;
    --dim: #b8ad9c;
    --panel: rgba(20, 17, 28, 0.74);
    --line: rgba(255, 226, 180, 0.2);
    --lamp: #ffb45a;
    --sea: #7fd0e2;
    --night: #0c0b14;
    --display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    --dot: "DotGothic16", "MS Gothic", "Osaka-Mono", monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--display); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #gl { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #gl.drag { cursor: grabbing; }
  #gl.pix { image-rendering: pixelated; }
  .plate { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(14px + env(safe-area-inset-top, 0px)); padding: 12px 16px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; backdrop-filter: blur(6px); max-width: min(320px, calc(100vw - 32px)); }
  .plate h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: 0.08em; text-wrap: balance; }
  .plate .ruby { font-family: var(--dot); font-size: 11px; color: var(--dim); letter-spacing: 0.25em; }
  .plate .clock { display: flex; gap: 10px; align-items: baseline; margin-top: 6px; font-family: var(--dot); }
  .plate .clock b { font-size: 26px; font-weight: 400; color: var(--lamp); font-variant-numeric: tabular-nums; }
  .plate .clock span { font-size: 13px; color: var(--ink); }
  .plate .stat { margin-top: 4px; font-family: var(--dot); font-size: 12px; color: var(--dim); }
  .rail { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; background: linear-gradient(to top, rgba(10, 9, 16, 0.86), rgba(10, 9, 16, 0.55)); border-top: 1px solid var(--line); font-family: var(--dot); font-size: 13px; }
  .group { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .group > .lab { color: var(--dim); font-size: 11px; letter-spacing: 0.15em; margin-right: 2px; }
  button { font: inherit; color: var(--ink); background: rgba(255, 240, 210, 0.07); border: 1px solid var(--line); border-radius: 3px; padding: 5px 9px; cursor: pointer; }
  button:hover { background: rgba(255, 240, 210, 0.16); }
  button[aria-pressed="true"] { background: var(--lamp); color: #1b1208; border-color: var(--lamp); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--sea); outline-offset: 2px; }
  #time { width: min(260px, 52vw); accent-color: var(--lamp); }
  .card { position: fixed; right: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); width: min(260px, calc(100vw - 32px)); padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; backdrop-filter: blur(6px); font-family: var(--dot); }
  .card .who { display: flex; gap: 10px; align-items: center; }
  .card canvas { width: 48px; height: 48px; image-rendering: pixelated; background: rgba(255, 240, 210, 0.06); border-radius: 3px; }
  .card h2 { margin: 0; font-family: var(--display); font-size: 17px; }
  .card .role { color: var(--dim); font-size: 12px; }
  .card p { margin: 8px 0 10px; font-size: 13px; line-height: 1.6; }
  .card .row { display: flex; gap: 6px; }
  .hint { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); font-family: var(--dot); font-size: 12px; color: var(--dim); background: var(--panel); padding: 5px 10px; border-radius: 3px; border: 1px solid var(--line); transition: opacity 1s; pointer-events: none; white-space: nowrap; }
  @media (max-width: 640px) { .hint { display: none; } .plate h1 { font-size: 18px; } .plate .clock b { font-size: 21px; } .card { top: auto; bottom: 150px; } }
  @media (prefers-reduced-motion: reduce) { .hint { transition: none; } }
</style>

<div id="stage"><canvas id="gl" aria-label="汐見坂の町の箱庭。ドラッグで回転、ホイールやピンチで拡大縮小、住人をクリックすると詳しく見られます"></canvas></div>
<div class="plate">
  <div class="ruby">しおみざか</div>
  <h1>汐見坂の箱庭</h1>
  <div class="clock"><b id="clk">17:00</b><span id="phase">夕暮れ</span></div>
  <div class="stat" id="stat">住人 44人</div>
</div>
<div class="hint" id="hint">ドラッグで回す ／ ホイールで寄る ／ 住人をクリック</div>
<div class="card" id="card" hidden>
  <div class="who"><canvas id="face" width="16" height="16"></canvas><div><h2 id="cname">名前</h2><div class="role" id="crole">役</div></div></div>
  <p id="cdo">…</p>
  <div class="row"><button id="cfollow" type="button">追いかける</button><button id="cclose" type="button">閉じる</button></div>
</div>
<div class="rail">
  <div class="group"><span class="lab">時刻</span><input id="time" type="range" min="0" max="24" step="0.05" value="17" aria-label="時刻"><button id="spd0" type="button" aria-pressed="false">停止</button><button id="spd1" type="button" aria-pressed="true">×1</button><button id="spd4" type="button" aria-pressed="false">×6</button></div>
  <div class="group"><span class="lab">天気</span><button id="w-clear" type="button" aria-pressed="true">晴れ</button><button id="w-rain" type="button" aria-pressed="false">雨</button><button id="w-fog" type="button" aria-pressed="false">霧</button></div>
  <div class="group"><span class="lab">視点</span><button id="v-all" type="button" aria-pressed="true">全景</button><button id="v-port" type="button" aria-pressed="false">港</button><button id="v-alley" type="button" aria-pressed="false">路地</button><button id="v-light" type="button" aria-pressed="false">灯台から</button><button id="v-ferry" type="button" aria-pressed="false">連絡船</button><button id="v-res" type="button" aria-pressed="false">住人を追う</button></div>
  <div class="group"><button id="pix" type="button" aria-pressed="false">ドット風</button><button id="snd" type="button" aria-pressed="false">音</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(() => {
  "use strict";
  const T = THREE, $ = s => document.querySelector(s);
  const cv = $("#gl");
  const renderer = new T.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: "high-performance" });
  let pixMode = false;
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
  const scene = new T.Scene();
  const camera = new T.PerspectiveCamera(36, 1, 0.3, 600);
  function resize() { const w = cv.clientWidth || innerWidth, h = cv.clientHeight || innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  addEventListener("resize", resize);

  // ---------- small helpers ----------
  function rng(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const R = rng(20261002), rr = (a, b) => a + R() * (b - a), pick = a => a[Math.floor(R() * a.length)];
  const lerp = (a, b, t) => a + (b - a) * t, clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const C = h => new T.Color(h);
  const MC = new Map();
  const mat = (c, extra) => { const k = c + (extra ? JSON.stringify(extra) : ""); if (!MC.has(k)) MC.set(k, new T.MeshLambertMaterial(Object.assign({ color: c }, extra || {}))); return MC.get(k); };
  function put(mesh, cast = true, recv = true) { mesh.castShadow = cast; mesh.receiveShadow = recv; scene.add(mesh); return mesh; }
  // a box whose bottom sits at y0
  function boxB(w, h, d, m, x, y0, z, cast = true) { const b = new T.Mesh(new T.BoxGeometry(w, h, d), typeof m === "number" ? mat(m) : m); b.position.set(x, y0 + h / 2, z); return put(b, cast, true); }
  function cyl(r0, r1, h, m, x, y0, z, seg = 10, cast = true) { const c = new T.Mesh(new T.CylinderGeometry(r0, r1, h, seg), typeof m === "number" ? mat(m) : m); c.position.set(x, y0 + h / 2, z); return put(c, cast, true); }
  function canvasTex(w, h, draw, near = true) { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h); const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; if (near) { t.magFilter = T.NearestFilter; } return t; }
  const texRep = (base, rx, ry) => { const t = base.clone(); t.needsUpdate = true; t.repeat.set(rx, ry); return t; };

  // ---------- textures ----------
  const STONE = canvasTex(64, 32, (g, w, h) => { const r = rng(7); g.fillStyle = "#7d776c"; g.fillRect(0, 0, w, h); for (let y = 0; y < h; y += 8) { let x = (y / 8) % 2 ? -8 : 0; while (x < w) { const bw = 12 + Math.floor(r() * 10), s = 104 + Math.floor(r() * 30); g.fillStyle = `rgb(${s + 8},${s + 4},${s - 6})`; g.fillRect(x + 1, y + 1, bw - 1, 7); g.fillStyle = "rgba(255,255,255,0.08)"; g.fillRect(x + 1, y + 1, bw - 1, 1); x += bw; } } g.fillStyle = "#58693f"; for (let x = 0; x < w; x++) if (r() < 0.6) g.fillRect(x, 0, 1, 1 + Math.floor(r() * 2)); });
  const SOIL = canvasTex(64, 64, (g, w, h) => { const r = rng(9); const bands = [["#5f8a3e", 4], ["#6a4a30", 14], ["#7a573a", 12], ["#5e4330", 16], ["#6f6458", 18]]; let y = 0; for (const [c, bh] of bands) { g.fillStyle = c; g.fillRect(0, y, w, bh); y += bh; } for (let i = 0; i < 90; i++) { g.fillStyle = r() < 0.5 ? "rgba(40,28,20,0.5)" : "rgba(170,150,120,0.5)"; g.fillRect(Math.floor(r() * w), 5 + Math.floor(r() * 58), 1 + Math.floor(r() * 3), 1 + Math.floor(r() * 2)); } });
  const ROCK = canvasTex(64, 32, (g, w, h) => { const r = rng(11); g.fillStyle = "#4b4038"; g.fillRect(0, 0, w, h); for (let i = 0; i < 70; i++) { g.fillStyle = r() < 0.5 ? "#5c5047" : "#3b322c"; g.fillRect(Math.floor(r() * w), Math.floor(r() * h), 2 + Math.floor(r() * 5), 1 + Math.floor(r() * 3)); } });
  const SEAWALL = canvasTex(32, 64, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, "rgba(120,200,220,0.55)"); gr.addColorStop(1, "rgba(10,40,70,0.85)"); g.fillStyle = gr; g.fillRect(0, 0, w, h); }, false);
  const HALO = canvasTex(64, 64, (g, w, h) => { const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, "rgba(255,240,210,1)"); gr.addColorStop(0.25, "rgba(255,190,110,0.55)"); gr.addColorStop(1, "rgba(255,150,60,0)"); g.fillStyle = gr; g.fillRect(0, 0, w, h); }, false);
  const PUFF = canvasTex(64, 64, (g, w, h) => { const gr = g.createRadialGradient(32, 32, 0, 32, 32, 30); gr.addColorStop(0, "rgba(255,255,255,0.9)"); gr.addColorStop(0.6, "rgba(255,255,255,0.35)"); gr.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = gr; g.fillRect(0, 0, w, h); }, false);
  const STREAK = canvasTex(16, 128, (g, w, h) => { for (let y = 0; y < h; y += 3) { const a = (1 - y / h) * (0.4 + 0.6 * Math.abs(Math.sin(y * 0.7))); g.fillStyle = `rgba(255,255,255,${a.toFixed(3)})`; const ww = Math.round(w * (0.4 + 0.6 * Math.abs(Math.sin(y * 1.3)))); g.fillRect((w - ww) >> 1, y, ww, 2); } }, false);

  // ---------- the box: bedrock slab, terraces climbing from the harbour, a cut-away sea ----------
  const SEA_Z = 9, WATER_Y = 0.2;
  boxB(40, 3, 40, [new T.MeshLambertMaterial({ map: texRep(ROCK, 6, 1) }), new T.MeshLambertMaterial({ map: texRep(ROCK, 6, 1) }), mat(0xc9b48a), mat(0x222222), new T.MeshLambertMaterial({ map: texRep(ROCK, 6, 1) }), new T.MeshLambertMaterial({ map: texRep(ROCK, 6, 1) })], 0, -6, 0, false);
  const PAVE = 0xa79d8d, STREET = 0xbdb3a2, GRASS = 0x6f8f4c;
  function terrace(x0, x1, z0, z1, top, front = "stone") {
    const w = x1 - x0, d = z1 - z0, h = top + 3;
    const side = (kind, len) => new T.MeshLambertMaterial({ map: kind === "stone" ? texRep(STONE, len / 3, h / 1.6) : texRep(SOIL, len / 7, 1) });
    const m = new T.Mesh(new T.BoxGeometry(w, h, d), [side(x1 >= 20 ? "soil" : "stone", d), side(x0 <= -20 ? "soil" : "stone", d), mat(PAVE), mat(0x222222), side(front, w), side(z0 <= -20 ? "soil" : "stone", w)]);
    m.position.set((x0 + x1) / 2, -3 + h / 2, (z0 + z1) / 2); put(m, false, true);
  }
  const TER = { T0: 0.8, T1: 2.8, T2: 4.8, T3: 6.8 };
  terrace(-20, 20, 1.5, SEA_Z, TER.T0);
  terrace(-20, 20, -5.5, 1.5, TER.T1);
  terrace(-20, 20, -12.5, -5.5, TER.T2);
  terrace(-2, 20, -20, -12.5, TER.T2);
  terrace(-20, -2, -20, -12.5, TER.T3);
  const strip = (x0, x1, z0, z1, y, c = STREET) => { const s = new T.Mesh(new T.BoxGeometry(x1 - x0, 0.04, z1 - z0), mat(c)); s.position.set((x0 + x1) / 2, y + 0.02, (z0 + z1) / 2); put(s, false, true); };
  strip(-20, 20, 6.1, SEA_Z, TER.T0); strip(-20, 20, -0.05, 1.5, TER.T1); strip(-20, 20, -7.0, -5.5, TER.T2); strip(-20, -2, -14, -12.5, TER.T3);
  strip(-1.6, 19.6, -19.6, -12.8, TER.T2, 0xc9b58f); // schoolyard
  strip(-20, -2, -20, -14, TER.T3, GRASS);
  // quay edge stones and bollards
  for (let x = -19.5; x < 20; x += 1) boxB(0.98, 0.12, 0.35, 0x8f887c, x, TER.T0, SEA_Z - 0.2, false);
  for (let x = -17; x < 18; x += 5.5) cyl(0.12, 0.15, 0.32, 0x3a3a3e, x + 1.3, TER.T0, SEA_Z - 0.45, 8);

  // sea: a translucent block you can see into from the front and sides, with a moving surface
  const seaBox = new T.Mesh(new T.BoxGeometry(40, 3 + WATER_Y, 20 - SEA_Z), [new T.MeshBasicMaterial({ map: SEAWALL, transparent: true, depthWrite: false }), new T.MeshBasicMaterial({ map: SEAWALL, transparent: true, depthWrite: false }), new T.MeshBasicMaterial({ visible: false }), new T.MeshBasicMaterial({ visible: false }), new T.MeshBasicMaterial({ map: SEAWALL, transparent: true, depthWrite: false }), new T.MeshBasicMaterial({ visible: false })]);
  seaBox.position.set(0, (-3 + WATER_Y) / 2, (SEA_Z + 20) / 2); seaBox.renderOrder = 2; scene.add(seaBox);
  const waterGeo = new T.PlaneGeometry(40, 20 - SEA_Z, 64, 18); waterGeo.rotateX(-Math.PI / 2);
  const waterMat = new T.MeshPhongMaterial({ color: 0x2f7fa0, specular: 0xbfd8e8, shininess: 70, transparent: true, opacity: 0.82, depthWrite: false });
  const water = new T.Mesh(waterGeo, waterMat); water.position.set(0, WATER_Y, (SEA_Z + 20) / 2); water.receiveShadow = true; water.renderOrder = 3; scene.add(water);
  const wBase = waterGeo.attributes.position.array.slice();
  // a little sand beach in the west corner, seaweed rocks on the floor
  { const b = new T.Mesh(new T.BoxGeometry(7, 3.3, 3.5), mat(0xd9c49a)); b.position.set(-16.5, -3 + 1.65, 10.75); put(b, false, true); }
  for (let i = 0; i < 26; i++) { const r = new T.Mesh(new T.DodecahedronGeometry(rr(0.2, 0.6)), mat(pick([0x5a5650, 0x6b6358, 0x4f5a46]))); r.position.set(rr(-19, 19), -2.9, rr(SEA_Z + 1, 19.5)); scene.add(r); }

  // ---------- path graph for the residents ----------
  const nodes = [], adj = [];
  function node(x, y, z, tag) { nodes.push({ x, y, z, tag, i: nodes.length }); adj.push([]); return nodes.length - 1; }
  function link(a, b) { if (a === b || adj[a].includes(b)) return; adj[a].push(b); adj[b].push(a); }
  const streets = {};
  function street(name, y, z, x0, x1, step = 3) { const ids = []; for (let x = x0; x <= x1 + 0.01; x += step) ids.push(node(x, y, z, name)); for (let i = 1; i < ids.length; i++) link(ids[i - 1], ids[i]); streets[name] = ids; return ids; }
  function nearestOn(name, x) { let best = null, bd = 1e9; for (const id of streets[name]) { const d = Math.abs(nodes[id].x - x); if (d < bd) { bd = d; best = id; } } return best; }
  street("T0", TER.T0, 7.4, -19, 19, 2);
  street("T1", TER.T1, 0.7, -19, 19, 2);
  street("T2", TER.T2, -6.3, -19, 19, 2);
  street("T3", TER.T3, -13.3, -19, -3, 2);
  street("YARD", TER.T2, -13.6, 0, 18, 3);

  // stairs: a flight of stone steps up the retaining wall, through an alley in the houses below
  const STAIRS = [[TER.T0, TER.T1, 1.5, [-12, 1, 11], "T0", "T1"], [TER.T1, TER.T2, -5.5, [-15, 3, 13], "T1", "T2"], [TER.T2, TER.T3, -12.5, [-11], "T2", "T3"]];
  const alleys = { T0: [], T1: [], T2: [] };
  for (const [y0, y1, zf, xs, lo, hi] of STAIRS) for (const sx of xs) {
    const n = 8, L = 2.2;
    for (let i = 0; i < n; i++) { const hgt = (y1 - y0) * (i + 1) / n; boxB(1.3, hgt, L / n + 0.01, 0x9a9283, sx, y0, zf + L - (i + 0.5) * L / n, false); }
    boxB(0.1, 0.9, L, 0x6d6658, sx - 0.7, y0 + (y1 - y0) / 2, zf + L / 2, false); // handrail wall
    const a = nearestOn(lo, sx), b = node(sx, y0, zf + L + 0.4, "stairfoot"), c = node(sx, y1, zf - 0.2, "stairtop"), d = nearestOn(hi, sx);
    const mid = node(sx, y0, nodes[a].z - (nodes[a].z - (zf + L + 0.4)) / 2, "alley");
    link(a, mid); link(mid, b); link(b, c); link(c, d); alleys[lo].push(sx);
  }
  // to the schoolyard (same height as T2) through an alley
  { const a = nearestOn("T2", 7), m = node(7, TER.T2, -10, "alley"); link(a, m); link(m, nearestOn("YARD", 6)); alleys.T2.push(7); }
  // piers, breakwater, beach
  const SP = {};
  { const q = nearestOn("T0", -6), p1 = node(-6, 0.55, 9.8, "pier"), p2 = node(-6, 0.55, 12, "pier"), p3 = node(-6, 0.55, 14.1, "pier"); link(q, p1); link(p1, p2); link(p2, p3); SP.pierA = p3; SP.pierAmid = p2; }
  { const q = nearestOn("T0", 5), p1 = node(6, 0.6, 10, "pier"), p2 = node(6, 0.6, 13, "pier"), p3 = node(6, 0.6, 15.2, "pier"); link(q, p1); link(p1, p2); link(p2, p3); SP.ferry = p3; }
  { const q = nearestOn("T0", 19), b1 = node(18.2, 0.95, 10.2, "break"), b2 = node(18.2, 0.95, 13.4, "break"), b3 = node(18.2, 0.95, 16.4, "break"); link(q, b1); link(b1, b2); link(b2, b3); SP.lighthouse = b3; SP.breakwater = b2; }
  { const q = nearestOn("T0", -16), s1 = node(-16.5, 0.35, 10.4, "beach"), s2 = node(-18.5, 0.35, 11.3, "beach"), s3 = node(-14.6, 0.35, 11.6, "beach"); link(q, s1); link(s1, s2); link(s1, s3); SP.beach = s1; }
  { const t = nearestOn("T3", -11), s = node(-11, TER.T3, -16.1, "shrine"); link(t, s); SP.shrine = s; SP.lookout = nearestOn("T3", -17); }
  SP.school = nearestOn("YARD", 9); SP.yard = nearestOn("YARD", 15);
  SP.quay = streets.T0.filter(id => nodes[id].x > -14 && nodes[id].x < 16);
  SP.shotengai = streets.T0.filter(id => nodes[id].x >= -18 && nodes[id].x <= 3);
  SP.bench1 = nearestOn("T0", -12); SP.bench2 = nearestOn("T0", 2);

  // ---------- houses ----------
  const houses = [], wins = [];
  const WALLS = [0xe9e2d0, 0xd9cdb0, 0x9b7b5a, 0x7f6a55, 0xc9d3d6, 0xe7cfc4, 0xb7c2b0, 0xf0e6cf];

    hemi.color.copy(top).lerp(C(0xffffff), 0.35); hemi.groundColor.copy(C(0x5a4a3a)).lerp(hor, 0.3); hemi.intensity = S.amb * (1 - wet * 0.2) + 0.08;
    sunDisc.position.copy(sunDir).multiplyScalar(260); sunDisc.visible = el > -0.08 && !wet && !fog; sunDisc.material.color.copy(S.sun).lerp(C(0xffffff), 0.3);
    moon.position.copy(moonDir).multiplyScalar(250); moon.visible = N > 0.3 && !wet;

    waterMat.specular.copy(S.sun).multiplyScalar(0.8);

    for (const s of streaks) if (!s.userData.die) s.material.opacity = lampOn * (0.35 + 0.15 * Math.sin(clockT * 3 + s.position.x));
    bulbMat.color.copy(C(0x8a8a88)).lerp(C(0xfff0d0), lampOn);

    lampRoom.material.color.copy(C(0x9a9a90)).lerp(C(0xfff2c0), lampOn); beamMat.opacity = 0.11 * lampOn * (fog ? 1.8 : 1);

    const H2 = h < 12 ? h + 24 : h;
    wins.forEach((w, i) => {
      const occ = w.house && w.house.home > 0 && H2 >= 17 && H2 < 23.6;
      let lit = !w.never && ((H2 >= w.on && H2 < w.off) || (h >= w.mOn && h < 7.2) || (occ && N > 0.25));
      if (w.house && w.house.kind === "school") lit = h > 7.5 && h < 18 && weather !== "clear" ? true : h > 17.5 && h < 19 && w.x > 8;
      if (w.house && (w.house.kind === "sento" || w.house.kind === "inn")) lit = N > 0.2 && H2 < 24.5;
      const c = lit ? tmpC.copy(w.c).multiplyScalar(lerp(0.75, 1, N) * (0.96 + 0.04 * Math.sin(clockT * 2 + i))) : glass;

    });
    winMesh.instanceColor.needsUpdate = true;
    return N;
  }

  // ---------- camera: orbit around the box, presets, following ----------
  const cam = { target: new T.Vector3(0, 2, -1), r: 62, th: 0.38, ph: 0.98 }, want = { target: cam.target.clone(), r: cam.r, th: cam.th, ph: cam.ph };
  let view = "all", follow = null, idleT = 0;
  const camFwd = new T.Vector3();
  const VIEWS = {
    all: () => ({ target: new T.Vector3(0, 2, -1), r: 62, th: 0.38, ph: 0.98 }),
    port: () => ({ target: new T.Vector3(-1, 1.2, 9), r: 21, th: 0.12, ph: 1.18 }),
    alley: () => ({ target: new T.Vector3(-3.5, TER.T1 + 0.8, 0.6), r: 8, th: -0.95, ph: 1.32 }),
    light: () => ({ target: new T.Vector3(0, 4, -4), r: 29, th: 0.69, ph: 1.47 }),

  function setView(v) {

  }
  function followRes(r) { follow = { kind: "res", r }; view = "res"; Object.assign(want, { r: 7.5, ph: 1.18 }); document.querySelectorAll("[id^='v-']").forEach(b => b.setAttribute("aria-pressed", String(b.id === "v-res"))); showCard(r); }
  // pointer input

  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  cv.addEventListener("wheel", e => { e.preventDefault(); want.r = clamp(want.r * Math.exp(e.deltaY * 0.0012), 5, 110); idleT = 0; hideHint(); }, { passive: false });
  const ray = new T.Raycaster(), ndc = new T.Vector2();

  function updateCamera(dt) {
    if (follow && follow.kind === "res") { const r = follow.r; want.target.set(r.pos.x, r.pos.y + 0.6, r.pos.z); if (r.hidden && r.house) want.target.set(r.house.x, r.house.y0 + 1, r.house.z + r.house.d / 2); }
    if (follow && follow.kind === "ferry") want.target.copy(ferry.position).add(new T.Vector3(0, 0.8, 0));
    if (view === "all" && !ptrs.size) { idleT += dt; if (idleT > 4) want.th += dt * 0.025; }
    const k = 1 - Math.pow(0.0015, dt);
    cam.target.lerp(want.target, k); cam.r = lerp(cam.r, want.r, k); cam.th = lerp(cam.th, want.th, k); cam.ph = lerp(cam.ph, want.ph, k);
    const sp = Math.sin(cam.ph); camera.position.set(cam.target.x + cam.r * sp * Math.sin(cam.th), cam.target.y + cam.r * Math.cos(cam.ph), cam.target.z + cam.r * sp * Math.cos(cam.th));
    if (camera.position.y < 0.7) camera.position.y = 0.7;
    camera.lookAt(cam.target); camera.getWorldDirection(camFwd); camFwd.y = 0; camFwd.normalize();
  }

  // ---------- resident card ----------
  const card = $("#card"), faceCtx = $("#face").getContext("2d");
  let cardR = null;
  function showCard(r) { cardR = r; card.hidden = false; $("#cname").textContent = r.name; $("#crole").textContent = r.label + (r.house && r.house.label ? `・${r.house.label}` : ""); faceCtx.clearRect(0, 0, 16, 16); faceCtx.drawImage(ATLAS, 0, r.row * CELL, CELL, CELL, 0, 0, 16, 16); updateCard(); }
  function updateCard() { if (!cardR || card.hidden) return; const r = cardR; let s; if (r.state === "walk" && r.path.length) s = `${PLACE(r.goal)}へ向かっている`; else s = ACT[r.act] || "のんびりしている"; if (r.state === "ride") s = ACT.boat; $("#cdo").textContent = s + "。"; }
  $("#cclose").addEventListener("click", () => { card.hidden = true; cardR = null; if (view === "res") setView("all"); });
  $("#cfollow").addEventListener("click", () => cardR && followRes(cardR));

  // ---------- controls ----------
  const timeEl = $("#time");
  timeEl.addEventListener("input", () => { hour = +timeEl.value; residents.forEach(r => r.slot = -1); });
  for (const [id, v] of [["spd0", 0], ["spd1", 1], ["spd4", 6]]) $("#" + id).addEventListener("click", () => { speed = v; ["spd0", "spd1", "spd4"].forEach(b => $("#" + b).setAttribute("aria-pressed", String(b === id))); });
  for (const w of ["clear", "rain", "fog"]) $("#w-" + w).addEventListener("click", () => { weather = w; ["clear", "rain", "fog"].forEach(b => $("#w-" + b).setAttribute("aria-pressed", String(b === w))); rain.visible = w === "rain"; });
  for (const v of ["all", "port", "alley", "light", "ferry", "res"]) $("#v-" + v).addEventListener("click", () => setView(v));
  $("#pix").addEventListener("click", () => { pixMode = !pixMode; $("#pix").setAttribute("aria-pressed", String(pixMode)); cv.classList.toggle("pix", pixMode); renderer.setPixelRatio(pixMode ? 0.34 : Math.min(2, devicePixelRatio || 1)); resize(); });
  const hint = $("#hint"); let hintGone = false; function hideHint() { if (hintGone) return; hintGone = true; hint.style.opacity = "0"; }
  setTimeout(hideHint, 9000);

  // ---------- sound: waves, gulls, evening cicadas, rain, fireworks ----------
  const A = { ac: null, on: false };
  function initAudio() {

    const nb = ac.createBuffer(1, ac.sampleRate * 3, ac.sampleRate), d = nb.getChannelData(0); let last = 0; for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } A.brown = nb;
    const wb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), wd = wb.getChannelData(0); for (let i = 0; i < wd.length; i++) wd[i] = Math.random() * 2 - 1; A.white = wb;

    A.waves = loop(nb, "lowpass", 600, 0.25); A.rain = loop(wb, "highpass", 1800, 0); return true;
  }
  function tone(type, f0, f1, t0, dur, vol) { const ac = A.ac, o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur); g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); o.connect(g); g.connect(A.master); o.start(t0); o.stop(t0 + dur + 0.05); }
  function noise(t0, dur, vol, type, f) { const ac = A.ac, s = ac.createBufferSource(); s.buffer = A.white; const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = f; const g = ac.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); s.connect(fl); fl.connect(g); g.connect(A.master); s.start(t0, Math.random()); s.stop(t0 + dur + 0.05); }
  function sfx(k, dist = 40) {
    if (!A.on) return; const t = A.ac.currentTime, delay = Math.min(0.6, dist / 340), v = clamp(30 / Math.max(dist, 10), 0.15, 1);
    if (k === "boom") { noise(t + delay, 1.4, 0.5 * v, "lowpass", 260); tone("sine", 70, 32, t + delay, 1.2, 0.5 * v); }
    if (k === "crackle") for (let i = 0; i < 18; i++) noise(t + delay + 0.25 + i * 0.035 + Math.random() * 0.03, 0.05, 0.12 * v, "highpass", 2500);
    if (k === "whistle") tone("sine", 900, 1700, t, 0.9, 0.025);
    if (k === "gull") { for (let i = 0; i < 2; i++) tone("triangle", 1500, 1050, t + i * 0.22, 0.18, 0.04); }
    if (k === "kana") { for (let i = 0; i < 14; i++) tone("sine", 4300, 4000, t + i * 0.085, 0.06, 0.012 * (1 - i / 16)); }
  }
  $("#snd").addEventListener("click", async () => { if (!A.ac && !initAudio()) return; A.on = !A.on; $("#snd").setAttribute("aria-pressed", String(A.on)); if (A.on) await A.ac.resume(); else await A.ac.suspend(); });

  // ---------- the loop ----------
  let last = performance.now(), statT = 0;
  const PHASES = h => h < 4.5 ? "深夜" : h < 6.5 ? "夜明け" : h < 10 ? "朝" : h < 15.5 ? "昼" : h < 17.2 ? "午後" : h < 19.3 ? "夕暮れ" : h < 23 ? "夜" : "深夜";
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; clockT += dt;
    hour = (hour + dt * speed / 15) % 24; if (document.activeElement !== timeEl) timeEl.value = hour.toFixed(2);
    const N = applyHour(hour, dt);
    fireworksOn = hour > 19.4 && hour < 21.2 && weather !== "rain";
    // water surface
    const p = waterGeo.attributes.position.array; for (let i = 0; i < p.length; i += 3) { const x = wBase[i], z = wBase[i + 2]; p[i + 1] = 0.06 * Math.sin(x * 0.7 + clockT * 1.3) + 0.045 * Math.sin(z * 1.4 - clockT * 1.7) + 0.02 * Math.sin((x + z) * 2.2 + clockT * 2.6); } waterGeo.attributes.position.needsUpdate = true; if (Math.floor(clockT * 30) % 2 === 0) waterGeo.computeVertexNormals();
    // boats
    const bob = (g, ph, x, z) => { g.position.set(x, WATER_Y + 0.02 * Math.sin(clockT * 1.5 + ph) - 0.12, z); g.rotation.z = 0.04 * Math.sin(clockT * 1.1 + ph); g.rotation.x = 0.03 * Math.sin(clockT * 0.9 + ph * 2); };
    { const m = (hour % 1) * 60, inService = hour >= 6 && hour < 22; let fx = 7.7, fz = 16.0, heading = 0; if (inService && m >= 10 && m < 55) { const u = (m - 10) / 45, pt = ferryPath.getPointAt(u), tg = ferryPath.getTangentAt(u); fx = pt.x; fz = pt.z; heading = Math.atan2(-tg.z, tg.x); } else heading = Math.PI * 0.15; bob(ferry, 0, fx, fz); ferry.rotation.y = heading; ferryGlow.position.set(fx, 1.3, fz); ferryStreak.position.set(fx, WATER_Y + 0.06, fz + 1.8); }
    for (const b of fishing) { const out = hour > 5 && hour < 12.6, u = hour < 5.5 ? (hour - 5) / 0.5 : hour > 12.1 ? (12.6 - hour) / 0.5 : 1, k = out ? smooth(0, 1, clamp(u, 0, 1)) : 0; b.out = out && k > 0.02; const x = lerp(b.moor.x, b.sea.x, k), z = lerp(b.moor.z, b.sea.z, k); bob(b.g, b.ph, x, z); b.g.rotation.y = out && k < 0.98 ? Math.atan2(-(b.sea.z - b.moor.z) * (hour > 12 ? -1 : 1), (b.sea.x - b.moor.x) * (hour > 12 ? -1 : 1)) : Math.PI / 2; }
    bob(rowboat, 2, rowboat.position.x, rowboat.position.z);
    // lighthouse beam
    beamPivot.rotation.y += dt * 0.9;
    // gulls by day
    for (const gl of gulls) { gl.g.visible = hour > 5.3 && hour < 18.6 && weather !== "rain"; if (!gl.g.visible) continue; gl.a += dt * gl.sp; const x = gl.cx + Math.cos(gl.a) * gl.r, z = gl.cz + Math.sin(gl.a) * gl.r * 0.6; gl.g.position.set(x, gl.h + Math.sin(gl.a * 3) * 0.4, z); gl.g.rotation.y = -gl.a - (gl.sp > 0 ? Math.PI / 2 : -Math.PI / 2); const f = Math.sin(clockT * 9 + gl.a * 5) * 0.6; gl.pl.rotation.x = f; gl.pr.rotation.x = -f; }
    // laundry and the school flag sway

    // smoke
    for (const s of smokeSrc) { const on = hour >= s.from && hour < s.to; s.acc = (s.acc || 0) + dt; if (on && s.acc > s.rate) { s.acc = 0; const p2 = puffs.find(q => q.life <= 0); if (p2) { p2.life = 1; p2.s.visible = true; p2.s.position.set(s.x, s.y, s.z); p2.vx = 0.35 + R() * 0.15; p2.sz = 0.5; } } }
    for (const q of puffs) { if (q.life <= 0) continue; q.life -= dt * 0.16; q.s.position.x += q.vx * dt; q.s.position.y += 0.55 * dt; q.sz += dt * 0.5; q.s.scale.set(q.sz, q.sz, 1); q.s.material.opacity = 0.55 * q.life; q.s.material.color.copy(C(0xd8d4cc)).multiplyScalar(0.35 + 0.65 * (1 - N)); if (q.life <= 0) q.s.visible = false; }
    // rain
    if (rain.visible) { for (let i = 0; i < RN; i++) { const j = i * 6 + 1; rainPos[j] -= dt * 26; rainPos[j + 3] -= dt * 26; if (rainPos[j] < -2) { rainPos[j] += 36; rainPos[j + 3] += 36; } } rainGeo.attributes.position.needsUpdate = true; }
    if (A.on) { A.waves.gain.value = 0.18 + 0.08 * Math.sin(clockT * 0.45); A.rain.gain.value = weather === "rain" ? 0.08 : 0; if (hour > 5.5 && hour < 18 && weather !== "rain" && R() < dt * 0.08) sfx("gull"); if (hour > 16.8 && hour < 19 && weather === "clear" && R() < dt * 0.06) sfx("kana"); }
    // fireworks and their passing reflections
    updateFireworks(dt, hour, N);
    for (let k = streaks.length - 1; k >= 0; k--) { const s = streaks[k]; if (!s.userData.die) continue; s.userData.fade -= dt * 0.9; s.material.opacity = Math.max(0, s.userData.fade) * 0.7; if (s.userData.fade <= 0) { scene.remove(s); streaks.splice(k, 1); } }
    // residents
    const sdt = dt * Math.min(Math.max(speed, 0.0001), 3.5);
    for (const r of residents) updateResident(r, speed ? sdt : 0, hour, N);
    updateCamera(dt);
    statT -= dt; if (statT <= 0) { statT = 0.5; const h = Math.floor(hour), m = Math.floor((hour % 1) * 60); $("#clk").textContent = `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`; $("#phase").textContent = PHASES(hour) + (fireworksOn ? "・花火" : "") + (weather === "rain" ? "・雨" : weather === "fog" ? "・霧" : ""); const out = residents.filter(r => !r.hidden).length; $("#stat").textContent = `住人 ${residents.length}人（猫と犬をふくむ）・外にいる ${out}人`; updateCard(); }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  resize(); applyHour(hour, 0); setView("all"); Object.assign(cam, VIEWS.all()); cam.target = cam.target.clone();
  window.Hako = { set hour(v) { hour = v; residents.forEach(r => r.slot = -1); }, get hour() { return hour; }, residents, setView, followRes, setWeather: w => $("#w-" + w).click(), launch, step: (n, dt = 1 / 30) => { for (let i = 0; i < n; i++) { last -= dt * 1000; } } };
  requestAnimationFrame(frame);
})();
