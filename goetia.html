<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ゴエティア・ランブル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120d1a; --panel:#1d1528; --panel2:#2a1f3a; --line:#4a3a63; --ink:#efe6ff; --mute:#a99bc4;
  --gold:#ffd25a; --red:#ff4a6a; --accent:#b98cff;
}
:root:not([data-theme="light"]){color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#120d1a}}
:root[data-theme="dark"]{--bg:#120d1a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#scr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:5}
#scr>.page{pointer-events:auto}
.page{max-width:1100px;width:calc(100% - 32px);max-height:calc(100% - 32px);overflow:auto;background:rgba(22,15,32,.93);
  border:2px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.04)}
.page.title{max-width:640px;text-align:center;background:rgba(18,12,26,.82);backdrop-filter:blur(3px)}
h1{font-family:"Dela Gothic One",sans-serif;font-weight:400;margin:0;letter-spacing:.04em;line-height:1.1}
.logo{font-size:clamp(26px,6.4vw,50px);white-space:nowrap;background:linear-gradient(#fff3c0,#ffb84a 55%,#ff5a3a);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #3a1020) drop-shadow(0 0 18px rgba(255,120,60,.35))}
.sub{color:var(--mute);margin:8px 0 18px;font-size:15px}
.btns{display:flex;flex-direction:column;gap:10px;align-items:stretch;max-width:360px;margin:0 auto}
button{font:inherit;color:var(--ink);background:linear-gradient(#3a2a52,#2a1e3c);border:2px solid #6a5590;border-radius:10px;padding:11px 16px;
  cursor:pointer;font-size:16px;transition:transform .08s,border-color .15s,background .15s}
button:hover{border-color:var(--gold);transform:translateY(-1px)}
button:active{transform:translateY(1px)}
button.primary{background:linear-gradient(#a8452f,#6e2420);border-color:#ffb27a}
button.ghost{background:transparent;border-color:var(--line);font-size:14px;padding:8px 12px}
button:disabled{opacity:.4;cursor:default;transform:none}
.small{font-size:13px;color:var(--mute);line-height:1.7}
.kbd{display:inline-block;border:1px solid #6a5590;border-bottom-width:3px;border-radius:5px;padding:0 6px;margin:0 2px;color:#fff;background:#2a1f3a;font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.selhead{position:sticky;top:-20px;z-index:2;background:rgba(22,15,32,.97);padding:6px 0 8px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.selhead h2{font-family:"Dela Gothic One";font-weight:400;margin:0;font-size:24px}
.layout{display:grid;grid-template-columns:1fr 330px;gap:16px}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px;align-content:start}
.card{position:relative;background:#241a33;border:2px solid #3a2d50;border-radius:9px;padding:4px 2px 5px;text-align:center;cursor:pointer;transition:border-color .1s,transform .1s}
.card:hover{border-color:#8a72b8;transform:translateY(-1px)}
.card.on{border-color:var(--gold);background:#3a2a26}
.card.focus{box-shadow:0 0 0 2px #fff6}
.card.lock{cursor:default;opacity:.55}
.card canvas{width:64px;height:64px;image-rendering:pixelated;display:block;margin:0 auto}
.card .no{position:absolute;left:5px;top:3px;font-size:10px;color:#8a7aa8}
.card .nm{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.card .pick{position:absolute;right:4px;top:3px;background:var(--gold);color:#2a1a10;border-radius:50%;width:18px;height:18px;font-size:12px;line-height:18px;font-weight:bold}
.card .new{position:absolute;right:3px;top:3px;background:#ff4a6a;color:#fff;border-radius:4px;font-size:9px;padding:0 3px}
.tags{display:flex;gap:3px;justify-content:center;margin-top:2px;flex-wrap:wrap}
.tag{font-size:10px;border-radius:4px;padding:0 4px;color:#1a1020;font-weight:bold;line-height:15px}
.detail{background:#1a1324;border:2px solid var(--line);border-radius:12px;padding:14px;position:sticky;top:0;align-self:start}
.detail .big{display:flex;gap:12px;align-items:center}
.detail canvas.sp{width:112px;height:112px;image-rendering:pixelated;background:radial-gradient(#3a2d50,#1a1324 70%);border-radius:10px}
.detail canvas.sg{width:64px;height:64px}
.detail h3{margin:0;font-size:20px;font-family:"Dela Gothic One";font-weight:400}
.latin{color:var(--mute);font-size:12px}
.stat{display:grid;grid-template-columns:44px 1fr 34px;gap:6px;align-items:center;font-size:12px;margin:2px 0}
.bar{height:7px;background:#0d0914;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7a5ad0,#ffb84a)}
.mv{display:flex;gap:6px;align-items:center;font-size:13px;padding:4px 6px;border-radius:6px;background:#241a33;margin:3px 0}
.mv b{font-weight:normal}
.mv .k{font-size:10px;color:var(--mute);margin-left:auto}
.lore{font-size:13px;line-height:1.7;color:#d8ccef;margin:8px 0}
.team{display:flex;gap:6px;margin:8px 0}
.team .slot{width:58px;height:58px;border:2px dashed #4a3a63;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#5a4a73;font-size:20px}
.team .slot canvas{width:52px;height:52px;image-rendering:pixelated}
.filters{display:flex;gap:4px;flex-wrap:wrap}
.filters button{padding:3px 8px;font-size:12px;border-radius:6px}
.filters button.on{border-color:var(--gold);background:#4a3420}
.center{text-align:center}
.result h2{font-family:"Dela Gothic One";font-weight:400;font-size:40px;margin:0 0 6px}
.contract{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.contract .card{width:150px;padding:10px}
.contract .card canvas{width:110px;height:110px}
#touch{position:fixed;inset:0;z-index:4;pointer-events:none;display:none}
#touch.on{display:block}
#joy{position:absolute;left:18px;bottom:24px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.18);pointer-events:auto}
#joy i{position:absolute;left:45px;top:45px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.25)}
#tbtn{position:absolute;right:14px;bottom:20px;width:190px;height:190px;pointer-events:none}
#tbtn div{position:absolute;width:62px;height:62px;border-radius:50%;background:rgba(40,25,60,.65);border:2px solid rgba(255,255,255,.35);
  display:flex;align-items:center;justify-content:center;font-size:12px;text-align:center;line-height:1.1;pointer-events:auto;color:#fff}
#topbtns{position:fixed;right:10px;bottom:10px;z-index:6;display:none;gap:6px}
#topbtns.on{display:flex}
#topbtns button{padding:5px 9px;font-size:12px;border-radius:7px;background:rgba(30,20,44,.8)}
#help{position:fixed;left:50%;transform:translateX(-50%);bottom:6px;z-index:3;font-size:11px;color:#cbbbe6;opacity:.75;pointer-events:none;white-space:nowrap;display:none}
@media (max-width:700px){#help{display:none!important}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="scr"></div>
<div id="touch">
  <div id="joy"><i></i></div>
  <div id="tbtn">
    <div data-k="0" style="right:0;bottom:0;width:78px;height:78px;font-size:14px">攻撃</div>
    <div data-k="1" style="right:88px;bottom:4px">技2</div>
    <div data-k="2" style="right:70px;bottom:72px">技3</div>
    <div data-k="3" style="right:4px;bottom:92px">技4</div>
    <div data-k="4" style="right:130px;bottom:120px;border-color:#ffd25a">解放</div>
  </div>
</div>
<div id="topbtns">
  <button id="bAuto">オート：切</button>
  <button id="bSnd">音：切</button>
  <button id="bQuit">中断</button>
</div>
<div id="help">移動 <span class="kbd">WASD</span> ／ 攻撃 <span class="kbd">クリック</span>または<span class="kbd">1</span>・<span class="kbd">J</span> ／ 技 <span class="kbd">2</span><span class="kbd">3</span><span class="kbd">4</span> ／ 真名解放・奥義 <span class="kbd">E</span>・<span class="kbd">Space</span> ／ オート <span class="kbd">Q</span></div>
<script>
"use strict";
/* =========================================================
   ゴエティア・ランブル ― 七十二柱の使い魔
   ========================================================= */
const TAU=Math.PI*2, clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.random()*a.length|0];
function mulberry(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]}
function hex(c){return'#'+c.map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('')}
function dk(c,k){return c.map(v=>v*(1-k))}
function lt(c,k){return c.map(v=>v+(255-v)*k)}
function mixc(a,b,t){return a.map((v,i)=>v+(b[i]-v)*t)}
function rgba(h,a){const c=typeof h==='string'?rgb(h):h;return`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`}

/* ---------- 属性 ---------- */
const EL={
  無:{c:'#d8d4e0',name:'無'}, 火:{c:'#ff6a2a'}, 水:{c:'#3e94ff'}, 風:{c:'#5fd08a'}, 地:{c:'#c8924e'},
  雷:{c:'#ffd23a'}, 毒:{c:'#b862e8'}, 闇:{c:'#7a62c0'}, 光:{c:'#fff2a8'}
};
const STRONG={火:['風','毒'],水:['火','地'],風:['水','毒'],地:['雷','火'],雷:['水','風'],毒:['水','光'],闇:['光'],光:['闇','毒']};
const WEAK  ={火:['水','地'],水:['雷','風'],風:['火','雷'],地:['水','風'],雷:['地','雷'],毒:['火','毒'],闇:['闇'],光:['光']};
function effOf(el,types){let e=1;for(const t of types){if(STRONG[el]&&STRONG[el].includes(t))e*=2;if(WEAK[el]&&WEAK[el].includes(t))e*=.5}return e}

/* ---------- 七十二柱 ---------- */
const RANKS={
  王:{hp:300,atk:1.14,def:1.08,spd:.95,pas:'王の威光',pd:'体力が35%を切ると攻撃力が大きく上がる'},
  君主:{hp:262,atk:1.04,def:1.05,spd:1.0,pas:'再生',pd:'体力が少しずつ回復する'},
  公爵:{hp:270,atk:1.08,def:1.04,spd:.96,pas:'軍勢の守り',pd:'受けるダメージを12%軽減'},
  侯爵:{hp:240,atk:1.1,def:.96,spd:1.05,pas:'猛攻',pd:'技の再使用時間が15%短い'},
  総裁:{hp:232,atk:1.0,def:1.0,spd:1.04,pas:'叡智',pd:'真名ゲージが35%たまりやすい'},
  伯爵:{hp:244,atk:1.05,def:1.0,spd:1.0,pas:'呪詛',pd:'攻撃が20%の確率で呪い（防御低下）を与える'},
  騎士:{hp:262,atk:1.12,def:1.0,spd:1.12,pas:'疾駆',pd:'移動が速く、突進技の再使用が早い'}
};
const RAW=[
['バエル','Bael','王','闇','triple','#6a5a7a','#3a2f48','#ff4a6a','heads:toad,man,cat legs:spider crown','東方を治める第一の王。蛙・人・猫の三つの頭をもち、蜘蛛の脚で歩む。姿を消す術を授ける。'],
['アガレス','Agares','公爵','地風','rider','#c9b48a','#7a6a4a','#ffcf4a','mount:croc mc:#5a7a48 head:man beard wpn:hawk','鰐にまたがり腕に鷹をとまらせた老人。逃げる者を呼び戻し、大地を震わせる。'],
['ウァサゴ','Vassago','君主','光','humanoid','#e8dcc0','#6a4a8a','#8af0ff','head:man robe wpn:staff halo','過去と未来を見通し、失せ物のありかを告げる善き君主。'],
['ガミジン','Gamigin','侯爵','水闇','beast','#8a8aa0','#4a4a66','#6af0ff','head:horse','小さな馬の姿で現れ、溺れた死者の魂を呼び出して語らせる。'],
['マルバス','Marbas','総裁','地','beast','#d0a04a','#8a5a2a','#ffdd44','head:lion','大いなる獅子の姿。病を治し、機械の技術を教える。'],
['ウァレフォル','Valefor','公爵','闇','beast','#a07a4a','#5a3a2a','#ff5a5a','head:horse mane','驢馬の頭をもつ獅子。盗賊たちの親分として盗みをそそのかす。'],
['アモン','Amon','侯爵','火','beast','#6a5a5a','#3a3030','#ff8a2a','head:wolf tail:serpent','蛇の尾をもつ狼。口から炎を吐き、過去と未来を語る。'],
['バルバトス','Barbatos','公爵','風','humanoid','#3f7a4a','#7a5a3a','#ffe07a','head:man wpn:bow cape hood','狩人の姿で現れ、鳥や獣の言葉を解する。隠された宝を暴く。'],
['パイモン','Paimon','王','光風','rider','#f0d060','#c98a4a','#ffffff','mount:camel mc:#c9a070 head:woman crown wpn:trumpet','冠を戴き駱駝に乗る王。楽隊を従え、あらゆる学問と秘密を授ける。'],
['ブエル','Buer','総裁','地光','wheel','#d0a050','#7a5a3a','#ffef6a','head:lion','獅子の頭から山羊の脚が放射状に伸び、車輪のように転がる。哲学と薬草の師。'],
['グシオン','Gusion','公爵','光','humanoid','#c9a26a','#6a4a2a','#7affea','head:ape robe wpn:staff','狒々の姿の公爵。過去・現在・未来に答え、敵どうしを和解させる。'],
['シトリー','Sitri','君主','火','humanoid','#e0a040','#8a2a4a','#ff6a9a','head:leopard wings:feather','豹の頭とグリフォンの翼をもつ君主。人の恋心を燃え上がらせる。'],
['ベレト','Beleth','王','雷','rider','#f4e4ec','#9a3a5a','#ffd23a','mount:horse mc:#e8e4dc head:man crown wpn:trumpet','青白い馬に乗り、楽隊のラッパとともに現れる恐るべき王。'],
['レラジェ','Leraje','侯爵','風毒','humanoid','#3f8a3f','#2a4a2a','#c0ff6a','head:man wpn:bow hood','緑衣の射手。その矢傷は決して癒えず、腐り続けるという。'],
['エリゴス','Eligos','公爵','雷','humanoid','#8a9ab0','#3a4a8a','#ffe04a','head:helm armor wpn:spear cape','槍と旗と蛇を携えた騎士。戦の行方と隠された秘密を見通す。'],
['ゼパル','Zepar','公爵','火','humanoid','#b03a3a','#5a1a1a','#ffaa3a','head:helm armor wpn:sword','赤い鎧の兵士。人々の心に恋の炎を灯す。'],
['ボティス','Botis','総裁','毒','serpent','#4a8a5a','#2a4a3a','#ffef4a','horns','恐ろしい毒蛇の姿で現れる。過去と未来を語り、友と敵を和解させる。'],
['バティン','Bathin','公爵','地','rider','#a07a5a','#6a3a2a','#8affc0','mount:horse mc:#e8e8e0 head:man tail:serpent','蛇の尾をもつ屈強な男が青白い馬に乗る。人を瞬時に遠くへ運ぶ。'],
['サレオス','Sallos','公爵','光','rider','#d0a050','#7a3a5a','#ffd0e0','mount:croc mc:#5a8a5a head:man crown armor','鰐に乗る美しい兵士。温和な性格で、男女の愛を取り持つ。'],
['プルソン','Purson','王','地光','rider','#c89a4a','#4a6a3a','#ffe46a','mount:bear mc:#6a4a3a head:lion crown wpn:serpent','獅子の顔の王が熊に乗り、手には毒蛇。ラッパの音とともに現れる。'],
['モラクス','Marax','総裁','地','beast','#7a5a4a','#3a2a2a','#ffcf6a','head:bull','人の顔をもつ巨大な雄牛。天文学と薬草と宝石の効能を教える。'],
['イポス','Ipos','伯爵','火','humanoid','#c89a4a','#8a5a3a','#ff8a4a','head:lion wings:feather legs:goose','獅子の頭に鵞鳥の脚をもつ天使。人に機知と勇気を与える。'],
['アイム','Aim','公爵','火','triple','#c07040','#6a2a2a','#ffd03a','heads:serpent,man,cat legs:serpent wpn:torch','三つの頭をもち毒蛇に乗る。手の松明で町や城に火を放つ。'],
['ナベリウス','Naberius','侯爵','闇','beast','#2c2a3c','#6a2a3a','#ff3a3a','head:dog triple3','三つ首の黒い犬。修辞学に優れ、失われた名誉を取り戻させる。'],
['グラシャ＝ラボラス','Glasya-Labolas','総裁','闇','beast','#6a5a4a','#3a3030','#ff4a4a','head:dog wings:feather','グリフォンの翼をもつ犬。殺戮の首魁にして、あらゆる学問の師。'],
['ブネ','Bune','公爵','闇地','serpent','#4a6a5a','#2a3a3a','#ffe46a','triple','犬・グリフォン・人の三つの首をもつ竜。死者を移し、富をもたらす。'],
['ロノウェ','Ronove','侯爵','闇','humanoid','#5a4a6a','#2a2a3a','#ff7aff','head:fiend wpn:staff robe','杖をもつ怪物。言語と修辞を教え、敵味方の好意を得させる。'],
['ベリト','Berith','公爵','火','rider','#c03030','#6a1a1a','#ffd03a','mount:horse mc:#8a2a2a head:man crown armor','赤い馬に乗る赤衣の兵士。金の冠を戴き、金属を黄金に変える。'],
['アスタロト','Astaroth','公爵','闇毒','rider','#8a7aa0','#4a3a5a','#8aff8a','mount:dragon mc:#4a5a7a head:man crown wpn:serpent','地獄の竜に乗り、右手に毒蛇を握る。過去と未来を語る強大な公爵。'],
['フォルネウス','Forneus','侯爵','水','fish','#3a6a8a','#2a3a5a','#aaf0ff','','巨大な海の怪物。修辞学と諸言語を教え、敵をも友に変える。'],
['フォラス','Foras','総裁','地','humanoid','#7a6a4a','#4a5a2a','#a0ff6a','head:man beard wpn:staff robe','屈強な男の姿。薬草と宝石の効能を教え、長寿と雄弁を授ける。'],
['アスモデウス','Asmoday','王','火','triple','#a04040','#4a2a3a','#ffb03a','heads:bull,man,ram legs:dragon wpn:spear tail:serpent','牛・人・羊の三つの首と蛇の尾をもち、竜にまたがる。幾何学と天文の王。'],

const MOVES_CACHE={};
function movesOf(di){
  if(MOVES_CACHE[di])return MOVES_CACHE[di];
  const d=DEMONS[di], R=mulberry(di*131+7), t0=d.types[0], t1=d.types[1]||t0;
  const p0=POOL[t0].slice(), p1=POOL[t1].slice();
  const a=p0.splice(R()*p0.length|0,1)[0];
  let pool2=t1===t0?p0:p1; let b=pool2[R()*pool2.length|0];
  if(b.n===a.n)b=p0[R()*p0.length|0]||b;
  const u=UTIL[UTIL_BY[t0][R()*2|0]];
  const list=[{...basicOf(d)},{...a,el:t0},{...b,el:t1},{...u}];
  if(d.rank==='騎士')list.forEach(m=>{if(m.k==='dash'||m.k==='lunge')m.cd*=.7});
  return MOVES_CACHE[di]=list;
}

function getSpr(di,frame,tf,white){
  if(typeof frame==='number')frame=['idle0','walk1','atk0'][frame]||'idle0';
  const key=di+'_'+frame+'_'+(tf?1:0)+(white?'w':'');
  if(SPR[key])return SPR[key];
  let c;
  if(white){
    const b=getSpr(di,frame,tf,false); c=document.createElement('canvas');c.width=SW;c.height=SH;
    const g=c.getContext('2d');g.drawImage(b,0,0);g.globalCompositeOperation='source-atop';g.fillStyle='#fff';g.fillRect(0,0,SW,SH);
  } else c=makeSprite(DEMONS[di],frame,tf);
  return SPR[key]=c;
}

function hit(att,tgt,pow,el,o){

  if(!o.dot){
    if(eff>=2){text(tgt.x,tgt.y-104,'効果抜群！','#ffd23a',22,{life:1.1,vy:-40});}
    else if(eff<=.5)text(tgt.x,tgt.y-104,'いまひとつ…','#aab8d8',16,{life:1,vy:-40});

    burst(tgt.x,tgt.y,EL[el].c,big?18:9,big?320:200);
    if(big){B.hitstop=Math.max(B.hitstop,.07);B.shake=Math.max(B.shake,8)}else B.shake=Math.max(B.shake,3);
    SFX.hit(big);
  }
  if(att){att.gauge=Math.min(100,att.gauge+dmg/tgt.maxhp*120*(att.d.rank==='総裁'?1.35:1));}
  tgt.gauge=Math.min(100,tgt.gauge+dmg/tgt.maxhp*70*(tgt.d.rank==='総裁'?1.35:1));
  if(o.st&&Math.random()<(o.sc===undefined?1:o.sc))applySt(tgt,o.st);
  if(att&&!o.dot&&att.d.rank==='伯爵'&&Math.random()<.2)applySt(tgt,'curse');
  if(tgt.d.rank==='王'&&!tgt.kingOn&&tgt.hp>0&&tgt.hp<tgt.maxhp*.35){tgt.kingOn=true;text(tgt.x,tgt.y-130,'王の威光！','#ffd25a',24,{life:1.6,vy:-25});burst(tgt.x,tgt.y,'#ffd25a',40,300)}
  if(tgt.hp<=0)faint(tgt);

}

      g.fillStyle=i===0?'rgba(40,30,90,.92)':'rgba(16,10,24,.9)';rr(g,x,y0,cw,40,7);g.fill();g.strokeStyle=cd>0?'#3a2d50':EL[m.el].c;g.lineWidth=2;rr(g,x,y0,cw,40,7);g.stroke();

      g.textAlign='left';g.fillStyle=EL[m.el].c;g.font='10px "DotGothic16"';g.fillText((i===0?'クリック・':'')+m.el+'・'+KIND[m.k],x+32,y0+13);
      g.fillStyle='#fff';g.font='15px "DotGothic16"';g.fillText(m.n,x+32,y0+29);
      if(cd>0){g.fillStyle='rgba(8,4,12,.62)';rr(g,x,y0,cw*clamp(cd/m.cd,0,1),40,7);g.fill();g.fillStyle='#fff';g.textAlign='right';g.font='12px "DotGothic16"';g.fillText(cd.toFixed(1),x+cw-6,y0+21)}
      void keys;
    });

    g.lineWidth=8;g.strokeStyle='#1a0e22';g.lineJoin='round';g.strokeText(b.s,0,0);g.fillStyle=b.col;g.fillText(b.s,0,0);g.restore()}
  if(G.auto&&B.mode!=='watch'&&B.phase!=='end'){g.font='12px "DotGothic16"';g.fillStyle='#ffd25a';g.textAlign='center';g.fillText('オート操作中（Q で切替）',w/2,h-(G.isTouch?14:104))}

const SEL={mode:'free',picks:[],focus:0,filter:'all',tf:false};
function showSelect(mode){
  G.screen='select';battleUI(false);
  SEL.mode=mode;SEL.tf=false;
  const ok=i=>mode==='free'||mode==='book'||G.save.c.includes(i);
  if(mode==='gauntNext')SEL.picks=G.team.slice();
  else if(mode!=='book')SEL.picks=(G.lastTeam&&G.lastTeam.every(ok)?G.lastTeam.slice():[]);
  else SEL.picks=[];
  SEL.focus=SEL.picks[0]!==undefined?SEL.picks[0]:(mode==='free'||mode==='book'?0:G.save.c[0]);
  renderSelect();
}
function renderSelect(){
  const m=SEL.mode,book=m==='book',gaunt=m==='gaunt'||m==='gauntNext';
  const ok=i=>!gaunt||G.save.c.includes(i);
  const known=i=>!book||G.save.c.includes(i)||G.save.seen.includes(i);
  const els=['all','火','水','風','地','雷','毒','闇','光'];
  const title=book?`魔導書 ― 契約 ${G.save.c.length} / 72 柱`:gaunt?(m==='gauntNext'?`第${G.stage}戦に向けて編成`:'契約の旅 ― 使い魔を三柱選ぶ'):'自由召喚 ― 使い魔を三柱選ぶ';
  let cards='';
  for(const d of DEMONS){if(SEL.filter!=='all'&&!d.types.includes(SEL.filter))continue;
    const i=d.i,can=ok(i),pk=SEL.picks.indexOf(i);
    const cont=G.save.c.includes(i),seen=G.save.seen.includes(i);
    let sil='';if(gaunt&&!can)sil=seen?'seen':'dark';if(book&&!cont)sil=seen?'seen':'dark';
    const showName=!sil||sil==='seen';
    cards+=`<div class="card ${pk>=0?'on':''} ${SEL.focus===i?'focus':''} ${sil&&!book?'lock':''}" data-i="${i}"><span class="no">${d.no}</span>${pk>=0?`<span class="pick">${pk+1}</span>`:''}
      <canvas data-di="${i}" ${sil?`data-sil="${sil}"`:''}></canvas><div class="nm">${showName?d.name:'？？？'}</div><div class="tags">${showName?d.types.map(tagH).join(''):''}</div></div>`;}
  const slots=book?'':`<div class="team">${[0,1,2].map(k=>SEL.picks[k]!==undefined?`<div class="slot"><canvas data-di="${SEL.picks[k]}"></canvas></div>`:`<div class="slot">${k+1}</div>`).join('')}</div>`;
  scr.innerHTML=`<div class="page"><div class="selhead"><div><h2>${title}</h2><div class="small">${book?'倒した悪魔は「契約の旅」で契約できます。':gaunt?'契約済みの悪魔だけを連れて行けます。勝つたびに倒した悪魔と契約できます。':'先頭の一柱から順に戦います。'}</div></div>
    <div class="row">${slots}<button class="ghost" data-a="back">戻る</button>${book?'':`<button class="ghost" data-a="rnd">おまかせ</button><button class="primary" data-a="go" ${SEL.picks.length?'':'disabled'}>出撃</button>`}</div></div>
    <div class="filters" style="margin-bottom:10px">${els.map(e=>`<button class="${SEL.filter===e?'on':''}" data-f="${e}">${e==='all'?'すべて':e}</button>`).join('')}</div>
    <div class="layout"><div class="grid">${cards}</div>${detailH(SEL.focus,(book?known(SEL.focus)&&G.save.c.includes(SEL.focus):ok(SEL.focus)),book?G.save.seen.includes(SEL.focus):G.save.seen.includes(SEL.focus))}</div></div>`;
  paint(scr);
  scr.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>{const i=+c.dataset.i;SFX.ui();SEL.focus=i;SEL.tf=false;
    if(!book&&ok(i)){const k=SEL.picks.indexOf(i);if(k>=0)SEL.picks.splice(k,1);else if(SEL.picks.length<3)SEL.picks.push(i)}
    const sc=scr.querySelector('.page').scrollTop;renderSelect();scr.querySelector('.page').scrollTop=sc}));
  scr.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{SEL.filter=b.dataset.f;renderSelect()}));
  bind(scr,{back:()=>{if(m==='gauntNext')showContinue();else showTitle()},
    rnd:()=>{const pool=DEMONS.map(d=>d.i).filter(ok);SEL.picks=[];while(SEL.picks.length<Math.min(3,pool.length))SEL.picks.push(pool.splice(Math.random()*pool.length|0,1)[0]);SEL.focus=SEL.picks[0];renderSelect()},
    go:()=>{if(!SEL.picks.length)return;G.lastTeam=SEL.picks.slice();G.team=SEL.picks.slice();
      if(m==='gaunt'){G.stage=1;G.gained=0;startStage()}else if(m==='gauntNext')startStage();else startFree()},
    tf:()=>{SEL.tf=!SEL.tf;const sc=scr.querySelector('.page').scrollTop;renderSelect();scr.querySelector('.page').scrollTop=sc}});
}
function detailH(i,unlocked,seen){
  const d=DEMONS[i],st=statsOf(i),mv=movesOf(i),u=ultOf(i),r=RANKS[d.rank];

    <p class="lore">まだ出会っていない悪魔です。契約の旅で戦うと姿が記録されます。</p></div>`;
  const bar=(l,v,mx,txt)=>`<div class="stat"><span>${l}</span><div class="bar"><i style="width:${clamp(v/mx*100,4,100)}%"></i></div><span>${txt}</span></div>`;
  return`<div class="detail"><div class="big"><canvas class="sp" data-di="${i}" data-tf="${SEL.tf?1:0}" ${!unlocked&&SEL.mode!=='free'?'data-sil="seen"':'data-anim="1"'}></canvas>
    <div><div class="latin">第${KANJI_NUM(d.no)}柱 ・ ${d.latin}</div><h3>${d.name}</h3><div class="tags" style="justify-content:flex-start;margin:4px 0">${d.types.map(tagH).join('')}${rankH(d.rank)}</div>

    <div style="margin:8px 0">${bar('体力',st.hp,340,st.hp)}${bar('攻撃',st.atk,1.32,(st.atk*100|0))}${bar('防御',st.def,1.25,(st.def*100|0))}${bar('速さ',st.spd,1.3,(st.spd*100|0))}</div>
    ${mv.map((m,k)=>`<div class="mv"><span class="tag" style="background:${EL[m.el].c}">${m.el}</span><b>${m.n}</b><span class="k">${k===0?'通常':'技'+(k+1)}・${KIND[m.k]}${m.pow?'・威力'+Math.round(m.pow*(m.cnt||1)):''}</span></div>`).join('')}
    <div class="mv" style="background:#3a2a26"><span class="tag" style="background:#ffd25a">奥義</span><b>${u.n}</b><span class="k">真名解放後</span></div>

function startStage(){
  const n=G.stage,boss=n%5===0;
  let en=rndTeam(3,G.team);
  if(boss){const kings=DEMONS.filter(d=>d.rank==='王'&&!G.team.includes(d.i)&&!en.includes(d.i)).map(d=>d.i);en[2]=pick(kings)}
  const lv=1+.09*(n-1);
  startBattle(G.team,en,{mode:'gaunt',lv,theme:boss?4:(n-1)%4,label:`契約の旅　第${n}戦`+(boss?'　王の試練':'')});
  B.big={s:`第${n}戦　${B.th.name}`,t:0,dur:1.8,col:boss?'#ffd25a':'#ffffff'};
  G.screen='battle';scr.innerHTML='';battleUI(true);
}

function onBattleEnd(){

  const any=list.some(i=>!G.save.c.includes(i));
  scr.innerHTML=`<div class="page result center"><h2 style="color:#ffd25a">第${G.stage}戦 勝利！</h2>

function showContinue(nd){

      <div>第${KANJI_NUM(nd.no)}柱 ${nd.name} が使い魔になった</div>`:`<h2>次の戦いへ</h2>`}

function showGameOver(){

G.isTouch=matchMedia('(pointer:coarse)').matches;
function updAutoBtn(){const b=document.getElementById('bAuto');if(b)b.textContent=G.auto?'オート：入':'オート：切'}
addEventListener('keydown',e=>{
  G.keys[e.code]=true;
  if(G.screen==='battle'){
    if(e.code==='KeyQ'&&B&&B.mode!=='watch'){G.auto=!G.auto;updAutoBtn()}
    if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  }
  if(e.code==='KeyM')setSound(!AU.on);
});
addEventListener('keyup',e=>{G.keys[e.code]=false});
addEventListener('blur',()=>{G.keys={};G.mouse.down=false});
cv.addEventListener('mousemove',e=>{G.mouse.x=e.clientX;G.mouse.y=e.clientY;G.mouse.active=true});
cv.addEventListener('mousedown',e=>{if(e.button===0)G.mouse.down=true;G.mouse.x=e.clientX;G.mouse.y=e.clientY;G.mouse.active=true});
addEventListener('mouseup',e=>{if(e.button===0)G.mouse.down=false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
(function(){
  const joy=document.getElementById('joy'),knob=joy.querySelector('i');let id=null;
  const upd=e=>{const r=joy.getBoundingClientRect();let dx=(e.clientX-r.left-r.width/2)/50,dy=(e.clientY-r.top-r.height/2)/50;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}
    G.touch.jx=Math.abs(dx)<.15?0:dx;G.touch.jy=Math.abs(dy)<.15?0:dy;knob.style.transform=`translate(${dx*40}px,${dy*40}px)`};
  joy.addEventListener('pointerdown',e=>{id=e.pointerId;joy.setPointerCapture(id);upd(e);G.isTouch=true;G.mouse.active=false});
  joy.addEventListener('pointermove',e=>{if(e.pointerId===id)upd(e)});
  const end=e=>{if(e.pointerId!==id)return;id=null;G.touch.jx=G.touch.jy=0;knob.style.transform=''};
  joy.addEventListener('pointerup',end);joy.addEventListener('pointercancel',end);
  document.querySelectorAll('#tbtn div').forEach(b=>{const k=+b.dataset.k;
    b.addEventListener('pointerdown',e=>{e.preventDefault();G.touch.btn[k]=1;G.mouse.active=false;b.setPointerCapture(e.pointerId)});
    const off=()=>{G.touch.btn[k]=0};b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off)});
})();
document.getElementById('bAuto').onclick=()=>{G.auto=!G.auto;updAutoBtn()};
document.getElementById('bSnd').onclick=()=>setSound(!AU.on);
document.getElementById('bQuit').onclick=()=>{showTitle()};
function resize(){
  G.W=innerWidth;G.H=innerHeight;G.dpr=Math.min(2,devicePixelRatio||1);cv.width=G.W*G.dpr|0;cv.height=G.H*G.dpr|0;
  G.uiS=G.W<G.H?clamp(G.W/560,.55,1.2):clamp(Math.min(G.W/1060,G.H/660),.55,1.5);
}
addEventListener('resize',resize);resize();
const ANIMSEQ=(()=>{const q=[],W=p=>[0,1,2,3,0,1,2,3].map(i=>p+'walk'+i);
  q.push('idle0','idle1','idle2','idle3','idle4','idle0',...W(''),'atk0','atk0','atk1','atk2','idle0','cast0','cast0','cast1','cast1','cast2',
    'f:idle0','f:idle1','f:idle2','f:idle3',...W('f:'),'f:atk0','f:atk1','f:atk2','f:idle4','b:idle0','b:idle1',...W('b:'),'b:cast0','b:cast1','b:cast2','hurt0','hurt0','idle2','idle3');return q})();
setInterval(()=>{document.querySelectorAll('canvas[data-anim]').forEach(c=>{const k=((+c.dataset.k||0)+1)%ANIMSEQ.length;c.dataset.k=k;
  const g=c.getContext('2d');g.clearRect(0,0,40,40);g.imageSmoothingEnabled=false;let fr=ANIMSEQ[k];
  if(DEMONS[+c.dataset.di].arch==='bird'&&/idle[0-3]$/.test(fr))fr=fr.replace(/idle\d$/,'walk'+(k%4));
  g.drawImage(getSpr(+c.dataset.di,fr,c.dataset.tf==='1',false),0,0)})},110);
let tbT=0;
function updTouchBtns(){
  if(!G.isTouch||!B||G.screen!=='battle')return;const f=B.f[0];if(!f)return;
  document.querySelectorAll('#tbtn div').forEach(b=>{const k=+b.dataset.k;
    if(k<4){const m=f.moves[k];const p=clamp(m.t/m.cd,0,1);b.style.background=p>0?`conic-gradient(rgba(10,6,16,.85) ${p*360}deg, rgba(60,40,90,.7) 0)`:'rgba(60,40,90,.75)';b.textContent=m.n}
    else{b.style.background=f.gauge>=100?'rgba(160,120,30,.85)':`conic-gradient(rgba(255,210,90,.55) ${f.gauge*3.6}deg, rgba(40,25,60,.65) 0)`;b.textContent=f.tf?'奥義':'真名'}})
}
let last=performance.now();
function frame(now){
  let dt=Math.min(.05,(now-last)/1000);last=now;
  if(B){
    G.mouse.wx=(G.mouse.x-G.W/2)/B.cam.z+B.cam.x;G.mouse.wy=(G.mouse.y-G.H/2)/B.cam.z+B.cam.y;
    let sdt=dt;if(B.hitstop>0){B.hitstop-=dt;sdt=0}
    if(B.slowT>0){B.slowT-=dt;sdt*=.35}
    sim(sdt);updCam(dt);
  }
  render();
  tbT-=dt;if(tbT<=0){tbT=.1;updTouchBtns()}
  requestAnimationFrame(frame);
}
showTitle();
requestAnimationFrame(frame);
window.GR={
  get B(){return B},G,DEMONS,
  ff(sec){const n=Math.round(sec*60);for(let i=0;i<n;i++){if(B.hitstop>0)B.hitstop=0;sim(1/60);updCam(1/60)}},
  start(a,b,mode){G.team=a;startBattle(a,b,{mode:mode||'free',label:'テスト'});G.screen='battle';scr.innerHTML='';battleUI(true)},
  special(s){const f=B.f[s||0];f.gauge=100;special(f)},
  state(){return B&&{phase:B.phase,time:B.time,idx:B.idx,f:B.f.map(f=>f&&{n:f.d.name,hp:Math.round(f.hp),max:f.maxhp,tf:f.tf,g:f.gauge|0}),result:B.result,proj:B.proj.length,haz:B.haz.length,parts:B.parts.length}},
  showSelect,showTitle,startStage,
};
</script>
</body>
