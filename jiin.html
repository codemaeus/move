<title>Mountain Temple Diorama</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #efe8dc;
    --dim: #a29684;
    --ground: #0e0c12;
    --panel: #1a1620;
    --line: #3e3346;
    --gold: #e8c06a;
    --moss: #9fc79a;
    --shu: #e0674c;
    --font: "DotGothic16", "MS Gothic", "Osaka-Mono", ui-monospace, monospace;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 15px;
    padding-inline: 16px; padding-block: 16px 24px; box-sizing: border-box; }
  .wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 22px; font-weight: 400; letter-spacing: 0.08em; color: var(--gold); }
  .sub { color: var(--dim); font-size: 13px; }
  .screen { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; background: #000; border: 1px solid var(--line); }
  #view { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  .hud { position: absolute; left: 10px; top: 8px; display: flex; gap: 10px; font-size: 13px; color: var(--gold); text-shadow: 0 0 4px #000; pointer-events: none; }
  .hud span:last-child { color: var(--moss); }
  .row { display: grid; grid-template-columns: 1fr minmax(0, 320px); gap: 14px; align-items: start; }
  @media (max-width: 760px) { .row { grid-template-columns: 1fr; } }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .label { color: var(--dim); font-size: 12px; letter-spacing: 0.1em; }
  button, select { font-family: var(--font); font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); padding: 6px 10px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  button.play { border-color: #7a4a3a; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--moss); outline-offset: 2px; }
  button:disabled { opacity: 0.5; cursor: wait; }
  input[type="range"] { accent-color: var(--gold); width: 110px; }
  .log { margin: 0; padding: 10px 12px; list-style: none; background: var(--panel); border: 1px solid var(--line); min-height: 170px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .log li { display: flex; gap: 8px; }
  .log time { color: var(--dim); font-variant-numeric: tabular-nums; flex: none; }
  .log li.wx { color: var(--moss); } .log li.yo { color: #d9a0ff; } .log li.ev { color: var(--gold); }
  #status { color: var(--moss); font-size: 13px; min-height: 1.2em; }
  .out { display: flex; flex-direction: column; gap: 8px; }
  .out img, .out video { max-width: 100%; image-rendering: pixelated; border: 1px solid var(--line); }
  .hint { color: var(--dim); font-size: 12px; line-height: 1.6; margin: 0; }
</style>

<div class="wrap">
  <header>
    <h1>山寺ジオラマ</h1>
    <span class="sub">アイソメトリック / 和の音楽 / 320×180 ピクセル</span>
  </header>
  <div class="screen">
    <canvas id="view" width="1280" height="720"></canvas>
    <div class="hud" aria-hidden="true"><span id="hud-t">夜</span><span id="hud-w">晴れ</span></div>
  </div>
  <div class="row">
    <div class="controls">
      <div class="group">
        <button id="music" class="play" aria-pressed="false">音を出す</button>
        <label class="label" for="vol">音量</label>
        <input id="vol" type="range" min="0" max="100" value="70">
        <button id="bgm" aria-pressed="true">音楽</button>
      </div>
      <div class="group" role="group" aria-label="時間">
        <span class="label">時間</span>
        <button data-t="auto" aria-pressed="false">自動</button>
        <button data-t="0.22" aria-pressed="false">昼</button>
        <button data-t="0.46" aria-pressed="false">夕</button>
        <button data-t="0.7" aria-pressed="true">夜</button>
      </div>
      <div class="group" role="group" aria-label="天気">
        <span class="label">天気</span>
        <button data-w="auto" aria-pressed="true">自動</button>
        <button data-w="rain" aria-pressed="false">雨あり</button>
        <button data-w="dry" aria-pressed="false">雨なし</button>
      </div>
      <div class="group" role="group" aria-label="出来事を起こす">
        <span class="label">出来事</span>
        <button data-ev="bell">鐘つき</button>
        <button data-ev="visitor">参拝</button>
        <button data-ev="sutra">読経</button>
        <button data-ev="takuhatsu">托鉢</button>
        <button data-ev="tanuki">化け狸</button>
        <button data-ev="yokai">妖怪</button>
      </div>
      <div class="group">
        <button id="pause" aria-pressed="false">一時停止</button>
        <label class="label" for="gifsec">GIF</label>
        <select id="gifsec"><option value="4">4秒</option><option value="8" selected>8秒</option><option value="12">12秒</option></select>
        <select id="gifscale" aria-label="GIFサイズ"><option value="1">320×180</option><option value="2" selected>640×360</option></select>
        <button id="gif">GIFを作る</button>
        <button id="webm">動画を録画</button>
      </div>
      <p class="hint">宙に浮かぶ山寺の境内。本堂、三重塔、鐘楼、山門、手水舎、枯山水、鯉の池、紅葉、お地蔵さん。参拝客が手を清めて鰐口を鳴らし、おみくじを引き、和尚が鐘をつき、本堂から読経と木魚が聞こえます。夜は石灯籠に火がともり、狐火や猫又、一反木綿、雨の日には河童も現れます。</p>
    </div>
    <ul class="log" id="log" aria-live="polite"></ul>
  </div>
  <div id="status" role="status"></div>
  <div class="out" id="out"></div>
</div>

<script>
(() => {
  "use strict";
  const W = 320, H = 180;
  const low = document.createElement("canvas"); low.width = W; low.height = H;
  const ctx = low.getContext("2d", { willReadFrequently: true });
  ctx.imageSmoothingEnabled = false;
  const view = document.getElementById("view"), vctx = view.getContext("2d");
  vctx.imageSmoothingEnabled = false;
  const PFONT = '"DotGothic16", "MS Gothic", monospace';
  if (document.fonts && document.fonts.load) document.fonts.load(`9px ${PFONT}`).catch(() => {});

  // ---------- helpers ----------
  function hash(i) { let h = Math.imul((i | 0) ^ 0x9e3779b9, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
  const mod = (a, n) => ((a % n) + n) % n;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const mul = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
  const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${clamp(a, 0, 1).toFixed(3)})`;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[(Math.random() * a.length) | 0];
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  function rect(x, y, w, h, c) { ctx.fillStyle = typeof c === "string" ? c : rgb(c); ctx.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h))); }
  const px = (x, y, c) => { ctx.fillStyle = typeof c === "string" ? c : rgb(c); ctx.fillRect(Math.round(x), Math.round(y), 1, 1); };
  function glow(x, y, r, c, a, sy = 1) {
    if (r < 0.5 || a <= 0.01) return;
    ctx.save(); ctx.translate(x, y); ctx.scale(1, sy);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
    g.addColorStop(0, rgba(c, a)); g.addColorStop(0.4, rgba(c, a * 0.35)); g.addColorStop(1, rgba(c, 0));
    ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = g; ctx.fillRect(-r, -r, r * 2, r * 2);
    ctx.restore();
  }

  // ---------- state ----------
  const S = {
    time: 0, tod: 0.7, todMode: "fixed", weather: "auto", rain: 0, wet: 0, lastWx: 0, lastPhase: "", flash: 0, bolt: null,
    drops: [], splashes: [], ripples: [], puffs: [], leaves: [], flies: [], wisps: [], words: [], events: [], nextEvent: 3, nextVisitor: 4,
    bell: 0, bellCount: 0, sutra: 0, lanternsLit: 1, shishi: 0, shishiT: 7, koiJump: null, gateObake: 0, paused: false,
  };
  const night = () => smooth(0.4, 0.55, S.tod) * (1 - smooth(0.9, 1.0, S.tod));
  const dusk = () => Math.max(0, 1 - Math.abs(S.tod - 0.47) / 0.07);
  let TINT = [1, 1, 1];
  const sh = c => [c[0] * TINT[0], c[1] * TINT[1], c[2] * TINT[2]];

  // ---------- isometric rasteriser ----------
  const OX = 160, OY0 = 58, A = 8, B = 4, C = 7, N = 12;
  let OY = OY0;
  const sX = (x, y) => OX + (x - y) * A;
  const sY = (x, y, z) => OY + (x + y) * B - z * C;
  function col(x, y0, y1) { const a = Math.round(y0), b = Math.round(y1); if (b > a) ctx.fillRect(x, a, 1, b - a); }
  function top(x0, x1, y0, y1, z, c) {
    ctx.fillStyle = typeof c === "string" ? c : rgb(c);
    const L = Math.ceil(sX(x0, y1) - 0.5), R = Math.floor(sX(x1, y0) - 0.5);
    for (let s = L; s <= R; s++) { const u = (s + 0.5 - OX) / A, lo = Math.max(2 * x0 - u, 2 * y0 + u), hi = Math.min(2 * x1 - u, 2 * y1 + u); if (hi > lo) col(s, OY + lo * B - z * C, OY + hi * B - z * C); }
  }
  function faceY(x0, x1, y, z0, z1, c) {
    ctx.fillStyle = typeof c === "string" ? c : rgb(c);
    const L = Math.ceil(sX(x0, y) - 0.5), R = Math.floor(sX(x1, y) - 0.5);
    for (let s = L; s <= R; s++) { const x = (s + 0.5 - OX) / A + y, b = OY + (x + y) * B; col(s, b - z1 * C, b - z0 * C); }
  }
  function faceX(x, y0, y1, z0, z1, c) {
    ctx.fillStyle = typeof c === "string" ? c : rgb(c);
    const L = Math.ceil(sX(x, y1) - 0.5), R = Math.floor(sX(x, y0) - 0.5);
    for (let s = L; s <= R; s++) { const y = x - (s + 0.5 - OX) / A, b = OY + (x + y) * B; col(s, b - z1 * C, b - z0 * C); }
  }
  const wetTop = c => S.wet > 0 ? mix(c, [c[0] * 0.72, c[1] * 0.74, c[2] * 0.86], S.wet * 0.6) : c;
  function box(x0, y0, z0, w, d, h, c, k = [1, 0.72, 0.52]) {
    top(x0, x0 + w, y0, y0 + d, z0 + h, wetTop(sh(mul(c, k[0]))));
    faceY(x0, x0 + w, y0 + d, z0, z0 + h, sh(mul(c, k[1])));
    faceX(x0 + w, y0, y0 + d, z0, z0 + h, sh(mul(c, k[2])));
  }
  // stepped hip roof with tile rows and an overhang
  function roof(x0, y0, w, d, z0, h, c, over = 0.6, ridge = null) {
    const steps = Math.max(3, Math.round(h * C / 1.6)), shrink = Math.min(w, d) / 2 + over - 0.12;
    for (let i = 0; i < steps; i++) {
      const t = i / steps, s = Math.pow(t, 0.85) * shrink, cc = i % 2 ? mul(c, 0.9) : c;
      box(x0 - over + s, y0 - over + s, z0 + t * h, w + 2 * over - 2 * s, d + 2 * over - 2 * s, h / steps + 0.02, cc, [1, 0.62, 0.45]);
    }
    if (ridge) { const r = shrink; box(x0 - over + r, y0 - over + r, z0 + h, Math.max(0.2, w + 2 * over - 2 * r), Math.max(0.2, d + 2 * over - 2 * r), 0.18, ridge); }
  }

  // ---------- log & words ----------
  const logEl = document.getElementById("log");
  const clock = () => { const m = Math.floor(mod(S.tod * 1440 + 360, 1440)); return `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`; };
  function log(msg, cls = "ev") {
    const li = document.createElement("li"); li.className = cls;
    const t = document.createElement("time"); t.textContent = clock();
    const sp = document.createElement("span"); sp.textContent = msg;
    li.append(t, sp); logEl.prepend(li);
    while (logEl.children.length > 9) logEl.lastChild.remove();
  }
  function word(str, gx, gy, gz, c = [255, 240, 200], life = 1.2) { S.words.push({ str, gx, gy, gz, c, t: 0, life }); }

  // ---------- layout ----------
  const LANTERNS = [[4.6, 6.6], [7.8, 6.6], [4.6, 9.2], [7.8, 9.2]];
  const HALL = { x: 3.8, y: 0.8, w: 4.8, d: 3.8 };
  function surfaceZ(x, y) {
    if (x > 3.2 && x < 9.2 && y > 0.2 && y < 5.2) return 4.2;
    if (x > 0.4 && x < 3.2 && y > 6.8 && y < 9.6) return 5;
    if (x > 9.2 && x < 11.8 && y > 5.8 && y < 8.4) return 3.2;
    if (x > 4.6 && x < 7.8 && y > 10.8 && y < 12) return 3;
    if (x > 0.6 && x < 3.2 && y > 3.8 && y < 6.2) return 2.2;
    if (x > 1 && x < 3.6 && y > 9.6 && y < 12) return 3;
    if (x > 8.3 && x < 11.5 && y > 9.2 && y < 11.6) return -0.25;
    return 0;
  }
  const isPond = (x, y) => x > 8.3 && x < 11.5 && y > 9.2 && y < 11.6;

  // ---------- characters & events ----------
  const LOOKS = [
    { coat: [80, 90, 120], pants: [40, 40, 50], hair: [20, 18, 18] },
    { coat: [170, 70, 90], pants: [60, 50, 60], hair: [50, 34, 26], long: true },
    { coat: [200, 186, 150], pants: [60, 56, 60], hair: [30, 24, 20] },
    { coat: [70, 110, 90], pants: [40, 44, 44], hair: [16, 16, 16], bag: true },
    { coat: [120, 80, 140], pants: [50, 45, 60], hair: [80, 70, 70], long: true },
  ];
  const UMB = [[190, 60, 50], [70, 110, 190], [220, 200, 120], [90, 150, 110], [230, 226, 214]];
  const add = e => { e.t = 0; S.events.push(e); return e; };
  const active = t => S.events.some(e => e.type === t);
  // a walker follows waypoints: [x, y, waitSeconds, action]
  function walker(type, path, extra = {}) { return add(Object.assign({ type, path, i: 0, x: path[0][0], y: path[0][1], wait: 0, v: 0.9, look: pick(LOOKS), umb: pick(UMB) }, extra)); }
  function visitorPath() {
    const omikuji = Math.random() < 0.6;
    const p = [[6.2, 12.2, 0], [6.2, 10.2, 0], [3.3, 5.2, 2.2, "wash"], [6.2, 7.2, 1.8, "smoke"], [6.2, 5.9, 3.2, "pray"]];
    if (omikuji) p.push([4.6, 5.6, 2.6, "omikuji"]);
    p.push([6.2, 8, 0], [6.2, 12.4, 0]);
    return p;
  }
  function startEvent(kind) {
    switch (kind) {
      case "visitor": walker("visitor", visitorPath()); log("参拝客が山門をくぐった"); break;
      case "bell": if (active("monk")) return; walker("monk", [[8.8, 4.9, 0], [8.9, 8.8, 0], [10.2, 8.8, 3.2, "ring"], [8.8, 4.9, 0]], { v: 0.7 }); log("和尚が鐘楼へ向かう"); break;
      case "sutra": S.sutra = 14; log("本堂から読経と木魚の音が聞こえてくる"); break;
      case "sweep": if (active("novice") || S.rain > 0.2) return; walker("novice", [[6.9, 5.4, 0], [6.9, 10.5, 0], [5.6, 10.5, 0], [5.6, 5.6, 0], [6.9, 5.4, 0]], { v: 0.35 }); log("小僧が参道の落ち葉を掃いている"); break;
      case "takuhatsu": walker("takuhatsu", [[0.2, 11.6, 0], [4.4, 11.9, 0], [6.2, 12.2, 2.5, "bow"], [12, 12.2, 0]], { v: 0.5 }); log("網代笠の托鉢僧が 鈴を鳴らして通りすぎていく"); break;
      case "tanuki": if (active("tanuki")) return; add({ type: "tanuki", dur: 12, x: 4.3, y: 11.4 }); log("山門脇の狸の置物が… 葉っぱを頭にのせて踊りだした！", "yo"); sfx("poof"); break;
      case "yokai": startEvent(pick(S.rain > 0.2 ? ["kappa", "kappa", "nekomata", "chochin"] : night() > 0.5 ? ["kitsunebi", "nekomata", "ittan", "chochin"] : ["nekomata", "ittan", "chochin"])); break;
      case "kappa": if (active("kappa")) return; add({ type: "kappa", dur: 10 }); log("池から河童がひょっこり顔を出した", "yo"); sfx("splash"); break;
      case "nekomata": if (active("nekomata")) return; add({ type: "nekomata", dur: 14 }); log("本堂の屋根を 尻尾が二股の猫又が歩いている", "yo"); sfx("meow"); break;
      case "ittan": if (active("ittan")) return; add({ type: "ittan", dur: 9, y: rnd(20, 50) }); log("夜空を一反木綿がひらひら飛んでいく", "yo"); break;
      case "kitsunebi": for (let i = 0; i < 5; i++) S.wisps.push({ x: rnd(0.5, 3), y: rnd(6.8, 9.6), z: rnd(1, 4), t: 0, ph: rnd(0, 6) }); log("三重塔のまわりに 青白い狐火がともった", "yo"); break;
      case "chochin": S.gateObake = 8; log("山門の大提灯が べろりと舌を出した", "yo"); sfx("giggle"); break;
      case "koi": S.koiJump = { t: 0, x: rnd(9, 11), y: rnd(9.8, 11) }; log("池の鯉がぱしゃりと跳ねた"); sfx("splash"); break;
      case "lanterns": S.lanternsLit = 0; walker("monk", [[8.8, 4.9, 0], [7.9, 6.9, 1, "light"], [4.9, 6.9, 1, "light"], [4.9, 9.5, 1, "light"], [7.9, 9.5, 1, "light"], [8.8, 4.9, 0]], { v: 0.8 }); log("和尚が石灯籠に火を入れてまわる"); break;
      case "cat": if (active("cat")) return; add({ type: "cat", dur: 18 }); log("本堂の階段で 寺の猫がのびをした"); break;
      case "shooting": add({ type: "shooting", dur: 0.9, x: rnd(80, 260), y: rnd(6, 24) }); log("流れ星が 五重の夜空をかけていった"); break;
    }
  }
  function trySpecial() {
    const n = night(), rain = S.rain > 0.2;
    const c = [["visitor", 2.6], ["bell", 1.6], ["sutra", 1.6], ["sweep", !rain && n < 0.5 ? 2 : 0], ["takuhatsu", 1.1], ["tanuki", 1.2], ["kappa", rain ? 2 : 0],
      ["nekomata", n > 0.4 ? 1.2 : 0.3], ["ittan", n > 0.5 && !rain ? 1 : 0], ["kitsunebi", n > 0.5 ? 1.3 : 0], ["chochin", n > 0.5 ? 1 : 0.3], ["koi", 1.6], ["cat", !rain ? 1.2 : 0], ["shooting", n > 0.6 && !rain ? 1 : 0]]
      .filter(x => x[1] > 0);
    let r = Math.random() * c.reduce((a, x) => a + x[1], 0), t = c[0][0];
    for (const [k, w] of c) if ((r -= w) <= 0) { t = k; break; }
    startEvent(t);
  }
  function doAction(e, act) {
    switch (act) {
      case "wash": sfx("water"); word("ちゃぷ", 2, 5, 1.6, [180, 220, 255]); break;
      case "smoke": word("けむり", 6.2, 6.4, 2.2, [220, 220, 230]); break;
      case "pray": sfx("coin"); setTimeout(() => sfx("gong"), 500); word("チャリン", 6.2, 5.4, 1.4, [255, 230, 140]); setTimeout(() => word("ガランガラン", 6.2, 4.9, 2.4, [255, 220, 150]), 500); break;
      case "omikuji": { const r = pick(["大吉", "中吉", "小吉", "吉", "末吉", "凶"]); sfx("rattle"); setTimeout(() => { word(r + "!", 4.6, 5.6, 2.2, r === "凶" ? [180, 200, 255] : [255, 120, 100], 2); log(`おみくじを引いた。「${r}」だった`); }, 900); break; }
      case "ring": S.bell = 8; S.bellCount++; sfx("bell"); word("ゴーン…", 10.5, 7.2, 4.2, [235, 235, 255], 2.4); log(`鐘の音が山にひびく（${S.bellCount}つ目）`); break;
      case "light": S.lanternsLit = Math.min(4, S.lanternsLit + 1); sfx("tap"); break;
      case "bow": sfx("suzu"); word("チリン", e.x, e.y, 2.2, [255, 240, 200]); break;
    }
  }

  // ---------- update ----------
  function weatherTarget() {
    if (S.weather === "rain") return 0.8;
    if (S.weather === "dry") return 0;

  // ---------- sound: koto, shakuhachi, sho-like drone + temple sounds ----------
  const Snd = { ac: null, on: false, vol: 0.7, bgm: true, n: null, nextNote: 0, nextFlute: 0, droneT: 0 };

    for (let i = 0; i < pd.length; i++) { const w = Math.random() * 2 - 1; b0 = 0.997 * b0 + w * 0.029; b1 = 0.985 * b1 + w * 0.032; b2 = 0.95 * b2 + w * 0.048; pd[i] = (b0 + b1 + b2) * 0.9; }

    if (rec) { rec.stop(); return; }
    if (!view.captureStream || typeof MediaRecorder === "undefined") { status.textContent = "このブラウザは動画録画に対応していません。GIF をお使いください。"; return; }
    const chunks = [], type = ["video/webm;codecs=vp9", "video/webm", "video/mp4"].find(t => MediaRecorder.isTypeSupported(t)) || "";
    rec = new MediaRecorder(view.captureStream(30), type ? { mimeType: type, videoBitsPerSecond: 6e6 } : undefined);
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => {
      const v = document.createElement("video"); v.src = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType || "video/webm" }));
      v.controls = v.loop = v.muted = v.autoplay = true; out.prepend(v);
      status.textContent = "録画しました（映像のみ）。動画の右クリック／長押しで保存できます。"; rec = null; webmBtn.textContent = "動画を録画";
    };
    rec.start(); webmBtn.textContent = "録画を止める"; status.textContent = "録画中… もう一度押すと停止します。";
  });

  log("山寺の夜。石灯籠に火がともっている", "wx");
  S.lanternsLit = 4; S.lastPhase = "night";
  for (let i = 0; i < 20; i++) step(1 / 30);
  window.Jiin = { S, frame, makeGif, startEvent };
  requestAnimationFrame(loop);
})();
</script>
