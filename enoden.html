<!doctype html>
<title>Shonan Window</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
  :root { color-scheme: dark; --ink: #eef0ea; --dim: #9aa4a0; --ground: #0c1113; --panel: #141c1e; --line: #2c3c3e; --accent: #7fd6c2; --warm: #ffd08a;
    --font: "DotGothic16", "MS Gothic", "Osaka-Mono", ui-monospace, monospace; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 15px; padding-inline: 16px; padding-block: 16px 24px; box-sizing: border-box; }
  .wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .screen { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--line); }
  #view { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  h1 { margin: 0; font-size: 22px; font-weight: 400; letter-spacing: 0.08em; color: var(--accent); }
  .sub { color: var(--dim); font-size: 13px; margin: 4px 0 0; }
  .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .label { color: var(--dim); font-size: 12px; letter-spacing: 0.1em; }
  button, select { font-family: var(--font); font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); padding: 6px 10px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  button.play { border-color: #3a6a60; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--warm); outline-offset: 2px; }
  button:disabled { opacity: 0.5; cursor: wait; }
  input[type="range"] { accent-color: var(--accent); width: 110px; }
  .log { margin: 0; padding: 10px 12px; list-style: none; background: var(--panel); border: 1px solid var(--line); min-height: 120px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .log li { display: flex; gap: 8px; } .log time { color: var(--dim); font-variant-numeric: tabular-nums; flex: none; }
  .log li.st { color: var(--accent); } .log li.ev { color: var(--warm); }
  #status { color: var(--accent); font-size: 13px; min-height: 1.2em; }
  .out { display: flex; flex-direction: column; gap: 8px; } .out img, .out video { max-width: 100%; image-rendering: pixelated; border: 1px solid var(--line); }
  .hint { color: var(--dim); font-size: 12px; line-height: 1.7; margin: 0; }
</style>
<body>
<div class="wrap">
  <div class="screen"><canvas id="view" width="1440" height="810" aria-label="湘南の海沿いを走る電車の車窓"></canvas></div>
  <div>
    <h1>湘南の車窓 ― 海沿いの小さな電車</h1>
    <p class="sub">480×270 ピクセル / 手で選んだ色で描いた湘南の海と町 / 江ノ電ふうの車内から</p>
  </div>
  <div class="group">
    <button id="music" class="play" aria-pressed="false">音を出す</button><label class="label" for="vol">音量</label><input id="vol" type="range" min="0" max="100" value="70">
    <button id="bgm" aria-pressed="true">lo-fi 音楽</button><button id="pause" aria-pressed="false">一時停止</button>
    <span class="label">速さ</span><button data-sp="1" aria-pressed="true">ふつう</button><button data-sp="2" aria-pressed="false">2倍</button>
  </div>
  <div class="group" role="group" aria-label="時間帯"><span class="label">時間帯</span><button data-t="auto" aria-pressed="true">自動</button><button data-t="0.12" aria-pressed="false">朝</button><button data-t="0.27" aria-pressed="false">昼</button><button data-t="0.49" aria-pressed="false">夕焼け</button><button data-t="0.72" aria-pressed="false">夜</button>
    <span class="label">天気</span><button data-w="clear" aria-pressed="true">晴れ</button><button data-w="rain" aria-pressed="false">雨</button></div>
  <div class="group"><label class="label" for="gifsec">GIF</label>
    <select id="gifsec"><option value="4">4秒</option><option value="8" selected>8秒</option><option value="12">12秒</option></select>
    <select id="gifscale" aria-label="GIFサイズ"><option value="1" selected>480×270</option><option value="2">960×540</option></select>
    <button id="gif">GIFを作る</button><button id="webm">動画を録画</button><span class="label" id="perf"></span></div>
  <ul class="log" id="log" aria-live="polite"></ul>
  <p class="hint">極楽寺のトンネルを抜け、稲村ヶ崎・七里ヶ浜・鎌倉高校前・腰越・江ノ島と、海沿いを走る小さな電車の車窓です。家すれすれの住宅街、七里ヶ浜の海と江の島と富士山、踏切、路面区間、駅での停車とすれ違い。時間は朝から夜へゆっくり移り、ぐるりと一周してまたトンネルへ戻ります。「音を出す」で走行音・踏切・波・セミと lo-fi 音楽が鳴ります（すべてブラウザ内で合成）。</p>
  <div id="status" role="status"></div><div class="out" id="out"></div>
</div>
<script>
(async () => {
  "use strict";
  try { await Promise.all([document.fonts.load('12px "DotGothic16"'), document.fonts.load('14px "DotGothic16"')]); } catch (e) { /* fall back to the system font */ }
  const W = 480, H = 270, XC = 240, HOR = 112;
  const view = document.getElementById("view"), vctx = view.getContext("2d"); vctx.imageSmoothingEnabled = false;
  const PF = '"DotGothic16", "MS Gothic", monospace';

  // ---------- helpers ----------
  function canvas(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d", { willReadFrequently: true }); x.imageSmoothingEnabled = false; return [c, x]; }
  function hash(i) { let h = Math.imul((i | 0) ^ 0x9e3779b9, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
  const h2 = (x, y) => hash(Math.imul(x | 0, 73856093) ^ Math.imul(y | 0, 19349663));
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const mul = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
  const col = c => typeof c === "string" ? c : `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${clamp(a, 0, 1).toFixed(3)})`;
  const mod = (a, n) => ((a % n) + n) % n;
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  function rng(seed) { let a = seed | 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const dith = (x, y, t) => t * 16 > BAY[(x & 3) + ((y & 3) << 2)];
  const F5 = { A: "010101111101101", B: "110101110101110", C: "011100100100011", D: "110101101101110", E: "111100110100111", F: "111100110100100", G: "011100101101011", H: "101101111101101", I: "111010010010111", K: "101101110101101", L: "100100100100111", M: "101111111101101", N: "110101101101101", O: "010101101101010", P: "110101110100100", R: "110101110101101", S: "011100010001110", T: "111010010010010", U: "101101101101111", W: "101101111111101", X: "101101010101101", Y: "101101010010010", "-": "000000111000000", ".": "000000000000010", " ": "000000000000000", "1": "010110010010111", "3": "110001010001110", "4": "101101111001001" };
  const [tc, tcx] = canvas(260, 24);
  // a painter bound to one canvas: rects, pixels, discs, crisp text, tiny 3x5 text
  function painter(x) {
    const R = (a, b, w, h, c) => { x.fillStyle = col(c); x.fillRect(Math.round(a), Math.round(b), Math.round(w), Math.round(h)); };
    const P = (a, b, c) => R(a, b, 1, 1, c);
    const D = (cx, cy, r, c, sy = 1) => { for (let y = -r; y <= r; y++) { const w = Math.floor(Math.sqrt(r * r - y * y + r * 0.6)); R(cx - w, cy + y * sy, w * 2 + 1, Math.max(1, sy), c); } };
    const T = (s, a, b, c, size = 12, center = false) => {
      tcx.clearRect(0, 0, 260, 24); tcx.font = `${size}px ${PF}`; tcx.textBaseline = "top"; tcx.fillStyle = "#000"; tcx.fillText(s, 0, 0);
      const w = Math.ceil(tcx.measureText(s).width), d = tcx.getImageData(0, 0, 260, 24).data, ox = center ? Math.round(a - w / 2) : a;
      x.fillStyle = col(c); for (let j = 0; j < 24; j++) for (let i = 0; i < 260; i++) if (d[(j * 260 + i) * 4 + 3] > 110) x.fillRect(ox + i, b + j, 1, 1);
    };
    const t5 = (s, a, b, c, center = false) => { const w = s.length * 4 - 1, ox = center ? Math.round(a - w / 2) : a; x.fillStyle = col(c); [...s].forEach((ch, i) => { const f = F5[ch] || F5[" "]; for (let k = 0; k < 15; k++) if (f[k] === "1") x.fillRect(ox + i * 4 + k % 3, b + ((k / 3) | 0), 1, 1); }); };
    return { R, P, D, T, t5, x };
  }
  function sprite(w, h, fn) { const [c, x] = canvas(w, h), [lc, lx] = canvas(w, h); fn(painter(x), painter(lx), w, h); return { c, lc, w, h }; }

  // ---------- the line: segments from Gokurakuji tunnel to Enoshima and around again ----------
  const SEGS = [
    ["tunnel", 260], ["houses", 900, { ajisai: 1 }],
    ["station", 560, { name: "稲村ヶ崎", roma: "INAMURAGASAKI", prev: "GOKURAKUJI", next: "SHICHIRIGAHAMA", pass: 1 }],
    ["houses", 620], ["coast", 2700],
    ["station", 560, { name: "七里ヶ浜", roma: "SHICHIRIGAHAMA", prev: "INAMURAGASAKI", next: "KAMAKURAKOKOMAE", sea: 1 }],
    ["coast", 1500],
    ["station", 560, { name: "鎌倉高校前", roma: "KAMAKURAKOKOMAE", prev: "SHICHIRIGAHAMA", next: "KOSHIGOE", sea: 1 }],
    ["coast", 1100], ["houses", 800],
    ["station", 560, { name: "腰越", roma: "KOSHIGOE", prev: "KAMAKURAKOKOMAE", next: "ENOSHIMA" }],
    ["street", 1200],
    ["station", 560, { name: "江ノ島", roma: "ENOSHIMA", prev: "KOSHIGOE", next: "SHONAN-KAIGAN-KOEN", pass: 1 }],
    ["houses", 900], ["tunnel", 260],
  ];
  let L = 0; const SEG = SEGS.map(([k, len, o]) => { const s = { k, d0: L, d1: L + len, len, ...(o || {}) }; L += len; return s; });
  const segAt = d => { d = mod(d, L); for (const s of SEG) if (d < s.d1) return s; return SEG[SEG.length - 1]; };
  const LAY = {}; for (const [n, k] of [["cloud", 0.012], ["mtn", 0.06], ["isl", 0.1], ["sea", 0.14], ["beach", 0.3], ["road", 0.5], ["near", 1]]) { const Lk = Math.round(L * k); LAY[n] = { k: Lk / L, Lk }; }
  const ISLAND_D = 7000, FUJI_D = 8300;

  // ---------- colours (daylight; time of day is applied later as a tint) ----------
  const C = {
    seaD: [36, 96, 142], seaM: [46, 118, 158], seaL: [62, 142, 170], seaS: [92, 172, 182], foam: [236, 246, 244],
    sand: [230, 212, 170], sandD: [206, 186, 142], sandL: [244, 230, 194],
    asph: [96, 98, 104], asphL: [118, 120, 126], line: [236, 236, 228], yline: [230, 190, 60],
    concrete: [196, 192, 182], concreteD: [158, 154, 146], guard: [238, 238, 234],
    leaf: [62, 112, 66], leafD: [42, 84, 54], leafL: [96, 146, 80], leafH: [140, 182, 104],
    trunk: [120, 96, 70], trunkD: [90, 70, 52], pine: [44, 80, 58], pineL: [70, 110, 72],
    mtn: [144, 168, 196], mtnD: [120, 146, 178], snow: [236, 240, 246],
    tile: [66, 72, 88], tileL: [92, 100, 118], tileD: [48, 52, 64],
  };
  const WALLS = [[232, 224, 204], [214, 206, 188], [226, 232, 234], [196, 210, 214], [150, 110, 80], [236, 230, 218], [210, 196, 170], [184, 196, 176]];
  const ROOFS = [[66, 72, 88], [120, 70, 56], [86, 96, 110], [60, 90, 96], [150, 92, 64]];
  const AJ = [[[80, 110, 200], [120, 150, 228], [190, 210, 250]], [[140, 100, 196], [180, 140, 226], [226, 200, 250]], [[90, 150, 210], [140, 190, 236], [210, 236, 250]], [[220, 120, 170], [240, 160, 200], [252, 214, 232]]];
  const WARM = [255, 214, 150];

  // ---------- small shared drawings ----------
  function hydra(p, x, y, n, rnd) { for (let i = 0; i < n; i++) { const cx = x + i * 7 + (rnd() * 3 | 0), cy = y + (rnd() * 3 | 0), c = AJ[(rnd() * 4) | 0]; p.D(cx, cy + 3, 4, C.leafD); p.D(cx + 1, cy + 2, 3, C.leaf); p.D(cx, cy, 3, c[0]); p.D(cx + 1, cy - 1, 2, c[1]); p.P(cx + 1, cy - 2, c[2]); } }
  function laundry(p, x, y, w, rnd) { p.R(x, y, w, 1, [150, 150, 150]); for (let i = 2; i < w - 4;) { const k = rnd(), c = [[240, 240, 236], [120, 170, 220], [230, 120, 110], [250, 220, 120], [160, 200, 150], [236, 200, 210]][(rnd() * 6) | 0]; if (k < 0.4) { p.R(x + i, y + 1, 5, 6, c); p.R(x + i + 1, y + 7, 1, 2, c); p.R(x + i + 3, y + 7, 1, 2, c); i += 7; } else if (k < 0.7) { p.R(x + i, y + 1, 4, 8, c); p.R(x + i, y + 1, 4, 1, mul(c, 0.8)); i += 6; } else { p.R(x + i - 1, y + 1, 7, 3, c); p.R(x + i, y + 4, 5, 4, c); i += 8; } } }
  function pineTree(p, x, base, h, rnd) {
    for (let y = 0; y < h; y++) { const lean = Math.sin(y / h * 2.2) * 6; p.R(x + lean, base - y, 3, 1, y % 5 === 0 ? C.trunkD : C.trunk); }
    for (let k = 0; k < 6; k++) { const y = base - h + k * (h / 7), lean = Math.sin((base - y) / h * 2.2) * 6, w = 8 + rnd() * 10; const cx = x + lean + (k % 2 ? 5 : -5); for (let j = 0; j < 4; j++) p.R(cx - w / 2 + j, y + j, w - j * 2 + 2, 1, j === 0 ? C.pineL : C.pine); p.R(cx - w / 2 + 2, y - 1, w - 4, 1, [96, 136, 90]); }
  }
  function palm(p, x, base, h) {
    for (let y = 0; y < h; y++) { const bend = Math.sin(y / h * 1.4) * 4; p.R(x + bend, base - y, 2, 1, y % 3 === 0 ? C.trunkD : [150, 120, 90]); }
    const tx = x + Math.sin(1.4) * 4, ty = base - h;
    for (const [dx, dy, len] of [[-1, 0.3, 11], [1, 0.3, 11], [-0.8, 0.9, 9], [0.8, 0.9, 9], [-0.3, -0.6, 7], [0.4, -0.5, 7]]) for (let i = 0; i < len; i++) { const t = i / len; p.P(tx + dx * i, ty + dy * i + t * t * 5, i < 3 ? C.leafD : C.leaf); if (i % 2) p.P(tx + dx * i, ty + dy * i + t * t * 5 + 1, C.leafD); }
    p.D(tx, ty, 1, [110, 90, 60]);
  }
  function person(p, x, feet, o, lp) {
    const sk = o.skin || [238, 198, 166], skS = mixc(sk, [120, 70, 60], 0.3), hr = o.hair || [40, 32, 30], top = o.top, topS = mixc(top, [30, 30, 60], 0.3), bot = o.bot || [60, 64, 80], botS = mixc(bot, [20, 20, 40], 0.3), h = o.h || 17, y = feet - h, legT = y + h - 5;
    if (o.skirt) { p.R(x, legT, 1, 4, sk); p.R(x + 2, legT, 1, 4, sk); } else { p.R(x - 1, legT, 2, 4, botS); p.R(x + 1, legT, 2, 4, bot); }
    p.R(x - 1, feet - 1, 2, 1, [60, 50, 50]); p.R(x + 2, feet - 1, 2, 1, [60, 50, 50]);
    if (o.skirt) { p.R(x - 2, legT - 3, 6, 3, bot); p.R(x - 2, legT - 3, 2, 3, botS); } else p.R(x - 1, legT - 2, 4, 2, bot);
    const tt = y + 6; p.R(x - 2, tt, 6, legT - 3 - tt + (o.skirt ? 0 : 1), top); p.R(x - 2, tt, 1, legT - tt - 2, topS); p.R(x - 3, tt + 1, 1, 4, topS); p.R(x + 4, tt + 1, 1, 4, top); p.P(x - 3, tt + 5, sk); p.P(x + 4, tt + 5, sk);
    if (o.collar) { p.R(x - 2, tt, 6, 1, o.collar); p.P(x, tt + 1, o.tie || o.collar); p.P(x + 1, tt + 1, o.tie || o.collar); }
    p.R(x - 1, y + 1, 4, 5, sk); p.R(x - 1, y + 1, 1, 5, skS); p.R(x - 2, y, 6, 2, hr); p.P(x - 2, y + 2, hr); if (o.long) { p.R(x - 2, y + 2, 1, 5, hr); p.R(x + 3, y + 2, 1, 4, hr); } else p.P(x + 3, y + 2, hr);
    p.P(x + (o.left ? 0 : 2), y + 3, [60, 40, 40]);
    if (o.hat === "straw") { p.R(x - 4, y, 10, 1, [224, 196, 120]); p.R(x - 2, y - 2, 6, 2, [236, 210, 136]); p.R(x - 2, y - 1, 6, 1, [180, 60, 50]); }
    if (o.hat === "cap") { p.R(x - 2, y - 1, 6, 2, o.capc); p.R(x + (o.left ? -4 : 3), y, 3, 1, o.capc); }
    if (o.bag) { p.R(x + 3, tt + 3, 3, 4, o.bag); p.P(x + 3, tt, o.bag); }
    if (o.board) { p.R(x - 7, y + 2, 3, 15, o.board); p.R(x - 7, y + 2, 1, 15, mixc(o.board, [255, 255, 255], 0.4)); }
    if (o.parasol) { p.R(x + 3, y - 6, 1, 12, [120, 100, 80]); for (let j = 0; j < 4; j++) p.R(x - 3 + j, y - 8 + j, 13 - j * 2, 1, j === 0 ? mixc(o.parasol, [255, 255, 255], 0.3) : o.parasol); }
    if (o.phone && lp) lp.P(x + (o.left ? -1 : 3), tt + 3, [180, 220, 255]);
  }
  const SKINS = [[240, 202, 170], [228, 182, 144], [200, 150, 114]];
  const HAIRS = [[36, 30, 30], [70, 46, 32], [120, 84, 54], [206, 206, 210], [30, 26, 28]];
  const TOPS = [[244, 244, 240], [236, 120, 90], [90, 150, 110], [60, 110, 180], [240, 210, 110], [150, 120, 170], [40, 56, 90], [220, 90, 110], [120, 190, 200]];
  function randPerson(r) { const kind = r(); const o = { skin: SKINS[(r() * 3) | 0], hair: HAIRS[(r() * 5) | 0], top: TOPS[(r() * 9) | 0], bot: [[60, 64, 80], [70, 110, 170], [236, 228, 208], [40, 40, 44], [140, 120, 90]][(r() * 5) | 0], left: r() < 0.5 };
    if (kind < 0.15) Object.assign(o, { top: [244, 244, 240], bot: [40, 48, 84], skirt: true, collar: [40, 48, 84], tie: [200, 50, 50], long: r() < 0.6, bag: [60, 50, 44] });
    else if (kind < 0.25) Object.assign(o, { hat: "straw" }); else if (kind < 0.35) Object.assign(o, { board: [250, 214, 90], top: [30, 34, 40], bot: [30, 34, 40] });
    else if (kind < 0.45) Object.assign(o, { skirt: true, long: true }); else if (kind < 0.52) Object.assign(o, { parasol: [236, 150, 170], hair: [206, 206, 210], h: 15 }); else if (kind < 0.62) Object.assign(o, { hat: "cap", capc: [240, 240, 240] });
    if (r() < 0.3) o.phone = true; return o; }

  // ---------- far layers ----------
  // mountains: Izu and Hakone ridges, and Fuji
  const MTN = sprite(LAY.mtn.Lk, 50, (p, l, w) => {
    const fx = Math.round(FUJI_D * LAY.mtn.k);
    for (let x = 0; x < w; x++) {
      const dx = Math.min(Math.abs(x - fx), w - Math.abs(x - fx));
      const ridge = 8 + Math.sin(x * 0.021) * 4 + Math.sin(x * 0.057 + 1) * 3 + Math.sin(x * 0.13) * 1.2;
      const fuji = Math.max(0, 40 - dx * 0.62) + (dx < 6 ? -0.5 : 0);
      const hh = Math.max(ridge, fuji);
      for (let y = 50 - hh; y < 50; y++) { const top = y - (50 - hh); let c = fuji > ridge ? (top < 7 && dx < 16 ? (dith(x, y, 0.3 + top * 0.1) ? C.mtn : C.snow) : C.mtnD) : (top < 2 ? C.mtn : mixc(C.mtnD, C.mtn, 0.5)); if (y > 44) c = mixc(c, [196, 212, 222], 0.5); p.P(x, y, c); }
    }
  });
  // Enoshima: wooded twin humps, the observation tower, the harbour and the long bridge to the shore
