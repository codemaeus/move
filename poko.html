<!doctype html>
<title>Poko Adventure</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
  :root { color-scheme: dark; --ink: #f4f0e6; --dim: #a9a3b8; --ground: #15121f; --panel: #221d33; --line: #3b3354; --accent: #ffcf4a; --go: #6fd46a;
    --font: "DotGothic16", "MS Gothic", "Osaka-Mono", ui-monospace, monospace; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 15px; padding-inline: 16px; padding-block: 16px 24px; box-sizing: border-box; }
  .wrap { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .screen { position: relative; width: 100%; max-width: 100%; aspect-ratio: 8 / 7; background: #000; border: 1px solid var(--line); }
  #view { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
  h1 { margin: 0; font-size: 22px; font-weight: 400; letter-spacing: 0.08em; color: var(--accent); }
  .sub { color: var(--dim); font-size: 13px; margin: 4px 0 0; }
  .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  button { font-family: var(--font); font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); padding: 6px 10px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--go); outline-offset: 2px; }
  .pad { display: flex; justify-content: space-between; align-items: center; gap: 12px; user-select: none; -webkit-user-select: none; touch-action: none; }
  .pad .dir, .pad .act { display: flex; gap: 8px; }
  .pad button { width: 64px; height: 56px; font-size: 20px; border-radius: 12px; touch-action: none; }
  .pad .act button { border-radius: 50%; width: 64px; height: 64px; }
  .pad .b-jump { background: #3a2c16; border-color: #8a6a28; color: var(--accent); }
  .pad .b-run { background: #1f3322; border-color: #3f7a42; color: var(--go); }
  .keys { color: var(--dim); font-size: 12px; line-height: 1.8; margin: 0; }
  kbd { font-family: var(--font); border: 1px solid var(--line); background: var(--panel); padding: 0 5px; color: var(--ink); }
  @media (hover: hover) and (pointer: fine) { .pad { display: none; } }
</style>
<body>
<div class="wrap">
  <div class="screen"><canvas id="view" width="768" height="672" tabindex="0" aria-label="ポコのぼうけん ゲーム画面"></canvas></div>
  <div class="pad" aria-label="タッチ操作">
    <div class="dir"><button data-k="left" aria-label="左">◀</button><button data-k="down" aria-label="しゃがむ">▼</button><button data-k="right" aria-label="右">▶</button></div>
    <div class="act"><button class="b-run" data-k="run" aria-label="ダッシュ・ファイア">B</button><button class="b-jump" data-k="jump" aria-label="ジャンプ">A</button></div>
  </div>
  <div>
    <h1>ポコのぼうけん</h1>
    <p class="sub">256×224 ピクセル / スーパーファミコン時代の横スクロールアクションを思わせる、オリジナルの3ステージ</p>
  </div>
  <div class="group"><button id="snd" aria-pressed="false">音を出す</button><button id="pause" aria-pressed="false">ポーズ</button><button id="restart">タイトルへ</button></div>
  <p class="keys">
    <kbd>←</kbd><kbd>→</kbd> 移動　<kbd>↓</kbd> しゃがむ　<kbd>Z</kbd>/<kbd>Space</kbd> ジャンプ（長押しで高く）　<kbd>X</kbd>/<kbd>Shift</kbd> ダッシュ（ファイア状態ではファイアボール）　<kbd>Enter</kbd> スタート・ポーズ<br>
    ゲームパッドにも対応。どんぐりで大きく、おひさまの花でファイア。敵は踏んで倒し、カタツムリの殻はけとばせます。中間の旗から再開、ゴールのポールは高い所ほど高得点。
  </p>
</div>
<script>
(async () => {
  "use strict";
  try { await Promise.all([document.fonts.load('12px "DotGothic16"'), document.fonts.load('16px "DotGothic16"')]); } catch (e) { /* system font */ }
  const W = 256, H = 224, T = 16, ROWS = 14;
  const view = document.getElementById("view"), vctx = view.getContext("2d"); vctx.imageSmoothingEnabled = false;
  const PF = '"DotGothic16", "MS Gothic", monospace';

  // ---------- helpers ----------
  function canvas(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d", { willReadFrequently: true }); x.imageSmoothingEnabled = false; return [c, x]; }
  function hash(i) { let h = Math.imul((i | 0) ^ 0x9e3779b9, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
  const h2 = (x, y) => hash(Math.imul(x | 0, 73856093) ^ Math.imul(y | 0, 19349663));
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const mul = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
  const col = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
  const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const dith = (x, y, t) => t * 16 > BAY[(x & 3) + ((y & 3) << 2)];
  function mk(w, h, fn) {
    const [c, x] = canvas(w, h), img = x.createImageData(w, h), d = img.data;
    const P = (a, b, cc) => { a = Math.round(a); b = Math.round(b); if (a < 0 || b < 0 || a >= w || b >= h) return; const o = (b * w + a) * 4; d[o] = cc[0]; d[o + 1] = cc[1]; d[o + 2] = cc[2]; d[o + 3] = 255; };
    const G = (a, b) => { if (a < 0 || b < 0 || a >= w || b >= h) return null; const o = (b * w + a) * 4; return d[o + 3] ? [d[o], d[o + 1], d[o + 2]] : null; };
    const R = (a, b, ww, hh, cc) => { for (let yy = Math.round(b); yy < Math.round(b) + hh; yy++) for (let xx = Math.round(a); xx < Math.round(a) + ww; xx++) P(xx, yy, cc); };
    const E = (cx, cy, rx, ry, cc) => { for (let y = -Math.ceil(ry); y <= Math.ceil(ry); y++) { const q = 1 - (y * y) / ((ry + 0.5) * (ry + 0.5)); if (q < 0) continue; const ww = Math.round(rx * Math.sqrt(q)); for (let xx = -ww; xx <= ww; xx++) P(Math.round(cx) + xx, Math.round(cy) + y, cc); } };
    const line = (x0, y0, x1, y1, cc) => { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1); for (let i = 0; i <= n; i++) P(lerp(x0, x1, i / n), lerp(y0, y1, i / n), cc); };
    // outline every opaque region with a dark edge
    const outline = (cc) => { const m = new Uint8Array(w * h); for (let i = 0; i < w * h; i++) m[i] = d[i * 4 + 3] ? 1 : 0; for (let y = 0; y < h; y++) for (let xx = 0; xx < w; xx++) if (!m[y * w + xx] && ((xx > 0 && m[y * w + xx - 1]) || (xx < w - 1 && m[y * w + xx + 1]) || (y > 0 && m[(y - 1) * w + xx]) || (y < h - 1 && m[(y + 1) * w + xx]))) P(xx, y, cc); };
    fn({ P, G, R, E, line, outline, w, h }); x.putImageData(img, 0, 0); return c;
  }
  function flip(c) { const [f, x] = canvas(c.width, c.height); x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(c, 0, 0); return f; }
  function fromStr(rows, pal) { return mk(rows[0].length, rows.length, p => rows.forEach((r, y) => [...r].forEach((ch, x) => { if (pal[ch]) p.P(x, y, pal[ch]); }))); }
  // crisp text from the pixel font (cached)
  const [tc, tcx] = canvas(400, 40), TXT = new Map();
  function text(s, size = 12, c = [255, 255, 255], shadow = [20, 16, 32]) {
    const key = s + size + c + shadow; if (TXT.has(key)) return TXT.get(key); if (TXT.size > 300) TXT.clear();
    tcx.clearRect(0, 0, 400, 40); tcx.font = `${size}px ${PF}`; tcx.textBaseline = "top"; tcx.fillStyle = "#000"; tcx.fillText(s, 1, 1);
    const w = Math.ceil(tcx.measureText(s).width) + 3, hh = size + 4, d = tcx.getImageData(0, 0, w, hh).data;
    const out = mk(w, hh, p => { if (shadow) for (let y = 0; y < hh; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 110) { p.P(x + 1, y + 1, shadow); } for (let y = 0; y < hh; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 110) p.P(x, y, c); });
    TXT.set(key, out); return out;
  }

  // ---------- the hero, Poko ----------
  const HPAL = { k: [34, 22, 40], w: [252, 252, 252], b: [58, 108, 224], B: [34, 62, 156], h: [128, 72, 40], s: [252, 206, 166], S: [220, 150, 112], e: [24, 24, 40], o: [248, 150, 40], O: [196, 96, 24], g: [72, 178, 84], G: [36, 118, 62], p: [150, 100, 62], P: [100, 62, 40], r: [186, 62, 50], R: [124, 36, 36] };
  const FPAL = { ...HPAL, g: [255, 186, 64], G: [218, 118, 40], o: [236, 64, 64], O: [168, 32, 40], w: [255, 230, 90] };
  const HEAD = ["....kwk.....", "...kbwbk....", "..kbbbbbk...", "..kbbbbbbk..", "..kBBBBBBBkk", "..khhssesk..", "..khsssssk..", "...kSsssk..."];
  const TOR = { idle: ["..kooooOOk..", ".kgggoGgggk.", ".ksggoGgGsk.", "..kgggGGgk.."], jump: ["..kooooOOksk", ".kgggoGgggk.", ".kggoGggGk..", "..kgggGGgk.."], throw: ["..kooooOOk..", ".kgggoGgggkk", ".kgggoGggsk.", "..kgggGGgk.."] };
  const LEG = { idle: ["..kppkPPk...", "..kppkPPk...", ".krrk.kRRk..", ".kkkk.kkkk.."], w1: ["..kpppPPk...", ".kppk.kPPk..", "krrk...kRRk.", "kkk.....kkk."], w2: ["...kpPPk....", "...kpPPk....", "...krRRk....", "...kkkkk...."], skid: ["..kppPPk....", ".kppkPPk....", "krrk.kRRk...", "kkk..kkkk..."] };
  function hero(tor, leg, big, pal) { const t = TOR[tor], l = LEG[leg]; const rows = big ? [...HEAD, t[0], t[1], t[1], t[2], t[2], t[2], t[3], t[3], l[0], l[0], l[1], l[1], l[1], l[2], l[2], l[3]] : [...HEAD, ...t, ...l]; return fromStr(rows, pal); }
  const HERO = {};
  for (const [form, pal] of [["s", HPAL], ["b", HPAL], ["f", FPAL]]) for (const [n, tor, leg] of [["idle", "idle", "idle"], ["w1", "idle", "w1"], ["w2", "idle", "w2"], ["jump", "jump", "w1"], ["skid", "idle", "skid"], ["throw", "throw", "idle"]]) { const c = hero(tor, leg, form !== "s", pal); HERO[`${form}_${n}`] = [c, flip(c)]; }
  { const duck = (pal) => fromStr([...HEAD, TOR.idle[0], TOR.idle[2], LEG.idle[2], LEG.idle[3]], pal); for (const [f, pal] of [["b", HPAL], ["f", FPAL], ["s", HPAL]]) { const c = duck(pal); HERO[`${f}_duck`] = [c, flip(c)]; } }
  const DEAD = fromStr(["....kwk.....", "...kbwbk....", "..kbbbbbk...", "..kBBBBBBk..", "..kssssssk..", ".ksekssksek.", "..ksssssk...", "sk.kSsSk.ks.", "skkoooOOkks.", ".kgggoGggk..", ".kgggoGggk..", "..kgggGGk...", "..kppkPPk...", "..kppkPPk...", ".krrk.kRRk..", ".kkkk.kkkk.."], HPAL);

  // ---------- enemies and items ----------
  const K = [40, 24, 30];
  const SPR = {};
  function critter(fr) { return mk(16, 16, p => { p.E(8, 8, 6, 5.5, [178, 98, 50]); p.E(8, 11, 4, 2, [222, 152, 92]); p.P(8, 1, [150, 80, 40]); p.P(8, 2, [178, 98, 50]); p.P(7, 2, [178, 98, 50]); p.P(5, 4, [240, 186, 130]); p.P(4, 5, [240, 186, 130]); p.P(6, 4, [240, 186, 130]); for (const ex of [5, 10]) { p.R(ex, 6, 2, 3, [252, 252, 252]); p.P(ex + (ex < 8 ? 1 : 0), 7, [30, 20, 30]); p.P(ex + (ex < 8 ? 1 : 0), 8, [30, 20, 30]); } p.line(4, 5, 6, 6, K); p.line(12, 5, 10, 6, K); p.R(7, 11, 3, 1, [120, 50, 40]); if (fr === 0) { p.R(2, 13, 4, 2, [70, 40, 30]); p.R(10, 14, 4, 1, [70, 40, 30]); } else { p.R(3, 14, 4, 1, [70, 40, 30]); p.R(10, 13, 4, 2, [70, 40, 30]); } p.outline(K); }); }
  SPR.crit = [critter(0), critter(1)].map(c => [c, flip(c)]);
  SPR.critSq = mk(16, 16, p => { p.E(8, 12, 7, 2.5, [178, 98, 50]); p.E(8, 13, 5, 1, [222, 152, 92]); p.R(5, 11, 2, 1, K); p.R(10, 11, 2, 1, K); p.outline(K); });
  function snail(fr) { return mk(18, 16, p => { const by = fr ? 0 : 1; p.R(1, 11 + by, 15, 4 - by, [240, 214, 130]); p.R(1, 14, 16, 1, [200, 170, 96]); p.E(3, 9 + by, 2.5, 3, [240, 214, 130]); p.line(2, 7 + by, 1, 3 + by, [200, 170, 96]); p.line(4, 7 + by, 5, 3 + by, [200, 170, 96]); p.P(1, 2 + by, [30, 20, 30]); p.P(5, 2 + by, [30, 20, 30]); p.P(2, 9 + by, [30, 20, 30]); shellArt(p, 10, 7, 0); p.outline(K); }); }
  function shellArt(p, cx, cy, rot) { p.E(cx, cy, 6, 5.5, [206, 72, 118]); p.E(cx - 1, cy - 1, 4, 3.5, [236, 120, 160]); for (let i = 0; i < 18; i++) { const a = i * 0.55 + rot, r = 4.6 - i * 0.24; p.P(cx + Math.cos(a) * r, cy + Math.sin(a) * r * 0.9, [120, 30, 70]); } p.P(cx - 3, cy - 3, [255, 210, 230]); }
  SPR.snail = [snail(0), snail(1)].map(c => [c, flip(c)]);
  SPR.shell = [0, 1, 2, 3].map(i => mk(16, 16, p => { shellArt(p, 8, 9, i * Math.PI / 2); p.R(3, 14, 10, 1, [200, 170, 96]); p.outline(K); }));
  function bird(fr, bat) { return mk(16, 16, p => { const c = bat ? [120, 80, 170] : [86, 150, 238], d = bat ? [80, 50, 120] : [56, 104, 200]; p.E(8, 9, 5.5, 4.5, c); if (!bat) p.E(9, 11, 3, 2, [236, 244, 252]); p.R(4, 7, 2, 2, [252, 252, 252]); p.P(4, 8, [20, 20, 30]); if (bat) { p.R(10, 7, 2, 2, [252, 252, 252]); p.P(11, 8, [20, 20, 30]); p.P(6, 3, c); p.P(10, 3, c); p.P(6, 4, c); p.P(10, 4, c); p.R(7, 11, 1, 1, [252, 252, 252]); p.R(9, 11, 1, 1, [252, 252, 252]); } else { p.R(1, 9, 2, 2, [250, 170, 50]); p.P(0, 10, [250, 170, 50]); p.R(13, 6, 2, 2, c); p.P(15, 5, c); } if (fr === 0) { p.E(10, 4, 3, 3, d); p.P(12, 1, d); if (bat) { p.E(3, 5, 3, 3, d); p.line(0, 2, 3, 4, d); p.line(15, 2, 12, 4, d); } } else { p.E(10, 12, 3, 2, d); if (bat) { p.E(3, 12, 3, 2, d); p.line(0, 14, 3, 12, d); p.line(15, 14, 12, 12, d); } } if (!bat) { p.R(7, 14, 1, 2, [250, 170, 50]); p.R(9, 14, 1, 2, [250, 170, 50]); } p.outline(K); }); }
  SPR.bird = [bird(0), bird(1)].map(c => [c, flip(c)]); SPR.bat = [bird(0, 1), bird(1, 1)].map(c => [c, flip(c)]);
  function plant(open) { return mk(16, 24, p => { p.R(7, 11, 2, 13, [60, 160, 70]); p.R(7, 11, 1, 13, [110, 200, 100]); p.E(4, 17, 3, 1.5, [60, 160, 70]); p.E(12, 20, 3, 1.5, [60, 160, 70]); p.E(8, 6, 7, 6, [222, 52, 64]); for (const [x, y] of [[4, 3], [11, 4], [7, 1], [3, 8], [12, 9]]) p.P(x, y, [255, 236, 236]); if (open) { p.E(8, 7, 5, 2.5, [80, 10, 30]); for (let x = 4; x <= 12; x += 2) { p.P(x, 5, [252, 252, 252]); p.P(x + 1, 9, [252, 252, 252]); } } else { p.R(2, 7, 13, 1, [150, 20, 40]); for (let x = 4; x <= 12; x += 2) p.P(x, 8, [252, 252, 252]); } p.outline(K); }); }
  SPR.plant = [plant(0), plant(1)];
  SPR.acorn = mk(16, 16, p => { p.E(8, 10, 6, 5, [238, 194, 116]); p.P(8, 15, [238, 194, 116]); p.E(8, 5, 7, 3.5, [140, 84, 44]); for (let x = 2; x < 15; x += 2) for (let y = 3; y < 8; y += 2) p.P(x + (y & 2 ? 1 : 0), y, [176, 116, 62]); p.R(7, 0, 2, 2, [100, 60, 30]); p.R(5, 10, 1, 2, [30, 20, 30]); p.R(10, 10, 1, 2, [30, 20, 30]); p.P(4, 9, [255, 236, 190]); p.P(12, 12, [250, 150, 150]); p.P(3, 12, [250, 150, 150]); p.outline(K); });
  SPR.sun = [0, 1].map(fr => mk(16, 16, p => { p.R(7, 10, 2, 6, [60, 160, 70]); p.E(4, 13, 3, 1.5, [60, 160, 70]); p.E(12, 13, 3, 1.5, [60, 160, 70]); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 + fr * 0.4; p.E(8 + Math.cos(a) * 4.5, 6 + Math.sin(a) * 4.5, 1.8, 1.8, i & 1 ? [255, 210, 60] : [255, 140, 40]); } p.E(8, 6, 3, 3, [150, 80, 40]); p.P(7, 5, [30, 20, 30]); p.P(9, 5, [30, 20, 30]); p.R(7, 7, 3, 1, [255, 190, 150]); p.outline(K); }));
  SPR.life = mk(16, 16, p => { p.E(5, 6, 4, 4, [80, 210, 100]); p.E(11, 6, 4, 4, [80, 210, 100]); for (let y = 6; y < 15; y++) { const w = 8 - (y - 6); for (let x = 8 - w; x <= 8 + w - 1; x++) p.P(x, y, [80, 210, 100]); } p.E(4, 4, 1.5, 1, [200, 255, 200]); p.R(7, 5, 2, 6, [252, 252, 252]); p.P(6, 6, [252, 252, 252]); p.outline(K); });
  SPR.coin = [3.5, 2.5, 0.5, 2.5].map((rx, i) => mk(10, 16, p => { p.E(5, 8, Math.max(0.5, rx), 6, [248, 196, 40]); if (rx > 1) { p.E(5, 8, rx - 1.2, 4.6, [255, 226, 90]); p.R(5, 5, 1, 6, [210, 150, 30]); } p.P(4, 3, [255, 255, 220]); p.outline(K); }));
  SPR.fire = [0, 1, 2, 3].map(i => mk(8, 8, p => { p.E(4, 4, 3, 3, [255, 120, 30]); p.E(4, 4, 1.5, 1.5, [255, 230, 120]); const a = i * Math.PI / 2; p.P(4 + Math.cos(a) * 3, 4 + Math.sin(a) * 3, [255, 250, 220]); p.outline([120, 30, 20]); }));
  SPR.chip = mk(8, 8, p => { p.R(1, 1, 6, 6, [200, 110, 60]); p.R(1, 1, 6, 1, [240, 170, 110]); p.outline(K); });
  SPR.star = mk(7, 7, p => { p.line(3, 0, 3, 6, [255, 255, 200]); p.line(0, 3, 6, 3, [255, 255, 200]); p.P(3, 3, [255, 255, 255]); p.P(1, 1, [255, 230, 140]); p.P(5, 5, [255, 230, 140]); p.P(5, 1, [255, 230, 140]); p.P(1, 5, [255, 230, 140]); });

  // ---------- themes: tiles and parallax backgrounds ----------
  const THEMES = {
    grass: { top: [112, 212, 84], topL: [180, 240, 120], topD: [56, 150, 60], dirt: [216, 152, 88], dirtD: [174, 110, 62], dirtL: [240, 190, 124], plank: [196, 132, 72], sky: [[92, 148, 248], [150, 196, 255], [212, 236, 255]], name: "はらっぱ" },
    cave: { top: [150, 140, 214], topL: [200, 196, 246], topD: [96, 86, 160], dirt: [86, 72, 132], dirtD: [60, 48, 100], dirtL: [118, 104, 170], plank: [150, 104, 70], sky: [[14, 10, 30], [30, 22, 58], [58, 40, 96]], name: "どうくつ" },
    sky: { top: [140, 222, 110], topL: [210, 250, 160], topD: [70, 160, 80], dirt: [196, 150, 196], dirtD: [150, 104, 160], dirtL: [228, 190, 226], plank: [250, 250, 255], sky: [[74, 104, 214], [236, 150, 196], [255, 214, 156]], name: "そらのみち" },

      case "oneup": [76, 79, 88, 84, 86, 91].forEach((m, i) => tone("pulse", mf(m), t + i * 0.09, 0.09, 0.05)); break;

      case "die": [[72, 0], [71, 0.15], [70, 0.3], [0, 0.45], [65, 0.9], [64, 1.05], [60, 1.2], [55, 1.5]].forEach(([m, d]) => m && tone("pulse", mf(m), t + d, 0.14, 0.06)); break;
      case "clear": [[67, 0], [72, 0.12], [76, 0.24], [79, 0.36], [84, 0.48], [88, 0.6], [91, 0.9], [88, 1.2], [91, 1.35], [96, 1.6]].forEach(([m, d]) => { tone("pulse", mf(m), t + d, 0.2, 0.06); tone("triangle", mf(m - 24), t + d, 0.2, 0.14); }); break;
      case "over": [[72, 0], [67, 0.3], [64, 0.6], [69, 0.9], [71, 1.1], [69, 1.3], [68, 1.5], [70, 1.7], [68, 1.9], [67, 2.2]].forEach(([m, d]) => tone("triangle", mf(m - 12), t + d, 0.28, 0.16)); break;

  }
  const sndBtn = document.getElementById("snd");
  sndBtn.addEventListener("click", async () => { A.want = true; if (!A.ac && !initAudio()) return; A.on = !A.on; if (A.on) { await A.ac.resume(); A.next = A.ac.currentTime + 0.1; } else await A.ac.suspend(); sndBtn.setAttribute("aria-pressed", String(A.on)); sndBtn.textContent = A.on ? "音を止める" : "音を出す"; view.focus(); });
  const pBtn = document.getElementById("pause"); function syncPause() { pBtn.setAttribute("aria-pressed", String(G.paused)); } pBtn.addEventListener("click", () => { if (G.mode === "play") { G.paused = !G.paused; syncPause(); } view.focus(); });

  // ---------- loop ----------
  let last = performance.now(), acc = 0;
  function loop(now) { acc += Math.min(0.1, (now - last) / 1000); last = now; while (acc >= 1 / 60) { update(); acc -= 1 / 60; } musicTick(); render(); vctx.drawImage(low, 0, 0, view.width, view.height); requestAnimationFrame(loop); }
  window.Game = { G, update, render, keys, startLevel, LEVELS, low };
