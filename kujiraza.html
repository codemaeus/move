<title>夜の酒場 くじら座</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yomogi&family=Kaisei+Decol:wght@500;700&display=swap">
<style>
  /* layout: the room fills the window like a stage seen through its missing fourth wall; a hand-lettered plate top-left, controls along the bottom */
  :root {
    --night: #0d2a8a;
    --ink: #1a1418;
    --paper: #fff6dc;
    --ochre: #f2c14e;
    --dim: #f6e3b0;
    --panel: rgba(13, 26, 90, 0.82);
    --hand: "Yomogi", "Klee One", "Hiragino Maru Gothic ProN", cursive;
    --title: "Kaisei Decol", "Hiragino Mincho ProN", "Yu Mincho", serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--night); color: var(--paper); font-family: var(--hand); overflow: hidden; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #grain { position: fixed; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: 0.16; }
  .plate { position: fixed; left: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); padding: 10px 16px 9px; background: var(--panel); border: 2px solid var(--ink); border-radius: 6px; box-shadow: 3px 3px 0 var(--ink); max-width: calc(100vw - 32px); }
  .plate small { display: block; font-size: 12px; letter-spacing: 0.3em; color: var(--dim); }
  .plate h1 { margin: 2px 0 0; font-family: var(--title); font-weight: 700; font-size: 26px; letter-spacing: 0.12em; color: var(--ochre); text-wrap: balance; }
  .plate .now { margin-top: 2px; font-size: 14px; color: var(--paper); font-variant-numeric: tabular-nums; }
  .rail { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; background: rgba(8, 18, 70, 0.84); border-top: 2px solid var(--ink); font-size: 15px; }
  .group { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .lab { font-size: 12px; color: var(--dim); letter-spacing: 0.2em; margin-right: 2px; }
  button { font: inherit; color: var(--ink); background: var(--paper); border: 2px solid var(--ink); border-radius: 5px; padding: 3px 10px; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); }
  button:hover { background: #ffe9a8; }
  button:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
  button[aria-pressed="true"] { background: var(--ochre); }
  button:focus-visible { outline: 3px solid #8fd0ff; outline-offset: 2px; }
  .card { position: fixed; right: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); width: min(270px, calc(100vw - 32px)); padding: 12px 14px; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 6px; box-shadow: 3px 3px 0 var(--ink); }
  .card h2 { margin: 0; font-family: var(--title); font-size: 19px; }
  .card .who { font-size: 13px; color: #6a4a2a; }
  .card p { margin: 8px 0 10px; font-size: 15px; line-height: 1.6; }
  .card .row { display: flex; gap: 6px; }
  .hint { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--panel); border: 2px solid var(--ink); border-radius: 5px; padding: 3px 12px; font-size: 14px; transition: opacity 1.2s; pointer-events: none; white-space: nowrap; }
  @media (max-width: 680px) { .hint { display: none; } .plate h1 { font-size: 21px; } .card { top: auto; bottom: 140px; } }
  @media (prefers-reduced-motion: reduce) { .hint { transition: none; } }
</style>

<canvas id="gl" aria-label="夜の酒場くじら座の店内。ドラッグで見回し、ホイールやピンチで近づけます。お客さんをクリックすると話が聞けます"></canvas>
<canvas id="grain" aria-hidden="true"></canvas>
<div class="plate"><small>よる の さかば</small><h1>くじら座</h1><div class="now" id="now">午前0時00分</div></div>
<div class="hint" id="hint">ドラッグで見回す ／ ホイールで近づく ／ お客さんをクリック</div>
<div class="card" id="card" hidden><h2 id="cname">名前</h2><div class="who" id="cwho">だれ</div><p id="ctext">…</p><div class="row"><button id="cnear" type="button">そばで見る</button><button id="cclose" type="button">閉じる</button></div></div>
<div class="rail">
  <div class="group"><span class="lab">みる</span><button id="v-all" type="button" aria-pressed="true">店ぜんぶ</button><button id="v-bar" type="button" aria-pressed="false">カウンター</button><button id="v-table" type="button" aria-pressed="false">テーブル席</button><button id="v-window" type="button" aria-pressed="false">窓辺</button><button id="v-cat" type="button" aria-pressed="false">猫について行く</button></div>
  <div class="group"><span class="lab">店</span><button id="rec" type="button" aria-pressed="false">レコードをかける</button><button id="rain" type="button" aria-pressed="false">雨</button><button id="dim" type="button" aria-pressed="false">灯りを落とす</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(async () => {
  "use strict";
  try { await Promise.all([document.fonts.load('40px "Yomogi"'), document.fonts.load('40px "Kaisei Decol"')]); } catch (e) { /* fallback fonts */ }
  const T = THREE, $ = s => document.querySelector(s), PI = Math.PI;
  const cv = $("#gl"), renderer = new T.WebGLRenderer({ canvas: cv, antialias: true });
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  const scene = new T.Scene(), camera = new T.PerspectiveCamera(34, 1, 0.1, 200);
  function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); const g = $("#grain"); g.width = Math.ceil(w / 2); g.height = Math.ceil(h / 2); g.style.width = w + "px"; g.style.height = h + "px"; paintGrain(g); }
  function paintGrain(c) { const x = c.getContext("2d"), im = x.createImageData(c.width, c.height); for (let i = 0; i < im.data.length; i += 4) { const v = 200 + Math.random() * 55; im.data[i] = v; im.data[i + 1] = v * 0.97; im.data[i + 2] = v * 0.9; im.data[i + 3] = 255; } x.putImageData(im, 0, 0); }
  addEventListener("resize", resize);
  let seed = 7; const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647, rr = (a, b) => a + R() * (b - a), pick = a => a[Math.floor(R() * a.length)];
  const lerp = (a, b, t) => a + (b - a) * t, clamp = (v, a, b) => v < a ? a : v > b ? b : v, ease = t => t * t * (3 - 2 * t);

  // ---------- the flat, hand-inked look: three-tone toon shading, ink lines on edges, an inked hull around round things ----------
  const GRAD = (() => { const t = new T.DataTexture(new Uint8Array([120, 200, 255]), 3, 1, T.RedFormat); t.minFilter = t.magFilter = T.NearestFilter; t.needsUpdate = true; return t; })();
  const TC = new Map();
  const toon = (c, extra) => { const k = c + (extra ? JSON.stringify(extra) : ""); if (!TC.has(k)) TC.set(k, new T.MeshToonMaterial(Object.assign({ color: c, gradientMap: GRAD }, extra || {}))); return TC.get(k); };
  const INK = new T.LineBasicMaterial({ color: 0x1a1418 });
  const HULL = new T.ShaderMaterial({ side: T.BackSide, uniforms: { th: { value: 0.011 } }, vertexShader: "uniform float th; void main(){ vec3 p = position + normalize(normal) * th; gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0); }", fragmentShader: "void main(){ gl_FragColor = vec4(0.10, 0.08, 0.09, 1.0); }" });
  const FLAT = new Set(["BoxGeometry", "PlaneGeometry", "ShapeGeometry", "ExtrudeGeometry", "CircleGeometry", "RingGeometry"]);
  function M(geo, color, x = 0, y = 0, z = 0, parent = scene, o = {}) {
    const m = new T.Mesh(geo, o.mat || toon(color, o.em ? { emissive: o.em } : undefined));
    m.position.set(x, y, z); if (o.r) m.rotation.set(o.r[0], o.r[1], o.r[2]); if (o.s) m.scale.set(o.s[0], o.s[1], o.s[2]);
    if (o.edges !== false) m.add(new T.LineSegments(new T.EdgesGeometry(geo, o.angle || 32), INK));
    if (o.hull ?? !FLAT.has(geo.type)) m.add(new T.Mesh(geo, HULL));
    parent.add(m); return m;
  }
  const box = (w, h, d) => new T.BoxGeometry(w, h, d), cylG = (a, b, h, s = 20, open = false) => new T.CylinderGeometry(a, b, h, s, 1, open), sph = (r, a = 18, b = 12) => new T.SphereGeometry(r, a, b);
  function tex(w, h, draw) { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h); const t = new T.CanvasTexture(c); t.anisotropy = 4; return t; }
  const pmat = (t, extra) => new T.MeshToonMaterial(Object.assign({ map: t, gradientMap: GRAD }, extra || {}));
  const bmat = (t, extra) => new T.MeshBasicMaterial(Object.assign({ map: t }, extra || {}));
  const ink = (g, lw = 3) => { g.strokeStyle = "#1a1418"; g.lineWidth = lw; g.lineJoin = g.lineCap = "round"; };

  // ---------- colours ----------
  const OCHRE = 0xf2c14e, OCHRE_D = 0xd9982f, WOOD = 0x9a5a2a, WOOD_D = 0x6e3c1c, WOOD_L = 0xc07a3a, BLACK = 0x1f1a22, CREAM = 0xfff1d2, BRASS = 0xe0a83a, NIGHT = 0x1236a8;

  // ---------- the room: floor, three walls, ceiling beams ----------
  const W2 = 4.1, D0 = -3.0, D1 = 3.0, HT = 3.8;
  const FLOOR = tex(512, 256, (g, w, h) => { g.fillStyle = "#c6863e"; g.fillRect(0, 0, w, h); for (let y = 0; y < h; y += 32) { g.fillStyle = y % 64 ? "#bb7c38" : "#cb8c44"; g.fillRect(0, y, w, 32); let x = (y / 32 % 3) * 70; while (x < w) { ink(g, 2); g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 32); g.stroke(); x += 150 + (y * 7 % 60); } g.strokeStyle = "#7a4a22"; g.lineWidth = 2; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); g.strokeStyle = "rgba(120,70,30,0.35)"; g.lineWidth = 1; for (let k = 0; k < 4; k++) { g.beginPath(); g.moveTo(0, y + 6 + k * 6); g.bezierCurveTo(w * 0.3, y + 4 + k * 6, w * 0.6, y + 9 + k * 6, w, y + 6 + k * 6); g.stroke(); } } });
  FLOOR.wrapS = FLOOR.wrapT = T.RepeatWrapping; FLOOR.repeat.set(2, 3);
  M(box(W2 * 2 + 0.4, 0.14, 6.4), 0, 0, -0.07, 0, scene, { mat: pmat(FLOOR) });
  M(box(W2 * 2 + 0.6, 0.5, 6.6), WOOD_D, 0, -0.39, 0.05);
  const WALL = tex(256, 256, (g, w, h) => { g.fillStyle = "#f2c14e"; g.fillRect(0, 0, w, h); g.fillStyle = "rgba(255,255,255,0.12)"; for (let i = 0; i < 40; i++) g.fillRect(Math.random() * w, Math.random() * h, 30 + Math.random() * 40, 2); });
  WALL.wrapS = WALL.wrapT = T.RepeatWrapping;
  const WAIN = tex(256, 128, (g, w, h) => { g.fillStyle = "#d39433"; g.fillRect(0, 0, w, h); ink(g, 2); for (let x = 0; x < w; x += 32) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); } g.fillStyle = "rgba(0,0,0,0.08)"; for (let x = 0; x < w; x += 32) g.fillRect(x + 22, 0, 8, h); });
  WAIN.wrapS = T.RepeatWrapping;
  function wall(w, h, x, y, z, ry, rep) { const t = WALL.clone(); t.needsUpdate = true; t.repeat.set(w / 2.5, h / 2.5); M(box(w, h, 0.2), 0, x, y, z, scene, { mat: pmat(t), r: [0, ry, 0] }); }
  function wain(w, x, z, ry) { const t = WAIN.clone(); t.needsUpdate = true; t.repeat.set(w / 1.6, 1); M(box(w, 0.95, 0.05), 0, x, 0.475, z, scene, { mat: pmat(t), r: [0, ry, 0] }); M(box(w, 0.07, 0.09), WOOD_D, x, 0.97, z, scene, { r: [0, ry, 0] }); }
  // back wall
  wall(W2 * 2 + 0.4, HT, 0, HT / 2, D0 - 0.1, 0); wain(W2 * 2, 0, D0 + 0.03, 0);
  // left wall with a window (z -0.6 .. 1.3, y 1.0 .. 2.6)
  const WX0 = -0.6, WX1 = 1.3, WY0 = 1.0, WY1 = 2.6;
  wall(6.2, WY0, -W2 - 0.1, WY0 / 2, 0, PI / 2); wall(6.2, HT - WY1, -W2 - 0.1, (HT + WY1) / 2, 0, PI / 2);
  wall(WX0 - D0, WY1 - WY0, -W2 - 0.1, (WY0 + WY1) / 2, (D0 + WX0) / 2, PI / 2); wall(D1 - WX1, WY1 - WY0, -W2 - 0.1, (WY0 + WY1) / 2, (WX1 + D1) / 2, PI / 2);
  wain(WX0 - D0, -W2 + 0.03, (D0 + WX0) / 2, PI / 2); wain(D1 - WX1, -W2 + 0.03, (WX1 + D1) / 2, PI / 2); M(box(0.05, 0.95, WX1 - WX0), 0, -W2 + 0.03, 0.475, (WX0 + WX1) / 2, scene, { mat: pmat(WAIN) });
  // right wall with the door (z 0.2 .. 1.4, y 0 .. 2.3)
  const DZ0 = 0.2, DZ1 = 1.4, DH = 2.3;
  wall(DZ0 - D0, HT, W2 + 0.1, HT / 2, (D0 + DZ0) / 2, PI / 2); wall(D1 - DZ1, HT, W2 + 0.1, HT / 2, (DZ1 + D1) / 2, PI / 2); wall(DZ1 - DZ0, HT - DH, W2 + 0.1, (HT + DH) / 2, (DZ0 + DZ1) / 2, PI / 2);
  wain(DZ0 - D0, W2 - 0.03, (D0 + DZ0) / 2, PI / 2); wain(D1 - DZ1, W2 - 0.03, (DZ1 + D1) / 2, PI / 2);
  // ceiling and beams
  { const c = new T.Mesh(new T.PlaneGeometry(W2 * 2 + 0.4, 6.4), toon(0x8a5428)); c.rotation.x = PI / 2; c.position.set(0, HT, 0); scene.add(c); } // seen only from below, so the room stays open from above
  for (let x = -3.4; x <= 3.5; x += 1.7) M(box(0.18, 0.2, 6.2), WOOD_D, x, HT - 0.1, 0);
  M(box(W2 * 2, 0.22, 0.2), WOOD_D, 0, HT - 0.11, 2.95);
  // the window: frame, panes, sill, curtains
  { const zc = (WX0 + WX1) / 2, yc = (WY0 + WY1) / 2, fw = WX1 - WX0, fh = WY1 - WY0;
    for (const [w, h, y, z] of [[fw + 0.2, 0.1, WY0, zc], [fw + 0.2, 0.1, WY1, zc], [0.1, fh, yc, WX0], [0.1, fh, yc, WX1], [0.05, fh, yc, zc]]) M(box(0.16, h, w === 0.1 || w === 0.05 ? w : w), WOOD, -W2 + 0.02, y, z, scene, { r: [0, 0, 0] });
    M(box(0.16, 0.05, fw), WOOD, -W2 + 0.02, yc, zc);
    M(box(0.42, 0.06, fw + 0.3), WOOD_L, -W2 + 0.18, WY0 - 0.02, zc);
    const glass = new T.Mesh(new T.PlaneGeometry(fw, fh), new T.MeshBasicMaterial({ color: 0x9ec8ff, transparent: true, opacity: 0.12, depthWrite: false })); glass.rotation.y = PI / 2; glass.position.set(-W2 - 0.05, yc, zc); scene.add(glass);
    const CUR = tex(64, 256, (g, w, h) => { g.fillStyle = "#c84b3a"; g.fillRect(0, 0, w, h); for (let x = 0; x < w; x += 16) { g.fillStyle = "rgba(0,0,0,0.18)"; g.fillRect(x + 10, 0, 6, h); } g.fillStyle = "#f6e3b0"; for (let y = 10; y < h; y += 40) for (let x = 6; x < w; x += 22) { g.beginPath(); g.arc(x, y, 3, 0, 7); g.fill(); } });
    for (const s of [-1, 1]) { const shape = new T.Shape(); shape.moveTo(0, 0); for (let i = 0; i <= 8; i++) shape.lineTo(i * 0.05, Math.sin(i * 1.6) * 0.035); shape.lineTo(0.4, 0.06); shape.lineTo(0, 0.06); const g = new T.ExtrudeGeometry(shape, { depth: fh + 0.55, bevelEnabled: false }); g.rotateX(-PI / 2); const m = M(g, 0, -W2 + 0.16, WY0 - 0.35, s < 0 ? WX0 - 0.42 : WX1 + 0.02, scene, { mat: pmat(CUR), hull: false }); m.rotation.y = PI / 2; }
    M(cylG(0.025, 0.025, fw + 1.2, 8), BRASS, -W2 + 0.2, WY1 + 0.22, zc, scene, { r: [PI / 2, 0, 0] });
  }

  // ---------- night outside the window and the door ----------
  const NIGHTTEX = tex(1024, 512, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, "#0a1f7a"); gr.addColorStop(0.62, "#1745c8"); gr.addColorStop(0.7, "#2a5ad8"); g.fillStyle = gr; g.fillRect(0, 0, w, h); for (let i = 0; i < 260; i++) { g.fillStyle = `rgba(255,250,220,${0.4 + Math.random() * 0.6})`; const s = Math.random() < 0.1 ? 3 : 2; g.fillRect(Math.random() * w, Math.random() * h * 0.62, s, s); } g.fillStyle = "#0b2a96"; g.beginPath(); g.moveTo(0, h * 0.7); g.bezierCurveTo(w * 0.3, h * 0.64, w * 0.6, h * 0.74, w, h * 0.68); g.lineTo(w, h); g.lineTo(0, h); g.fill(); ink(g, 3); g.beginPath(); g.moveTo(0, h * 0.7); g.bezierCurveTo(w * 0.3, h * 0.64, w * 0.6, h * 0.74, w, h * 0.68); g.stroke(); for (const lx of [0.22, 0.71]) { const x = w * lx, y = h * 0.7; g.fillStyle = "#1a1418"; g.fillRect(x - 2, y - 80, 4, 80); const rg = g.createRadialGradient(x, y - 84, 0, x, y - 84, 26); rg.addColorStop(0, "rgba(255,230,140,1)"); rg.addColorStop(1, "rgba(255,230,140,0)"); g.fillStyle = rg; g.fillRect(x - 30, y - 114, 60, 60); g.fillStyle = "#fff2b0"; g.beginPath(); g.arc(x, y - 84, 6, 0, 7); g.fill(); } g.fillStyle = "#fff6c8"; g.beginPath(); g.arc(w * 0.83, h * 0.18, 34, 0, 7); g.fill(); g.fillStyle = "#0e2788"; g.beginPath(); g.arc(w * 0.83 + 16, h * 0.18 - 8, 30, 0, 7); g.fill(); });
  for (const [x, ry] of [[-W2 - 3.2, PI / 2], [W2 + 3.2, -PI / 2]]) { const b = new T.Mesh(new T.PlaneGeometry(14, 7), bmat(NIGHTTEX)); b.position.set(x, 1.9, 0.4); b.rotation.y = ry; scene.add(b); }
  const outside = new T.Group(); scene.add(outside); // things that drift past outside the window
  const WHALE = tex(256, 128, (g, w, h) => { g.fillStyle = "#0f2f9e"; ink(g, 4); g.beginPath(); g.moveTo(20, 70); g.bezierCurveTo(30, 20, 150, 15, 200, 50); g.bezierCurveTo(215, 40, 228, 20, 246, 22); g.bezierCurveTo(236, 45, 240, 60, 250, 86); g.bezierCurveTo(232, 82, 218, 72, 204, 70); g.bezierCurveTo(170, 108, 50, 112, 20, 70); g.fill(); g.stroke(); g.fillStyle = "#fff2b0"; for (const [x, y] of [[60, 50], [90, 42], [120, 48], [150, 40], [104, 70], [70, 80]]) { g.beginPath(); g.arc(x, y, 3, 0, 7); g.fill(); } g.strokeStyle = "rgba(255,242,176,0.7)"; g.lineWidth = 1.5; g.beginPath(); g.moveTo(60, 50); g.lineTo(90, 42); g.lineTo(120, 48); g.lineTo(150, 40); g.moveTo(90, 42); g.lineTo(104, 70); g.lineTo(70, 80); g.stroke(); g.fillStyle = "#1a1418"; g.beginPath(); g.arc(46, 64, 4, 0, 7); g.fill(); });
  const whale = new T.Mesh(new T.PlaneGeometry(2.4, 1.2), bmat(WHALE, { transparent: true })); whale.rotation.y = PI / 2; whale.position.set(-W2 - 2.4, 3.2, 9); outside.add(whale);
  const meteor = new T.Mesh(new T.PlaneGeometry(1.4, 0.05), new T.MeshBasicMaterial({ color: 0xfff6c8, transparent: true, opacity: 0 })); meteor.rotation.y = PI / 2; outside.add(meteor);
  const RAINN = 500, rainPos = new Float32Array(RAINN * 6); for (let i = 0; i < RAINN; i++) { const x = rr(-W2 - 2.8, -W2 - 0.4), y = rr(-0.5, 5), z = rr(-1.5, 2.6); rainPos.set([x, y, z, x, y - 0.3, z + 0.05], i * 6); }
  const rainGeo = new T.BufferGeometry(); rainGeo.setAttribute("position", new T.BufferAttribute(rainPos, 3));
  const rainLines = new T.LineSegments(rainGeo, new T.LineBasicMaterial({ color: 0xbcd4ff, transparent: true, opacity: 0.6 })); rainLines.visible = false; scene.add(rainLines);
  const drops = []; for (let i = 0; i < 18; i++) { const d = new T.Mesh(new T.PlaneGeometry(0.018, 0.12), new T.MeshBasicMaterial({ color: 0xd8ecff, transparent: true, opacity: 0.8 })); d.rotation.y = PI / 2; d.visible = false; scene.add(d); drops.push({ m: d, y: rr(WY0, WY1), z: rr(WX0 + 0.1, WX1 - 0.1), v: rr(0.05, 0.25) }); }

  // the door, swinging on its hinge, with a little bell

  $("#cnear").addEventListener("click", () => { if (!cardCast) return; if (cardCast.cat) { setView("cat"); return; } const p = new T.Vector3().setFromMatrixPosition(cardCast.P.head.matrixWorld); want.tg.copy(p).add(new T.Vector3(0, -0.15, 0)); want.r = 2.4; want.ph = 1.32; view = "near"; document.querySelectorAll("[id^='v-']").forEach(b => b.setAttribute("aria-pressed", "false")); });
  function updateCamera(dt) {
    if (follow && follow.cat) { want.tg.copy(cat.g.position).add(new T.Vector3(0, 0.35, 0)); if (!ptrs.size) want.th = cat.g.position.x < -2.4 ? 1.15 : cat.g.position.x > 2 ? -0.35 : 0.2; }
    if (view === "all" && !ptrs.size) { idle += dt; if (idle > 5) want.th = 0.08 + Math.sin(clockT * 0.08) * 0.35; }
    const k = 1 - Math.pow(0.002, dt); cam.tg.lerp(want.tg, k); cam.r = lerp(cam.r, want.r, k); cam.th = lerp(cam.th, want.th, k); cam.ph = lerp(cam.ph, want.ph, k);
    const s = Math.sin(cam.ph); camera.position.set(cam.tg.x + cam.r * s * Math.sin(cam.th), cam.tg.y + cam.r * Math.cos(cam.ph), cam.tg.z + cam.r * s * Math.cos(cam.th)); if (camera.position.z < 3.3) { camera.position.x = clamp(camera.position.x, -W2 + 0.25, W2 - 0.25); camera.position.y = Math.min(camera.position.y, HT - 0.2); } camera.lookAt(cam.tg);
  }
  const hint = $("#hint"); let hinted = false; function hideHint() { if (hinted) return; hinted = true; hint.style.opacity = "0"; } setTimeout(hideHint, 9000);
  for (const v of ["all", "bar", "table", "window", "cat"]) $("#v-" + v).addEventListener("click", () => setView(v));

  // ---------- sound: an original slow lounge tune on the gramophone, glasses, the door bell, rain ----------
  const A = { ac: null, on: false, rec: false };
  function initAudio() { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false; const ac = new AC(); A.ac = ac; A.master = ac.createGain(); A.master.gain.value = 0.55; const comp = ac.createDynamicsCompressor(); A.master.connect(comp); comp.connect(ac.destination); A.mus = ac.createGain(); A.mus.gain.value = 0; A.mus.connect(A.master); const verb = ac.createConvolver(), ir = ac.createBuffer(2, ac.sampleRate * 1.8, ac.sampleRate); for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3); } verb.buffer = ir; const vg = ac.createGain(); vg.gain.value = 0.35; A.mus.connect(verb); verb.connect(vg); vg.connect(A.master); const nb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), nd = nb.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1; A.noise = nb; const loop = (f, type, vol, dest) => { const s = ac.createBufferSource(); s.buffer = nb; s.loop = true; const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = f; const g = ac.createGain(); g.gain.value = vol; s.connect(fl); fl.connect(g); g.connect(dest || A.master); s.start(); return g; }; A.rain = loop(1600, "highpass", 0, A.master); A.crackle = loop(3000, "highpass", 0, A.master); A.room = loop(300, "lowpass", 0.02, A.master); A.next = ac.currentTime + 0.2; A.step = 0; return true; }
  const mf = m => 440 * Math.pow(2, (m - 69) / 12);
  function note(m, t0, dur, vol, type = "triangle", dest) { const ac = A.ac, o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(); o.type = type; o2.type = "sine"; o.frequency.value = mf(m); o2.frequency.value = mf(m) * 2.003; g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.012); g.gain.exponentialRampToValueAtTime(vol * 0.35, t0 + 0.25); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); const g2 = ac.createGain(); g2.gain.value = 0.25; o.connect(g); o2.connect(g2); g2.connect(g); g.connect(dest || A.mus); o.start(t0); o2.start(t0); o.stop(t0 + dur + 0.05); o2.stop(t0 + dur + 0.05); }
  function nz(t0, dur, vol, f, type = "bandpass", dest) { const ac = A.ac, s = ac.createBufferSource(); s.buffer = A.noise; const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = f; const g = ac.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); s.connect(fl); fl.connect(g); g.connect(dest || A.master); s.start(t0, Math.random()); s.stop(t0 + dur + 0.05); }
  // Fmaj7 – D7 – Gm7 – C7, then Am7 – Dm7 – Gm7 – C7 (an original progression, 70 bpm swing)
  const CHORDS = [[53, [57, 60, 64, 69]], [50, [54, 57, 60, 66]], [55, [58, 62, 65, 69]], [48, [52, 58, 62, 67]], [57, [60, 64, 67, 72]], [50, [53, 57, 60, 65]], [55, [58, 62, 65, 70]], [48, [52, 55, 58, 64]]];
  const MEL = [[72, 0, 1.5], [69, 1.5, 0.5], [67, 2, 2], [74, 4, 1], [72, 5, 1], [70, 6, 2], [69, 8, 1.5], [67, 9.5, 0.5], [65, 10, 2], [64, 12, 1], [67, 13, 1], [70, 14, 2], [72, 16, 1.5], [76, 17.5, 0.5], [74, 18, 2], [72, 20, 1], [69, 21, 1], [65, 22, 2], [67, 24, 1.5], [69, 25.5, 0.5], [70, 26, 1], [74, 27, 1], [72, 28, 3]];
  function music() { if (!A.on || !A.rec) return; const ac = A.ac, beat = 60 / 70; while (A.next < ac.currentTime + 0.3) { const s = A.step, bar = Math.floor(s / 4) % 8, b = s % 4, t0 = A.next, [root, ch] = CHORDS[bar]; if (b === 0) ch.forEach((m, i) => note(m, t0 + i * 0.015, beat * 3.5, 0.045)); if (b === 2) ch.slice(1).forEach(m => note(m, t0 + beat * 0.66, beat * 1.2, 0.03)); const walk = [root, root + 7, root + 12 - (b === 3 ? 1 : 0), root + 4][b]; note(walk - 12, t0, beat * 0.9, 0.11, "sine"); nz(t0 + (b % 2 ? beat * 0.66 : 0), 0.18, 0.025, 6000, "highpass", A.mus); const pos = (s % 32); for (const [m, st, d] of MEL) if (Math.floor(st) === pos) note(m, t0 + (st - Math.floor(st)) * beat, d * beat * 0.95, 0.06, "sine"); A.next += beat; A.step++; } }
  function sfx(k) { if (!A.on) return; const t = A.ac.currentTime; if (k === "clink") { note(96, t, 0.6, 0.05, "sine", A.master); note(100, t + 0.04, 0.5, 0.04, "sine", A.master); } if (k === "bell") for (let i = 0; i < 4; i++) { note(91, t + i * 0.14, 0.6, 0.05, "sine", A.master); note(95, t + i * 0.14 + 0.02, 0.5, 0.03, "sine", A.master); } if (k === "shake") for (let i = 0; i < 24; i++) nz(t + i * 0.09, 0.06, 0.08, 3500); if (k === "pour") nz(t, 1.6, 0.05, 900); if (k === "page") nz(t, 0.25, 0.05, 2500); if (k === "tick") nz(t, 0.02, 0.03, 4000, "highpass"); }
  async function ensureAudio() { if (!A.ac && !initAudio()) return false; await A.ac.resume(); A.on = true; return true; }
  $("#rec").addEventListener("click", async () => { if (!(await ensureAudio())) return; A.rec = !A.rec; $("#rec").setAttribute("aria-pressed", String(A.rec)); $("#rec").textContent = A.rec ? "レコードを止める" : "レコードをかける"; A.mus.gain.setTargetAtTime(A.rec ? 0.9 : 0, A.ac.currentTime, 0.4); A.crackle.gain.setTargetAtTime(A.rec ? 0.012 : 0, A.ac.currentTime, 0.4); A.next = A.ac.currentTime + 0.1; });
  let raining = false, dimmed = false;
  $("#rain").addEventListener("click", async () => { raining = !raining; $("#rain").setAttribute("aria-pressed", String(raining)); rainLines.visible = raining; drops.forEach(d => d.m.visible = raining); await ensureAudio(); A.rain.gain.setTargetAtTime(raining ? 0.06 : 0, A.ac.currentTime, 0.6); });
  $("#dim").addEventListener("click", () => { dimmed = !dimmed; $("#dim").setAttribute("aria-pressed", String(dimmed)); });

  // ---------- the loop ----------
  let last = performance.now(), clockT = 0, lastSec = -1;
  const WD = ["日", "月", "火", "水", "木", "金", "土"];
  let ffLeft = 0;
  function frame(now) { const dt0 = Math.min(0.05, (now - last) / 1000); last = now; while (ffLeft > 0) { sim(1 / 30); ffLeft -= 1 / 30; } sim(dt0); renderer.render(scene, camera); requestAnimationFrame(frame); }
  function sim(dt) {
    clockT += dt; const t = clockT;
    const d = new Date(), hh = d.getHours(), mi = d.getMinutes(), se = d.getSeconds() + d.getMilliseconds() / 1000;
    handH.rotation.z = -((hh % 12) + mi / 60) / 12 * PI * 2; handM.rotation.z = -(mi + se / 60) / 60 * PI * 2; handS.rotation.z = -Math.floor(se) / 60 * PI * 2;
    if (Math.floor(se) !== lastSec) { lastSec = Math.floor(se); $("#now").textContent = `${hh < 12 ? "午前" : "午後"}${hh % 12}時${String(mi).padStart(2, "0")}分　${WD[d.getDay()]}曜の夜`; if (A.on && !A.rec) sfx("tick"); }
    updateMaster(dt, t); updateTraveller(dt, t); updateWaiter(dt, t); updateTables(dt, t); updateCat(dt, t);
    bellSwing *= Math.pow(0.15, dt); bell.rotation.x = Math.sin(t * 18) * 0.5 * bellSwing;
    fan.rotation.y += dt * 1.6; if (A.rec) disc.rotation.y += dt * 3.5;
    for (const f of fishes) { f.a += dt * f.sp; f.g.position.set(0.3 + Math.cos(f.a) * f.r * 1.4, f.y + Math.sin(f.a * 2.3) * 0.12, -0.2 + Math.sin(f.a) * f.r * 0.7); f.g.rotation.y = -f.a + (f.sp > 0 ? PI : 0); f.tail.rotation.y = PI / 2 + Math.sin(t * 8) * 0.5; }
    const glow = dimmed ? 0.55 : 1;
    for (const L of lamps) { L.pl.intensity = L.base * glow * (0.97 + 0.03 * Math.sin(t * 7 + L.ph)); L.h.material.opacity = 0.8 * glow; }
    hemi.intensity = lerp(hemi.intensity, dimmed ? 0.36 : 0.72, 0.05); key.intensity = lerp(key.intensity, dimmed ? 0.15 : 0.55, 0.05);
    for (const c of candles) { const fl = 0.85 + 0.15 * Math.sin(t * 13 + c.f.position.x * 5) + 0.06 * Math.sin(t * 31); c.f.scale.set(0.16 * fl, 0.26 * fl, 1); c.core.scale.y = 1.5 + 0.3 * Math.sin(t * 17); }
    candyLights.forEach((s, i) => { s.material.color.setHSL((i * 0.13 + t * 0.05) % 1, 0.8, 0.75 + 0.15 * Math.sin(t * 2 + i)); });
    // dust drifts
    const dp = dustGeo.attributes.position.array; for (let i = 0; i < DN; i++) { dp[i * 3] += Math.sin(t * 0.3 + i) * dt * 0.03; dp[i * 3 + 1] += Math.cos(t * 0.2 + i * 1.3) * dt * 0.02; } dustGeo.attributes.position.needsUpdate = true;
    // steam puffs
    for (const q of steamPuffs) { if (q.life <= 0) continue; q.life -= dt * 0.7; q.s.position.y += dt * 0.25; q.s.position.x += Math.sin(t * 2 + q.s.id) * dt * 0.05; const s = 0.05 + (1 - q.life) * 0.12; q.s.scale.set(s, s, 1); q.s.material.opacity = Math.min(1, q.life * 1.4); if (q.life <= 0) q.s.visible = false; }
    if (Math.random() < dt * 0.6) puff(new T.Vector3(TA.x - 0.3, 0.9, TA.z + 0.18));
    // outside: the whale of stars swims by now and then, a meteor falls
    if (whaleT < 0 && t > nextWhale) { whaleT = 0; }
    if (whaleT >= 0) { whaleT += dt; whale.position.z = 9 - whaleT * 0.6; whale.position.y = 3.0 + Math.sin(whaleT * 0.6) * 0.25; if (whaleT > 22) { whaleT = -1; nextWhale = t + rr(30, 55); whale.position.z = 9; } }
    if (meteorT < 0 && t > nextMeteor) { meteorT = 0; meteor.position.set(-W2 - 2.2, rr(3.2, 4.0), rr(-1, 2)); }
    if (meteorT >= 0) { meteorT += dt; meteor.position.y -= dt * 1.4; meteor.position.z -= dt * 2.2; meteor.rotation.x = 0.55; meteor.material.opacity = Math.sin(Math.min(1, meteorT / 0.9) * PI); if (meteorT > 0.9) { meteorT = -1; nextMeteor = t + rr(7, 16); meteor.material.opacity = 0; } }
    if (raining) { for (let i = 0; i < RAINN; i++) { const j = i * 6 + 1; rainPos[j] -= dt * 7; rainPos[j + 3] -= dt * 7; rainPos[j + 1] += dt * 1; rainPos[j + 4] += dt * 1; if (rainPos[j] < -0.5) { rainPos[j] += 5.5; rainPos[j + 3] += 5.5; rainPos[j + 1] -= 1; rainPos[j + 4] -= 1; } } rainGeo.attributes.position.needsUpdate = true; for (const dr of drops) { dr.y -= dt * dr.v; if (dr.y < WY0 + 0.05) { dr.y = WY1 - 0.05; dr.z = rr(WX0 + 0.1, WX1 - 0.1); dr.v = rr(0.05, 0.3); } dr.m.position.set(-W2 - 0.04, dr.y, dr.z); } }
    // speech bubbles follow their speaker's head
    for (let i = bubbles.length - 1; i >= 0; i--) { const b = bubbles[i]; b.t += dt; const p = new T.Vector3().setFromMatrixPosition(b.target.head.matrixWorld); b.s.position.set(p.x, p.y + b.dy * 0.6 + 0.2, p.z); b.s.material.opacity = Math.min(1, b.t * 5, (b.dur - b.t) * 3); if (b.t > b.dur) { scene.remove(b.s); b.s.material.map.dispose(); bubbles.splice(i, 1); } }
    if (cardCast && !$("#card").hidden && Math.floor(t * 2) % 4 === 0) { const [a, b] = cardCast.lines(); $("#ctext").textContent = a + "　" + b; }
    music();
    updateCamera(dt);
  }
  resize(); setView("all"); Object.assign(cam, { r: 13, th: 0.35, ph: 1.25 }); cam.tg = VIEWS.all.tg.clone();
  window.Bar = { ff: s => { ffLeft += s; }, setView, step: s => { last -= s * 1000; }, get state() { return { mState, tState, catState }; }, say, scene };
  requestAnimationFrame(frame);
})();
