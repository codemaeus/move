<title>Moonlit Floating Hall</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #efe9f6;
    --dim: #9b93b8;
    --ground: #0b0a18;
    --panel: #16132c;
    --line: #342b56;
    --gold: #f0c878;
    --cool: #a8d4ff;
    --font: "DotGothic16", "MS Gothic", "Osaka-Mono", ui-monospace, monospace;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 15px;
    padding-inline: 16px; padding-block: 16px 24px; box-sizing: border-box; }
  .wrap { max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 420px) 1fr; gap: 18px; align-items: start; }
  @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } }
  .screen { position: relative; width: 100%; aspect-ratio: 9 / 16; max-width: 100%; background: #000; border: 1px solid var(--line); }
  #view { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  .hud { position: absolute; left: 10px; top: 8px; display: flex; gap: 10px; font-size: 13px; color: var(--gold); text-shadow: 0 0 4px #000; pointer-events: none; }
  .hud span:last-child { color: var(--cool); }
  .side { display: flex; flex-direction: column; gap: 12px; }
  h1 { margin: 0; font-size: 22px; font-weight: 400; letter-spacing: 0.08em; color: var(--gold); }
  .sub { color: var(--dim); font-size: 13px; margin: 4px 0 0; }
  .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .label { color: var(--dim); font-size: 12px; letter-spacing: 0.1em; }
  button, select { font-family: var(--font); font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); padding: 6px 10px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  button.play { border-color: #7a5a3a; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--cool); outline-offset: 2px; }
  button:disabled { opacity: 0.5; cursor: wait; }
  input[type="range"] { accent-color: var(--gold); width: 110px; }
  .log { margin: 0; padding: 10px 12px; list-style: none; background: var(--panel); border: 1px solid var(--line); min-height: 170px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .log li { display: flex; gap: 8px; }
  .log time { color: var(--dim); font-variant-numeric: tabular-nums; flex: none; }
  .log li.wx { color: var(--cool); } .log li.ev { color: var(--gold); } .log li.yo { color: #d9a0ff; }
  #status { color: var(--cool); font-size: 13px; min-height: 1.2em; }
  .out { display: flex; flex-direction: column; gap: 8px; }
  .out img, .out video { max-width: 100%; image-rendering: pixelated; border: 1px solid var(--line); }
  .hint { color: var(--dim); font-size: 12px; line-height: 1.6; margin: 0; }
</style>

<div class="wrap">
  <div class="screen">
    <canvas id="view" width="720" height="1280"></canvas>
    <div class="hud" aria-hidden="true"><span id="hud-t">22:10</span><span id="hud-w">晴れ</span></div>
  </div>
  <div class="side">
    <div>
      <h1>月夜の浮御堂</h1>
      <p class="sub">湖に浮かぶお堂 / 180×320 ピクセル / 縦長</p>
    </div>
    <div class="group">
      <button id="music" class="play" aria-pressed="false">音を出す</button>
      <label class="label" for="vol">音量</label>
      <input id="vol" type="range" min="0" max="100" value="70">
      <button id="bgm" aria-pressed="true">音楽</button>
    </div>
    <div class="group" role="group" aria-label="天気">
      <span class="label">天気</span>
      <button data-w="auto" aria-pressed="true">自動</button>
      <button data-w="rain" aria-pressed="false">雨あり</button>
      <button data-w="dry" aria-pressed="false">雨なし</button>
    </div>
    <div class="group" role="group" aria-label="出来事を起こす">
      <span class="label">出来事</span>
      <button data-ev="toro">灯籠流し</button>
      <button data-ev="bell">鐘</button>
      <button data-ev="sutra">読経</button>
      <button data-ev="tsukimi">お月見</button>
      <button data-ev="tanuki">狸囃子</button>
      <button data-ev="lotus">蓮の花</button>
    </div>
    <div class="group">
      <button id="pause" aria-pressed="false">一時停止</button>
      <label class="label" for="gifsec">GIF</label>
      <select id="gifsec"><option value="4">4秒</option><option value="8" selected>8秒</option><option value="12">12秒</option></select>
      <select id="gifscale" aria-label="GIFサイズ"><option value="1">180×320</option><option value="2" selected>360×640</option></select>
      <button id="gif">GIFを作る</button>
      <button id="webm">動画を録画</button>
    </div>
    <ul class="log" id="log" aria-live="polite"></ul>
    <p class="hint">満月の下、湖に張り出したお堂に灯りがともり、水面にはお堂と月が揺れて映ります。灯籠流し、山の鐘の音が水面に広がる波紋、読経と木魚、和尚と小僧のお月見、狸囃子、蓮の花が開く音、鷺、狐火、雨の日の河童などが起こります。音楽は箏と尺八と笙のような響きを毎回その場で合成しています。</p>
    <div id="status" role="status"></div>
    <div class="out" id="out"></div>
  </div>
</div>

<script>
(() => {
  "use strict";
  const W = 180, H = 320, H0 = 140;
  const low = document.createElement("canvas"); low.width = W; low.height = H;
  const ctx0 = low.getContext("2d", { willReadFrequently: true });
  let ctx = ctx0;
  ctx0.imageSmoothingEnabled = false;
  const view = document.getElementById("view"), vctx = view.getContext("2d");
  vctx.imageSmoothingEnabled = false;
  const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d"); x.imageSmoothingEnabled = false; return [c, x]; };
  const [bgC, bgX] = mk(W, H0 + 2);
  const [hallC, hallX] = mk(116, 106);
  const [bridgeC, bridgeX] = mk(70, 30);
  const [boatC, boatX] = mk(50, 28);
  const PFONT = '"DotGothic16", "MS Gothic", monospace';
  if (document.fonts && document.fonts.load) document.fonts.load(`8px ${PFONT}`).catch(() => {});

  // ---------- helpers ----------
  function hash(i) { let h = Math.imul((i | 0) ^ 0x9e3779b9, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
  const mod = (a, n) => ((a % n) + n) % n;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const mul = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
  const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${clamp(a, 0, 1).toFixed(3)})`;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[(Math.random() * a.length) | 0];
  function rect(x, y, w, h, c) { ctx.fillStyle = typeof c === "string" ? c : rgb(c); ctx.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h))); }
  const px = (x, y, c) => { ctx.fillStyle = typeof c === "string" ? c : rgb(c); ctx.fillRect(Math.round(x), Math.round(y), 1, 1); };
  function line(x0, y0, x1, y1, c) { ctx.fillStyle = typeof c === "string" ? c : rgb(c); const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) | 0; for (let i = 0; i <= n; i++) { const f = n ? i / n : 0; ctx.fillRect(Math.round(lerp(x0, x1, f)), Math.round(lerp(y0, y1, f)), 1, 1); } }
  function disc(x, y, r, c) { ctx.fillStyle = typeof c === "string" ? c : rgb(c); for (let dy = -r; dy <= r; dy++) { const w = Math.floor(Math.sqrt(r * r - dy * dy + r * 0.8)); ctx.fillRect(Math.round(x - w), Math.round(y + dy), w * 2 + 1, 1); } }
  function glow(x, y, r, c, a) {
    if (r < 0.5 || a <= 0.01) return;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, rgba(c, a)); g.addColorStop(0.4, rgba(c, a * 0.35)); g.addColorStop(1, rgba(c, 0));
    const p = ctx.globalCompositeOperation; ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.globalCompositeOperation = p;
  }

  // ---------- state ----------
  const S = {
    time: 0, weather: "auto", rain: 0, lastWx: 0, flash: 0, bolt: null,
    drops: [], rings: [], flies: [], wisps: [], puffs: [], events: [], words: [], nextEvent: 3,
    boatX: 10, sutra: 0, tsukimi: 0, bell: 0, bellRings: [], lotus: 0, heron: null, fish: 0, paused: false, windows: [1, 1, 1, 1],
  };
  const logEl = document.getElementById("log");
  const clock = () => { const m = 22 * 60 + 10 + Math.floor(S.time / 15); return `${String(Math.floor(m / 60) % 24).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`; };
  function log(msg, cls = "ev") {
    const li = document.createElement("li"); li.className = cls;
    const t = document.createElement("time"); t.textContent = clock();
    const sp = document.createElement("span"); sp.textContent = msg;
    li.append(t, sp); logEl.prepend(li);
    while (logEl.children.length > 9) logEl.lastChild.remove();
  }
  const word = (str, x, y, c = [255, 240, 200], life = 1.2) => S.words.push({ str, x, y, c, t: 0, life });

  // ---------- events ----------
  const add = e => { e.t = 0; S.events.push(e); return e; };
  const active = t => S.events.some(e => e.type === t);
  function startEvent(kind) {
    switch (kind) {
      case "toro": if (active("toro")) return; for (let i = 0; i < 7; i++) add({ type: "toro", x: 40 - i * 9, y: 226 + (i % 3) * 7 + rnd(-2, 2), v: rnd(2.4, 3.4), dur: 90, c: pick([[255, 214, 140], [255, 190, 150], [255, 230, 170]]) }); log("灯籠流し。ひとつひとつの灯りが湖をすべっていく"); break;
      case "bell": S.bell = 9; S.bellRings.push({ t: 0 }); sfx("bell"); word("ゴーン…", 156, 108, [230, 230, 255], 2.6); log("向こう岸の鐘楼から 鐘の音が湖面をわたってくる"); break;
      case "sutra": S.sutra = 14; log("お堂から読経と木魚の音が聞こえる"); break;
      case "tsukimi": if (S.tsukimi > 0) return; S.tsukimi = 22; log("和尚と小僧が縁側でお月見。団子とすすきが供えてある"); break;
      case "tanuki": if (active("tanuki")) return; add({ type: "tanuki", dur: 12 }); log("岸辺で狸たちが腹鼓を打っている… 狸囃子だ", "yo"); break;
      case "lotus": S.lotus = 12; sfx("pon"); log("ぽん、と蓮の花が開いた"); break;
      case "heron": S.heron = { t: 0 }; log("白鷺が月をよこぎって飛んでいった"); sfx("heron"); break;
      case "kitsunebi": for (let i = 0; i < 5; i++) S.wisps.push({ x: rnd(6, 60), y: rnd(118, 132), t: 0, ph: rnd(0, 6) }); log("向こう岸の塔のそばに 狐火がゆらめく", "yo"); break;
      case "kappa": if (active("kappa")) return; add({ type: "kappa", dur: 10 }); log("蓮の葉のかげから 河童が顔を出した", "yo"); sfx("splash"); break;
      case "fish": S.fish = 3.5; log("小僧が橋の上で釣り糸を垂れている…　釣れた！"); setTimeout(() => sfx("splash"), 2200); break;
      case "koi": add({ type: "koi", x: rnd(30, 160), y: rnd(230, 300), dur: 1.2 }); sfx("splash"); log("鯉がぱしゃりと跳ねた"); break;
      case "takuhatsu": add({ type: "takuhatsu", dur: 26 }); log("網代笠の托鉢僧が 橋をわたってお堂へ向かう"); break;
      case "shooting": add({ type: "shooting", x: rnd(60, 170), y: rnd(10, 50), dur: 0.9 }); log("流れ星が 月の横をすべっていった"); break;
      case "window": { const i = (Math.random() * 4) | 0; S.windows[i] = S.windows[i] ? 0 : 1; log(S.windows[i] ? "お堂の障子に灯りがともった" : "お堂の障子の灯りがひとつ消えた"); break; }
    }
  }
  function trySpecial() {
    const dry = S.rain < 0.15;
    const c = [["toro", dry ? 1.6 : 0], ["bell", 1.8], ["sutra", 1.8], ["tsukimi", dry ? 1.6 : 0], ["tanuki", dry ? 1.2 : 0], ["lotus", 1.4], ["heron", 1.2], ["kitsunebi", dry ? 1.2 : 0],
      ["kappa", !dry ? 2.2 : 0.3], ["fish", 1.3], ["koi", 1.6], ["takuhatsu", 1.2], ["shooting", dry ? 1.2 : 0], ["window", 1]].filter(x => x[1] > 0);
    let r = Math.random() * c.reduce((a, x) => a + x[1], 0), t = c[0][0];
    for (const [k, w] of c) if ((r -= w) <= 0) { t = k; break; }
    startEvent(t);
  }

  // ---------- update ----------
  function weatherTarget() {
    if (S.weather === "rain") return 0.8;
    if (S.weather === "dry") return 0;
    const c = S.time % 120; return c < 50 ? 0 : c < 57 ? (c - 50) / 7 * 0.8 : c < 103 ? 0.8 : Math.max(0, 0.8 - (c - 103) / 7);
  }
  function step(dt) {
    S.time += dt;
    S.rain += (weatherTarget() - S.rain) * Math.min(1, dt * 0.5);
    if (S.lastWx === 0 && S.rain > 0.2) { S.lastWx = 1; log("雨が湖面をたたきはじめた。和尚が番傘をひらく", "wx"); }
    else if (S.lastWx === 1 && S.rain < 0.08) { S.lastWx = 0; log("雨がやみ、雲間から満月がのぞいた", "wx"); }
    const want = Math.round(S.rain * 160);
    while (S.drops.length < want) S.drops.push({ x: rnd(-10, W), y: rnd(-20, H), v: rnd(150, 210), ty: rnd(H0 + 4, H) });
    if (S.drops.length > want) S.drops.length = want;
    for (const d of S.drops) { d.y += d.v * dt; d.x += d.v * 0.06 * dt; if (d.y > d.ty) { if (d.ty > H0) S.rings.push({ x: d.x, y: d.ty, t: 0, s: 0.6 + (d.ty - H0) / 180 }); d.y = rnd(-30, -4); d.x = rnd(-10, W); d.ty = rnd(H0 + 4, H); } }
    if (Math.random() < dt * 0.5) S.rings.push({ x: rnd(0, W), y: rnd(H0 + 10, H), t: 0, s: 0.8 + Math.random() });
    for (let i = S.rings.length - 1; i >= 0; i--) { S.rings[i].t += dt; if (S.rings[i].t > 1) S.rings.splice(i, 1); }
    S.flash = Math.max(0, S.flash - dt * 2.5);
    if (S.rain > 0.7 && Math.random() < dt * 0.03) { S.flash = 1; const b = []; let x = rnd(20, 160), y = 0; while (y < 90) { b.push([x, y]); x += rnd(-5, 5); y += rnd(3, 6); } S.bolt = { pts: b, t: 0 }; log("山の向こうで稲妻が光った", "wx"); setTimeout(() => sfx("thunder"), 700); }
    if (S.bolt) { S.bolt.t += dt; if (S.bolt.t > 0.2) S.bolt = null; }
    const wf = S.rain < 0.1 ? 14 : 0;
    while (S.flies.length < wf) S.flies.push({ x: Math.random() < 0.5 ? rnd(2, 60) : rnd(110, 178), y: Math.random() < 0.4 ? rnd(116, 138) : rnd(262, 312), ph: rnd(0, 6) });
    if (S.flies.length > wf) S.flies.length = wf;
    for (const f of S.flies) { f.x += Math.sin(S.time * 0.6 + f.ph) * dt * 3; f.y += Math.cos(S.time * 0.5 + f.ph * 2) * dt * 2.5; }
    for (let i = S.wisps.length - 1; i >= 0; i--) { const w = S.wisps[i]; w.t += dt; w.x += Math.sin(w.t * 0.8 + w.ph) * dt * 3; w.y += Math.cos(w.t + w.ph) * dt; if (w.t > 14) S.wisps.splice(i, 1); }
    if (Math.random() < dt * 3) S.puffs.push({ x: 20, y: 280, t: 0 });
    for (let i = S.puffs.length - 1; i >= 0; i--) { const p = S.puffs[i]; p.t += dt; p.y -= dt * 5; p.x += Math.sin(p.t * 1.5) * dt * 3; if (p.t > 3.5) S.puffs.splice(i, 1); }
    for (let i = S.bellRings.length - 1; i >= 0; i--) { S.bellRings[i].t += dt; if (S.bellRings[i].t > 6) S.bellRings.splice(i, 1); }
    S.boatX = 8 + Math.sin(S.time * 0.05) * 8;
    S.bell = Math.max(0, S.bell - dt); S.tsukimi = Math.max(0, S.tsukimi - dt); S.lotus = Math.max(0, S.lotus - dt); S.fish = Math.max(0, S.fish - dt);
    const sb = S.sutra; S.sutra = Math.max(0, S.sutra - dt);
    if (S.sutra > 0 && Math.floor(sb / 0.5) !== Math.floor(S.sutra / 0.5)) { sfx("moku"); if (Math.floor(S.sutra / 0.5) % 2) word("ポク", 114, 150, [255, 230, 190], 0.6); }
    if (S.heron) { S.heron.t += dt; if (S.heron.t > 8) S.heron = null; }
    for (let i = S.events.length - 1; i >= 0; i--) {
      const e = S.events[i]; e.t += dt;
      if (e.v) e.x += e.v * dt;
      if (e.type === "tanuki" && Math.floor(e.t * 3.2) !== Math.floor((e.t - dt) * 3.2) && e.t < 11) { sfx("ponpoko"); if (Math.floor(e.t * 3.2) % 2) word(pick(["ポン", "ポコ", "ポンポコ"]), 30 + rnd(-10, 10), 272, [255, 220, 150], 0.7); }
      if (e.t > e.dur || (e.v && e.x > W + 20)) S.events.splice(i, 1);
    }
    for (let i = S.words.length - 1; i >= 0; i--) { S.words[i].t += dt; if (S.words[i].t > S.words[i].life) S.words.splice(i, 1); }
    S.nextEvent -= dt; if (S.nextEvent <= 0) { S.nextEvent = rnd(6, 11); trySpecial(); }
    audioUpdate(dt);
  }

  // ---------- sky and far shore (also reflected) ----------
  function drawSky() {
    ctx = bgX;
    const cloud = clamp(S.rain * 1.4, 0, 1);
    const g = ctx.createLinearGradient(0, 0, 0, H0);
    g.addColorStop(0, rgb(mix([10, 10, 36], [22, 22, 34], cloud))); g.addColorStop(0.6, rgb(mix([30, 28, 72], [38, 38, 56], cloud))); g.addColorStop(1, rgb(mix([62, 54, 104], [56, 56, 72], cloud)));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H0 + 2);
    if (S.flash > 0) { ctx.fillStyle = rgba([200, 200, 240], S.flash * 0.4); ctx.fillRect(0, 0, W, H0); }
    for (let i = 0; i < 90; i++) { const tw = hash(i * 5 + 2); ctx.fillStyle = rgba([235, 230, 255], (1 - cloud) * (0.3 + 0.7 * Math.abs(Math.sin(S.time * (0.4 + tw * 1.8) + i))) * (tw > 0.9 ? 1 : 0.55)); ctx.fillRect((hash(i * 5) * W) | 0, (hash(i * 5 + 1) * (H0 - 30)) | 0, 1, 1); }
    // full moon with haze
    const mx = 118, my = 58, ma = 1 - cloud * 0.75;
    glow(mx, my, 48, [220, 210, 255], 0.28 * ma); glow(mx, my, 20, [255, 250, 230], 0.4 * ma);
    ctx.globalAlpha = ma; disc(mx, my, 13, [250, 244, 222]); for (const [dx, dy, r] of [[-4, -3, 3], [3, 4, 2], [5, -5, 2], [-2, 6, 1]]) disc(mx + dx, my + dy, r, [228, 220, 196]); ctx.globalAlpha = 1;
    // thin horizontal clouds across the moon
    for (let i = 0; i < 7; i++) {
      const w = 40 + hash(i * 7) * 60, x = mod(hash(i * 11) * 320 + S.time * (1.5 + hash(i)), 320) - 80, y = 30 + hash(i * 13) * 70;
      ctx.fillStyle = rgba(mix([80, 70, 120], [60, 60, 78], cloud), 0.3 + cloud * 0.55); ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), 2 + (i % 2) * 2);
      ctx.fillStyle = rgba([200, 190, 240], 0.08 * ma); ctx.fillRect(Math.round(x + 4), Math.round(y), Math.round(w - 8), 1);
    }
    if (S.bolt) for (const [bx, by] of S.bolt.pts) rect(bx, by, 1, 4, [240, 235, 255]);
    for (const e of S.events) if (e.type === "shooting") { const p = e.t / e.dur; for (let j = 0; j < 12; j++) px(e.x - p * 60 + j * 1.8, e.y + p * 26 - j * 0.8, rgba([255, 255, 230], (1 - j / 12) * (1 - p))); }
    if (S.heron) { const k = S.heron.t / 8, x = lerp(200, -20, k), y = 70 - Math.sin(k * Math.PI) * 20, up = Math.floor(S.time * 4) & 1, c = [250, 250, 245]; rect(x - 2, y, 6, 2, c); px(x - 3, y - 1, c); px(x - 4, y - 1, [230, 180, 60]); line(x + 3, y, x + 8, y + 1, c); line(x, y, x + 3, y - (up ? 5 : -3), c); line(x + 1, y, x + 5, y - (up ? 4 : -2), c); }
    // far mountains

    for (const w of S.words) { const k = w.t / w.life, y = w.y - k * 6; ctx.lineWidth = 2; ctx.strokeStyle = rgba([12, 10, 20], 0.9 * (1 - k)); ctx.strokeText(w.str, w.x, y); ctx.fillStyle = rgba(w.c, 1 - k); ctx.fillText(w.str, w.x, y); }
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    const g = ctx.createRadialGradient(W / 2, H / 2, 90, W / 2, H / 2, 210);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(8,4,20,0.45)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  // ---------- post-process ----------
  const LEVELS = [0, 28, 66, 118, 182, 255];
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const LO = new Uint8Array(256), FR = new Uint8Array(256);
  for (let v = 0; v < 256; v++) { let i = 0; while (i < 4 && v >= LEVELS[i + 1]) i++; const a = LEVELS[i], b = LEVELS[i + 1]; LO[v] = i; FR[v] = Math.round(((v - a) / (b - a)) * 16); }
  const indexBuf = new Uint8Array(W * H);
  function postProcess() {
    const img = ctx0.getImageData(0, 0, W, H), d = img.data;
    for (let y = 0, p = 0; y < H; y++) for (let x = 0; x < W; x++, p++) {
      const o = p * 4, th = BAYER[(x & 3) + ((y & 3) << 2)];
      let r = LO[d[o]] + (FR[d[o]] > th ? 1 : 0), g = LO[d[o + 1]] + (FR[d[o + 1]] > th ? 1 : 0), b = LO[d[o + 2]] + (FR[d[o + 2]] > th ? 1 : 0);
      if (r > 5) r = 5; if (g > 5) g = 5; if (b > 5) b = 5;
      indexBuf[p] = r * 36 + g * 6 + b;
      d[o] = LEVELS[r]; d[o + 1] = LEVELS[g]; d[o + 2] = LEVELS[b]; d[o + 3] = 255;
    }
    ctx0.putImageData(img, 0, 0);
    return indexBuf;
  }
  const hudT = document.getElementById("hud-t"), hudW = document.getElementById("hud-w");
  function frame(dt) {
    step(dt); ctx = ctx0; render();
    const idx = postProcess();
    vctx.drawImage(low, 0, 0, view.width, view.height);
    hudT.textContent = clock();
    hudW.textContent = S.rain > 0.5 ? "雨" : S.rain > 0.12 ? "小雨" : "晴れ";
    return idx;
  }

  // ---------- sound: koto, shakuhachi, sho-like drone + temple and lake sounds ----------
  const Snd = { ac: null, on: false, vol: 0.7, bgm: true, n: null, nextNote: 0, nextFlute: 0, droneT: 0 };
  let busy = false;
  const live = () => Snd.on && Snd.ac && !busy;
  const SCALE = [62, 63, 67, 69, 70, 74, 75, 79, 81, 82];
  const mf = m => 440 * Math.pow(2, (m - 69) / 12);
  function audioInit() {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    const ac = new AC(); Snd.ac = ac;
    const master = ac.createGain(); master.gain.value = Snd.vol;
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3; master.connect(comp); comp.connect(ac.destination);
    const conv = ac.createConvolver(), len = ac.sampleRate * 4, ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.4); }
    conv.buffer = ir; const wet = ac.createGain(); wet.gain.value = 0.5; conv.connect(wet); wet.connect(master);
    const music = ac.createGain(); music.gain.value = 0.9; music.connect(master); music.connect(conv);
    const white = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), wd = white.getChannelData(0); for (let i = 0; i < wd.length; i++) wd[i] = Math.random() * 2 - 1;
    const pink = ac.createBuffer(1, ac.sampleRate * 3, ac.sampleRate), pd = pink.getChannelData(0); let b0 = 0, b1 = 0, b2 = 0;
    for (let i = 0; i < pd.length; i++) { const w = Math.random() * 2 - 1; b0 = 0.997 * b0 + w * 0.029; b1 = 0.985 * b1 + w * 0.032; b2 = 0.95 * b2 + w * 0.048; pd[i] = (b0 + b1 + b2) * 0.9; }
    const loop = (buf, type, f) => { const s = ac.createBufferSource(); s.buffer = buf; s.loop = true; const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = f; const g = ac.createGain(); g.gain.value = 0; s.connect(fl); fl.connect(g); g.connect(master); s.start(); return g; };
    const voice = ac.createOscillator(); voice.type = "sawtooth"; voice.frequency.value = 98;
    const f1 = ac.createBiquadFilter(); f1.type = "bandpass"; f1.frequency.value = 500; f1.Q.value = 6;
    const f2 = ac.createBiquadFilter(); f2.type = "bandpass"; f2.frequency.value = 900; f2.Q.value = 8;
    const chantG = ac.createGain(); chantG.gain.value = 0; voice.connect(f1); voice.connect(f2); f1.connect(chantG); f2.connect(chantG); chantG.connect(master); chantG.connect(conv); voice.start();
    Snd.n = { master, music, conv, white, pink, rainG: loop(pink, "lowpass", 2000), hissG: loop(white, "highpass", 5500), lapG: loop(pink, "lowpass", 380), chantG, f1, f2 };
    Snd.nextNote = ac.currentTime + 0.5; Snd.nextFlute = ac.currentTime + 6;
    return true;
  }
  function envG(t0, a, peak, dur, dest) { const g = Snd.ac.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(peak, t0 + a); g.gain.exponentialRampToValueAtTime(0.0005, t0 + dur); g.connect(dest); return g; }
  function osc(type, f, t0, dur, g) { const o = Snd.ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t0); o.connect(g); o.start(t0); o.stop(t0 + dur + 0.05); return o; }
  function koto(m, t0, vel, bend) {
    const d = Snd.n.music, f = mf(m);
    const o = osc("triangle", f, t0, 2.4, envG(t0, 0.003, 0.08 * vel, 2.4, d));
    const o2 = osc("sine", f * 2, t0, 0.9, envG(t0, 0.002, 0.04 * vel, 0.9, d));
    osc("sine", f * 3.01, t0, 0.3, envG(t0, 0.001, 0.02 * vel, 0.3, d));
    if (bend) for (const oo of [o, o2]) { oo.frequency.setValueAtTime(oo.frequency.value, t0 + 0.25); oo.frequency.linearRampToValueAtTime(oo.frequency.value * Math.pow(2, 1 / 12), t0 + 0.45); }
    const s = Snd.ac.createBufferSource(); s.buffer = Snd.n.white; const hp = Snd.ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 3000; s.connect(hp); hp.connect(envG(t0, 0.001, 0.03 * vel, 0.02, d)); s.start(t0); s.stop(t0 + 0.03);
  }
  function shakuhachi(m, t0, dur) {
    const d = Snd.n.music, f = mf(m);
    const g = Snd.ac.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(0.06, t0 + 0.4); g.gain.setValueAtTime(0.05, t0 + dur * 0.7); g.gain.linearRampToValueAtTime(0.0001, t0 + dur); g.connect(d);
    const o = osc("sine", f * 0.97, t0, dur, g); o.frequency.linearRampToValueAtTime(f, t0 + 0.35);
    const v = Snd.ac.createOscillator(), vg = Snd.ac.createGain(); v.frequency.value = 4.5; vg.gain.setValueAtTime(0, t0); vg.gain.linearRampToValueAtTime(14, t0 + dur); v.connect(vg); vg.connect(o.detune); v.start(t0); v.stop(t0 + dur);
    const s = Snd.ac.createBufferSource(); s.buffer = Snd.n.white; s.loop = true; const bp = Snd.ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = f * 2; bp.Q.value = 2;
    const ng = Snd.ac.createGain(); ng.gain.setValueAtTime(0.0001, t0); ng.gain.linearRampToValueAtTime(0.03, t0 + 0.15); ng.gain.linearRampToValueAtTime(0.008, t0 + 0.6); ng.gain.linearRampToValueAtTime(0.0001, t0 + dur); s.connect(bp); bp.connect(ng); ng.connect(d); s.start(t0); s.stop(t0 + dur);
  }
  function drone(t0, dur) {
    const g = Snd.ac.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(0.012, t0 + 3); g.gain.setValueAtTime(0.012, t0 + dur - 3); g.gain.linearRampToValueAtTime(0.0001, t0 + dur); g.connect(Snd.n.music);
    for (const m of pick([[62, 69, 74, 76, 81], [67, 70, 74, 79], [62, 67, 69, 74, 79]])) { const o = Snd.ac.createOscillator(); o.type = "sine"; o.frequency.value = mf(m); o.detune.value = rnd(-4, 4); o.connect(g); o.start(t0); o.stop(t0 + dur); }
  }
  let melIdx = 4;
  function audioUpdate(dt) {
    if (!live()) return;
    const ac = Snd.ac, n = Snd.n, t = ac.currentTime;
    if (Snd.bgm) {
      while (Snd.nextNote < t + 0.3) {
        let tt = Snd.nextNote; const len = 3 + ((Math.random() * 5) | 0);
        for (let i = 0; i < len; i++) { melIdx = clamp(melIdx + pick([-2, -1, -1, 1, 1, 2]), 0, SCALE.length - 1); koto(SCALE[melIdx], tt, i === 0 ? 1 : 0.75, Math.random() < 0.15); if (Math.random() < 0.25) koto(SCALE[Math.max(0, melIdx - 3)] - 12, tt, 0.5, false); tt += pick([0.3, 0.45, 0.45, 0.65, 0.95]); }
        Snd.nextNote = tt + rnd(1.8, 4.5);
      }
      if (t > Snd.nextFlute) { const len = rnd(2.8, 4.8); shakuhachi(pick([69, 70, 74, 75, 79]), t + 0.05, len); if (Math.random() < 0.5) shakuhachi(pick([67, 69, 74]), t + len + 0.3, rnd(2, 3.5)); Snd.nextFlute = t + rnd(11, 20); }
      if (t > Snd.droneT) { drone(t, 14); Snd.droneT = t + 12; }
    }
    n.rainG.gain.setTargetAtTime(S.rain * 0.3, t, 0.3); n.hissG.gain.setTargetAtTime(S.rain * 0.035, t, 0.3);
    n.lapG.gain.setTargetAtTime(0.05 + 0.04 * Math.sin(S.time * 0.9), t, 0.2);
    if (S.rain > 0.2 && Math.random() < dt * 6) osc("sine", rnd(1400, 3200), t, 0.06, envG(t, 0.002, 0.01, 0.06, n.master));
    if (S.rain < 0.1 && Math.random() < dt * 1.8) for (let i = 0; i < 2; i++) osc("sine", 4600 + Math.random() * 200, t + i * 0.09, 0.08, envG(t + i * 0.09, 0.005, 0.006, 0.08, n.master));
    if (Math.random() < dt * 0.25) { const g = envG(t, 0.01, 0.02, 0.22, n.master); const o = osc("square", 120, t, 0.22, g); const am = ac.createOscillator(), ag = ac.createGain(); am.frequency.value = 28; ag.gain.value = 60; am.connect(ag); ag.connect(o.frequency); am.start(t); am.stop(t + 0.25); }
    const chanting = S.sutra > 0;
    n.chantG.gain.setTargetAtTime(chanting ? 0.03 : 0, t, 0.3);
    if (chanting) { const syl = Math.floor(S.sutra / 0.5) % 4; n.f1.frequency.setTargetAtTime([500, 350, 700, 400][syl], t, 0.04); n.f2.frequency.setTargetAtTime([900, 1900, 1100, 800][syl], t, 0.04); }
  }
  function sfx(kind) {
    if (!live()) return;
    const ac = Snd.ac, t0 = ac.currentTime, m = Snd.n.master, cv = Snd.n.conv;
    const noise = (type, f, q, dur, vol, dest = m, at = t0) => { const s = ac.createBufferSource(); s.buffer = Snd.n.white; const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q; s.connect(fl); fl.connect(envG(at, 0.002, vol, dur, dest)); s.start(at, Math.random()); s.stop(at + dur + 0.05); };
    switch (kind) {
      case "moku": osc("sine", 540, t0, 0.12, envG(t0, 0.001, 0.14, 0.12, cv)); noise("bandpass", 900, 3, 0.04, 0.07, cv); break;
      case "bell": noise("lowpass", 300, 0.7, 0.3, 0.25, cv); for (const [f, a, d] of [[82, 0.22, 13], [84.5, 0.16, 13], [168, 0.1, 10], [230, 0.08, 8], [318, 0.05, 6], [433, 0.03, 4]]) osc("sine", f, t0, d, envG(t0, 0.02, a, d, cv)); break;
      case "pon": { const o = osc("sine", 300, t0, 0.3, envG(t0, 0.002, 0.12, 0.3, cv)); o.frequency.exponentialRampToValueAtTime(700, t0 + 0.08); break; }
      case "ponpoko": { const o = osc("sine", 140, t0, 0.2, envG(t0, 0.002, 0.25, 0.2, cv)); o.frequency.exponentialRampToValueAtTime(90, t0 + 0.18); noise("lowpass", 400, 0.7, 0.06, 0.1); break; }
      case "splash": noise("bandpass", 1200, 0.8, 0.4, 0.14); osc("sine", 600, t0, 0.15, envG(t0, 0.002, 0.03, 0.15, m)).frequency.exponentialRampToValueAtTime(1400, t0 + 0.12); break;
      case "heron": { const g = envG(t0, 0.01, 0.03, 0.35, cv); const o = osc("sawtooth", 420, t0, 0.35, g); o.frequency.linearRampToValueAtTime(300, t0 + 0.35); break; }
      case "thunder": { const s = ac.createBufferSource(); s.buffer = Snd.n.pink; const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.setValueAtTime(800, t0); f.frequency.exponentialRampToValueAtTime(100, t0 + 3); s.connect(f); f.connect(envG(t0, 0.05, 0.45, 3.5, m)); s.start(t0); s.stop(t0 + 3.6); break; }
    }
  }

  // ---------- GIF ----------
  const PALETTE = new Uint8Array(768);
  for (let i = 0; i < 216; i++) { PALETTE[i * 3] = LEVELS[(i / 36) | 0]; PALETTE[i * 3 + 1] = LEVELS[((i / 6) | 0) % 6]; PALETTE[i * 3 + 2] = LEVELS[i % 6]; }
  function lzw(ix, out) {
    let size = 9, next = 258, cur = 0, bits = 0; const dict = new Map(), bytes = [];
    const emit = c => { cur |= c << bits; bits += size; while (bits >= 8) { bytes.push(cur & 255); cur >>>= 8; bits -= 8; } };
    emit(256); let prefix = ix[0];
    for (let i = 1; i < ix.length; i++) {
      const k = ix[i], key = prefix * 256 + k, v = dict.get(key);
      if (v !== undefined) { prefix = v; continue; }
      emit(prefix);
      if (next < 4095) { dict.set(key, next++); if (next > (1 << size) && size < 12) size++; } else { emit(256); dict.clear(); size = 9; next = 258; }
      prefix = k;
    }
    emit(prefix); emit(257); if (bits > 0) bytes.push(cur & 255);
    out.push(8);
    for (let i = 0; i < bytes.length; i += 255) { const n = Math.min(255, bytes.length - i); out.push(n); for (let j = 0; j < n; j++) out.push(bytes[i + j]); }
    out.push(0);
  }
  function upscale(ix, k) {
    if (k === 1) return ix.slice();
    const w = W * k, o = new Uint8Array(w * H * k);
    for (let y = 0; y < H * k; y++) { const sy = ((y / k) | 0) * W, row = y * w; for (let x = 0; x < w; x++) o[row + x] = ix[sy + ((x / k) | 0)]; }
    return o;
  }
  async function makeGif(seconds = 8, scale = 2, fps = 20, onProgress) {
    const n = Math.round(seconds * fps), w = W * scale, h = H * scale, delay = Math.round(100 / fps);
    const out = []; for (const ch of "GIF89a") out.push(ch.charCodeAt(0));
    out.push(w & 255, w >> 8, h & 255, h >> 8, 0xf7, 0, 0); for (let i = 0; i < 768; i++) out.push(PALETTE[i]);
    out.push(0x21, 0xff, 0x0b); for (const ch of "NETSCAPE2.0") out.push(ch.charCodeAt(0)); out.push(3, 1, 0, 0, 0);
    for (let i = 0; i < n; i++) {
      const ix = frame(1 / fps);
      out.push(0x21, 0xf9, 4, 4, delay & 255, delay >> 8, 0, 0, 0x2c, 0, 0, 0, 0, w & 255, w >> 8, h & 255, h >> 8, 0);
      lzw(upscale(ix, scale), out);
      if (i % 4 === 3) { onProgress && onProgress(i + 1, n); await new Promise(r => setTimeout(r, 0)); }
    }
    out.push(0x3b); return new Uint8Array(out);
  }

  // ---------- UI ----------
  let last = performance.now();
  function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; if (!S.paused && !busy) frame(dt); requestAnimationFrame(loop); }
  const status = document.getElementById("status"), out = document.getElementById("out");
  const mBtn = document.getElementById("music");
  mBtn.addEventListener("click", async () => {
    if (!Snd.ac && !audioInit()) { status.textContent = "このブラウザでは音を鳴らせません。"; return; }
    Snd.on = !Snd.on;
    if (Snd.on) { await Snd.ac.resume(); Snd.nextNote = Snd.ac.currentTime + 0.3; } else await Snd.ac.suspend();
    mBtn.setAttribute("aria-pressed", String(Snd.on)); mBtn.textContent = Snd.on ? "音を止める" : "音を出す";
  });
  const bgmBtn = document.getElementById("bgm");
  bgmBtn.addEventListener("click", () => { Snd.bgm = !Snd.bgm; bgmBtn.setAttribute("aria-pressed", String(Snd.bgm)); });
  document.getElementById("vol").addEventListener("input", e => { Snd.vol = e.target.value / 100; if (Snd.n) Snd.n.master.gain.setTargetAtTime(Snd.vol, Snd.ac.currentTime, 0.05); });
  const wButtons = [...document.querySelectorAll("[data-w]")];
  wButtons.forEach(b => b.addEventListener("click", () => { S.weather = b.dataset.w; wButtons.forEach(x => x.setAttribute("aria-pressed", String(x === b))); }));
  document.querySelectorAll("[data-ev]").forEach(b => b.addEventListener("click", () => startEvent(b.dataset.ev)));
  const pBtn = document.getElementById("pause");
  function togglePause() { S.paused = !S.paused; pBtn.setAttribute("aria-pressed", String(S.paused)); pBtn.textContent = S.paused ? "再生" : "一時停止"; }
  pBtn.addEventListener("click", togglePause);
  window.addEventListener("keydown", e => { if (e.code === "Space" && e.target === document.body) { e.preventDefault(); togglePause(); } });
  const gifBtn = document.getElementById("gif");
  gifBtn.addEventListener("click", async () => {
    busy = true; gifBtn.disabled = true;
    try {
      const bytes = await makeGif(+document.getElementById("gifsec").value, +document.getElementById("gifscale").value, 20, (i, n) => { status.textContent = `GIF 生成中… ${i}/${n} フレーム`; });
      const img = new Image(); img.src = URL.createObjectURL(new Blob([bytes], { type: "image/gif" })); img.alt = "書き出した浮御堂のGIF"; out.prepend(img);
      status.textContent = `GIF ができました（${(bytes.length / 1048576).toFixed(1)} MB）。右クリック／長押しで保存できます。`;
    } catch (err) { status.textContent = `GIF の生成に失敗しました: ${err.message}`; }
    finally { busy = false; gifBtn.disabled = false; last = performance.now(); }
  });
  const webmBtn = document.getElementById("webm"); let rec = null;
  webmBtn.addEventListener("click", () => {
    if (rec) { rec.stop(); return; }
    if (!view.captureStream || typeof MediaRecorder === "undefined") { status.textContent = "このブラウザは動画録画に対応していません。GIF をお使いください。"; return; }
    const chunks = [], type = ["video/webm;codecs=vp9", "video/webm", "video/mp4"].find(t => MediaRecorder.isTypeSupported(t)) || "";
    rec = new MediaRecorder(view.captureStream(30), type ? { mimeType: type, videoBitsPerSecond: 6e6 } : undefined);
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => {
      const v = document.createElement("video"); v.src = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType || "video/webm" }));
      v.controls = v.loop = v.muted = v.autoplay = true; out.prepend(v);
      status.textContent = "録画しました（映像のみ）。動画の右クリック／長押しで保存できます。"; rec = null; webmBtn.textContent = "動画を録画";
    };
    rec.start(); webmBtn.textContent = "録画を止める"; status.textContent = "録画中… もう一度押すと停止します。";
  });

  log("満月の夜。湖に張り出したお堂に灯りがともる", "wx");
  for (let i = 0; i < 20; i++) step(1 / 30);
  window.Uki = { S, frame, makeGif, startEvent };
  requestAnimationFrame(loop);
})();
</script>
