<!doctype html>
<title>Torchbearer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
  :root { color-scheme: dark; --ink: #efe8da; --dim: #9d97ad; --ground: #0e0c16; --panel: #1b1726; --line: #372f48; --accent: #ffb35c; --cool: #8fd0ff;
    --font: "DotGothic16", "MS Gothic", "Osaka-Mono", ui-monospace, monospace; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 15px; padding-inline: 16px; padding-block: 16px 24px; box-sizing: border-box; }
  .wrap { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .screen { position: relative; width: 100%; max-width: 100%; aspect-ratio: 8 / 7; background: #000; border: 1px solid var(--line); }
  #view { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
  h1 { margin: 0; font-size: 22px; font-weight: 400; letter-spacing: 0.08em; color: var(--accent); }
  .sub { color: var(--dim); font-size: 13px; margin: 4px 0 0; }
  .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  button { font-family: var(--font); font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); padding: 6px 10px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--cool); outline-offset: 2px; }
  .pad { display: flex; justify-content: space-between; align-items: center; gap: 12px; user-select: none; -webkit-user-select: none; touch-action: none; }
  .pad .dir { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 48px); gap: 6px; }
  .pad .act { display: flex; gap: 10px; }
  .pad button { font-size: 18px; border-radius: 10px; touch-action: none; padding: 0; }
  .pad .act button { border-radius: 50%; width: 64px; height: 64px; }
  .pad .b-jump { background: #3a2a14; border-color: #8a6428; color: var(--accent); }
  .pad .b-atk { background: #16283a; border-color: #2f6a8f; color: var(--cool); }
  .keys { color: var(--dim); font-size: 12px; line-height: 1.8; margin: 0; }
  kbd { font-family: var(--font); border: 1px solid var(--line); background: var(--panel); padding: 0 5px; color: var(--ink); }
  @media (hover: hover) and (pointer: fine) { .pad { display: none; } }
</style>
<body>
<div class="wrap">
  <div class="screen"><canvas id="view" width="768" height="672" tabindex="0" aria-label="ともしびの剣 ゲーム画面"></canvas></div>
  <div class="pad" aria-label="タッチ操作">
    <div class="dir"><span></span><button data-k="up" aria-label="上を見る・しらべる">▲</button><span></span><button data-k="left" aria-label="左">◀</button><button data-k="down" aria-label="しゃがむ">▼</button><button data-k="right" aria-label="右">▶</button></div>
    <div class="act"><button class="b-atk" data-k="atk" aria-label="剣">剣</button><button class="b-jump" data-k="jump" aria-label="ジャンプ">跳</button></div>
  </div>
  <div>
    <h1>ともしびの剣</h1>
    <p class="sub">256×224 ピクセル / 松明をかかげて夜の森・地下墓所・亡霊の塔をゆく、オリジナルの横スクロールアクション</p>
  </div>
  <div class="group"><button id="snd" aria-pressed="false">音を出す</button><button id="pause" aria-pressed="false">ポーズ</button><button id="restart">タイトルへ</button></div>
  <p class="keys">
    <kbd>←</kbd><kbd>→</kbd> 移動　<kbd>↓</kbd> しゃがむ　<kbd>↑</kbd> 上を見る／看板をしらべる　<kbd>Z</kbd>/<kbd>Space</kbd> ジャンプ（空中でもう一回）　<kbd>X</kbd>/<kbd>J</kbd> 剣（連打で3段斬り）　<kbd>Enter</kbd> スタート・ポーズ<br>
    空中で <kbd>↓</kbd>+剣 は下突き（敵を踏み台にしてはね返る）、<kbd>↑</kbd>+剣 は斬り上げ、しゃがみ中の剣は足払い。松明を近づけると、かがり火や壁の燭台に火がつきます。たき火で休むとそこから再開。亡霊は松明の光の中でしか見えません。宝箱やひびの入った岩は剣で。
  </p>
</div>
<script>
(async () => {
  "use strict";
  try { await Promise.all([document.fonts.load('12px "DotGothic16"'), document.fonts.load('16px "DotGothic16"')]); } catch (e) { /* system font */ }
  const W = 256, H = 224, T = 16, ROWS = 14;
  const view = document.getElementById("view"), vctx = view.getContext("2d"); vctx.imageSmoothingEnabled = false;
  const PF = '"DotGothic16", "MS Gothic", monospace';

  // ---------- helpers ----------
  function canvas(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d", { willReadFrequently: true }); x.imageSmoothingEnabled = false; return [c, x]; }
  function hash(i) { let h = Math.imul((i | 0) ^ 0x9e3779b9, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
  const h2 = (x, y) => hash(Math.imul(x | 0, 73856093) ^ Math.imul(y | 0, 19349663));
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const mul = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
  const col = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${clamp(a, 0, 1).toFixed(3)})`;
  const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const dith = (x, y, t) => t * 16 > BAY[(x & 3) + ((y & 3) << 2)];
  const rnd = (a, b) => a + Math.random() * (b - a);
  function mk(w, h, fn) {
    const [c, x] = canvas(w, h), img = x.createImageData(w, h), d = img.data;
    const P = (a, b, cc) => { a = Math.round(a); b = Math.round(b); if (a < 0 || b < 0 || a >= w || b >= h) return; const o = (b * w + a) * 4; d[o] = cc[0]; d[o + 1] = cc[1]; d[o + 2] = cc[2]; d[o + 3] = 255; };
    const G = (a, b) => { a = Math.round(a); b = Math.round(b); if (a < 0 || b < 0 || a >= w || b >= h) return null; const o = (b * w + a) * 4; return d[o + 3] ? [d[o], d[o + 1], d[o + 2]] : null; };
    const R = (a, b, ww, hh, cc) => { a = Math.round(a); b = Math.round(b); for (let yy = b; yy < b + hh; yy++) for (let xx = a; xx < a + ww; xx++) P(xx, yy, cc); };
    const E = (cx, cy, rx, ry, cc) => { for (let y = -Math.ceil(ry); y <= Math.ceil(ry); y++) { const q = 1 - (y * y) / ((ry + 0.5) * (ry + 0.5)); if (q < 0) continue; const ww = Math.round(rx * Math.sqrt(q)); for (let xx = -ww; xx <= ww; xx++) P(Math.round(cx) + xx, Math.round(cy) + y, cc); } };
    const line = (x0, y0, x1, y1, cc, th = 1) => { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1); for (let i = 0; i <= n; i++) { const xx = Math.round(lerp(x0, x1, i / n)), yy = Math.round(lerp(y0, y1, i / n)); R(xx, yy, th, th, cc); } };
    const poly = (pts, cc) => { let y0 = 1e9, y1 = -1e9; for (const [, y] of pts) { y0 = Math.min(y0, y); y1 = Math.max(y1, y); } for (let y = Math.floor(y0); y < Math.ceil(y1); y++) { const yc = y + 0.5, xs = []; for (let i = 0; i < pts.length; i++) { const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length]; if ((ay <= yc && by > yc) || (by <= yc && ay > yc)) xs.push(ax + (yc - ay) / (by - ay) * (bx - ax)); } xs.sort((a, b) => a - b); for (let k = 0; k + 1 < xs.length; k += 2) for (let xx = Math.round(xs[k]); xx < Math.round(xs[k + 1]); xx++) P(xx, y, cc); } };
    const outline = cc => { const m = new Uint8Array(w * h); for (let i = 0; i < w * h; i++) m[i] = d[i * 4 + 3] ? 1 : 0; for (let y = 0; y < h; y++) for (let xx = 0; xx < w; xx++) if (!m[y * w + xx] && ((xx > 0 && m[y * w + xx - 1]) || (xx < w - 1 && m[y * w + xx + 1]) || (y > 0 && m[(y - 1) * w + xx]) || (y < h - 1 && m[(y + 1) * w + xx]))) P(xx, y, cc); };
    fn({ P, G, R, E, line, poly, outline, w, h }); x.putImageData(img, 0, 0); return c;
  }
  function flip(c) { const [f, x] = canvas(c.width, c.height); x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(c, 0, 0); return f; }
  function whiteOf(c) { const [f, x] = canvas(c.width, c.height); x.drawImage(c, 0, 0); x.globalCompositeOperation = "source-in"; x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); return f; }
  const pair = c => { const f = flip(c); return { r: c, l: f, wr: whiteOf(c), wl: whiteOf(f) }; };
  const [tc, tcx] = canvas(420, 40), TXT = new Map();
  function text(s, size = 12, c = [255, 255, 255], shadow = [16, 12, 26]) {
    const key = s + "|" + size + c + shadow; if (TXT.has(key)) return TXT.get(key); if (TXT.size > 400) TXT.clear();
    tcx.clearRect(0, 0, 420, 40); tcx.font = `${size}px ${PF}`; tcx.textBaseline = "top"; tcx.fillStyle = "#000"; tcx.fillText(s, 1, 1);
    const w = Math.min(420, Math.ceil(tcx.measureText(s).width) + 3), hh = size + 4, d = tcx.getImageData(0, 0, w, hh).data;
    const out = mk(w, hh, p => { for (let y = 0; y < hh; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 110) { if (shadow) p.P(x + 1, y + 1, shadow); } for (let y = 0; y < hh; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 110) p.P(x, y, c); });
    TXT.set(key, out); return out;
  }
  const O = [22, 14, 28];

  // ---------- the hero: built from parts so every pose shares one design ----------
  const HC = { skin: [250, 204, 162], skinD: [212, 146, 108], hair: [160, 78, 44], hood: [48, 94, 132], hoodL: [88, 142, 178], hoodD: [30, 58, 90], tun: [190, 156, 94], tunD: [136, 104, 64], belt: [94, 58, 38], gold: [240, 196, 84], pant: [78, 70, 100], pantD: [52, 46, 72], boot: [118, 76, 48], bootD: [76, 46, 32], scarf: [214, 62, 54], scarfD: [150, 36, 40], blade: [212, 222, 238], edge: [255, 255, 255], bladeD: [132, 146, 172], grip: [104, 62, 40], stick: [128, 86, 54], thead: [74, 56, 48] };
  function heroFrame(o) {
    let tip = [0, 0];
    const c = mk(32, 32, p => {
      const cx = 15, cr = o.crouch ? 5 : 0, hipY = 22 + cr + (o.hipDY || 0), bob = o.bob || 0, tt = hipY - 8 + bob + (o.crouch ? 1 : 0), lean = o.lean || 0, ht = tt - 7 + (o.headDY || 0);
      const leg = (l, cp, cd, back) => { const hx = cx + (back ? -1 : 1), fx = cx + l[0], fy = 30 - (l[1] || 0), bend = l[2] == null ? 1.5 : l[2], kx = (hx + fx) / 2 + bend, ky = (hipY + fy) / 2 - (o.crouch ? 1 : 0); p.line(hx, hipY, kx, ky, cp, 2); p.line(kx, ky, fx, fy - 1, cp, 2); p.P(kx + 1, ky, cd); p.R(fx - 1, fy - 1, 4, 2, back ? HC.bootD : HC.boot); p.P(fx + 2, fy, back ? HC.bootD : HC.boot); p.R(fx - 1, fy - 2, 3, 1, back ? HC.bootD : HC.boot); };
      const fl = o.fl == null ? 1 : o.fl;
      // cloak behind the body
      p.poly([[cx - 3 + lean, tt + 1], [cx + 1 + lean, tt + 1], [cx, hipY + 2], [cx - 4 - fl, hipY + 3 - Math.max(0, -fl) * 2], [cx - 5 - fl, hipY - 1]], HC.hoodD);
      p.line(cx - 3 + lean, tt + 2, cx - 5 - fl, hipY - 1, HC.hood);
      // torch arm (behind)
      const sh = [cx - 2 + lean, tt + 2], bh = [cx + o.bh[0], tt + o.bh[1]];
      p.line(sh[0], sh[1], bh[0], bh[1], HC.hoodD, 2); p.R(bh[0], bh[1], 2, 2, HC.skinD);
      const ta = o.ta == null ? -1.9 : o.ta, tx1 = bh[0] + 1 + Math.cos(ta) * 8, ty1 = bh[1] + Math.sin(ta) * 8;
      p.line(bh[0] + 1 - Math.cos(ta) * 2, bh[1] - Math.sin(ta) * 2, tx1, ty1, HC.stick); p.R(tx1 - 1, ty1 - 1, 3, 3, HC.thead); p.P(tx1, ty1 - 1, [150, 110, 80]);
      tip = [Math.round(tx1), Math.round(ty1 - 2)];
      leg(o.l1 || [-2, 0], HC.pantD, HC.pantD, true);
      // torso
      for (let y = tt; y < hipY; y++) { const off = Math.round(lean * (hipY - y) / 8); p.R(cx - 3 + off, y, 7, 1, HC.tun); p.P(cx - 3 + off, y, HC.tunD); p.P(cx + 3 + off, y, HC.tunD); if (y === tt) p.R(cx - 2 + off, y, 5, 1, mixc(HC.tun, [255, 240, 200], 0.3)); }
      { const off = Math.round(lean * 2 / 8); p.R(cx - 3 + off, hipY - 2, 7, 1, HC.belt); p.P(cx + 1 + off, hipY - 2, HC.gold); }
      leg(o.l2 || [2, 0], HC.pant, HC.pantD, false);
      // head with hood
      const hx = cx - 2 + lean + (o.headDX || 0);
      p.R(hx, ht + 1, 6, 6, HC.skin); p.R(hx, ht + 6, 6, 1, HC.skinD);
      p.R(hx - 2, ht - 1, 8, 2, HC.hood); p.R(hx - 2, ht, 3, 7, HC.hood); p.R(hx - 1, ht - 1, 6, 1, HC.hoodL); p.P(hx + 5, ht, HC.hoodD); p.R(hx - 2, ht + 5, 2, 3, HC.hoodD);
      const up = o.up ? 1 : 0;
      p.R(hx + 1, ht + 1 - up, 4, 1, HC.hair); p.P(hx + 1, ht + 2 - up, HC.hair); p.P(hx + 3, ht + 2 - up, HC.hair);
      if (o.hurt) { p.P(hx + 4, ht + 3, [30, 20, 40]); p.P(hx + 3, ht + 4, [30, 20, 40]); p.P(hx + 5, ht + 4, [30, 20, 40]); }
      else { p.R(hx + 4, ht + 3 - up, 1, 2, [30, 20, 40]); p.P(hx + 5, ht + 5 - up, HC.skinD); if (up) p.P(hx + 5, ht + 6, HC.skin); }
      p.P(hx + 3, ht + 5 - up, [246, 150, 130]);
      // scarf
      p.R(cx - 2 + lean, tt - 1, 6, 2, HC.scarf); p.R(cx - 2 + lean, tt, 6, 1, HC.scarfD);
      const sp = o.sp || 0; for (let i = 0; i < 4; i++) p.P(cx - 3 + lean - i, tt + Math.round(Math.sin(sp + i * 1.3) * (fl > 0 ? 1 : 0.4)) + (i > 1 ? 1 : 0), i & 1 ? HC.scarfD : HC.scarf);
      // sword arm (front)
      const fs = [cx + 1 + lean, tt + 2], fh = [cx + o.fh[0], tt + o.fh[1]], a = o.sa == null ? 1 : o.sa, dx = Math.cos(a), dy = Math.sin(a);
      p.line(fs[0], fs[1], fh[0], fh[1], HC.tunD, 2);
      p.line(fh[0] - dx * 2, fh[1] - dy * 2, fh[0] - dx * 3, fh[1] - dy * 3, HC.gold);
      p.line(fh[0] + dx * 2, fh[1] + dy * 2, fh[0] + dx * 12, fh[1] + dy * 12, HC.blade);
      p.line(fh[0] + dx * 3 - dy, fh[1] + dy * 3 + dx, fh[0] + dx * 10 - dy, fh[1] + dy * 10 + dx, HC.bladeD);
      p.line(fh[0] + dx * 3 + dy * 0.2, fh[1] + dy * 3 - dx * 0.2, fh[0] + dx * 9, fh[1] + dy * 9, HC.edge);
      p.line(fh[0] + dx * 1.5 - dy * 2, fh[1] + dy * 1.5 + dx * 2, fh[0] + dx * 1.5 + dy * 2, fh[1] + dy * 1.5 - dx * 2, HC.gold);
      p.R(fh[0], fh[1], 2, 2, HC.skin);
      p.outline(O);
    });
    return { ...pair(c), tip };
  }
  const B = { bh: [-5, 3], fh: [4, 6], sa: 1.05, l1: [-2, 0], l2: [2, 0] };
  const JL = { l1: [-3, 4, 2], l2: [3, 6, 2] };
  const POSES = {
    idle0: { ...B }, idle1: { ...B, bob: 1, bh: [-5, 4], fh: [4, 7], sp: 1 },
    jump: { ...B, ...JL, bh: [-5, 1], fh: [5, 3], sa: -0.4, fl: 3, lean: 1 },
    fall: { ...B, l1: [-2, 1, 1], l2: [3, 2, 1], bh: [-6, 2], fh: [5, 4], sa: 0.5, fl: -1 },
    tuck: { ...B, crouch: 1, l1: [1, 7, 3], l2: [4, 6, 3], bh: [-4, 2], fh: [5, 3], sa: 0.1, lean: 2, headDY: 1 },
    crouch: { ...B, crouch: 1, l1: [-4, 0, 2.5], l2: [4, 0, 2.5], bh: [-5, 2], fh: [6, 4], sa: 0.15, lean: 1 },
    up: { ...B, up: 1, headDY: -1, bh: [-3, -3], ta: -1.65, fh: [4, 7], sa: 1.2 },
    a0: { ...B, bh: [-5, 4], fh: [0, 0], sa: -2.3, lean: -1, l1: [-3, 0], l2: [3, 0] }, a1: { ...B, bh: [-5, 4], fh: [6, 2], sa: -0.5, lean: 2, l1: [-3, 0], l2: [4, 0], fl: 2 }, a2: { ...B, bh: [-5, 4], fh: [6, 6], sa: 0.9, lean: 2, l1: [-3, 0], l2: [4, 0], fl: 2 },
    b0: { ...B, fh: [5, 8], sa: 1.3, lean: 1, l1: [-3, 0], l2: [4, 0] }, b1: { ...B, fh: [7, 3], sa: -0.3, lean: 2, l1: [-3, 0], l2: [4, 0], fl: 2 }, b2: { ...B, fh: [4, -1], sa: -1.5, lean: 1, l1: [-3, 0], l2: [4, 0] },
    c0: { ...B, fh: [0, 5], sa: 0, lean: -1, l1: [-3, 0], l2: [3, 0] }, c1: { ...B, fh: [9, 5], sa: 0, lean: 3, l1: [-6, 0, 1], l2: [6, 0, 2], fl: 3 },
    ja0: { ...B, ...JL, bh: [-5, 3], fh: [0, 0], sa: -2.3, lean: 0, fl: 2 }, ja1: { ...B, ...JL, bh: [-5, 3], fh: [6, 2], sa: -0.5, lean: 2, fl: 3 }, ja2: { ...B, ...JL, bh: [-5, 3], fh: [6, 6], sa: 0.9, lean: 2, fl: 3 },
    dn: { ...B, l1: [0, 6, 3], l2: [3, 5, 3], fh: [2, 9], sa: 1.57, bh: [-5, 1], lean: 1, fl: -1 },
    upA: { ...B, ...JL, fh: [2, -2], sa: -1.57, bh: [-5, 4], fl: 2 },
    ca: { ...B, crouch: 1, fh: [9, 4], sa: 0.05, l1: [-4, 0, 2.5], l2: [5, 0, 2], lean: 2, bh: [-5, 2] },
    hurt: { ...B, lean: -2, bh: [-6, 0], fh: [1, 0], sa: -2, l1: [-3, 1], l2: [1, 2], headDY: 1, hurt: 1, fl: 3 },
  };
  for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2, s = Math.sin(a), c = Math.cos(a); POSES["run" + i] = { ...B, l2: [Math.round(4 * s), Math.round(Math.max(0, c) * 3), 2], l1: [Math.round(-4 * s), Math.round(Math.max(0, -c) * 3), 2], hipDY: Math.abs(s) < 0.5 ? -1 : 0, fh: [Math.round(4 - 2 * s), 6], bh: [Math.round(-5 + 1.5 * s), 3], lean: 1, sa: 0.85, fl: 2 + (i & 1), sp: i }; }
  const HERO = {}; for (const k in POSES) HERO[k] = heroFrame(POSES[k]);

  // ---------- creatures ----------
  const SPR = {};
