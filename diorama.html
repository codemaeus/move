<title>Night Alley Diorama</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #e7e3f5;
    --dim: #8f89ad;
    --ground: #0b0a16;
    --panel: #15132a;
    --line: #2e2a52;
    --warm: #ffbe73;
    --cool: #8fd8ff;
    --font: "DotGothic16", "MS Gothic", "Osaka-Mono", ui-monospace, monospace;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 15px;
    padding-inline: 16px; padding-block: 16px 24px; box-sizing: border-box; }
  .wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 22px; font-weight: 400; letter-spacing: 0.08em; color: var(--warm); }
  .sub { color: var(--dim); font-size: 13px; }
  .screen { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; background: #000; border: 1px solid var(--line); }
  #view { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  .hud { position: absolute; left: 10px; top: 8px; display: flex; gap: 10px; font-size: 13px; color: var(--warm); text-shadow: 0 0 4px #000; pointer-events: none; }
  .hud span:last-child { color: var(--cool); }
  .now { position: absolute; right: 10px; bottom: 8px; font-size: 12px; color: var(--dim); text-shadow: 0 0 4px #000; pointer-events: none; }
  .row { display: grid; grid-template-columns: 1fr minmax(0, 320px); gap: 14px; align-items: start; }
  @media (max-width: 760px) { .row { grid-template-columns: 1fr; } }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .label { color: var(--dim); font-size: 12px; letter-spacing: 0.1em; }
  button, select { font-family: var(--font); font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); padding: 6px 10px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--warm); color: var(--warm); }
  button.play { border-color: #6a4d8a; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--cool); outline-offset: 2px; }
  button:disabled { opacity: 0.5; cursor: wait; }
  input[type="range"] { accent-color: var(--warm); width: 110px; }
  .log { margin: 0; padding: 10px 12px; list-style: none; background: var(--panel); border: 1px solid var(--line); min-height: 150px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .log li { display: flex; gap: 8px; }
  .log time { color: var(--dim); font-variant-numeric: tabular-nums; flex: none; }
  .log li.wx { color: var(--cool); } .log li.ev { color: var(--warm); }
  #status { color: var(--cool); font-size: 13px; min-height: 1.2em; }
  .out { display: flex; flex-direction: column; gap: 8px; }
  .out img, .out video { max-width: 100%; image-rendering: pixelated; border: 1px solid var(--line); }
  .hint { color: var(--dim); font-size: 12px; line-height: 1.6; margin: 0; }
</style>

<div class="wrap">
  <header>
    <h1>夜の路地ジオラマ</h1>
    <span class="sub">アイソメトリック / lo-fi / 320×180 ピクセル</span>
  </header>
  <div class="screen">
    <canvas id="view" width="1280" height="720"></canvas>
    <div class="hud" aria-hidden="true"><span id="hud-t">23:12</span><span id="hud-w">晴れ</span></div>
    <div class="now" id="now" aria-hidden="true"></div>
  </div>
  <div class="row">
    <div class="controls">
      <div class="group">
        <button id="music" class="play" aria-pressed="false">音楽を流す</button>
        <label class="label" for="vol">音量</label>
        <input id="vol" type="range" min="0" max="100" value="70">
        <button id="amb" aria-pressed="true">環境音</button>
      </div>
      <div class="group" role="group" aria-label="天気">
        <span class="label">天気</span>
        <button data-w="auto" aria-pressed="true">自動</button>
        <button data-w="rain" aria-pressed="false">雨あり</button>
        <button data-w="dry" aria-pressed="false">雨なし</button>
      </div>
      <div class="group">
        <button id="pause" aria-pressed="false">一時停止</button>
        <label class="label" for="gifsec">GIF</label>
        <select id="gifsec"><option value="4">4秒</option><option value="8" selected>8秒</option><option value="12">12秒</option></select>
        <select id="gifscale" aria-label="GIFサイズ"><option value="1">320×180</option><option value="2" selected>640×360</option></select>
        <button id="gif">GIFを作る</button>
        <button id="webm">動画を録画</button>
      </div>
      <p class="hint">宙に浮かぶ小さな夜の路地。ラーメン屋の提灯、アパートの窓明かり、自販機、神社、水路の小さな滝。傘の人、猫、出前のバイク、高架を走る電車、ベランダで一服する人、風鈴、流れ星などが起こります。「音楽を流す」で lo-fi ヒップホップ（コードもドラムも毎回ブラウザで合成）と雨音・虫の声が流れます。</p>
    </div>
    <ul class="log" id="log" aria-live="polite"></ul>
  </div>
  <div id="status" role="status"></div>
  <div class="out" id="out"></div>
</div>

<script>
(() => {
  "use strict";
  const W = 320, H = 180;
  const low = document.createElement("canvas"); low.width = W; low.height = H;
  const ctx = low.getContext("2d", { willReadFrequently: true });
  ctx.imageSmoothingEnabled = false;
  const view = document.getElementById("view"), vctx = view.getContext("2d");
  vctx.imageSmoothingEnabled = false;

  // ---------- helpers ----------
  function hash(i) { let h = Math.imul((i | 0) ^ 0x9e3779b9, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
  const mod = (a, n) => ((a % n) + n) % n;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const mul = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
  const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${clamp(a, 0, 1).toFixed(3)})`;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[(Math.random() * a.length) | 0];
  function rect(x, y, w, h, c) { ctx.fillStyle = typeof c === "string" ? c : rgb(c); ctx.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h))); }
  const px = (x, y, c) => { ctx.fillStyle = typeof c === "string" ? c : rgb(c); ctx.fillRect(Math.round(x), Math.round(y), 1, 1); };
  function glow(x, y, r, c, a, sy = 1) {
    if (r < 0.5 || a <= 0.01) return;
    ctx.save(); ctx.translate(x, y); ctx.scale(1, sy);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
    g.addColorStop(0, rgba(c, a)); g.addColorStop(0.4, rgba(c, a * 0.35)); g.addColorStop(1, rgba(c, 0));
    ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = g; ctx.fillRect(-r, -r, r * 2, r * 2);
    ctx.restore();
  }

  // ---------- isometric rasteriser (pixel-exact columns) ----------
  const OX = 160, OY0 = 46, A = 8, B = 4, C = 8, N = 12;
  let OY = OY0;
  const sX = (x, y) => OX + (x - y) * A;
  const sY = (x, y, z) => OY + (x + y) * B - z * C;
  function col(x, y0, y1) { const a = Math.round(y0), b = Math.round(y1); if (b > a) ctx.fillRect(x, a, 1, b - a); }
  function top(x0, x1, y0, y1, z, c) {
    ctx.fillStyle = typeof c === "string" ? c : rgb(c);
    const L = Math.ceil(sX(x0, y1) - 0.5), R = Math.floor(sX(x1, y0) - 0.5);
    for (let s = L; s <= R; s++) {
      const u = (s + 0.5 - OX) / A;
      const lo = Math.max(2 * x0 - u, 2 * y0 + u), hi = Math.min(2 * x1 - u, 2 * y1 + u);
      if (hi > lo) col(s, OY + lo * B - z * C, OY + hi * B - z * C);
    }
  }
  function faceY(x0, x1, y, z0, z1, c) { // wall facing +y (lower-left on screen)
    ctx.fillStyle = typeof c === "string" ? c : rgb(c);
    const L = Math.ceil(sX(x0, y) - 0.5), R = Math.floor(sX(x1, y) - 0.5);
    for (let s = L; s <= R; s++) { const x = (s + 0.5 - OX) / A + y, b = OY + (x + y) * B; col(s, b - z1 * C, b - z0 * C); }
  }
  function faceX(x, y0, y1, z0, z1, c) { // wall facing +x (lower-right on screen)
    ctx.fillStyle = typeof c === "string" ? c : rgb(c);
    const L = Math.ceil(sX(x, y1) - 0.5), R = Math.floor(sX(x, y0) - 0.5);
    for (let s = L; s <= R; s++) { const y = x - (s + 0.5 - OX) / A, b = OY + (x + y) * B; col(s, b - z1 * C, b - z0 * C); }
  }
  function box(x0, y0, z0, w, d, h, c, k = [1, 0.72, 0.52]) {
    top(x0, x0 + w, y0, y0 + d, z0 + h, lit(mul(c, k[0]), 1));
    faceY(x0, x0 + w, y0 + d, z0, z0 + h, lit(mul(c, k[1]), 0));
    faceX(x0 + w, y0, y0 + d, z0, z0 + h, lit(mul(c, k[2]), 0));
  }

  // ---------- state ----------
  const S = {
    time: 0, weather: "auto", rain: 0, wet: 0, flash: 0, bolt: null,
    drops: [], splashes: [], ripples: [], puffs: [], flies: [], events: [], nextEvent: 3, nextWalker: 2,
    windows: {}, lastWx: 0, paused: false, dither: true, shoot: null, train: null, balcony: 0, chime: 0,
  };
  const lit = (c, isTop) => (isTop && S.wet > 0 ? mix(c, [c[0] * 0.7, c[1] * 0.72, c[2] * 0.85], S.wet * 0.6) : c);

  // windows of the apartment: lit / dark / tv
  const APT_WIN = [];
  for (let f = 0; f < 3; f++) for (let i = 0; i < 3; i++) APT_WIN.push({ face: "y", f, i, on: Math.random() < 0.6, tv: Math.random() < 0.25 });
  for (let f = 0; f < 3; f++) for (let i = 0; i < 2; i++) APT_WIN.push({ face: "x", f, i, on: Math.random() < 0.5, tv: false });

  // ---------- log ----------
  const logEl = document.getElementById("log"), nowEl = document.getElementById("now");
  const clock = () => { const m = 23 * 60 + 12 + Math.floor(S.time / 15); return `${String(Math.floor(m / 60) % 24).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`; };
  function log(msg, cls = "ev") {
    const li = document.createElement("li"); li.className = cls;
    const t = document.createElement("time"); t.textContent = clock();
    const sp = document.createElement("span"); sp.textContent = msg;
    li.append(t, sp); logEl.prepend(li);
    while (logEl.children.length > 8) logEl.lastChild.remove();
  }

  // ---------- height map for rain ----------
  function surfaceZ(x, y) {
    if (x > 0.5 && x < 4.5 && y > 0.5 && y < 3.5) return 4.4;
    if (x > 5.5 && x < 9.5 && y > 0.5 && y < 3) return 3.1;
    if (x > 0.6 && x < 2.6 && y > 7.6 && y < 10.2) return 2.2;
    if (y > 10.8) return -0.45;
    return 0;
  }
  const isWater = (x, y) => y > 10.8;
  const isRoad = (x, y) => (y > 3.6 && y < 5.4) || (x > 5 && x < 6.6 && y > 5.4 && y < 10.8);

  // ---------- weather ----------
  function weatherTarget() {
    if (S.weather === "rain") return 0.8;
    if (S.weather === "dry") return 0;
    const c = S.time % 100;
    return c < 35 ? 0 : c < 42 ? (c - 35) / 7 * 0.85 : c < 85 ? 0.85 + 0.15 * Math.sin(S.time * 0.05) : Math.max(0, 0.85 - (c - 85) / 6);
  }

  // ---------- events ----------
  const LOOKS = [
    { coat: [70, 80, 110], pants: [40, 40, 50], hair: [20, 18, 18] },
    { coat: [150, 60, 70], pants: [50, 45, 60], hair: [60, 40, 30], long: true },
    { coat: [200, 190, 170], pants: [50, 50, 60], hair: [30, 24, 20] },
    { coat: [60, 100, 90], pants: [40, 40, 44], hair: [15, 15, 15], bag: true },
    { coat: [220, 160, 80], pants: [60, 55, 70], hair: [40, 30, 26], long: true },
  ];
  const UMB = [[220, 220, 235], [200, 70, 90], [70, 110, 200], [240, 200, 80], [90, 160, 120]];
  const PATH_ALLEY = { from: [0.2, 4.5], to: [11.8, 4.5] };
  const PATH_LANE = { from: [5.8, 5.4], to: [5.8, 11.9] };
  function addEv(e) { e.t = 0; S.events.push(e); return e; }
  const active = t => S.events.some(e => e.type === t);
  function walker(kind = "walker", path = Math.random() < 0.7 ? PATH_ALLEY : PATH_LANE, rev = Math.random() < 0.5) {
    const [a, b] = rev ? [path.to, path.from] : [path.from, path.to];
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const v = kind === "scooter" ? 3.2 : kind === "dog" ? 0.9 : 0.8 + Math.random() * 0.3;
    return addEv({ type: kind, a, b, len, v, look: pick(LOOKS), umb: pick(UMB), p: 0, stop: null });
  }
  function spawnSpecial(t) {
    switch (t) {
      case "cat": { const e = addEv({ type: "cat", x: 12, y: 6.2, tx: 8.4, ty: 9.3, sit: 0, mode: "in" }); log("猫がやってきて、ベンチの下で丸くなった"); sfx("meow"); break; }
      case "scooter": walker("scooter", PATH_ALLEY); log("出前のバイクが通りすぎていく"); sfx("scooter"); break;
      case "train": S.train = { x: -200, dir: 1, t: 0 }; log("うしろの高架を最終電車が走っていく"); sfx("train"); break;
      case "balcony": S.balcony = 18; log("ベランダで誰かが一服している"); break;
      case "ramen": { const e = walker("walker", PATH_ALLEY, false); e.stop = { at: 0.6, what: "ramen" }; log("ラーメン屋にお客さんが入っていく"); break; }
      case "vending": { const e = walker("walker", PATH_LANE, false); e.stop = { at: 0.08, what: "vend", wait: 2.2 }; log("自販機で飲み物を買う人"); break; }
      case "dog": walker("dog", PATH_ALLEY); log("犬の散歩をしている人が通る"); break;
      case "chime": S.chime = 3; log("風鈴がちりんと鳴った"); sfx("chime"); break;
      case "shooting": S.shoot = { t: 0, x: rnd(60, 280), y: rnd(8, 24) }; log("流れ星が見えた"); break;
      case "lights": { const w = pick(APT_WIN); w.on = !w.on; log(w.on ? "アパートの窓に明かりがついた" : "アパートの窓の明かりが消えた"); sfx("click"); break; }
      case "fireworks": addEv({ type: "fw", parts: [], next: 0, dur: 9 }); log("遠くで小さく花火が上がった"); break;
    }
  }
  function trySpecial() {
    const dry = S.rain < 0.1;
    const c = [["cat", 2.5], ["scooter", 2], ["train", 2.5], ["balcony", 1.5], ["ramen", 2], ["vending", 2], ["dog", dry ? 1.5 : 0.4], ["lights", 2],
      ["chime", dry ? 1.5 : 0], ["shooting", dry ? 1.2 : 0], ["fireworks", dry ? 0.6 : 0]].filter(([t, w]) => w > 0 &&
      !(t === "cat" && active("cat")) && !(t === "train" && S.train) && !(t === "balcony" && S.balcony > 0) && !(t === "fireworks" && active("fw")));
    let r = Math.random() * c.reduce((a, x) => a + x[1], 0), t = c[0][0];
    for (const [n, w] of c) if ((r -= w) <= 0) { t = n; break; }
    spawnSpecial(t);
  }

  // ---------- update ----------
  function step(dt) {
    S.time += dt;
    const target = weatherTarget();
    S.rain += (target - S.rain) * Math.min(1, dt * 0.5);
    S.wet = S.rain > 0.1 ? Math.min(1, S.wet + dt * 0.08) : Math.max(0, S.wet - dt * 0.02);
    if (S.lastWx === 0 && S.rain > 0.2) { S.lastWx = 1; log("ぽつぽつと雨が降ってきた", "wx"); }
    else if (S.lastWx === 1 && S.rain < 0.08) { S.lastWx = 0; log("雨があがった。水たまりに灯りが映る", "wx"); }
    OY = OY0 + Math.round(Math.sin(S.time * 0.6) * 1.2);

    // rain drops aimed at a point of the diorama (or the void around it)
    const want = Math.round(S.rain * 220);
    while (S.drops.length < want) S.drops.push(newDrop(true));
    if (S.drops.length > want) S.drops.length = want;
    for (let i = 0; i < S.drops.length; i++) {
      const d = S.drops[i];
      d.y += d.v * dt; d.x += d.v * 0.12 * dt;
      if (d.y >= d.ty) {
        if (d.hit) {
          S.splashes.push({ x: d.tx, y: d.ty, t: 0 });
          if (d.water || (d.road && S.wet > 0.4 && Math.random() < 0.5)) S.ripples.push({ x: d.tx, y: d.ty, t: 0 });
        }
        S.drops[i] = newDrop(false);
      }
    }
    for (const arr of [S.splashes, S.ripples]) for (let i = arr.length - 1; i >= 0; i--) { arr[i].t += dt; if (arr[i].t > (arr === S.ripples ? 0.9 : 0.18)) arr.splice(i, 1); }
    // thunder in heavy rain
    S.flash = Math.max(0, S.flash - dt * 2.5);
    if (S.rain > 0.9 && Math.random() < dt * 0.04) {
      S.flash = 1; const b = []; let x = rnd(20, 300), y = 0; while (y < 60) { b.push([x, y]); x += rnd(-6, 6); y += rnd(3, 6); } S.bolt = { pts: b, t: 0 };
      log("遠くで雷が光った", "wx"); setTimeout(() => sfx("thunder"), 700);
    }
    if (S.bolt) { S.bolt.t += dt; if (S.bolt.t > 0.2) S.bolt = null; }
    // fireflies when dry
    const wantFlies = S.rain < 0.1 ? 14 : 0;
    while (S.flies.length < wantFlies) S.flies.push({ x: rnd(6.8, 11.5), y: rnd(6, 10.6), z: rnd(0.3, 2.5), ph: rnd(0, 6) });
    if (S.flies.length > wantFlies) S.flies.length = wantFlies;
    for (const f of S.flies) { f.x += Math.sin(S.time * 0.7 + f.ph) * dt * 0.3; f.y += Math.cos(S.time * 0.5 + f.ph * 2) * dt * 0.3; f.z += Math.sin(S.time + f.ph) * dt * 0.2; }
    // ramen steam, chimney smoke
    if (Math.random() < dt * 5) S.puffs.push({ x: 8.6, y: 1.2, z: 3.6, t: 0, life: 2.5 });
    if (S.balcony > 0 && Math.random() < dt * 1.5) S.puffs.push({ x: 2.3, y: 3.7, z: 3.2, t: 0, life: 2 });
    for (let i = S.puffs.length - 1; i >= 0; i--) { const p = S.puffs[i]; p.t += dt; p.z += dt * 0.6; p.x += dt * 0.15; if (p.t > p.life) S.puffs.splice(i, 1); }
    S.balcony = Math.max(0, S.balcony - dt); S.chime = Math.max(0, S.chime - dt);
    if (S.shoot) { S.shoot.t += dt; if (S.shoot.t > 0.8) S.shoot = null; }
    if (S.train) { S.train.x += 150 * dt; if (S.train.x > 520) S.train = null; }
    for (const w of APT_WIN) if (w.tv) w.flick = 0.6 + 0.4 * Math.sin(S.time * 13 + w.i) * Math.sin(S.time * 3.1);

    // events
    S.nextEvent -= dt; if (S.nextEvent <= 0) { S.nextEvent = rnd(5, 10); trySpecial(); }
    S.nextWalker -= dt; if (S.nextWalker <= 0) { S.nextWalker = rnd(5, 11); walker(); }
    for (let i = S.events.length - 1; i >= 0; i--) {
      const e = S.events[i]; e.t += dt;
      if (e.type === "walker" || e.type === "scooter" || e.type === "dog") {
        if (e.stop && e.p >= e.stop.at && !e.stop.done) {
          e.waitT = (e.waitT || 0) + dt;
          if (e.stop.what === "ramen" && e.waitT > 0.6) { e.stop.done = true; S.events.splice(i, 1); sfx("door"); continue; }
          if (e.stop.what === "vend") { if (!e.stop.clunk && e.waitT > 1.2) { e.stop.clunk = true; sfx("clunk"); } if (e.waitT > e.stop.wait) e.stop.done = true; }
          continue;
        }
        e.p += e.v * dt / e.len;
        if (e.p >= 1) S.events.splice(i, 1);
      } else if (e.type === "cat") {
        if (e.mode === "in") { const dx = e.tx - e.x, dy = e.ty - e.y, d = Math.hypot(dx, dy); if (d < 0.05) { e.mode = "sit"; e.sitT = 0; } else { e.x += dx / d * 0.7 * dt; e.y += dy / d * 0.7 * dt; } }
        else if (e.mode === "sit") { e.sitT += dt; if (e.sitT > 16) { e.mode = "out"; e.tx = 3.2; e.ty = 6.8; } }

      case "chime": for (let i = 0; i < 4; i++) { const g = envG(t0 + i * 0.18, 0.002, 0.05, 1.6, m); osc("sine", pick([2637, 3136, 3520, 2794]), t0 + i * 0.18, 1.6, g, false); } break;
      case "click": noiseHit(t0, "highpass", 3000, 1, 0.01, 0.05, m); break;
      case "thunder": { const s = ac.createBufferSource(); s.buffer = Snd.n.pink; const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.setValueAtTime(900, t0); f.frequency.exponentialRampToValueAtTime(120, t0 + 3); const g = envG(t0, 0.05, 0.5, 3.5, m); s.connect(f); f.connect(g); s.start(t0); s.stop(t0 + 3.6); break; }
      case "pop": noiseHit(t0 + 0.4, "lowpass", 600, 0.7, 0.4, 0.08, m); break;
    }
  }

  // ---------- GIF ----------
  const PALETTE = new Uint8Array(768);
  for (let i = 0; i < 216; i++) { PALETTE[i * 3] = LEVELS[(i / 36) | 0]; PALETTE[i * 3 + 1] = LEVELS[((i / 6) | 0) % 6]; PALETTE[i * 3 + 2] = LEVELS[i % 6]; }
  function lzw(ix, out) {
    let size = 9, next = 258, cur = 0, bits = 0; const dict = new Map(), bytes = [];
    const emit = c => { cur |= c << bits; bits += size; while (bits >= 8) { bytes.push(cur & 255); cur >>>= 8; bits -= 8; } };
    emit(256); let prefix = ix[0];
    for (let i = 1; i < ix.length; i++) {
      const k = ix[i], key = prefix * 256 + k, v = dict.get(key);
      if (v !== undefined) { prefix = v; continue; }
      emit(prefix);
      if (next < 4095) { dict.set(key, next++); if (next > (1 << size) && size < 12) size++; } else { emit(256); dict.clear(); size = 9; next = 258; }
      prefix = k;
    }
    emit(prefix); emit(257); if (bits > 0) bytes.push(cur & 255);
    out.push(8);
    for (let i = 0; i < bytes.length; i += 255) { const n = Math.min(255, bytes.length - i); out.push(n); for (let j = 0; j < n; j++) out.push(bytes[i + j]); }
    out.push(0);
  }
  function upscale(ix, k) {
    if (k === 1) return ix.slice();
    const w = W * k, o = new Uint8Array(w * H * k);
    for (let y = 0; y < H * k; y++) { const sy = ((y / k) | 0) * W, row = y * w; for (let x = 0; x < w; x++) o[row + x] = ix[sy + ((x / k) | 0)]; }
    return o;
  }
  async function makeGif(seconds = 8, scale = 2, fps = 20, onProgress) {
    const n = Math.round(seconds * fps), w = W * scale, h = H * scale, delay = Math.round(100 / fps);
    const out = []; for (const ch of "GIF89a") out.push(ch.charCodeAt(0));
    out.push(w & 255, w >> 8, h & 255, h >> 8, 0xf7, 0, 0); for (let i = 0; i < 768; i++) out.push(PALETTE[i]);
    out.push(0x21, 0xff, 0x0b); for (const ch of "NETSCAPE2.0") out.push(ch.charCodeAt(0)); out.push(3, 1, 0, 0, 0);
    for (let i = 0; i < n; i++) {
      const ix = frame(1 / fps);
      out.push(0x21, 0xf9, 4, 4, delay & 255, delay >> 8, 0, 0, 0x2c, 0, 0, 0, 0, w & 255, w >> 8, h & 255, h >> 8, 0);
      lzw(upscale(ix, scale), out);
      if (i % 4 === 3) { onProgress && onProgress(i + 1, n); await new Promise(r => setTimeout(r, 0)); }
    }
    out.push(0x3b); return new Uint8Array(out);
  }

  // ---------- UI ----------
  let last = performance.now();
  function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; if (!S.paused && !busy) frame(dt); requestAnimationFrame(loop); }
  const status = document.getElementById("status"), out = document.getElementById("out");
  const mBtn = document.getElementById("music");
  mBtn.addEventListener("click", async () => {
    if (!Snd.ac && !audioInit()) { status.textContent = "このブラウザでは音を鳴らせません。"; return; }
    Snd.on = !Snd.on;
    if (Snd.on) { await Snd.ac.resume(); Snd.nextStep = Snd.ac.currentTime + 0.1; } else { await Snd.ac.suspend(); nowEl.textContent = ""; }
    mBtn.setAttribute("aria-pressed", String(Snd.on)); mBtn.textContent = Snd.on ? "音楽を止める" : "音楽を流す";
  });
  document.getElementById("vol").addEventListener("input", e => { Snd.vol = e.target.value / 100; if (Snd.n) Snd.n.master.gain.setTargetAtTime(Snd.vol, Snd.ac.currentTime, 0.05); });
  const aBtn = document.getElementById("amb");
  aBtn.addEventListener("click", () => { Snd.amb = !Snd.amb; aBtn.setAttribute("aria-pressed", String(Snd.amb)); });
  const wButtons = [...document.querySelectorAll("[data-w]")];
  wButtons.forEach(b => b.addEventListener("click", () => { S.weather = b.dataset.w; wButtons.forEach(x => x.setAttribute("aria-pressed", String(x === b))); }));
  const pBtn = document.getElementById("pause");
  function togglePause() { S.paused = !S.paused; pBtn.setAttribute("aria-pressed", String(S.paused)); pBtn.textContent = S.paused ? "再生" : "一時停止"; }
  pBtn.addEventListener("click", togglePause);
  window.addEventListener("keydown", e => { if (e.code === "Space" && e.target === document.body) { e.preventDefault(); togglePause(); } });
  const gifBtn = document.getElementById("gif");
  gifBtn.addEventListener("click", async () => {
    busy = true; gifBtn.disabled = true;
    try {
      const bytes = await makeGif(+document.getElementById("gifsec").value, +document.getElementById("gifscale").value, 20, (i, n) => { status.textContent = `GIF 生成中… ${i}/${n} フレーム`; });
      const img = new Image(); img.src = URL.createObjectURL(new Blob([bytes], { type: "image/gif" })); img.alt = "書き出したジオラマGIF"; out.prepend(img);
      status.textContent = `GIF ができました（${(bytes.length / 1048576).toFixed(1)} MB）。右クリック／長押しで保存できます。`;
    } catch (err) { status.textContent = `GIF の生成に失敗しました: ${err.message}`; }
    finally { busy = false; gifBtn.disabled = false; last = performance.now(); }
  });
  const webmBtn = document.getElementById("webm"); let rec = null;
  webmBtn.addEventListener("click", () => {
    if (rec) { rec.stop(); return; }
    if (!view.captureStream || typeof MediaRecorder === "undefined") { status.textContent = "このブラウザは動画録画に対応していません。GIF をお使いください。"; return; }
    const chunks = [], type = ["video/webm;codecs=vp9", "video/webm", "video/mp4"].find(t => MediaRecorder.isTypeSupported(t)) || "";
    rec = new MediaRecorder(view.captureStream(30), type ? { mimeType: type, videoBitsPerSecond: 8e6 } : undefined);
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => {
      const v = document.createElement("video"); v.src = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType || "video/webm" }));
      v.controls = v.loop = v.muted = v.autoplay = true; out.prepend(v);
      status.textContent = "録画しました（映像のみ）。動画の右クリック／長押しで保存できます。"; rec = null; webmBtn.textContent = "動画を録画";
    };
    rec.start(); webmBtn.textContent = "録画を止める"; status.textContent = "録画中… もう一度押すと停止します。";
  });

  log("夜の路地。今夜はなんだか静かだ", "wx");
  for (let i = 0; i < 20; i++) step(1 / 30);
  window.Dio = { S, frame, makeGif, spawnSpecial, walker };
  requestAnimationFrame(loop);
})();
</script>
