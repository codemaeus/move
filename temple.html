<title>Temple Hall Hours</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Yuji+Syuku&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #f1ebdf;
    --dim: #a59a86;
    --ground: #120f0c;
    --panel: #1d1812;
    --line: #463a2a;
    --gold: #e9c26a;
    --moss: #a8c79a;
    --font: "DotGothic16", "MS Gothic", "Osaka-Mono", ui-monospace, monospace;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 15px;
    padding-inline: 16px; padding-block: 16px 24px; box-sizing: border-box; }
  .wrap { max-width: 1040px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 480px) 1fr; gap: 18px; align-items: start; }
  @media (max-width: 800px) { .wrap { grid-template-columns: 1fr; } }
  .screen { position: relative; width: 100%; aspect-ratio: 4 / 5; max-width: 100%; background: #000; border: 1px solid var(--line); }
  #view { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  .hud { position: absolute; left: 10px; bottom: 8px; display: flex; gap: 10px; font-size: 13px; color: var(--gold); text-shadow: 0 0 4px #000; pointer-events: none; }
  .hud span:last-child { color: var(--moss); }
  .side { display: flex; flex-direction: column; gap: 12px; }
  h1 { margin: 0; font-size: 22px; font-weight: 400; letter-spacing: 0.08em; color: var(--gold); }
  .sub { color: var(--dim); font-size: 13px; margin: 4px 0 0; }
  .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .label { color: var(--dim); font-size: 12px; letter-spacing: 0.1em; }
  button, select { font-family: var(--font); font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); padding: 6px 10px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  button.play { border-color: #7a5a2a; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--moss); outline-offset: 2px; }
  button:disabled { opacity: 0.5; cursor: wait; }
  input[type="range"] { accent-color: var(--gold); width: 110px; }
  .log { margin: 0; padding: 10px 12px; list-style: none; background: var(--panel); border: 1px solid var(--line); min-height: 170px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .log li { display: flex; gap: 8px; }
  .log time { color: var(--dim); font-variant-numeric: tabular-nums; flex: none; }
  .log li.wx { color: var(--moss); } .log li.yo { color: #d9a0ff; }
  #status { color: var(--moss); font-size: 13px; min-height: 1.2em; }
  .out { display: flex; flex-direction: column; gap: 8px; }
  .out img, .out video { max-width: 100%; image-rendering: pixelated; border: 1px solid var(--line); }
  .hint { color: var(--dim); font-size: 12px; line-height: 1.6; margin: 0; }
</style>

<div class="wrap">
  <div class="screen">
    <canvas id="view" width="1024" height="1280"></canvas>
    <div class="hud" aria-hidden="true"><span id="hud-t">夜</span><span id="hud-w">晴れ</span></div>
  </div>
  <div class="side">
    <div>
      <h1>本堂の刻</h1>
      <p class="sub">山寺の本堂 / 256×320 ピクセル / 昼と夜</p>
    </div>
    <div class="group">
      <button id="music" class="play" aria-pressed="false">音を出す</button>
      <label class="label" for="vol">音量</label>
      <input id="vol" type="range" min="0" max="100" value="70">
      <button id="bgm" aria-pressed="true">お囃子（音楽）</button>
    </div>
    <div class="group" role="group" aria-label="時間">
      <span class="label">時間</span>
      <button data-t="auto" aria-pressed="true">自動</button>
      <button data-t="0.2" aria-pressed="false">昼</button>
      <button data-t="0.45" aria-pressed="false">夕</button>
      <button data-t="0.7" aria-pressed="false">夜</button>
    </div>
    <div class="group" role="group" aria-label="天気">
      <span class="label">天気</span>
      <button data-w="auto" aria-pressed="true">自動</button>
      <button data-w="rain" aria-pressed="false">雨あり</button>
      <button data-w="dry" aria-pressed="false">雨なし</button>
    </div>
    <div class="group" role="group" aria-label="出来事を起こす">
      <span class="label">出来事</span>
      <button data-ev="tanuki">分福茶釜</button>
      <button data-ev="mochi">餅</button>
      <button data-ev="mokugyo">木魚</button>
      <button data-ev="bell">鐘</button>
      <button data-ev="incense">お香</button>
      <button data-ev="yokai">妖怪</button>
    </div>
    <div class="group">
      <button id="pause" aria-pressed="false">一時停止</button>
      <label class="label" for="gifsec">GIF</label>
      <select id="gifsec"><option value="4">4秒</option><option value="8" selected>8秒</option><option value="12">12秒</option></select>
      <select id="gifscale" aria-label="GIFサイズ"><option value="1">256×320</option><option value="2" selected>512×640</option></select>
      <button id="gif">GIFを作る</button>
      <button id="webm">動画を録画</button>
    </div>
    <ul class="log" id="log" aria-live="polite"></ul>
    <p class="hint">金色の須弥壇と仏さま、吊り灯籠、法要の提灯、香炉から立ちのぼる線香の煙。右の縁側の向こうには庭と鐘楼と鹿威し。和尚が木魚をポクポク叩き、小僧が習字をし、分福茶釜の狸が踊り、唐傘お化けや提灯お化け、座敷わらしがときどき現れます。夜は庭にホタル、昼は雀と縁側の猫。音楽は箏と尺八と笙のような響きを毎回その場で合成しています。</p>
    <div id="status" role="status"></div>
    <div class="out" id="out"></div>
  </div>
</div>

<script>
(() => {
  "use strict";
  const W = 256, H = 320;
  const low = document.createElement("canvas"); low.width = W; low.height = H;
  const ctx = low.getContext("2d", { willReadFrequently: true });
  ctx.imageSmoothingEnabled = false;
  const view = document.getElementById("view"), vctx = view.getContext("2d");
  vctx.imageSmoothingEnabled = false;
  const KFONT = '"Yuji Syuku", "DotGothic16", "Hiragino Mincho ProN", serif';
  const PFONT = '"DotGothic16", "MS Gothic", monospace';
  if (document.fonts && document.fonts.load) { document.fonts.load(`20px ${KFONT}`).catch(() => {}); document.fonts.load(`10px ${PFONT}`).catch(() => {}); }

  // ---------- helpers ----------
  function hash(i) { let h = Math.imul((i | 0) ^ 0x9e3779b9, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
  const mod = (a, n) => ((a % n) + n) % n;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const mul = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
  const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${clamp(a, 0, 1).toFixed(3)})`;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[(Math.random() * a.length) | 0];
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  function rect(x, y, w, h, c) { ctx.fillStyle = typeof c === "string" ? c : rgb(c); ctx.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h))); }
  const px = (x, y, c) => { ctx.fillStyle = typeof c === "string" ? c : rgb(c); ctx.fillRect(Math.round(x), Math.round(y), 1, 1); };
  function disc(x, y, rx, ry, c) { ctx.fillStyle = typeof c === "string" ? c : rgb(c); for (let dy = -ry; dy <= ry; dy++) { const w = Math.round(rx * Math.sqrt(Math.max(0, 1 - (dy / (ry + 0.5)) ** 2))); ctx.fillRect(Math.round(x - w), Math.round(y + dy), w * 2 + 1, 1); } }
  function line(x0, y0, x1, y1, c, t = 1) { ctx.fillStyle = typeof c === "string" ? c : rgb(c); const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) | 0; for (let i = 0; i <= n; i++) { const f = n ? i / n : 0; ctx.fillRect(Math.round(lerp(x0, x1, f)), Math.round(lerp(y0, y1, f)), t, t); } }
  function glow(x, y, r, c, a) {
    if (a <= 0.01) return;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, rgba(c, a)); g.addColorStop(0.4, rgba(c, a * 0.35)); g.addColorStop(1, rgba(c, 0));
    const p = ctx.globalCompositeOperation; ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.globalCompositeOperation = p;
  }
  function kanji(str, x, y, size, c, vertical = false) {
    ctx.fillStyle = typeof c === "string" ? c : rgb(c); ctx.font = `${size}px ${KFONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if (vertical) [...str].forEach((ch, i) => ctx.fillText(ch, x, y + i * size * 1.05)); else ctx.fillText(str, x, y);
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  }

  // ---------- state ----------
  const S = {
    time: 0, tod: 0.62, todMode: "auto", weather: "auto", rain: 0, lastWx: 0, lastPhase: "",
    events: [], nextEvent: 5, smoke: [], flies: [], drops: [], ripples: [], birds: [], words: [],
    monk: { mode: "idle", t: 0, arm: 0 }, novice: { mode: "write", t: 0, char: "夢", brush: 0 },
    tanuki: 0, lantern: 0, umbrella: null, warashi: 0, mochi: 3, bell: 0, shishi: 0, shishiT: 6, incense: 0, cat: 0, paused: false,
  };
  const logEl = document.getElementById("log");
  const clock = () => { const m = Math.floor(mod(S.tod * 1440 + 360, 1440)); return `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`; };
  function log(msg, cls = "") {
    const li = document.createElement("li"); li.className = cls;
    const t = document.createElement("time"); t.textContent = clock();
    const sp = document.createElement("span"); sp.textContent = msg;
    li.append(t, sp); logEl.prepend(li);
    while (logEl.children.length > 9) logEl.lastChild.remove();
  }
  function word(str, x, y, c = [255, 240, 200], life = 1.1) { S.words.push({ str, x, y, c, t: 0, life }); }
  const night = () => smooth(0.4, 0.55, S.tod) * (1 - smooth(0.9, 1.0, S.tod));
  const dusk = () => Math.max(0, 1 - Math.abs(S.tod - 0.47) / 0.07);

  // ---------- layout ----------
  const OPEN = { x0: 194, x1: 256, y0: 82, y1: 226 }; // open shoji to the garden
  const CENSER = { x: 72, y: 250 }, KETTLE = { x: 118, y: 300 }, MOKU = { x: 138, y: 204 }, RIN = { x: 120, y: 206 };
  const MONK = { x: 160, y: 232 }, NOVICE = { x: 232, y: 300 }, OFFER = { x: 182, y: 214 };

  // ---------- events ----------
  function startEvent(kind) {
    switch (kind) {
      case "tanuki": if (S.tanuki > 0) return; S.tanuki = 14; log("茶釜から しっぽが…！ 分福茶釜の狸が踊りだした", "yo"); sfx("poof"); break;
      case "mochi": if (S.monk.mode !== "idle" || S.mochi <= 0) { if (S.mochi <= 0) { S.mochi = 3; log("小僧が お供えのお餅を並べなおした"); } return; } S.monk.mode = "mochi"; S.monk.t = 0; S.novice.mode = "doze"; S.novice.t = 0; log("小僧がうとうとしている隙に、和尚がそっとお供えの餅を…"); break;
      case "mokugyo": if (S.monk.mode !== "idle") return; S.monk.mode = "chant"; S.monk.t = 0; sfx("rin"); word("チーン", RIN.x, RIN.y - 14, [255, 240, 170]); log("和尚が木魚を叩き、お経をあげはじめた"); break;
      case "bell": S.bell = 9; sfx("bell"); log("鐘楼の鐘が ゴーン… と鳴った"); word("ゴーン…", 226, 104, [230, 230, 255], 2.5); break;
      case "incense": S.incense = 10; log("小僧が 香炉にお香をくべた。白檀の香りがひろがる"); sfx("tap"); break;
      case "yokai": startEvent(pick(S.rain > 0.2 ? ["umbrella", "umbrella", "lantern", "warashi"] : ["lantern", "warashi", "umbrella"])); break;
      case "umbrella": if (S.umbrella) return; S.umbrella = { x: 250, y: 238, t: 0 }; log("唐傘お化けが 縁側からぴょんぴょん跳ねてきた", "yo"); sfx("boing"); break;
      case "lantern": if (S.lantern > 0) return; S.lantern = 9; log("法要の提灯が べろんと舌を出した… 提灯お化けだ", "yo"); sfx("giggle"); break;
      case "warashi": if (S.warashi > 0) return; S.warashi = 8; log("柱のかげから 座敷わらしがこちらをのぞいている", "yo"); sfx("giggle"); break;
      case "cat": S.cat = 16; log("縁側で 寺の猫が丸くなって昼寝している"); break;
      case "write": S.novice.char = pick(["夢", "和", "空", "寿", "福", "心", "花", "風"]); S.novice.mode = "show"; S.novice.t = 0; log(`小僧が「${S.novice.char}」の字を書きあげた`); break;
      case "wind": sfx("furin"); log("風が通り、軒の風鈴がちりんと鳴った"); S.furin = 2; break;
    }
  }
  function trySpecial() {
    const n = night(), rain = S.rain > 0.2;
    const c = [["tanuki", 2], ["mochi", 2], ["mokugyo", 2.5], ["bell", 1.4], ["incense", 1.6], ["umbrella", rain ? 2.5 : 0.6], ["lantern", n > 0.5 ? 2 : 0.5],
      ["warashi", 1.3], ["cat", n < 0.5 && !rain ? 1.8 : 0], ["write", 1.5], ["wind", rain ? 0.3 : 1.2]].filter(x => x[1] > 0);
    let r = Math.random() * c.reduce((a, x) => a + x[1], 0), t = c[0][0];
    for (const [k, w] of c) if ((r -= w) <= 0) { t = k; break; }
    startEvent(t);
  }

  // ---------- update ----------
  function weatherTarget() {
    if (S.weather === "rain") return 0.8;
    if (S.weather === "dry") return 0;
    const c = S.time % 130; return c < 60 ? 0 : c < 66 ? (c - 60) / 6 * 0.8 : c < 112 ? 0.8 : Math.max(0, 0.8 - (c - 112) / 6);
  }
  function step(dt) {
    S.time += dt;
    if (S.todMode === "auto") S.tod = mod(S.tod + dt / 200, 1);
    S.rain += (weatherTarget() - S.rain) * Math.min(1, dt * 0.5);
    if (S.lastWx === 0 && S.rain > 0.2) { S.lastWx = 1; log("庭に雨が降りはじめた。軒から雨だれが落ちる", "wx"); }
    else if (S.lastWx === 1 && S.rain < 0.08) { S.lastWx = 0; log("雨があがり、苔の匂いがする", "wx"); }
    const phase = S.tod < 0.4 ? "day" : S.tod < 0.5 ? "dusk" : S.tod < 0.9 ? "night" : "dawn";
    if (phase !== S.lastPhase) {
      if (S.lastPhase) log({ day: "日が高くなり、本堂に光が差しこむ", dusk: "夕暮れ。ヒグラシがカナカナと鳴く", night: "日が暮れ、灯籠に火がともった", dawn: "夜が白みはじめた" }[phase], "wx");
      if (phase === "dusk" && S.lastPhase) startEvent("bell");
      S.lastPhase = phase;
    }
    // incense smoke from the censer and the altar sticks
    const rate = 4 + (S.incense > 0 ? 10 : 0);
    if (Math.random() < dt * rate) S.smoke.push({ x: CENSER.x + rnd(-2, 2), y: CENSER.y - 8, t: 0, life: rnd(4, 6), ph: rnd(0, 6), big: S.incense > 0 });
    if (Math.random() < dt * 2) S.smoke.push({ x: 88 + rnd(-1, 1), y: 150, t: 0, life: 3, ph: rnd(0, 6), thin: true });
    for (let i = S.smoke.length - 1; i >= 0; i--) { const p = S.smoke[i]; p.t += dt; p.y -= dt * (p.thin ? 9 : 14); p.x += Math.sin(p.t * 1.6 + p.ph) * dt * (4 + p.t * 3); if (p.t > p.life) S.smoke.splice(i, 1); }
    S.incense = Math.max(0, S.incense - dt);
    // monk
    const m = S.monk; m.t += dt;
    if (m.mode === "chant") {
      const beat = Math.floor(m.t / 0.48), prev = Math.floor((m.t - dt) / 0.48);
      m.arm = mod(m.t, 0.48) < 0.12 ? 1 : 0;
      if (beat !== prev && m.t < 12) { sfx("moku"); if (beat % 2 === 0) word("ポク", MOKU.x + rnd(-3, 3), MOKU.y - 12, [255, 230, 190], 0.6); }
      if (m.t > 12.5) { m.mode = "idle"; m.t = 0; sfx("rin"); word("チーン", RIN.x, RIN.y - 14, [255, 240, 170]); }
    } else if (m.mode === "mochi") {
      if (m.t > 1.2 && m.t - dt <= 1.2) { S.mochi = Math.max(0, S.mochi - 1); sfx("munch"); }
      if (m.t > 4.2 && m.t - dt <= 4.2) { S.novice.mode = "look"; S.novice.t = 0; }
      if (m.t > 4.4 && m.t - dt <= 4.4) { m.mode = "fake"; m.t = 0; log("小僧が顔を上げた！ 和尚は何食わぬ顔で合掌…（ほっぺがふくらんでいる）"); }
    } else if (m.mode === "fake") { if (m.t > 3.5) { m.mode = "idle"; m.t = 0; S.novice.mode = "write"; } }
    // novice
    const nv = S.novice; nv.t += dt;
    if (nv.mode === "write") nv.brush = Math.sin(S.time * 3);
    if (nv.mode === "doze" && m.mode !== "mochi") { nv.mode = "write"; }
    if (nv.mode === "show" && nv.t > 4) nv.mode = "write";
    if (nv.mode === "look" && nv.t > 3.8) nv.mode = "write";
    if (S.tanuki > 0) { const b = S.tanuki; S.tanuki -= dt; if (b > 1 && S.tanuki <= 1) sfx("poof"); if (Math.random() < dt * 3 && S.tanuki > 1.5 && S.tanuki < 12.5) sfx("step"); }
    S.lantern = Math.max(0, S.lantern - dt); S.warashi = Math.max(0, S.warashi - dt); S.bell = Math.max(0, S.bell - dt); S.cat = Math.max(0, S.cat - dt); S.furin = Math.max(0, (S.furin || 0) - dt);
    if (S.umbrella) { const u = S.umbrella; u.t += dt; u.x -= dt * 22; u.y = 244 + Math.min(1, u.t / 3) * 20 - Math.abs(Math.sin(u.t * 5)) * 8; if (Math.floor(u.t * 5 / Math.PI) !== Math.floor((u.t - dt) * 5 / Math.PI)) sfx("hop"); if (u.x < -20) S.umbrella = null; }
    // shishi-odoshi in the garden
    S.shishiT -= dt; if (S.shishiT <= 0) { S.shishiT = rnd(11, 16); S.shishi = 0.8; sfx("shishi"); }
    S.shishi = Math.max(0, S.shishi - dt);
    // fireflies at night when dry, sparrows by day
    const wantF = night() > 0.6 && S.rain < 0.1 ? 12 : 0;
    while (S.flies.length < wantF) S.flies.push({ x: rnd(OPEN.x0 + 4, 252), y: rnd(150, 215), ph: rnd(0, 6) });
    if (S.flies.length > wantF) S.flies.length = wantF;
    for (const f of S.flies) { f.x += Math.sin(S.time * 0.6 + f.ph) * dt * 3; f.y += Math.cos(S.time * 0.5 + f.ph * 2) * dt * 2.5; }
    const wantB = night() < 0.3 && S.rain < 0.1 ? 3 : 0;
    while (S.birds.length < wantB) S.birds.push({ x: rnd(200, 250), y: 214, t: rnd(0, 5) });
    if (S.birds.length > wantB) S.birds.length = wantB;
    for (const b of S.birds) { b.t += dt; if (Math.random() < dt * 0.8) b.x = clamp(b.x + rnd(-5, 5), 200, 250); }
    // rain in the garden
    const want = Math.round(S.rain * 70);
    while (S.drops.length < want) S.drops.push({ x: rnd(OPEN.x0, W + 10), y: rnd(OPEN.y0, 222), v: rnd(140, 190) });
    if (S.drops.length > want) S.drops.length = want;
    for (const d of S.drops) { d.y += d.v * dt; d.x -= d.v * 0.1 * dt; if (d.y > 218) { if (Math.random() < 0.4) S.ripples.push({ x: d.x, y: rnd(196, 214), t: 0 }); d.y = OPEN.y0 + rnd(0, 6); d.x = rnd(OPEN.x0, W + 10); } }
    for (let i = S.ripples.length - 1; i >= 0; i--) { S.ripples[i].t += dt; if (S.ripples[i].t > 0.6) S.ripples.splice(i, 1); }
    for (let i = S.words.length - 1; i >= 0; i--) { S.words[i].t += dt; if (S.words[i].t > S.words[i].life) S.words.splice(i, 1); }
    S.nextEvent -= dt; if (S.nextEvent <= 0) { S.nextEvent = rnd(7, 12); trySpecial(); }
    audioUpdate(dt);
  }

  // ---------- interior ----------

    if (S.rain > 0.2 && Math.random() < dt * 0.3) { const g = envG(t, 0.01, 0.02, 0.2, n.master); const o = osc("square", 150, t, 0.2, g); const am = ac.createOscillator(), ag = ac.createGain(); am.frequency.value = 28; ag.gain.value = 60; am.connect(ag); ag.connect(o.frequency); am.start(t); am.stop(t + 0.25); }
    // chanting while the mokugyo is struck
    const chanting = S.monk.mode === "chant" && S.monk.t < 12;
    n.chantG.gain.setTargetAtTime(chanting ? 0.035 : 0, t, 0.2);
    if (chanting) { const syl = Math.floor(S.monk.t / 0.48) % 4; n.f1.frequency.setTargetAtTime([500, 350, 700, 400][syl], t, 0.04); n.f2.frequency.setTargetAtTime([900, 1900, 1100, 800][syl], t, 0.04); n.voice.frequency.setTargetAtTime(syl === 3 ? 92 : 98, t, 0.1); }
  }
  function sfx(kind) {
    if (!live()) return;
    const ac = Snd.ac, t0 = ac.currentTime, m = Snd.n.master, cv = Snd.n.conv;
    const noise = (type, f, q, dur, vol, dest = m) => { const s = ac.createBufferSource(); s.buffer = Snd.n.white; const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q; s.connect(fl); fl.connect(envG(t0, 0.002, vol, dur, dest)); s.start(t0, Math.random()); s.stop(t0 + dur + 0.05); };
    switch (kind) {
      case "moku": osc("sine", 540, t0, 0.12, envG(t0, 0.001, 0.25, 0.12, m)); osc("sine", 1180, t0, 0.05, envG(t0, 0.001, 0.08, 0.05, m)); noise("bandpass", 900, 3, 0.04, 0.15); break;
      case "rin": for (const [f, a, d] of [[1210, 0.08, 7], [1218, 0.05, 7], [3290, 0.03, 4], [6100, 0.012, 2]]) osc("sine", f, t0, d, envG(t0, 0.002, a, d, cv)); break;
      case "bell": {
        noise("lowpass", 300, 0.7, 0.3, 0.3);
        for (const [f, a, d] of [[82, 0.22, 12], [84.5, 0.16, 12], [168, 0.1, 9], [230, 0.08, 7], [318, 0.05, 5], [433, 0.03, 4]]) osc("sine", f, t0, d, envG(t0, 0.01, a, d, cv));
        break;
      }
      case "shishi": osc("sine", 420, t0, 0.18, envG(t0, 0.001, 0.14, 0.18, cv)); noise("bandpass", 1100, 4, 0.08, 0.2, cv); for (let i = 0; i < 6; i++) { const tt = t0 + 0.3 + i * 0.07; osc("sine", rnd(900, 1600), tt, 0.04, envG(tt, 0.002, 0.012, 0.04, m)); } break;
      case "furin": for (let i = 0; i < 3; i++) { const tt = t0 + i * 0.22; osc("sine", pick([2637, 2794, 3136]), tt, 1.5, envG(tt, 0.002, 0.04, 1.5, cv)); osc("sine", 5274, tt, 0.4, envG(tt, 0.001, 0.01, 0.4, cv)); } break;
      case "poof": noise("lowpass", 1200, 0.7, 0.5, 0.3); osc("sine", 300, t0, 0.4, envG(t0, 0.01, 0.06, 0.4, m)).frequency.exponentialRampToValueAtTime(900, t0 + 0.3); break;
      case "step": osc("sine", rnd(300, 420), t0, 0.08, envG(t0, 0.001, 0.05, 0.08, m)); break;
      case "munch": for (let i = 0; i < 4; i++) { const tt = t0 + i * 0.18; const s = ac.createBufferSource(); s.buffer = Snd.n.white; const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 600; s.connect(f); f.connect(envG(tt, 0.005, 0.08, 0.08, m)); s.start(tt); s.stop(tt + 0.1); } break;
      case "tap": noise("bandpass", 2000, 2, 0.03, 0.1); break;
      case "boing": { const o = osc("sine", 200, t0, 0.3, envG(t0, 0.005, 0.06, 0.3, m)); o.frequency.exponentialRampToValueAtTime(600, t0 + 0.15); o.frequency.exponentialRampToValueAtTime(250, t0 + 0.3); break; }
      case "hop": { const o = osc("sine", 260, t0, 0.12, envG(t0, 0.003, 0.03, 0.12, m)); o.frequency.exponentialRampToValueAtTime(520, t0 + 0.1); break; }
      case "giggle": for (let i = 0; i < 4; i++) { const tt = t0 + i * 0.13; const o = osc("triangle", 900 - i * 40, tt, 0.1, envG(tt, 0.01, 0.025, 0.1, cv)); o.frequency.linearRampToValueAtTime(1100 - i * 40, tt + 0.05); } break;
    }
  }

  // ---------- GIF ----------
  const PALETTE = new Uint8Array(768);
  for (let i = 0; i < 216; i++) { PALETTE[i * 3] = LEVELS[(i / 36) | 0]; PALETTE[i * 3 + 1] = LEVELS[((i / 6) | 0) % 6]; PALETTE[i * 3 + 2] = LEVELS[i % 6]; }
  function lzw(ix, out) {
    let size = 9, next = 258, cur = 0, bits = 0; const dict = new Map(), bytes = [];
    const emit = c => { cur |= c << bits; bits += size; while (bits >= 8) { bytes.push(cur & 255); cur >>>= 8; bits -= 8; } };
    emit(256); let prefix = ix[0];
    for (let i = 1; i < ix.length; i++) {
      const k = ix[i], key = prefix * 256 + k, v = dict.get(key);
      if (v !== undefined) { prefix = v; continue; }
      emit(prefix);
      if (next < 4095) { dict.set(key, next++); if (next > (1 << size) && size < 12) size++; } else { emit(256); dict.clear(); size = 9; next = 258; }
      prefix = k;
    }
    emit(prefix); emit(257); if (bits > 0) bytes.push(cur & 255);
    out.push(8);
    for (let i = 0; i < bytes.length; i += 255) { const n = Math.min(255, bytes.length - i); out.push(n); for (let j = 0; j < n; j++) out.push(bytes[i + j]); }
    out.push(0);
  }
  function upscale(ix, k) {
    if (k === 1) return ix.slice();
    const w = W * k, o = new Uint8Array(w * H * k);
    for (let y = 0; y < H * k; y++) { const sy = ((y / k) | 0) * W, row = y * w; for (let x = 0; x < w; x++) o[row + x] = ix[sy + ((x / k) | 0)]; }
    return o;
  }
  async function makeGif(seconds = 8, scale = 2, fps = 20, onProgress) {
    const n = Math.round(seconds * fps), w = W * scale, h = H * scale, delay = Math.round(100 / fps);
    const out = []; for (const ch of "GIF89a") out.push(ch.charCodeAt(0));
    out.push(w & 255, w >> 8, h & 255, h >> 8, 0xf7, 0, 0); for (let i = 0; i < 768; i++) out.push(PALETTE[i]);
    out.push(0x21, 0xff, 0x0b); for (const ch of "NETSCAPE2.0") out.push(ch.charCodeAt(0)); out.push(3, 1, 0, 0, 0);
    for (let i = 0; i < n; i++) {
      const ix = frame(1 / fps);
      out.push(0x21, 0xf9, 4, 4, delay & 255, delay >> 8, 0, 0, 0x2c, 0, 0, 0, 0, w & 255, w >> 8, h & 255, h >> 8, 0);
      lzw(upscale(ix, scale), out);
      if (i % 4 === 3) { onProgress && onProgress(i + 1, n); await new Promise(r => setTimeout(r, 0)); }
    }
    out.push(0x3b); return new Uint8Array(out);
  }

  // ---------- UI ----------
  let last = performance.now();
  function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; if (!S.paused && !busy) frame(dt); requestAnimationFrame(loop); }
  const status = document.getElementById("status"), out = document.getElementById("out");
  const mBtn = document.getElementById("music");
  mBtn.addEventListener("click", async () => {
    if (!Snd.ac && !audioInit()) { status.textContent = "このブラウザでは音を鳴らせません。"; return; }
    Snd.on = !Snd.on;
    if (Snd.on) { await Snd.ac.resume(); Snd.nextNote = Snd.ac.currentTime + 0.3; } else await Snd.ac.suspend();
    mBtn.setAttribute("aria-pressed", String(Snd.on)); mBtn.textContent = Snd.on ? "音を止める" : "音を出す";
  });
  const bgmBtn = document.getElementById("bgm");
  bgmBtn.addEventListener("click", () => { Snd.bgm = !Snd.bgm; bgmBtn.setAttribute("aria-pressed", String(Snd.bgm)); });
  document.getElementById("vol").addEventListener("input", e => { Snd.vol = e.target.value / 100; if (Snd.n) Snd.n.master.gain.setTargetAtTime(Snd.vol, Snd.ac.currentTime, 0.05); });
  const tButtons = [...document.querySelectorAll("[data-t]")];
  tButtons.forEach(b => b.addEventListener("click", () => { tButtons.forEach(x => x.setAttribute("aria-pressed", String(x === b))); if (b.dataset.t === "auto") S.todMode = "auto"; else { S.todMode = "fixed"; S.tod = +b.dataset.t; } }));
  const wButtons = [...document.querySelectorAll("[data-w]")];
  wButtons.forEach(b => b.addEventListener("click", () => { S.weather = b.dataset.w; wButtons.forEach(x => x.setAttribute("aria-pressed", String(x === b))); }));
  document.querySelectorAll("[data-ev]").forEach(b => b.addEventListener("click", () => startEvent(b.dataset.ev)));
  const pBtn = document.getElementById("pause");
  function togglePause() { S.paused = !S.paused; pBtn.setAttribute("aria-pressed", String(S.paused)); pBtn.textContent = S.paused ? "再生" : "一時停止"; }
  pBtn.addEventListener("click", togglePause);
  window.addEventListener("keydown", e => { if (e.code === "Space" && e.target === document.body) { e.preventDefault(); togglePause(); } });
  const gifBtn = document.getElementById("gif");
  gifBtn.addEventListener("click", async () => {
    busy = true; gifBtn.disabled = true;
    try {
      const bytes = await makeGif(+document.getElementById("gifsec").value, +document.getElementById("gifscale").value, 20, (i, n) => { status.textContent = `GIF 生成中… ${i}/${n} フレーム`; });
      const img = new Image(); img.src = URL.createObjectURL(new Blob([bytes], { type: "image/gif" })); img.alt = "書き出した本堂のGIF"; out.prepend(img);
      status.textContent = `GIF ができました（${(bytes.length / 1048576).toFixed(1)} MB）。右クリック／長押しで保存できます。`;
    } catch (err) { status.textContent = `GIF の生成に失敗しました: ${err.message}`; }
    finally { busy = false; gifBtn.disabled = false; last = performance.now(); }
  });
  const webmBtn = document.getElementById("webm"); let rec = null;
  webmBtn.addEventListener("click", () => {
    if (rec) { rec.stop(); return; }
    if (!view.captureStream || typeof MediaRecorder === "undefined") { status.textContent = "このブラウザは動画録画に対応していません。GIF をお使いください。"; return; }
    const chunks = [], type = ["video/webm;codecs=vp9", "video/webm", "video/mp4"].find(t => MediaRecorder.isTypeSupported(t)) || "";
    rec = new MediaRecorder(view.captureStream(30), type ? { mimeType: type, videoBitsPerSecond: 6e6 } : undefined);
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => {
      const v = document.createElement("video"); v.src = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType || "video/webm" }));
      v.controls = v.loop = v.muted = v.autoplay = true; out.prepend(v);
      status.textContent = "録画しました（映像のみ）。動画の右クリック／長押しで保存できます。"; rec = null; webmBtn.textContent = "動画を録画";
    };
    rec.start(); webmBtn.textContent = "録画を止める"; status.textContent = "録画中… もう一度押すと停止します。";
  });

  log("山寺の本堂。灯明がゆらめいている", "wx");
  for (let i = 0; i < 20; i++) step(1 / 30);
  window.Temple = { S, frame, makeGif, startEvent };
  requestAnimationFrame(loop);
})();
</script>
