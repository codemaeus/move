<title>Retro Train Window</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #efe6d2;
    --dim: #a8987c;
    --ground: #17120d;
    --panel: #231b13;
    --line: #4a3a28;
    --accent: #e8a24a;
    --green: #8fc79a;
    --font: "DotGothic16", "MS Gothic", "Osaka-Mono", ui-monospace, monospace;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 15px;
    padding-inline: 16px; padding-block: 16px 24px; box-sizing: border-box; }
  .wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 22px; font-weight: 400; letter-spacing: 0.08em; color: var(--accent); }
  .sub { color: var(--dim); font-size: 13px; }
  .screen { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; background: #000; border: 1px solid var(--line); }
  #view { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  .hud { position: absolute; left: 10px; top: 8px; display: flex; gap: 10px; font-size: 13px; color: var(--accent); text-shadow: 0 0 4px #000, 0 0 2px #000; pointer-events: none; }
  .hud span:last-child { color: var(--green); }
  .row { display: grid; grid-template-columns: 1fr minmax(0, 320px); gap: 14px; align-items: start; }
  @media (max-width: 760px) { .row { grid-template-columns: 1fr; } }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .label { color: var(--dim); font-size: 12px; letter-spacing: 0.1em; }
  button, select { font-family: var(--font); font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); padding: 6px 10px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  button.rec { border-color: #7a3a2a; }
  button:disabled { opacity: 0.5; cursor: wait; }
  input[type="range"] { accent-color: var(--accent); width: 120px; }
  .log { margin: 0; padding: 10px 12px; list-style: none; background: var(--panel); border: 1px solid var(--line); min-height: 150px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .log li { display: flex; gap: 8px; }
  .log time { color: var(--dim); font-variant-numeric: tabular-nums; flex: none; }
  .log li.area { color: var(--accent); }
  .log li.ev { color: var(--green); }
  #status { color: var(--green); font-size: 13px; min-height: 1.2em; }
  .out { display: flex; flex-direction: column; gap: 8px; }
  .out img, .out video { max-width: 100%; image-rendering: pixelated; border: 1px solid var(--line); }
  .hint { color: var(--dim); font-size: 12px; line-height: 1.6; margin: 0; }
</style>

<div class="wrap">
  <header>
    <h1>レトロ電車の車窓</h1>
    <span class="sub">ローカル線 / 320×180 ピクセル / 手続き生成</span>
  </header>
  <div class="screen">
    <canvas id="view" width="1280" height="720"></canvas>
    <div class="hud" aria-hidden="true"><span id="hud-area">田園</span><span id="hud-time">朝</span></div>
  </div>
  <div class="row">
    <div class="controls">
      <div class="group" role="group" aria-label="時間帯">
        <span class="label">時間帯</span>
        <button data-t="auto" aria-pressed="true">自動</button>
        <button data-t="0.1" aria-pressed="false">朝</button>
        <button data-t="0.32" aria-pressed="false">昼</button>
        <button data-t="0.6" aria-pressed="false">夕</button>
        <button data-t="0.84" aria-pressed="false">夜</button>
      </div>
      <div class="group">
        <label class="label" for="cycle">一日の長さ</label>
        <select id="cycle">
          <option value="90">1分30秒</option>
          <option value="180" selected>3分</option>
          <option value="360">6分</option>
        </select>
        <button id="stops" aria-pressed="true">各駅に停まる</button>
        <button id="pause" aria-pressed="false">一時停止</button>
      </div>
      <div class="group">
        <button id="sound" aria-pressed="false">音を出す</button>
        <label class="label" for="vol">音量</label>
        <input id="vol" type="range" min="0" max="100" value="70">
      </div>
      <div class="group">
        <label class="label" for="gifsec">GIF</label>
        <select id="gifsec"><option value="4">4秒</option><option value="8" selected>8秒</option><option value="12">12秒</option></select>
        <select id="gifscale" aria-label="GIFサイズ"><option value="1">320×180</option><option value="2" selected>640×360</option></select>
        <button id="gif" class="rec">GIFを作る</button>
        <button id="webm" class="rec">動画を録画</button>
      </div>
      <p class="hint">田んぼ、集落、鉄橋、海辺、山あいのトンネル、小さな町を走り、ときどき駅に停まります。踏切、犬の散歩、手を振る子ども、白サギ、対向列車、夕方のカラス、夜のホタルや花火などが現れます。「音を出す」で、レールの継ぎ目の音、モーターのうなり、踏切、警笛、発車メロディ、セミやヒグラシ、夜の虫の声が鳴ります（すべてブラウザ内で合成）。できた GIF や動画は右クリック／長押しで保存できます。</p>
    </div>
    <ul class="log" id="log" aria-live="polite"></ul>
  </div>
  <div id="status" role="status"></div>
  <div class="out" id="out"></div>
</div>

<script>
(() => {
  "use strict";
  const W = 320, H = 180, CX = 160;
  const GX0 = 42, GX1 = 278, GY0 = 30, GY1 = 118, GR = 7, SASH0 = 70, SASH1 = 74;
  const K_MT = 0.06, K_MT2 = 0.18, K_FAR = 0.5, K_MID = 2.4, K_NEAR = 8, K_TRACK2 = 11;
  const Y_FAR = 84, Y_MID = 98, Y_NEAR = 112;

  const low = document.createElement("canvas"); low.width = W; low.height = H;
  const lctx = low.getContext("2d", { willReadFrequently: true });
  const wc = document.createElement("canvas"); wc.width = W; wc.height = H;
  const wctx = wc.getContext("2d");
  let ctx = lctx;
  lctx.imageSmoothingEnabled = false;
  const view = document.getElementById("view"), vctx = view.getContext("2d");
  vctx.imageSmoothingEnabled = false;
  const FONT = '"DotGothic16", "MS Gothic", monospace';
  if (document.fonts && document.fonts.load) document.fonts.load(`10px ${FONT}`).catch(() => {});

  // ---------- helpers ----------
  function hash(i) { let h = Math.imul((i | 0) ^ 0x9e3779b9, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
  const h2 = (a, b) => hash(Math.imul(a | 0, 73856093) ^ Math.imul(b | 0, 19349663));
  function noise1(t) { const i = Math.floor(t), f = t - i, u = f * f * (3 - 2 * f); return hash(i) + (hash(i + 1) - hash(i)) * u; }
  const mod = (a, n) => ((a % n) + n) % n;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${clamp(a, 0, 1).toFixed(3)})`;
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  function rect(x, y, w, h, c) {
    const x0 = Math.round(x), y0 = Math.round(y), x1 = Math.round(x + w), y1 = Math.round(y + h);
    ctx.fillStyle = typeof c === "string" ? c : rgb(c);
    ctx.fillRect(x0, y0, Math.max(1, x1 - x0), Math.max(1, y1 - y0));
  }
  const px = (x, y, c) => { ctx.fillStyle = typeof c === "string" ? c : rgb(c); ctx.fillRect(Math.round(x), Math.round(y), 1, 1); };
  function pxLine(x0, y0, x1, y1, style, t = 1) {
    ctx.fillStyle = typeof style === "string" ? style : rgb(style);
    const dx = x1 - x0, dy = y1 - y0, n = Math.max(Math.abs(dx), Math.abs(dy)) | 0;
    for (let i = 0; i <= n; i++) { const f = n ? i / n : 0; ctx.fillRect(Math.round(x0 + dx * f), Math.round(y0 + dy * f), t, t); }
  }
  function glow(x, y, r, c, a) {
    if (r < 0.5 || a <= 0.01) return;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, rgba(c, a)); g.addColorStop(0.35, rgba(c, a * 0.35)); g.addColorStop(1, rgba(c, 0));
    const prev = ctx.globalCompositeOperation; ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.globalCompositeOperation = prev;
  }
  function blob(x, y, w, h, c) { rect(x + 2, y, w - 4, h, c); rect(x, y + 2, w, h - 4, c); rect(x + 1, y + 1, w - 2, h - 2, c); }
  function scaled(ox, oy, m) { ctx.save(); ctx.translate(ox, oy); ctx.scale(m, m); ctx.translate(-ox, -oy); }

  // ---------- time of day ----------
  const KEYS = [
    [0.00, [70, 80, 140], [255, 170, 120], [0.85, 0.72, 0.66], 0.25],
    [0.10, [100, 160, 225], [235, 225, 200], [1, 0.95, 0.88], 0],
    [0.30, [60, 130, 225], [175, 215, 245], [1, 1, 1], 0],
    [0.50, [80, 140, 220], [215, 215, 215], [1, 0.95, 0.86], 0],
    [0.60, [90, 76, 150], [255, 140, 70], [1, 0.74, 0.52], 0.1],
    [0.68, [40, 36, 90], [170, 90, 110], [0.6, 0.5, 0.62], 0.6],
    [0.76, [8, 10, 32], [28, 32, 70], [0.3, 0.32, 0.48], 1],
    [0.93, [10, 12, 36], [32, 36, 76], [0.3, 0.32, 0.48], 1],
    [0.98, [30, 34, 80], [110, 80, 120], [0.45, 0.42, 0.55], 0.7],
    [1.00, [70, 80, 140], [255, 170, 120], [0.85, 0.72, 0.66], 0.25],
  ];
  const T = { top: [0, 0, 0], bot: [0, 0, 0], li: [1, 1, 1], night: 0 };
  function computeTOD(t) {
    let i = 0; while (i < KEYS.length - 2 && KEYS[i + 1][0] <= t) i++;
    const a = KEYS[i], b = KEYS[i + 1], f = smooth(0, 1, (t - a[0]) / (b[0] - a[0]));
    T.top = mix(a[1], b[1], f); T.bot = mix(a[2], b[2], f); T.li = mix(a[3], b[3], f); T.night = lerp(a[4], b[4], f);
  }
  const todName = t => t < 0.2 ? "朝" : t < 0.52 ? "昼" : t < 0.7 ? "夕方" : "夜";
  const L = c => [c[0] * T.li[0], c[1] * T.li[1], c[2] * T.li[2]];
  const shade = (c, f) => mix(L(c), T.bot, f);

  // ---------- route ----------
  const STY = {
    field:    { name: "田園",         len: [500, 800], mount: 0.8, msg: "青々とした田んぼの中を走る" },
    village:  { name: "山あいの集落", len: [400, 650], mount: 1.2, msg: "瓦屋根の集落が見えてきた" },
    river:    { name: "鉄橋",         len: [140, 220], mount: 0.6, msg: "鉄橋を渡る。ゴーッという音" },
    coast:    { name: "海辺",         len: [600, 900], mount: 0.35, msg: "窓の外に海が広がった" },
    mountain: { name: "山あい",       len: [400, 650], mount: 1.6, msg: "山あいを縫うように走る" },
    tunnel:   { name: "トンネル",     len: [150, 260], mount: 1.8, msg: "トンネルに入った" },
    town:     { name: "小さな町",     len: [400, 650], mount: 0.5, msg: "懐かしい町並みを抜けていく" },
    station:  { name: "駅",           len: [140, 140], mount: 0.8, msg: "" },
  };
  const NEXT = {
    field: ["village", "river", "coast", "mountain", "town"], village: ["field", "mountain", "town"],
    river: ["field", "village", "town"], coast: ["field", "mountain", "village"],
    mountain: ["tunnel", "village", "field", "tunnel"], tunnel: ["coast", "mountain", "field"], town: ["field", "river", "coast"],
  };
  const NAMES = ["ひだまり", "なつやま", "しおかぜ", "こもれび", "ほたるがわ", "あかね", "ゆうなぎ", "つきみの"];
  const route = [{ b: "field", s0: -6000, s1: 260 }];
  let sinceStation = 0, stationCount = 0;
  function extendRoute(upto) {
    while (route[route.length - 1].s1 < upto) {
      const last = route[route.length - 1], n = route.length;
      if (sinceStation >= 2 && last.b !== "tunnel" && last.b !== "river" && last.b !== "station") {
        route.push({ b: "station", bg: last.b === "coast" ? "coast" : last.b, s0: last.s1, s1: last.s1 + 140, name: NAMES[stationCount % NAMES.length], idx: stationCount });
        stationCount++; sinceStation = 0; continue;
      }
      const prev = last.b === "station" ? last.bg : last.b;
      const opts = NEXT[prev];
      const b = opts[Math.floor(hash(n * 977 + 13) * opts.length)];
      const [a, c] = STY[b].len;
      route.push({ b, s0: last.s1, s1: last.s1 + a + (c - a) * hash(n * 31 + 7) });
      sinceStation++;
    }
  }
  function segIndex(s) {
    extendRoute(s + 10);
    if (s < route[0].s1) return 0;
    let lo = 0, hi = route.length - 1;
    while (lo < hi) { const m = (lo + hi + 1) >> 1; if (route[m].s0 <= s) lo = m; else hi = m - 1; }
    return lo;
  }
  const segAt = s => route[segIndex(s)];
  const styleAt = s => { const g = segAt(s); return g.b === "station" ? g.bg : g.b; };
  function mountAt(s) {
    const i = segIndex(s), g = route[i], v = STY[g.b === "station" ? g.bg : g.b].mount, B = 150;
    const sv = j => { const q = route[j]; return STY[q.b === "station" ? q.bg : q.b].mount; };
    if (i > 0 && s - g.s0 < B) return lerp(sv(i - 1), v, 0.5 + 0.5 * (s - g.s0) / B);
    if (g.s1 - s < B) { extendRoute(g.s1 + 10); return lerp(sv(i + 1), v, 0.5 + 0.5 * (g.s1 - s) / B); }
    return v;
  }

  // ---------- state ----------
  const S = {
    time: 0, tod: 0.06, todMode: "auto", cycle: 180, camD: 0, v: 0, vmax: 17, accel: 0,
    stopT: 0, departed: -1e9, stops: true, events: [], nextEvent: 3, area: "", paused: false, dither: true, bob: 0, shadow: 1,
  };
  const sx = (s, k) => CX + (s - S.camD) * k;
  const sAt = (x, k) => S.camD + (x - CX) / k;
  function baseY(k) {
    const lk = Math.log(k), a = Math.log(K_FAR), b = Math.log(K_MID), c = Math.log(K_NEAR);
    if (lk <= b) return Y_FAR + (Y_MID - Y_FAR) * (lk - a) / (b - a);
    return Y_MID + (Y_NEAR - Y_MID) * (lk - b) / (c - b);
  }
  function cells(k, cell, marginM, fn) {
    const s0 = sAt(-10, k) - marginM, s1 = sAt(W + 10, k) + marginM;
    for (let i = Math.floor(s0 / cell); i * cell <= s1; i++) { const s = i * cell; fn(i, s, sx(s, k), styleAt(s)); }
  }

  // ---------- log ----------
  const logEl = document.getElementById("log");
  function clockStr() {
    const m = Math.floor(mod(S.tod * 24 * 60 + 5 * 60, 24 * 60));
    return `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
  }
  function log(msg, cls = "ev") {
    const li = document.createElement("li"); li.className = cls;
    const t = document.createElement("time"); t.textContent = clockStr();
    const sp = document.createElement("span"); sp.textContent = msg;
    li.append(t, sp); logEl.prepend(li);
    while (logEl.children.length > 7) logEl.lastChild.remove();
  }

  // ---------- train motion ----------
  function nextStation() {
    for (let i = segIndex(S.camD), n = 0; n < 60; i++, n++) {
      while (route.length <= i + 1) extendRoute(route[route.length - 1].s1 + 1);
      const g = route[i];
      if (g.b === "station") { const c = g.s0 + 70; if (c > S.camD - 1 && c !== S.departed) return g; }
    }
    return null;
  }
  function stepTrain(dt) {
    const v0 = S.v;
    if (S.stopT > 0) {
      S.stopT -= dt; S.v = 0;
      if (S.stopT < 2.5 && !S.flagShown) { S.flagShown = true; }
      if (S.stopT + dt > 6 && S.stopT <= 6) sfx("melody", 0.7);
      if (S.stopT + dt > 1.2 && S.stopT <= 1.2) sfx("hiss", 0.6);
      if (S.stopT <= 0) { const g = segAt(S.camD); S.departed = g.s0 + 70; log("発車します。ガタン、ゴトン…"); }
    } else {
      const st = nextStation();
      let vt = S.vmax;
      if (st && S.stops) {
        const dist = st.s0 + 70 - S.camD;
        vt = Math.min(S.vmax, Math.max(dist > 0.4 ? 0.6 : 0, Math.sqrt(2 * 0.8 * Math.max(0, dist))));
        if (dist < 0.4 && S.v < 1) {
          S.v = 0; S.camD = st.s0 + 70; S.stopT = 9; S.flagShown = false;
          log(`${st.name}駅に到着しました`, "area"); sfx("hiss", 1);
          spawnStationPeople(st);
        }
      } else if (st && !S.stops) {
        const dist = st.s0 + 70 - S.camD;
        if (dist < 0 && st.s0 + 70 !== S.departed) { S.departed = st.s0 + 70; log(`${st.name}駅を通過`); }
      }
      if (S.stopT <= 0) {
        if (vt > S.v) S.v = Math.min(vt, S.v + 0.6 * dt); else S.v = Math.max(vt, S.v - 1.3 * dt);
      }
    }
    S.accel = lerp(S.accel, (S.v - v0) / Math.max(dt, 1e-3), Math.min(1, dt * 4));
    const d0 = S.camD;
    S.camD += S.v * dt;
    // rail joints every 25 m, felt under each axle (two bogies, two axles each)
    const sp = S.v / S.vmax;
    for (const off of [0, 2.3, 16.5, 18.8]) {
      if (Math.floor((d0 - off) / 25) !== Math.floor((S.camD - off) / 25)) {
        B.joltV += 17 * (0.3 + sp); B.rollV += (Math.random() - 0.5) * 0.05 * sp;
        for (const st of B.straps) st.av += (Math.random() - 0.5) * 0.25 * sp;
        sfx("clack", 0.35 + 0.65 * sp, off < 5 ? 1 : 0.92);
      }
    }
    // spring-damped car body: vertical bounce and side-to-side roll
    B.joltV += (-160 * B.jolt - 11 * B.joltV) * dt; B.jolt += B.joltV * dt;
    const rollT = sp * (0.011 * Math.sin(S.camD * 0.047) + 0.006 * Math.sin(S.camD * 0.131 + 1) + 0.003 * Math.sin(S.time * 7.3));
    B.rollV += (-38 * (B.roll - rollT) - 3.2 * B.rollV) * dt; B.roll += B.rollV * dt;
    // hanging straps: little pendulums pushed by acceleration and roll
    for (const st of B.straps) {
      const tgt = clamp(-S.accel * 0.28, -0.5, 0.5) + B.roll * 6;
      st.av += (-11 * (st.a - tgt) - 0.9 * st.av) * dt; st.a += st.av * dt;
    }
  }
  const B = { jolt: 0, joltV: 0, roll: 0, rollV: 0, straps: [0, 1, 2, 3].map(() => ({ a: 0, av: 0 })) };

  // ---------- events ----------
  const LOOKS = [
    { coat: [230, 230, 220], pants: [40, 50, 90], hair: [30, 24, 20] },
    { coat: [200, 80, 80], pants: [60, 60, 80], hair: [50, 30, 20], long: true },
    { coat: [90, 110, 150], pants: [50, 46, 40], hair: [20, 18, 16] },
    { coat: [210, 180, 110], pants: [80, 70, 60], hair: [40, 30, 24], long: true },
    { coat: [120, 150, 110], pants: [50, 50, 60], hair: [24, 20, 18] },
  ];
  const addEvent = e => { e.t = 0; e.seed = (Math.random() * 1e9) | 0; S.events.push(e); return e; };
  const active = type => S.events.some(e => e.type === type);
  const spawnS = (k, L, v) => (v < S.v ? sAt(W + 30, k) : sAt(-30, k) - L);
  const isDay = () => T.night < 0.3;
  const CANDS = {
    field:    [["crossing", 3], ["dogwalk", 2], ["kids", 2], ["farmer", 2], ["heron", 2], ["bike", 1.5], ["oncoming", 2], ["crows", 2], ["plane", 1], ["fireflies", 2], ["fireworks", 1.2], ["shooting", 1]],
    village:  [["crossing", 3], ["dogwalk", 2], ["kids", 2.5], ["bike", 1.5], ["oncoming", 1.5], ["crows", 2], ["fireworks", 1], ["fireflies", 1]],
    river:    [["fisher", 3], ["fireflies", 2], ["crows", 1]],

      const o = osc("sine", 120 * pitch), g2 = ac.createGain(); o.frequency.exponentialRampToValueAtTime(55, t0 + 0.09); env(g2, t0, 0.002, 0.35 * vol, 0.12); out(o, g2); o.start(t0); o.stop(t0 + 0.14);

      for (const [f, a] of [[760, 0.08], [1140, 0.05], [1520, 0.03]]) {
        const o = osc("square", f * pitch), lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 3200;
        const g = ac.createGain(); env(g, t0, 0.003, a * vol, 0.32); o.connect(lp); out(lp, g); o.start(t0); o.stop(t0 + 0.35);
      }
    } else if (kind === "horn") {
      const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1600;
      const g = ac.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.09 * vol, t0 + 0.06); g.gain.setValueAtTime(0.09 * vol, t0 + 0.9); g.gain.linearRampToValueAtTime(0, t0 + 1.3);
      lp.connect(g); g.connect(n.master);
      for (const f of [311, 370]) { const o = osc("sawtooth", f * pitch); o.frequency.linearRampToValueAtTime(f * pitch * 0.985, t0 + 1.3); o.connect(lp); o.start(t0); o.stop(t0 + 1.35); }
    } else if (kind === "hiss") {
      const src = noise(), hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 2500;
      const g = ac.createGain(); env(g, t0, 0.02, 0.12 * vol, 1.4); src.connect(hp); out(hp, g); src.start(t0); src.stop(t0 + 1.5);
    } else if (kind === "whoosh") {
      const src = noise(), bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 0.8;
      bp.frequency.setValueAtTime(300, t0); bp.frequency.linearRampToValueAtTime(1300, t0 + 1.2); bp.frequency.linearRampToValueAtTime(260, t0 + 4);
      const g = ac.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.3 * vol, t0 + 0.8); g.gain.linearRampToValueAtTime(0.22 * vol, t0 + 3); g.gain.linearRampToValueAtTime(0, t0 + 4.2);
      src.loop = true; src.connect(bp); out(bp, g); src.start(t0); src.stop(t0 + 4.3);
    } else if (kind === "melody") {
      const notes = [76, 79, 84, 83, 79, 76, 74, 76, 79, 72];
      notes.forEach((m, i) => {
        const f = 440 * Math.pow(2, (m - 69) / 12), st = t0 + i * 0.2;
        const o = osc("triangle", f), g = ac.createGain(); env(g, st, 0.01, 0.07 * vol, 0.34); out(o, g); o.start(st); o.stop(st + 0.36);
      });
    }
  }

  // ---------- UI ----------
  let last = performance.now(), busy = false;
  function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; if (!S.paused && !busy) frame(dt); requestAnimationFrame(loop); }
  const status = document.getElementById("status"), out = document.getElementById("out");
  const tButtons = [...document.querySelectorAll("[data-t]")];
  function setTod(v) {
    tButtons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.t === v)));
    if (v === "auto") S.todMode = "auto"; else { S.todMode = "fixed"; S.tod = +v; }
  }
  tButtons.forEach(b => b.addEventListener("click", () => setTod(b.dataset.t)));
  document.getElementById("cycle").addEventListener("change", e => { S.cycle = +e.target.value; });
  const stopsBtn = document.getElementById("stops");
  stopsBtn.addEventListener("click", () => { S.stops = !S.stops; stopsBtn.setAttribute("aria-pressed", String(S.stops)); stopsBtn.textContent = S.stops ? "各駅に停まる" : "駅を通過する"; if (!S.stops && S.stopT > 0) S.stopT = 0.01; });

  const sBtn = document.getElementById("sound");
  sBtn.addEventListener("click", async () => {
    if (!Snd.ac && !audioInit()) { status.textContent = "このブラウザでは音を鳴らせません。"; return; }
    Snd.on = !Snd.on;
    if (Snd.on) await Snd.ac.resume(); else await Snd.ac.suspend();
    sBtn.setAttribute("aria-pressed", String(Snd.on)); sBtn.textContent = Snd.on ? "音を消す" : "音を出す";
  });
  document.getElementById("vol").addEventListener("input", e => { Snd.vol = e.target.value / 100; if (Snd.nodes) Snd.nodes.master.gain.setTargetAtTime(Snd.vol, Snd.ac.currentTime, 0.05); });
  const pBtn = document.getElementById("pause");
  function togglePause() { S.paused = !S.paused; pBtn.setAttribute("aria-pressed", String(S.paused)); pBtn.textContent = S.paused ? "再生" : "一時停止"; }
  pBtn.addEventListener("click", togglePause);
  window.addEventListener("keydown", e => { if (e.code === "Space" && e.target === document.body) { e.preventDefault(); togglePause(); } });
  const gifBtn = document.getElementById("gif");
  gifBtn.addEventListener("click", async () => {
    busy = true; gifBtn.disabled = true;
    try {
      const bytes = await makeGif(+document.getElementById("gifsec").value, +document.getElementById("gifscale").value, 20, (i, n) => { status.textContent = `GIF 生成中… ${i}/${n} フレーム`; });
      const img = new Image(); img.src = URL.createObjectURL(new Blob([bytes], { type: "image/gif" })); img.alt = "書き出した車窓GIF"; out.prepend(img);
      status.textContent = `GIF ができました（${(bytes.length / 1048576).toFixed(1)} MB）。右クリック／長押しで保存できます。`;
    } catch (err) { status.textContent = `GIF の生成に失敗しました: ${err.message}`; }
    finally { busy = false; gifBtn.disabled = false; last = performance.now(); }
  });
  const webmBtn = document.getElementById("webm"); let rec = null;
  webmBtn.addEventListener("click", () => {
    if (rec) { rec.stop(); return; }
    if (!view.captureStream || typeof MediaRecorder === "undefined") { status.textContent = "このブラウザは動画録画に対応していません。GIF をお使いください。"; return; }
    const chunks = [], type = ["video/webm;codecs=vp9", "video/webm", "video/mp4"].find(t => MediaRecorder.isTypeSupported(t)) || "";
    rec = new MediaRecorder(view.captureStream(30), type ? { mimeType: type, videoBitsPerSecond: 8e6 } : undefined);
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => {
      const v = document.createElement("video"); v.src = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType || "video/webm" }));
      v.controls = v.loop = v.muted = v.autoplay = true; out.prepend(v);
      status.textContent = "録画しました。動画の右クリック／長押しで保存できます。"; rec = null; webmBtn.textContent = "動画を録画";
    };
    rec.start(); webmBtn.textContent = "録画を止める"; status.textContent = "録画中… もう一度押すと停止します。";
  });

  S.v = 10;
  for (let i = 0; i < 20; i++) step(1 / 30);
  window.Train = { S, frame, makeGif, spawnSpecial, route, segIndex, setTod };
  requestAnimationFrame(loop);
})();
</script>
