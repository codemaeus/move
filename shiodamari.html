<title>浮き島カフェ しおだまり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
  /* layout: the sea fills the window; a name plate floats top-left, the controls ride along the bottom, a guest card slides in at the right */
  :root {
    --ink: #1c1a24;
    --paper: #fffaf0;
    --sea: #2a7fb8;
    --deep: #0e2f57;
    --sun: #ffb44a;
    --panel: rgba(14, 47, 87, 0.82);
    --dim: #cfe3ef;
    --dot: "DotGothic16", "MS Gothic", "Osaka-Mono", monospace;
    --round: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--deep); color: var(--paper); font-family: var(--dot); overflow: hidden; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  .plate { position: fixed; left: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); padding: 10px 16px 9px; background: var(--panel); border: 2px solid var(--ink); border-radius: 8px; box-shadow: 3px 3px 0 var(--ink); max-width: calc(100vw - 32px); }
  .plate small { display: block; font-size: 12px; letter-spacing: 0.25em; color: var(--dim); }
  .plate h1 { margin: 2px 0 0; font-family: var(--round); font-weight: 700; font-size: 25px; letter-spacing: 0.1em; color: var(--paper); text-wrap: balance; }
  .plate h1 span { color: var(--sun); }
  .plate .now { margin-top: 3px; font-size: 14px; display: flex; gap: 10px; align-items: baseline; }
  .plate .now b { font-weight: 400; font-size: 22px; color: var(--sun); font-variant-numeric: tabular-nums; }
  .rail { position: fixed; left: 0; right: 0; bottom: 0; padding: 9px 16px calc(9px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; background: rgba(9, 30, 60, 0.86); border-top: 2px solid var(--ink); font-size: 14px; }
  .group { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .lab { font-size: 11px; color: var(--dim); letter-spacing: 0.2em; margin-right: 2px; }
  button { font: inherit; color: var(--ink); background: var(--paper); border: 2px solid var(--ink); border-radius: 6px; padding: 3px 9px; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); }
  button:hover { background: #ffe9c8; }
  button:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
  button[aria-pressed="true"] { background: var(--sun); }
  button:focus-visible, input:focus-visible { outline: 3px solid #9fe0ff; outline-offset: 2px; }
  #time { width: min(220px, 46vw); accent-color: var(--sun); }
  .card { position: fixed; right: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); width: min(270px, calc(100vw - 32px)); padding: 12px 14px; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 8px; box-shadow: 3px 3px 0 var(--ink); }
  .card .who { display: flex; gap: 10px; align-items: center; }
  .card canvas { width: 36px; height: 60px; image-rendering: pixelated; background: #e8f2f8; border: 2px solid var(--ink); border-radius: 4px; }
  .card h2 { margin: 0; font-family: var(--round); font-size: 18px; }
  .card .role { font-size: 12px; color: #4a5a6a; }
  .card p { margin: 8px 0 10px; font-size: 14px; line-height: 1.6; }
  .card .row { display: flex; gap: 6px; }
  .hint { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--panel); border: 2px solid var(--ink); border-radius: 6px; padding: 3px 12px; font-size: 13px; transition: opacity 1.2s; pointer-events: none; white-space: nowrap; }
  @media (max-width: 680px) { .hint { display: none; } .plate h1 { font-size: 20px; } .card { top: auto; bottom: 150px; } }
  @media (prefers-reduced-motion: reduce) { .hint { transition: none; } }
</style>

<canvas id="gl" aria-label="海に浮かぶカフェしおだまりの風景。ドラッグでまわりを一周でき、ホイールやピンチで近づけます。お客さんをクリックすると話が聞けます"></canvas>
<div class="plate"><small>うきしま カフェ</small><h1><span>しおだまり</span></h1><div class="now"><b id="clk">17:00</b><span id="phase">夕なぎ</span></div></div>
<div class="hint" id="hint">ドラッグでぐるりと見る ／ ホイールで近づく ／ お客さんをクリック</div>
<div class="card" id="card" hidden><div class="who"><canvas id="face" width="24" height="40"></canvas><div><h2 id="cname">名前</h2><div class="role" id="crole">役</div></div></div><p id="ctext">…</p><div class="row"><button id="cnear" type="button">そばで見る</button><button id="cclose" type="button">閉じる</button></div></div>
<div class="rail">
  <div class="group"><span class="lab">時刻</span><input id="time" type="range" min="0" max="24" step="0.05" value="17" aria-label="時刻"><button id="sp0" type="button" aria-pressed="false">止める</button><button id="sp1" type="button" aria-pressed="true">ふつう</button><button id="sp6" type="button" aria-pressed="false">はやい</button></div>
  <div class="group"><span class="lab">みる</span><button id="v-all" type="button" aria-pressed="true">ぜんたい</button><button id="v-terrace" type="button" aria-pressed="false">テラス</button><button id="v-counter" type="button" aria-pressed="false">カウンター</button><button id="v-pier" type="button" aria-pressed="false">桟橋</button><button id="v-sea" type="button" aria-pressed="false">海から</button></div>
  <div class="group"><button id="music" type="button" aria-pressed="false">音と音楽</button></div>
</div>

  }
