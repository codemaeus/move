<title>Night Drive Pixel</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #d9d4ee;
    --dim: #8a84a8;
    --ground: #07060d;
    --panel: #12101e;
    --line: #2a2640;
    --amber: #ffb35c;
    --cyan: #6fe3f0;
    --font: "DotGothic16", "MS Gothic", "Osaka-Mono", ui-monospace, monospace;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font);
    font-size: 15px;
    padding-inline: 16px;
    padding-block: 16px 24px;
    box-sizing: border-box;
  }
  .wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 22px; font-weight: 400; letter-spacing: 0.08em; color: var(--amber); }
  .sub { color: var(--dim); font-size: 13px; }
  .screen { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; background: #000; border: 1px solid var(--line); }
  #view { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  .hud { position: absolute; left: 10px; top: 8px; display: flex; gap: 10px; font-size: 13px; color: var(--amber); text-shadow: 0 0 4px #000, 0 0 2px #000; pointer-events: none; }
  .hud span:last-child { color: var(--cyan); }
  .row { display: grid; grid-template-columns: 1fr minmax(0, 320px); gap: 14px; align-items: start; }
  @media (max-width: 760px) { .row { grid-template-columns: 1fr; } }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .label { color: var(--dim); font-size: 12px; letter-spacing: 0.1em; }
  button, select {
    font-family: var(--font); font-size: 14px; color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); padding: 6px 10px; cursor: pointer;
  }
  button[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  button.rec { border-color: #7a2a3a; }
  button:disabled { opacity: 0.5; cursor: wait; }
  input[type="range"] { accent-color: var(--amber); width: 120px; }
  .log { margin: 0; padding: 10px 12px; list-style: none; background: var(--panel); border: 1px solid var(--line); min-height: 150px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .log li { display: flex; gap: 8px; }
  .log time { color: var(--dim); font-variant-numeric: tabular-nums; flex: none; }
  .log li.area { color: var(--amber); }
  .log li.ev { color: var(--cyan); }
  #status { color: var(--cyan); font-size: 13px; min-height: 1.2em; }
  .out { display: flex; flex-direction: column; gap: 8px; }
  .out img, .out video { max-width: 100%; image-rendering: pixelated; border: 1px solid var(--line); }
  .hint { color: var(--dim); font-size: 12px; line-height: 1.6; margin: 0; }
</style>

<div class="wrap">
  <header>
    <h1>NIGHT DRIVE</h1>
    <span class="sub">後部座席の窓から / 320×180 ピクセル / 手続き生成</span>
  </header>

  <div class="screen">
    <canvas id="view" width="1280" height="720"></canvas>
    <div class="hud" aria-hidden="true"><span id="hud-area">市街地</span><span id="hud-time">23:47</span></div>
  </div>

  <div class="row">
    <div class="controls">
      <div class="group" role="group" aria-label="天気">
        <span class="label">天気</span>
        <button id="w-auto" data-w="auto" aria-pressed="true">自動</button>
        <button id="w-clear" data-w="clear" aria-pressed="false">晴れ</button>
        <button id="w-rain" data-w="rain" aria-pressed="false">雨</button>
        <button id="w-storm" data-w="storm" aria-pressed="false">嵐</button>
      </div>
      <div class="group">
        <label class="label" for="area">景色</label>
        <select id="area">
          <option value="">行き先を選ぶ…</option>
          <option value="city">市街地</option>
          <option value="suburb">住宅街</option>
          <option value="country">田園</option>
          <option value="forest">山道</option>
          <option value="tunnel">トンネル</option>
          <option value="coast">海沿い</option>
          <option value="bridge">大きな橋</option>
        </select>
        <button id="next">次の景色へ</button>
      </div>
      <div class="group">
        <label class="label" for="speed">速度</label>
        <input id="speed" type="range" min="8" max="40" value="22">
        <button id="dither" aria-pressed="true">ディザ</button>
        <button id="pause" aria-pressed="false">一時停止</button>
      </div>
      <div class="group">
        <label class="label" for="gifsec">GIF</label>
        <select id="gifsec">
          <option value="4">4秒</option>
          <option value="8" selected>8秒</option>
          <option value="12">12秒</option>
        </select>
        <select id="gifscale" aria-label="GIFサイズ">
          <option value="1">320×180</option>
          <option value="2" selected>640×360</option>
        </select>
        <button id="gif" class="rec">GIFを作る</button>
        <button id="webm" class="rec">動画を録画</button>
      </div>
      <p class="hint">景色は約 30〜60 秒ごとに移り変わります。鹿やキツネ、散歩中の人、電車、花火、夜間工事などがときどき現れます。GIF は今の景色と天気のまま書き出します。できた画像や動画は右クリック／長押しで保存できます。スペースキーで一時停止。</p>
    </div>
    <ul class="log" id="log" aria-live="polite"></ul>
  </div>
  <div id="status" role="status"></div>
  <div class="out" id="out"></div>
</div>

<script>
(() => {
  "use strict";
  // ================= constants =================
  const W = 320, H = 180, CX = 160;
  const K_MT = 0.1, K_MT2 = 0.25, K_FAR = 0.6, K_MID = 2.8, K_NEAR = 9;
  const Y_FAR = 86, Y_MID = 104, Y_NEAR = 124, WIN_BOT = 134, WIN_R = 292;
  const winTop = x => 17 + Math.round(((x - 175) / 140) ** 2 * 7);
  const winL = y => Math.round(36 + (WIN_BOT - y) * 0.28);

  const low = document.createElement("canvas");
  low.width = W; low.height = H;
  const ctx = low.getContext("2d", { willReadFrequently: true });
  ctx.imageSmoothingEnabled = false;
  const view = document.getElementById("view");
  const vctx = view.getContext("2d");
  vctx.imageSmoothingEnabled = false;

  // ================= helpers =================
  function hash(i) {
    let h = Math.imul((i | 0) ^ 0x9e3779b9, 0x85ebca6b);
    h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  const h2 = (a, b) => hash(Math.imul(a | 0, 73856093) ^ Math.imul(b | 0, 19349663));
  function noise1(t) {
    const i = Math.floor(t), f = t - i, u = f * f * (3 - 2 * f);
    return hash(i) + (hash(i + 1) - hash(i)) * u;
  }
  const mod = (a, n) => ((a % n) + n) % n;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${clamp(a, 0, 1).toFixed(3)})`;
  function rect(x, y, w, h, c) {
    const x0 = Math.round(x), y0 = Math.round(y);
    const x1 = Math.round(x + w), y1 = Math.round(y + h);
    ctx.fillStyle = typeof c === "string" ? c : rgb(c);
    ctx.fillRect(x0, y0, Math.max(1, x1 - x0), Math.max(1, y1 - y0));
  }
  const px = (x, y, c) => { ctx.fillStyle = typeof c === "string" ? c : rgb(c); ctx.fillRect(Math.round(x), Math.round(y), 1, 1); };
  function pxLine(x0, y0, x1, y1, style, t = 1) {
    ctx.fillStyle = typeof style === "string" ? style : rgb(style);
    const dx = x1 - x0, dy = y1 - y0;
    const n = Math.max(Math.abs(dx), Math.abs(dy)) | 0;
    for (let i = 0; i <= n; i++) {
      const f = n ? i / n : 0;
      ctx.fillRect(Math.round(x0 + dx * f), Math.round(y0 + dy * f), t, t);
    }
  }
  function glow(x, y, r, c, a) {
    if (r < 0.5 || a <= 0.01) return;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, rgba(c, a));
    g.addColorStop(0.35, rgba(c, a * 0.35));
    g.addColorStop(1, rgba(c, 0));
    const prev = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
    ctx.globalCompositeOperation = prev;
  }

  // ================= route / biomes =================
  const BIOMES = {
    city:    { name: "市街地",   len: [700, 1100], top: [8, 6, 22], bot: [70, 38, 72], stars: 0.2, mount: 0.3,
               msg: "街の中心部を走っている" },
    suburb:  { name: "住宅街",   len: [600, 1000], top: [6, 8, 24], bot: [40, 34, 70], stars: 0.55, mount: 0.55,
               msg: "静かな住宅街に入った" },
    country: { name: "田園",     len: [800, 1300], top: [4, 8, 26], bot: [22, 30, 62], stars: 1, mount: 1,
               msg: "田んぼの広がる田園地帯へ" },
    forest:  { name: "山道",     len: [600, 1000], top: [3, 6, 18], bot: [16, 22, 46], stars: 1, mount: 1.5,
               msg: "山道に入った" },
    tunnel:  { name: "トンネル", len: [250, 450], top: [3, 6, 18], bot: [16, 22, 46], stars: 1, mount: 1.7,
               msg: "トンネルに入った" },
    coast:   { name: "海沿い",   len: [900, 1400], top: [4, 8, 28], bot: [26, 36, 74], stars: 1, mount: 0.35,
               msg: "海沿いの道に出た" },
    bridge:  { name: "大きな橋", len: [220, 360], top: [6, 8, 26], bot: [36, 34, 72], stars: 0.6, mount: 0.3,
               msg: "大きな橋を渡っている" },
  };
  const NEXT = {
    city: ["suburb", "bridge"], suburb: ["city", "country", "bridge", "country"],
    country: ["forest", "suburb", "coast"], forest: ["tunnel", "country", "tunnel"],
    tunnel: ["coast", "forest", "country"], coast: ["bridge", "forest", "suburb"],
    bridge: ["city", "suburb", "coast", "country"],
  };
  const route = [{ b: "city", s0: -8000, s1: 900 }];
  function extendRoute(upto) {
    while (route[route.length - 1].s1 < upto) {
      const last = route[route.length - 1], n = route.length;
      const opts = NEXT[last.b];
      const b = opts[Math.floor(hash(n * 977 + 13) * opts.length)];
      const [a, c] = BIOMES[b].len;
      route.push({ b, s0: last.s1, s1: last.s1 + a + (c - a) * hash(n * 31 + 7) });
    }
  }
  function segIndex(s) {
    extendRoute(s + 10);
    if (s < route[0].s1) return 0;
    let lo = 0, hi = route.length - 1;
    while (lo < hi) { const m = (lo + hi + 1) >> 1; if (route[m].s0 <= s) lo = m; else hi = m - 1; }
    return lo;
  }
  const biomeAt = s => route[segIndex(s)].b;
  function paramAt(s, key) {
    const i = segIndex(s), g = route[i], v = BIOMES[g.b][key], B = 150;
    if (i > 0 && s - g.s0 < B) return lerp(BIOMES[route[i - 1].b][key], v, 0.5 + 0.5 * (s - g.s0) / B);
    if (g.s1 - s < B) { extendRoute(g.s1 + 10); return lerp(BIOMES[route[i + 1].b][key], v, 0.5 + 0.5 * (g.s1 - s) / B); }
    return v;
  }
  const wallAt = s => biomeAt(s) === "suburb" && hash(Math.floor(s / 14) * 7 + 3) > 0.3;
  const railAt = s => { const b = biomeAt(s); return (b === "suburb" || b === "country") && hash(Math.floor(s / 1200) * 17 + 5) > 0.35; };
  function guardrailAt(s, b) {
    if (b === "forest" || b === "coast") return true;
    return b === "country" && hash(Math.floor(s / 90) * 3 + 1) > 0.5;
  }

  // ================= state =================
  const S = {
    time: 0, camD: 0, speed: 22, baseSpeed: 22,
    rain: 0, wet: 0, weather: "auto", rainState: 0,
    flash: 0, bolt: null, boltT: 0,
    drops: [], streaks: [], events: [],
    nextEvent: 2.5, nextWalker: 0.5,
    skyTop: BIOMES.city.top.slice(), skyBot: BIOMES.city.bot.slice(), stars: 0.2,
    biome: "", dither: true, paused: false, bob: 0, amb: 0.55, fw: [0, 0, 0],
  };
  const sx = (s, k) => CX + (s - S.camD) * k;
  const sAt = (x, k) => S.camD + (x - CX) / k;
  function baseY(k) {
    const lk = Math.log(k), a = Math.log(K_FAR), b = Math.log(K_MID), c = Math.log(K_NEAR);
    if (lk <= b) return Y_FAR + (Y_MID - Y_FAR) * (lk - a) / (b - a);
    return Y_MID + (Y_NEAR - Y_MID) * (lk - b) / (c - b);
  }
  function cells(k, cell, marginM, fn) {
    const s0 = sAt(-10, k) - marginM, s1 = sAt(W + 10, k) + marginM;
    for (let i = Math.floor(s0 / cell); i * cell <= s1; i++) {
      const s = i * cell;
      fn(i, s, sx(s, k), biomeAt(s));
    }
  }

  // light that reaches the cabin / nearby objects (previous frame, per column)
  const Lr = new Float32Array(W), Lg = new Float32Array(W), Lb = new Float32Array(W);
  let lights = [];
  const addLight = (x, c, a) => lights.push([x, c, a]);
  function lit(c, x, k = 1) {
    const i = clamp(x | 0, 0, W - 1), a = S.amb;
    return [c[0] * a + Lr[i] * (c[0] * 0.8 + 45) * k, c[1] * a + Lg[i] * (c[1] * 0.8 + 45) * k, c[2] * a + Lb[i] * (c[2] * 0.8 + 45) * k];
  }

  // ================= log =================
  const logEl = document.getElementById("log");
  function clockStr() {
    const m = 23 * 60 + 47 + Math.floor(S.time / 20);
    return `${String(Math.floor(m / 60) % 24).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
  }
  function log(msg, cls = "ev") {
    const li = document.createElement("li");
    li.className = cls;
    const t = document.createElement("time"); t.textContent = clockStr();
    const sp = document.createElement("span"); sp.textContent = msg;
    li.append(t, sp);
    logEl.prepend(li);
    while (logEl.children.length > 7) logEl.lastChild.remove();
  }

  // ================= weather =================
  function weatherTarget(t) {
    if (S.weather === "clear") return 0;
    if (S.weather === "rain") return 0.55;
    if (S.weather === "storm") return 1;
    const c = t % 90;
    if (c < 30) return 0;
    if (c < 38) return lerp(0, 0.45, (c - 30) / 8);
    if (c < 46) return lerp(0.45, 1, (c - 38) / 8);
    if (c < 58) return 1;
    if (c < 66) return lerp(1, 0.3, (c - 58) / 8);
    if (c < 76) return lerp(0.3, 0, (c - 66) / 10);
    return 0;
  }

  // ================= events =================
  const LOOKS = [
    { coat: [60, 62, 80], pants: [30, 30, 40], hair: [20, 16, 14] },
    { coat: [120, 40, 50], pants: [40, 36, 50], hair: [50, 30, 20], long: true, bag: true },
    { coat: [40, 44, 52], pants: [26, 26, 32], hair: [12, 12, 14], bag: true },
    { coat: [150, 140, 110], pants: [50, 46, 60], hair: [24, 20, 18], long: true },
    { coat: [40, 90, 120], pants: [30, 30, 40], hair: [16, 14, 14] },
  ];
  const YUKATA = [[60, 80, 150], [180, 70, 110], [220, 220, 230], [70, 60, 110]];
  const UMBRELLA = [[200, 200, 215], [190, 60, 70], [50, 90, 170], [220, 190, 60]];

  function evActive(type) { return S.events.some(e => e.type === type); }
  function spawnAt(k, L, v) {
    // choose the side it enters from so it drifts across the window
    return v < S.speed ? sAt(W + 30, k) : sAt(-30, k) - L;
  }
  function addEvent(e) { e.t = 0; e.seed = (Math.random() * 1e9) | 0; S.events.push(e); return e; }

  function spawnWalker(kind, sOverride) {
    const b = biomeAt(S.camD + 20);
    let v, type = kind;
    if (!type) {
      const r = Math.random();
      type = r < 0.7 ? "walker" : r < 0.88 ? "cyclist" : "runner";
    }
    if (type === "walker" || type === "dogwalker") v = (Math.random() < 0.5 ? -1 : 1) * (1 + Math.random() * 0.5);
    else if (type === "cyclist") v = (Math.random() < 0.5 ? -1 : 1) * (4 + Math.random() * 2);
    else v = (Math.random() < 0.5 ? -1 : 1) * 3;
    const e = addEvent({ type, k: K_NEAR, v, L: 1, dur: 60, look: LOOKS[(Math.random() * LOOKS.length) | 0],
      umb: UMBRELLA[(Math.random() * UMBRELLA.length) | 0], yukata: b === "festival" });
    e.s = sOverride !== undefined ? sOverride : spawnAt(K_NEAR, 1, v);
    return e;
  }

  const SPECIALS = {
    city:    [["police", 2], ["construction", 2], ["dogwalker", 2]],
    suburb:  [["cat", 3], ["dogwalker", 3], ["construction", 1], ["police", 1], ["festival", 2], ["train", 3], ["fireworks", 1.5]],
    country: [["deer", 2], ["fox", 2], ["tanuki", 2], ["train", 3], ["fireworks", 2], ["festival", 1], ["ufo", 0.5], ["shooting", 1.5]],
    forest:  [["deer", 4], ["fox", 2], ["tanuki", 2], ["shooting", 1.5]],
    coast:   [["fireworks", 3], ["shooting", 1.5], ["ufo", 0.4], ["dogwalker", 1]],
    bridge:  [["fireworks", 2], ["shooting", 1]],
    tunnel:  [],
  };
  function trySpecial() {
    const b = biomeAt(S.camD + 25);
    const cands = SPECIALS[b].filter(([t]) => {
      if (evActive(t)) return false;
      if (t === "fireworks") return S.rain < 0.3;
      if (t === "shooting" || t === "ufo") return S.rain < 0.08;
      if (t === "train") return railAt(S.camD + 40);
      return true;
    });
    if (!cands.length) return;
    let r = Math.random() * cands.reduce((a, c) => a + c[1], 0), t = cands[0][0];
    for (const [n, w] of cands) { if ((r -= w) <= 0) { t = n; break; } }
    spawnSpecial(t);
  }
  function spawnSpecial(t) {
    let e;
    switch (t) {
      case "deer": {
        const v = S.speed * (0.78 + Math.random() * 0.12);
        const n = 1 + ((Math.random() * 3) | 0);
        e = addEvent({ type: t, k: 7.5, v, L: 8, dur: 45, herd: Array.from({ length: n }, (_, i) => ({ off: i * 2.6 + Math.random(), stag: i === 0 && Math.random() < 0.6, ph: Math.random() })) });
        e.s = spawnAt(7.5, 8, v);
        log(n > 1 ? `鹿の群れ（${n}頭）が並走している！` : "鹿が並走している！");
        break;
      }
      case "fox": e = addEvent({ type: t, k: 7.5, v: S.speed * 0.62, L: 1, dur: 30 }); e.s = spawnAt(7.5, 1, e.v); log("キツネが道路脇を駆けていく"); break;
      case "tanuki": e = addEvent({ type: t, k: 7.5, v: 0.7, L: 1, dur: 30 }); e.s = spawnAt(7.5, 1, e.v); log("タヌキがのそのそ歩いている"); break;
      case "cat": {
        e = addEvent({ type: t, k: K_NEAR, v: 0, L: 1, dur: 30 }); e.s = spawnAt(K_NEAR, 1, 0);
        e.onWall = wallAt(e.s); log(e.onWall ? "塀の上に猫がいる" : "道ばたに猫がいる");
        break;
      }
      case "dogwalker": spawnWalker("dogwalker"); log("犬の散歩をしている人がいる"); return;
      case "train": {
        const over = Math.random() < 0.5, v = over ? S.speed + 12 : -24;
        e = addEvent({ type: t, k: 2.2, v, L: 120, dur: 60, cars: 6, stripe: [[40, 150, 90], [220, 120, 40], [50, 100, 200]][(Math.random() * 3) | 0] });
        e.s = spawnAt(2.2, 120, v);
        log(over ? "電車に追い抜かれた" : "電車とすれ違った");
        break;
      }
      case "fireworks": e = addEvent({ type: t, k: 0.3, v: 0, dur: 16, s: sAt(170 + Math.random() * 110, 0.3), parts: [], rockets: [], next: 0 }); log("遠くで花火が上がっている"); break;
      case "shooting": e = addEvent({ type: t, dur: 0.9, x0: 90 + Math.random() * 200, y0: 22 + Math.random() * 18, dx: -(60 + Math.random() * 40), dy: 22 + Math.random() * 10 }); log("流れ星！"); break;
      case "ufo": e = addEvent({ type: t, dur: 9, x0: W + 10, y0: 30 + Math.random() * 20 }); log("……今の光は何だったんだろう？"); break;
      case "festival": {
        e = addEvent({ type: t, k: K_NEAR, v: 0, L: 70, dur: 40 }); e.s = spawnAt(K_NEAR, 70, 0);
        for (let i = 0; i < 6; i++) { const w = spawnWalker("walker", e.s + 5 + i * 11 + Math.random() * 5); w.yukata = true; w.v *= 0.6; }
        log("夏祭りの提灯が並んでいる");
        break;
      }
      case "police": e = addEvent({ type: t, k: K_NEAR, v: 0, L: 4.6, dur: 30 }); e.s = spawnAt(K_NEAR, 4.6, 0); log("路肩にパトカーが停まっている"); break;
      case "construction": e = addEvent({ type: t, k: K_NEAR, v: 0, L: 36, dur: 30 }); e.s = spawnAt(K_NEAR, 36, 0); log("夜間工事中。誘導員が赤い棒を振っている"); break;
    }
  }

  function updateEvents(dt) {
    S.nextEvent -= dt;
    if (S.nextEvent <= 0) { S.nextEvent = 4 + Math.random() * 6; trySpecial(); }
    S.nextWalker -= dt;
    if (S.nextWalker <= 0) {
      const b = biomeAt(S.camD + 20);
      const rate = { city: 1.3, suburb: 3.5, bridge: 5, coast: 7, country: 9 }[b];
      if (rate) { spawnWalker(); S.nextWalker = rate * (0.4 + Math.random()); } else S.nextWalker = 2;
    }
    for (let i = S.events.length - 1; i >= 0; i--) {
      const e = S.events[i];
      e.t += dt;
      if (e.k) e.s += e.v * dt;
      let dead = e.t > e.dur;
      if (e.k && e.type !== "fireworks") {
        const xa = sx(e.s, e.k), xb = sx(e.s + e.L, e.k);
        if (e.v <= S.speed && xb < -40) dead = true;
        if (e.v > S.speed && xa > W + 40) dead = true;
      }
      if (e.type === "fireworks") updateFireworks(e, dt);
      if (dead) S.events.splice(i, 1);
    }
  }

  function updateFireworks(e, dt) {
    e.next -= dt;
    if (e.next <= 0 && e.t < e.dur - 3) {
      e.next = 0.5 + Math.random() * 1.1;
      e.rockets.push({ ds: (Math.random() - 0.5) * 300, y: Y_FAR, ty: 24 + Math.random() * 30, t: 0 });
    }
    for (let i = e.rockets.length - 1; i >= 0; i--) {
      const r = e.rockets[i];
      r.t += dt; r.y = lerp(Y_FAR, r.ty, Math.min(1, r.t / 0.9));
      if (r.t >= 0.9) {
        const pal = [[255, 80, 80], [255, 210, 90], [120, 255, 140], [120, 170, 255], [255, 130, 220], [255, 255, 255]];
        const c = pal[(Math.random() * pal.length) | 0], c2 = pal[(Math.random() * pal.length) | 0];
        const n = 34 + ((Math.random() * 16) | 0), sp = 16 + Math.random() * 12;
        for (let j = 0; j < n; j++) {
          const a = (j / n) * Math.PI * 2;
          e.parts.push({ ds: r.ds, x: 0, y: r.ty, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: 0, life: 1.4 + Math.random() * 0.6, c: j % 3 ? c : c2 });
        }
        S.fwFlash = Math.max(S.fwFlash || 0, 1);
        S.fwCol = c;
        e.rockets.splice(i, 1);
      }
    }
    for (let i = e.parts.length - 1; i >= 0; i--) {
      const p = e.parts[i];
      p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 10 * dt; p.vx *= 1 - dt * 0.8; p.vy *= 1 - dt * 0.6;
      if (p.t > p.life) e.parts.splice(i, 1);
    }
  }

  // ================= update =================
  function step(dt) {
    S.time += dt;
    const target = weatherTarget(S.time);
    S.rain += (target - S.rain) * Math.min(1, dt * 0.6);
    const inTunnel = biomeAt(S.camD) === "tunnel";
    if (S.rain > 0.08) S.wet = Math.min(1, S.wet + dt * 0.12 * (0.5 + S.rain));
    else S.wet = Math.max(0, S.wet - dt * 0.025);
    if (S.rainState === 0 && S.rain > 0.15) { S.rainState = 1; log("雨が降ってきた", "wx"); }
    else if (S.rainState === 1 && S.rain > 0.8) { S.rainState = 2; log("土砂降りになってきた", "wx"); }
    else if (S.rainState > 0 && S.rain < 0.08) { S.rainState = 0; log("雨が上がった", "wx"); }
    else if (S.rainState === 2 && S.rain < 0.6) S.rainState = 1;

    S.speed = S.baseSpeed * (1 - 0.15 * S.rain) * (1 + 0.04 * Math.sin(S.time * 0.21));
    S.camD += S.speed * dt;
    S.bob = (Math.sin(S.camD * 1.3) * Math.sin(S.camD * 0.71) > 0.88) ? 1 : 0;

    const b = biomeAt(S.camD);
    if (b !== S.biome) {
      const first = S.biome === "";
      S.biome = b;
      log(BIOMES[b].msg, "area");
      if (first) { S.skyTop = BIOMES[b].top.slice(); S.skyBot = BIOMES[b].bot.slice(); S.stars = BIOMES[b].stars; }
    }
    const B = BIOMES[b], r = Math.min(1, dt * 0.35);
    S.skyTop = mix(S.skyTop, B.top, r); S.skyBot = mix(S.skyBot, B.bot, r);
    S.stars = lerp(S.stars, B.stars, r);
    S.fwFlash = (S.fwFlash || 0) * Math.exp(-dt * 4);

    updateEvents(dt);

    // rain streaks outside (relative wind blows them backward = to the left)
    const want = Math.round(S.rain * 300);
    while (S.streaks.length < want) S.streaks.push(newStreak(true));
    if (S.streaks.length > want) S.streaks.length = want;
    for (let i = 0; i < S.streaks.length; i++) {
      const p = S.streaks[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.y > WIN_BOT || p.x < 0) S.streaks[i] = newStreak(false);
    }

    // drops on the side glass stream backward
    if (!inTunnel) {
      const spawn = S.rain * 70 * dt;
      let n = Math.floor(spawn) + (Math.random() < spawn % 1 ? 1 : 0);
      while (n-- > 0 && S.drops.length < 260) {
        const y = 20 + Math.random() * 112;
        S.drops.push({ x: winL(y) + Math.random() * (WIN_R - winL(y)), y, r: Math.random() < 0.75 ? 1 : 2,
          vx: -(2 + Math.random() * S.speed * 0.9), vy: (Math.random() - 0.3) * 3, age: 0 });
      }
    }
    for (let i = S.drops.length - 1; i >= 0; i--) {
      const d = S.drops[i];
      d.age += dt; d.x += d.vx * dt; d.y += d.vy * dt;
      if (d.x < winL(d.y) || d.y > WIN_BOT - 1 || d.age > 25) S.drops.splice(i, 1);
    }

    // lightning
    S.flash *= Math.exp(-dt * 5);
    S.boltT -= dt;
    if (S.rain > 0.75 && !inTunnel && Math.random() < dt * 0.09) {
      S.flash = 1; S.boltT = 0.18;
      const bolt = []; let x = 60 + Math.random() * 220, y = 10;
      while (y < Y_FAR - 10) { bolt.push([x, y]); x += (Math.random() - 0.5) * 8; y += 2 + Math.random() * 4; }
      S.bolt = bolt;
      if (!S.lastBoltLog || S.time - S.lastBoltLog > 20) { log("遠くで雷が光った", "wx"); S.lastBoltLog = S.time; }
    }
    if (S.flash > 0.3 && S.flash < 0.35 && Math.random() < 0.5) S.flash = 0.8;
  }
  function newStreak(anywhere) {
    const d = 0.2 + Math.random() * 0.8;
    return { x: anywhere ? Math.random() * (W + 60) : 20 + Math.random() * (W + 80), y: anywhere ? Math.random() * WIN_BOT : 10 + Math.random() * 20,
      d, vx: -(60 + S.speed * 5) * d, vy: (140 + 80 * d) };
  }

  // ================= render: sky & distance =================
  let cloud = 0, fogCol = [0, 0, 0], moonA = 0;
  const MOON_X = 238, MOON_Y = 36;

  function drawSky() {
    const fl = S.flash;
    const top = mix(mix(S.skyTop, [22, 24, 34], cloud), [120, 120, 150], fl * 0.6);
    const bot = mix(mix(S.skyBot, [66, 64, 78], cloud), [190, 190, 210], fl * 0.6);
    const g = ctx.createLinearGradient(0, 0, 0, Y_FAR);

    ctx.fillStyle = g; ctx.fillRect(0, 0, W, Y_FAR + 1);

    const sa = S.stars * (1 - cloud);
    if (sa > 0.02) {
      for (let i = 0; i < 90; i++) {
        const tw = hash(i * 3 + 2);
        const x = ((hash(i * 3) * W - S.camD * 0.02) % W + W) % W, y = 18 + hash(i * 3 + 1) * (Y_FAR - 30);
        const a = sa * (0.45 + 0.55 * Math.sin(S.time * (1 + tw * 3) + tw * 20));

      ctx.beginPath(); ctx.arc(MOON_X, MOON_Y, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = rgba([190, 185, 170], moonA);
      ctx.fillRect(MOON_X - 2, MOON_Y - 2, 2, 2); ctx.fillRect(MOON_X + 2, MOON_Y + 2, 1, 1);
    }
    if (cloud > 0.02) {
      for (let i = 0; i < 16; i++) {
        const w = 60 + hash(i * 17) * 90, hh = 6 + hash(i * 19) * 12;
        const cx = ((hash(i * 23) * 700 - S.camD * 0.08 - S.time * 2) % 700 + 700) % 700 - 100;
        const cy = 14 + hash(i * 29) * 40;
        ctx.fillStyle = rgba(mix([34, 34, 46], [150, 150, 175], fl * 0.7), cloud * 0.75);
        ctx.fillRect(Math.round(cx + 6), Math.round(cy), Math.round(w - 12), 2);
        ctx.fillRect(Math.round(cx), Math.round(cy + 2), Math.round(w), Math.round(hh - 4));
        ctx.fillRect(Math.round(cx + 4), Math.round(cy + hh - 2), Math.round(w - 8), 2);
      }
    }
    if (S.bolt && S.boltT > 0) for (const [bx, by] of S.bolt) rect(bx, by, 1, 3, [240, 240, 255]);
    // city light pollution on the horizon
    const cityW = paramAt(S.camD, "stars");
    glow(CX, Y_FAR + 6, 200, [255, 120, 90], 0.12 * (1 - cityW) * (1 - cloud * 0.4));
  }

  function drawMountains() {

  function waterBand(x, y0, y1, grad, u) {

  // ---------- far layer ----------
  function drawFar() {
    const f = 0.35 + 0.35 * S.rain;
    const sh = c => mix(c, fogCol, f);
    const wg = ctx.createLinearGradient(0, Y_FAR, 0, Y_MID);
    wg.addColorStop(0, rgb(sh([14, 20, 40]))); wg.addColorStop(1, rgb(sh([10, 16, 32])));
    const GROUND = { city: [18, 16, 28], suburb: [14, 16, 22], country: [10, 16, 16], forest: [8, 12, 12], tunnel: [8, 12, 12] };
    for (let x = 0; x < W; x++) {
      const s = sAt(x, K_FAR), b = biomeAt(s);
      if (b === "coast" || b === "bridge") waterBand(x, Y_FAR, Y_MID, wg, Math.floor(s));
      else rect(x, Y_FAR, 1, Y_MID - Y_FAR, sh(GROUND[b]));
    }
    cells(K_FAR, 12, 40, (i, s, x, b) => {
      const h = hash(i * 3 + 1);
      if (b === "city" && h > 0.12) {
        const bw = 5 + hash(i * 5) * 9, bh = 10 + Math.pow(hash(i * 7), 1.5) * 40;
        const x0 = Math.round(x - bw / 2), y0 = Math.round(Y_FAR - bh);
        rect(x0, y0, bw, bh, sh([22, 20, 40]));
        for (let yy = 2; yy < bh - 1; yy += 3) for (let xx = 1; xx < bw - 1; xx += 2)
          if (h2(i * 131 + yy, xx) < 0.25) px(x0 + xx, y0 + yy, rgba(h2(i, yy * xx) < 0.75 ? [255, 196, 110] : [170, 210, 255], 0.85 - f * 0.5));
        if (bh > 40 && Math.sin(S.time * 3 + i) > 0.3) { px(x0 + (bw >> 1), y0 - 1, [255, 50, 50]); glow(x0 + (bw >> 1), y0 - 1, 4, [255, 40, 40], 0.5); }
      } else if (b === "suburb") {

          rect(x - bw / 2, Y_FAR - bh, bw, bh, sh([18, 18, 32]));
          if (hash(i * 9) > 0.4) px(x + hash(i * 11) * 4 - 2, Y_FAR - bh + 2, rgba([255, 190, 110], 0.7));
        }
        if (h < 0.03) pylon(x, 30, sh);
      } else if (b === "country") {

        if (h > 0.95) pylon(x, 26, sh);
      } else if (b === "forest" || b === "tunnel") {
        for (let j = 0; j < 2; j++) {
          const th = 7 + hash(i * 5 + j) * 9, tx = x + j * 4;
          for (let r = 0; r < th; r++) rect(tx - (r * 2.5) / th, Y_FAR - th + r, (r * 5) / th + 1, 1, sh([8, 16, 14]));

      } else if (b === "coast") {

        rect(x - bw / 2, Y_FAR - bh, bw, bh, sh([20, 18, 34]));
        for (let j = 0; j < 3; j++) if (hash(i * 13 + j) > 0.3) {

      }
    });
  }
  function pylon(x, h, sh) {
    const c = sh([30, 30, 40]), y1 = Y_FAR, y0 = Y_FAR - h;

  function midBuilding(x, i, sh) {
    const bw = Math.round((12 + hash(i * 5) * 12) * K_MID), bh = Math.round((16 + Math.pow(hash(i * 11), 1.3) * 34) * K_MID);
    const x0 = Math.round(x - bw / 2), y0 = Y_MID - bh;
    rect(x0, y0, bw, bh, sh([22 + hash(i) * 8, 20, 34]));
    rect(x0, y0, bw, 1, sh([40, 38, 52]));
    const p = 0.15 + hash(i * 13) * 0.5;
    for (let yy = 4; yy < bh - 6; yy += 4) for (let xx = 2; xx < bw - 3; xx += 4) {
      const v = h2(i * 1013 + yy, xx);

        if (tunnelRanges.some(([a, b]) => p.x >= a && p.x < b)) continue;
        const i = clamp(p.x | 0, 0, W - 1), br = 1 + Math.min(1, Lr[i] + Lg[i]) * 0.8;
        pxLine(p.x, p.y, p.x - p.vx * 0.025, p.y - p.vy * 0.025, rgba([170, 190, 235], (0.1 + p.d * 0.25) * br));
      }
      for (let j = 0; j < S.rain * 18; j++) {
        const x = Math.random() * W;
        if (!tunnelRanges.some(([a, b]) => x >= a && x < b)) px(x, Y_NEAR + Math.random() * 10, rgba([190, 200, 230], 0.5));
      }
    }
    if (S.flash > 0.02) { ctx.fillStyle = rgba([200, 200, 230], S.flash * 0.22); ctx.fillRect(0, 0, W, WIN_BOT); }
    ctx.restore();

    drawGlass();
    drawCabin();
  }

  // ================= pixel post-process (216 colours + Bayer dither) =================
  const LEVELS = [0, 16, 38, 72, 140, 255];
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const LO = new Uint8Array(256), FR = new Uint8Array(256), NEAR = new Uint8Array(256);
  for (let v = 0; v < 256; v++) {
    let i = 0; while (i < 4 && v >= LEVELS[i + 1]) i++;
    const a = LEVELS[i], b = LEVELS[Math.min(5, i + 1)];
    LO[v] = i; FR[v] = b > a ? Math.round(((v - a) / (b - a)) * 16) : 0;
    NEAR[v] = v - a < b - v ? i : Math.min(5, i + 1);
  }
  const indexBuf = new Uint8Array(W * H);
  function postProcess() {
    const img = ctx.getImageData(0, 0, W, H), d = img.data;
    const dither = S.dither;
    for (let y = 0, p = 0; y < H; y++) {
      for (let x = 0; x < W; x++, p++) {
        const o = p * 4, th = BAYER[(x & 3) + ((y & 3) << 2)];
        let r, g, b;
        if (dither) {
          r = LO[d[o]] + (FR[d[o]] > th ? 1 : 0);
          g = LO[d[o + 1]] + (FR[d[o + 1]] > th ? 1 : 0);
          b = LO[d[o + 2]] + (FR[d[o + 2]] > th ? 1 : 0);
        } else { r = NEAR[d[o]]; g = NEAR[d[o + 1]]; b = NEAR[d[o + 2]]; }
        if (r > 5) r = 5; if (g > 5) g = 5; if (b > 5) b = 5;
        indexBuf[p] = r * 36 + g * 6 + b;
        d[o] = LEVELS[r]; d[o + 1] = LEVELS[g]; d[o + 2] = LEVELS[b]; d[o + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    return indexBuf;
  }

  const hudArea = document.getElementById("hud-area"), hudTime = document.getElementById("hud-time");
  function frame(dt) {
    step(dt);
    render();
    const idx = postProcess();
    vctx.drawImage(low, 0, 0, view.width, view.height);
    hudArea.textContent = BIOMES[S.biome].name + (S.rain > 0.6 ? " ・ 大雨" : S.rain > 0.12 ? " ・ 雨" : "");
    hudTime.textContent = clockStr();
    return idx;
  }

  // ================= GIF encoder =================
  const PALETTE = new Uint8Array(256 * 3);
  for (let i = 0; i < 216; i++) {
    PALETTE[i * 3] = LEVELS[(i / 36) | 0]; PALETTE[i * 3 + 1] = LEVELS[((i / 6) | 0) % 6]; PALETTE[i * 3 + 2] = LEVELS[i % 6];
  }
  function lzw(ix, out) {
    const min = 8, clear = 256, eoi = 257;
    let size = 9, next = 258, cur = 0, bits = 0;
    const dict = new Map();
    const bytes = [];
    const emit = c => { cur |= c << bits; bits += size; while (bits >= 8) { bytes.push(cur & 255); cur >>>= 8; bits -= 8; } };
    emit(clear);
    let prefix = ix[0];
    for (let i = 1; i < ix.length; i++) {
      const k = ix[i], key = prefix * 256 + k, v = dict.get(key);
      if (v !== undefined) { prefix = v; continue; }
      emit(prefix);
      if (next < 4095) { dict.set(key, next++); if (next > (1 << size) && size < 12) size++; }
      else { emit(clear); dict.clear(); size = 9; next = 258; }
      prefix = k;
    }
    emit(prefix); emit(eoi);
    if (bits > 0) bytes.push(cur & 255);
    out.push(min);
    for (let i = 0; i < bytes.length; i += 255) {
      const n = Math.min(255, bytes.length - i);
      out.push(n); for (let j = 0; j < n; j++) out.push(bytes[i + j]);
    }
    out.push(0);
  }
  function gifHeader(w, h) {
    const o = [];
    for (const ch of "GIF89a") o.push(ch.charCodeAt(0));
    o.push(w & 255, w >> 8, h & 255, h >> 8, 0xf7, 0, 0);
    for (let i = 0; i < 768; i++) o.push(PALETTE[i]);
    o.push(0x21, 0xff, 0x0b); for (const ch of "NETSCAPE2.0") o.push(ch.charCodeAt(0));
    o.push(0x03, 0x01, 0, 0, 0);
    return o;
  }
  function gifFrame(o, ix, w, h, delayCs) {
    o.push(0x21, 0xf9, 0x04, 0x04, delayCs & 255, delayCs >> 8, 0, 0);
    o.push(0x2c, 0, 0, 0, 0, w & 255, w >> 8, h & 255, h >> 8, 0);
    lzw(ix, o);
  }
  function upscale(ix, k) {
    if (k === 1) return ix.slice();
    const w = W * k, out = new Uint8Array(w * H * k);
    for (let y = 0; y < H * k; y++) {
      const sy = ((y / k) | 0) * W, row = y * w;
      for (let x = 0; x < w; x++) out[row + x] = ix[sy + ((x / k) | 0)];
    }
    return out;
  }
  async function makeGif(seconds = 8, scale = 2, fps = 20, onProgress) {
    const n = Math.round(seconds * fps), w = W * scale, h = H * scale;
    const out = gifHeader(w, h);
    const delay = Math.round(100 / fps);
    for (let i = 0; i < n; i++) {
      const ix = frame(1 / fps);
      gifFrame(out, upscale(ix, scale), w, h, delay);
      if (i % 4 === 3) { onProgress && onProgress(i + 1, n); await new Promise(r => setTimeout(r, 0)); }
    }
    out.push(0x3b);
    return new Uint8Array(out);
  }

  // ================= navigation =================
  function jumpTo(b) {
    let i = segIndex(S.camD) + 1;
    for (let n = 0; n < 400; n++, i++) {
      while (route.length <= i) extendRoute(route[route.length - 1].s1 + 1);
      if (route[i].b === b) { goTo(route[i]); return true; }
    }
    return false;
  }
  function nextArea() {
    const i = segIndex(S.camD);
    extendRoute(route[i].s1 + 10);
    goTo(route[i + 1]);
  }
  function goTo(g) {
    S.camD = g.s0 + (g.b === "tunnel" || g.b === "bridge" ? 20 : 60);
    S.events.length = 0;
    S.skyTop = BIOMES[g.b].top.slice(); S.skyBot = BIOMES[g.b].bot.slice(); S.stars = BIOMES[g.b].stars;
    S.nextEvent = 1.5;
  }

  // ================= main loop & UI =================
  let last = performance.now(), busy = false;
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!S.paused && !busy) frame(dt);
    requestAnimationFrame(loop);
  }

  const status = document.getElementById("status");
  const out = document.getElementById("out");
  const wButtons = [...document.querySelectorAll("[data-w]")];
  function setWeather(w) {
    S.weather = w;
    wButtons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.w === w)));
  }
  wButtons.forEach(b => b.addEventListener("click", () => setWeather(b.dataset.w)));
  document.getElementById("speed").addEventListener("input", e => { S.baseSpeed = +e.target.value; });
  const areaSel = document.getElementById("area");
  areaSel.addEventListener("change", () => { if (areaSel.value) jumpTo(areaSel.value); areaSel.value = ""; });
  document.getElementById("next").addEventListener("click", nextArea);
  const dBtn = document.getElementById("dither");
  dBtn.addEventListener("click", () => { S.dither = !S.dither; dBtn.setAttribute("aria-pressed", String(S.dither)); });
  const pBtn = document.getElementById("pause");
  function togglePause() { S.paused = !S.paused; pBtn.setAttribute("aria-pressed", String(S.paused)); pBtn.textContent = S.paused ? "再生" : "一時停止"; }
  pBtn.addEventListener("click", togglePause);
  window.addEventListener("keydown", e => { if (e.code === "Space" && e.target === document.body) { e.preventDefault(); togglePause(); } });

  const gifBtn = document.getElementById("gif");
  gifBtn.addEventListener("click", async () => {
    busy = true; gifBtn.disabled = true;
    const sec = +document.getElementById("gifsec").value, sc = +document.getElementById("gifscale").value;
    try {
      const bytes = await makeGif(sec, sc, 20, (i, n) => { status.textContent = `GIF 生成中… ${i}/${n} フレーム`; });
      const url = URL.createObjectURL(new Blob([bytes], { type: "image/gif" }));
      const img = new Image(); img.src = url; img.alt = "書き出したドライブGIF";
      out.prepend(img);
      status.textContent = `GIF ができました（${(bytes.length / 1024 / 1024).toFixed(1)} MB）。右クリック／長押しで保存できます。`;
    } catch (err) {
      status.textContent = `GIF の生成に失敗しました: ${err.message}`;
    } finally { busy = false; gifBtn.disabled = false; last = performance.now(); }
  });

  const webmBtn = document.getElementById("webm");
  let rec = null;
  webmBtn.addEventListener("click", () => {
    if (rec) { rec.stop(); return; }
    if (!view.captureStream || typeof MediaRecorder === "undefined") { status.textContent = "このブラウザは動画録画に対応していません。GIF をお使いください。"; return; }
    const chunks = [];
    const type = ["video/webm;codecs=vp9", "video/webm", "video/mp4"].find(t => MediaRecorder.isTypeSupported(t)) || "";
    rec = new MediaRecorder(view.captureStream(30), type ? { mimeType: type, videoBitsPerSecond: 8e6 } : undefined);
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => {
      const v = document.createElement("video");
      v.src = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType || "video/webm" }));
      v.controls = true; v.loop = true; v.muted = true; v.autoplay = true;
      out.prepend(v);
      status.textContent = "録画しました。動画の右クリック／長押しで保存できます。";
      rec = null; webmBtn.textContent = "動画を録画";
    };
    rec.start();
    webmBtn.textContent = "録画を止める";
    status.textContent = "録画中… もう一度押すと停止します。";
  });

  for (let i = 0; i < 30; i++) step(1 / 30);
  window.NightDrive = { S, makeGif, frame, setWeather, jumpTo, spawnSpecial, route };
  requestAnimationFrame(loop);
})();
</script>
