<!doctype html>
<title>Forest Labyrinth</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
  :root { color-scheme: dark; --ink: #eaf0e6; --dim: #93a394; --ground: #070b09; --panel: #111a15; --line: #28402f; --gold: #f0cc70; --cool: #9fd6ff;
    --font: "DotGothic16", "MS Gothic", "Osaka-Mono", ui-monospace, monospace; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 15px; padding-inline: 16px; padding-block: 16px 24px; box-sizing: border-box; }
  .wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .screen { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--line); }
  #view { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair; touch-action: none; }
  #view:focus-visible { outline: 2px solid var(--cool); outline-offset: 2px; }
  .pad { display: none; gap: 8px; justify-content: space-between; user-select: none; -webkit-user-select: none; }
  .pad div { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 44px); gap: 4px; }
  .pad button { padding: 0; font-size: 18px; touch-action: none; }
  .pad .fire { display: flex; gap: 6px; align-items: center; } .pad .fire button { width: 76px; height: 76px; border-radius: 50%; font-size: 15px; }
  @media (pointer: coarse) { .pad { display: flex; } }
  h1 { margin: 0; font-size: 22px; font-weight: 400; letter-spacing: 0.08em; color: var(--gold); }
  .sub { color: var(--dim); font-size: 13px; margin: 4px 0 0; }
  .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .label { color: var(--dim); font-size: 12px; letter-spacing: 0.1em; }
  button, select { font-family: var(--font); font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); padding: 6px 10px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  button.play { border-color: #6a5a2a; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--cool); outline-offset: 2px; }
  button:disabled { opacity: 0.5; cursor: wait; }
  input[type="range"] { accent-color: var(--gold); width: 110px; }
  .log { margin: 0; padding: 10px 12px; list-style: none; background: var(--panel); border: 1px solid var(--line); min-height: 140px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .log li { display: flex; gap: 8px; } .log time { color: var(--dim); font-variant-numeric: tabular-nums; flex: none; }
  .log li.wx { color: var(--cool); } .log li.ev { color: var(--gold); } .log li.bt { color: #ff9c8c; } .log li.it { color: #b8f0a0; }
  #status { color: var(--cool); font-size: 13px; min-height: 1.2em; }
  .out { display: flex; flex-direction: column; gap: 8px; } .out img, .out video { max-width: 100%; image-rendering: pixelated; border: 1px solid var(--line); }
  .hint { color: var(--dim); font-size: 12px; line-height: 1.7; margin: 0; }
  kbd { font-family: var(--font); border: 1px solid var(--line); padding: 0 4px; }
</style>
<body>
<div class="wrap">
  <div class="screen"><canvas id="view" width="1024" height="576" tabindex="0" aria-label="森の迷宮の一人称視点。WASDで移動、矢印キーかドラッグで見回し、スペースかクリックで魔法を撃つ"></canvas></div>
  <div class="pad" aria-label="タッチ操作">
    <div><span></span><button data-k="KeyW" aria-label="前へ">▲</button><span></span><button data-k="ArrowLeft" aria-label="左を向く">◀</button><button data-k="KeyS" aria-label="後ろへ">▼</button><button data-k="ArrowRight" aria-label="右を向く">▶</button></div>
    <div class="fire"><button data-k="Digit1" aria-label="魔法を切り替える">切替</button><button data-k="Space" aria-label="魔法を撃つ">撃つ</button></div>
  </div>
  <div>
    <h1>森の迷宮 ― 封印の主</h1>
    <p class="sub">レイキャスティングの一人称RPG / 256×144 ピクセル / 216色</p>
  </div>
  <div class="group">
    <button id="music" class="play" aria-pressed="false">音を出す</button><label class="label" for="vol">音量</label><input id="vol" type="range" min="0" max="100" value="70">
    <button id="bgm" aria-pressed="true">音楽</button><button id="auto" aria-pressed="true">自動プレイ</button><button id="restart">新しい迷宮</button>
  </div>
  <div class="group" role="group" aria-label="天気"><span class="label">天気</span><button data-w="auto" aria-pressed="true">自動</button><button data-w="rain" aria-pressed="false">雨あり</button><button data-w="dry" aria-pressed="false">雨なし</button></div>
  <div class="group" role="group" aria-label="出来事"><span class="label">出来事</span><button data-ev="ambush">狼の群れ</button><button data-ev="bats">コウモリの群れ</button><button data-ev="fairy">妖精</button><button data-ev="berry">木の実</button><button data-ev="levelup">レベルアップ</button><button data-ev="boss">主の間へ</button></div>
  <div class="group"><button id="pause" aria-pressed="false">一時停止</button><label class="label" for="gifsec">GIF</label>
    <select id="gifsec"><option value="4">4秒</option><option value="8" selected>8秒</option><option value="12">12秒</option></select>
    <select id="gifscale" aria-label="GIFサイズ"><option value="1">256×144</option><option value="2" selected>512×288</option></select>
    <button id="gif">GIFを作る</button><button id="webm">動画を録画</button><span class="label" id="perf"></span></div>
  <ul class="log" id="log" aria-live="polite"></ul>
  <p class="hint">森の迷宮を探索し、宝箱を開け、鍵を見つけて封印の扉を開き、奥に眠る「森の主」を倒します。自動プレイでは勇者が自分で探索して戦います。操作すると8秒間は手動になります。<br>
  <kbd>W</kbd><kbd>S</kbd> 前後 / <kbd>A</kbd><kbd>D</kbd> 横歩き / <kbd>←</kbd><kbd>→</kbd>・ドラッグ 見回す / <kbd>Space</kbd>・クリック 撃つ / <kbd>1</kbd> 魔法の矢 <kbd>2</kbd> 火球 / <kbd>H</kbd> 薬を飲む / <kbd>M</kbd> 地図 / <kbd>P</kbd> 一時停止</p>
  <div id="status" role="status"></div><div class="out" id="out"></div>
</div>
<script>
(() => {
  "use strict";
  const W = 256, H = 144, FOV = 1.15, PROJ = (W / 2) / Math.tan(FOV / 2), EYE = 0.5, WH = 1.4, TX = 32;
  const [low, lctx] = mk(W, H);
  const view = document.getElementById("view"), vctx = view.getContext("2d"); vctx.imageSmoothingEnabled = false;
  const PFONT = '"DotGothic16", "MS Gothic", monospace';
  if (document.fonts && document.fonts.load) document.fonts.load(`8px ${PFONT}`).catch(() => {});

  // ---------- helpers ----------
  function mk(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d", { willReadFrequently: true }); x.imageSmoothingEnabled = false; return [c, x]; }
  function hash(i) { let h = Math.imul((i | 0) ^ 0x9e3779b9, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
  const h2 = (x, y) => hash(Math.imul(x | 0, 73856093) ^ Math.imul(y | 0, 19349663));

  const lerp = (a, b, t) => a + (b - a) * t;
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${clamp(a, 0, 1).toFixed(3)})`;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[(Math.random() * a.length) | 0];
  const wrap = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
  function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  // ---------- dungeon generation ----------
  // '#': tree wall, 'R': ruin wall, 'L': sealed gate, '.': floor
  const N = 31;
  let G, rng, WORLD;
  const cell = (x, y) => (x < 0 || y < 0 || x >= N || y >= N) ? "#" : G[y | 0][x | 0];
  const solid = (x, y) => cell(x, y) !== ".";
  let BLOCKC = new Set();
  function generate(seed) {
    rng = mulberry(seed); BLOCKC = new Set();
    G = Array.from({ length: N }, () => Array(N).fill("#"));
    const arena = (x, y) => x >= 22 && y >= 22;
    const seen = new Set(), stack = [[1, 1]]; seen.add("1,1"); G[1][1] = ".";
    while (stack.length) {
      const [cx, cy] = stack[stack.length - 1];
      const nb = [[2, 0], [-2, 0], [0, 2], [0, -2]].map(([dx, dy]) => [cx + dx, cy + dy, dx, dy]).filter(([x, y]) => x > 0 && y > 0 && x < N - 1 && y < N - 1 && !seen.has(`${x},${y}`) && !arena(x, y));

    // loops so it is not a perfect maze
    for (let i = 0; i < 150; i++) { const x = 1 + ((rng() * (N - 2)) | 0), y = 1 + ((rng() * (N - 2)) | 0); if (G[y][x] === "#" && !arena(x, y) && ((x % 2 === 0 && y % 2 === 1) || (x % 2 === 1 && y % 2 === 0))) { const h = G[y][x - 1] === "." && G[y][x + 1] === ".", v = G[y - 1] && G[y - 1][x] === "." && G[y + 1][x] === "."; if (h || v) G[y][x] = "."; } }
    // clearings
    const rooms = [];
    for (let i = 0; i < 80 && rooms.length < 8; i++) {
      const cx = 3 + 2 * ((rng() * 12) | 0), cy = 3 + 2 * ((rng() * 12) | 0), r = rooms.length < 3 ? 2 : 1;
      if (arena(cx + 3, cy + 3) || cx + r > N - 2 || cy + r > N - 2 || (cx < 6 && cy < 6) || rooms.some(q => Math.abs(q[0] - cx) < 6 && Math.abs(q[1] - cy) < 6)) continue;
      for (let y = cy - r; y <= cy + r; y++) for (let x = cx - r; x <= cx + r; x++) G[y][x] = ".";
      rooms.push([cx, cy]);
    }
    // ruins in the north-east
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (G[y][x] === "#" && x > 15 && y < 14) G[y][x] = "R";
    // boss arena, sealed by one gate
    for (let y = 22; y < N; y++) for (let x = 22; x < N; x++) G[y][x] = (x === 22 || y === 22 || x === N - 1 || y === N - 1) ? "R" : ".";
    const gate = [22, 25]; G[25][22] = "L"; G[25][21] = "."; G[25][20] = G[25][20] === "#" ? "." : G[25][20];
    // reachability from the start
    const dist = bfsFrom(1, 1);
    let far = [1, 1], fd = 0; const dead = [], floors = [];
    for (let y = 1; y < N - 1; y++) for (let x = 1; x < N - 1; x++) {

      floors.push([x, y, d]); if (d > fd) { fd = d; far = [x, y]; }
      const walls = [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(([dx, dy]) => G[y + dy][x + dx] !== ".").length;
      if (walls === 3 && d > 4) dead.push([x, y, d]);
    }
    const used = new Set([`${far[0]},${far[1]}`, "1,1"]);
    const take = (list, fn) => { for (let i = 0; i < 200; i++) { const c = list[(rng() * list.length) | 0]; if (c && !used.has(`${c[0]},${c[1]}`) && (!fn || fn(c))) { used.add(`${c[0]},${c[1]}`); return c; } } return null; };
    const W0 = { props: [], items: [], chests: [], enemies: [], lights: [], rooms, gate, far };
    W0.items.push({ k: "key", x: far[0] + 0.5, y: far[1] + 0.5 });
    // chests at dead ends
    dead.sort((a, b) => b[2] - a[2]);
    const contents = ["potion", "potion", "ether", "gold", "gold", "mimic", "potion", "ether"];
    for (let i = 0; i < 7; i++) { const c = take(dead); if (c) W0.chests.push({ x: c[0] + 0.5, y: c[1] + 0.5, open: false, has: contents[i] }); }
    // clearings: shrine, merchant, fairy spring, mushroom rings
    rooms.forEach(([cx, cy], i) => {
      const kind = ["ring", "shrine", "merchant", "spring", "ring", "shrine", "ring", "spring"][i];
      used.add(`${cx},${cy}`);
      if (kind === "shrine") W0.props.push({ k: "crystal", x: cx + 0.5, y: cy + 0.5, solid: true, light: [0.4, 0.8, 1.2, 1.2] });
      if (kind === "merchant") { W0.props.push({ k: "merchant", x: cx + 0.5, y: cy - 0.1, solid: true }); W0.props.push({ k: "fire", x: cx + 0.5, y: cy + 0.9, light: [1.4, 0.8, 0.3, 1.6] }); }
      if (kind === "ring" || kind === "spring") for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI * 2; W0.props.push({ k: "mush", x: cx + 0.5 + Math.cos(a) * 1.1, y: cy + 0.5 + Math.sin(a) * 1.1, light: k % 2 ? [0.3, 0.9, 1, 0.5] : null }); }
      if (kind === "spring") W0.props.push({ k: "pond", x: cx + 0.5, y: cy + 0.5 });
    });
    // decoration and torches
    for (const [x, y] of floors) {
      const n = rng();
      if (x > 15 && y < 14 && n < 0.08 && !used.has(`${x},${y}`)) W0.props.push({ k: "torch", x: x + 0.5, y: y + 0.5, solid: false, light: [1.4, 0.8, 0.35, 1.3] });
      else if (n < 0.1) W0.props.push({ k: pick(["fern", "rock", "fern", "mushs"]), x: x + 0.2 + rng() * 0.6, y: y + 0.2 + rng() * 0.6 });
    }
    for (const p of W0.props) if (p.solid) BLOCKC.add((p.y | 0) * N + (p.x | 0));
    W0.props.push({ k: "torch", x: 21.5, y: 24.3, light: [1.4, 0.8, 0.35, 1.3] }, { k: "torch", x: 21.5, y: 25.7, light: [1.4, 0.8, 0.35, 1.3] });
    // monsters
    for (let i = 0; i < 26; i++) {
      const c = take(floors, c => c[2] > 7); if (!c) break;
      const ruins = c[0] > 15 && c[1] < 14;
      const k = ruins ? pick(["skel", "skel", "bat", "kinoko"]) : pick(["slime", "slime", "wolf", "kinoko", "bat", "wolf"]);
      W0.enemies.push(makeEnemy(k, c[0] + 0.5, c[1] + 0.5));
    }
    W0.enemies.push(makeEnemy("skel", far[0] + 0.5 + (G[far[1]][far[0] + 1] === "." ? 1 : 0), far[1] + 0.5 + (G[far[1] + 1][far[0]] === "." ? 1 : 0)));
    W0.enemies.push(makeEnemy("boss", 26.5, 26.5));
    return W0;
  }
  function bfsFrom(sx, sy, pass = (x, y) => G[y][x] === "." && !BLOCKC.has(y * N + x)) {
    const d = new Int16Array(N * N).fill(-1), q = [sy * N + sx]; d[sy * N + sx] = 0;
    for (let h = 0; h < q.length; h++) { const k = q[h], x = k % N, y = (k / N) | 0; for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue; const nk = ny * N + nx; if (d[nk] < 0 && pass(nx, ny)) { d[nk] = d[k] + 1; q.push(nk); } } }

  // ---------- wall textures ----------
  function makeTex(fn) { const th = Math.round(WH * TX), data = new Uint8Array(TX * th * 3), em = new Uint8Array(TX * th); for (let y = 0; y < th; y++) for (let x = 0; x < TX; x++) { const [c, e] = fn(x, y, th), o = y * TX + x; data.set(c.map(v => clamp(v, 0, 255)), o * 3); em[o] = e ? 1 : 0; } return { w: TX, h: th, data, em }; }
  const TEX = {
    "#": makeTex((x, y, th) => { const n = h2(x, y), trunk = (x % 12 < 3 || (x + 5) % 17 < 2) && y > th * 0.38; if (trunk) return [[52 + n * 16 - (x % 12 === 0 ? 14 : 0), 38 + n * 10, 28], 0]; const lb = h2(x >> 2, y >> 2); return [lb > 0.6 ? [40, 84 + n * 20, 44] : lb > 0.3 ? [30, 64 + n * 16, 36] : [22, 44 + n * 10, 28], 0]; }),
    R: makeTex((x, y) => { const row = (y / 6) | 0, off = row % 2 ? 5 : 0, mort = y % 6 === 5 || (x + off) % 10 === 0, n = h2(x, y); if (mort) return [[46, 46, 50], 0]; const moss = h2(x >> 2, (y >> 2) + 40) > 0.72; return [moss ? [58, 90, 52] : [104 + n * 20, 100 + n * 18, 96 + n * 16], 0]; }),
    L: makeTex((x, y, th) => { const bar = x % 6 < 2, rail = y % 14 < 2; if (bar || rail) return [[70, 70, 80], 0]; const rune = (y > 18 && y < 28) && ((x + y) % 7 === 0 || x === 16); return rune ? [[120, 220, 255], 1] : [[14, 18, 24], 0]; }),
  };

  // ---------- sprite art ----------
  function art(pw, ph, w, h, draw) {
    const [c, x] = mk(pw, ph), [ec, ex] = mk(pw, ph);
    const g = { x, ex };
    const R = (px, py, pw2, ph2, col, em) => { x.fillStyle = rgb(col); x.fillRect(Math.round(px), Math.round(py), Math.round(pw2), Math.round(ph2)); if (em) { ex.fillStyle = x.fillStyle; ex.fillRect(Math.round(px), Math.round(py), Math.round(pw2), Math.round(ph2)); } };

    draw(R, D, g);

  }
  const ART = {};
  function buildArt() {
    for (const f of [0, 1]) {
      ART["slime" + f] = art(20, 16, 0.62, 0.5, (R, D) => { const sq = f ? 1 : 0; for (let y = 3 + sq * 2; y < 16; y++) { const ww = Math.min(9, 3 + (y - 3 - sq * 2) * 1.2); R(10 - ww, y, ww * 2, 1, y > 12 ? [40, 130, 60] : [70, 200, 90]); } R(5, 7 + sq, 3, 3, [255, 255, 255]); R(12, 7 + sq, 3, 3, [255, 255, 255]); R(6, 8 + sq, 1, 2, [20, 20, 20]); R(13, 8 + sq, 1, 2, [20, 20, 20]); R(8, 12, 4, 1, [30, 80, 40]); R(7, 5 + sq * 2, 2, 1, [180, 255, 190]); });
      ART["wolf" + f] = art(28, 20, 0.92, 0.66, (R) => { R(6, 6, 16, 8, [110, 112, 120]); R(4, 7, 4, 5, [120, 122, 130]); R(20, 3, 7, 7, [120, 122, 130]); R(21, 1, 2, 3, [100, 100, 110]); R(24, 1, 2, 3, [100, 100, 110]); R(26, 7, 2, 2, [40, 40, 40]); R(22, 5, 2, 1, [255, 220, 60], true); R(0, 5 + f, 5, 2, [100, 100, 110]);
        const l = f ? [[7, 14], [11, 16], [16, 14], [19, 16]] : [[8, 16], [11, 14], [17, 16], [20, 14]]; for (const [lx, ly] of l) R(lx, 14, 2, ly - 14 + 4, [90, 90, 98]); R(8, 12, 12, 2, [150, 150, 160]); });

    explore: { bpm: 100, prog: [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]], scale: [69, 71, 72, 74, 76, 79, 81], lead: "triangle", drums: [1, 0, 0, 0, 0, 0, 2, 0, 1, 0, 1, 0, 0, 0, 2, 0], arp: 0.5 },
    battle: { bpm: 144, prog: [[52, 55, 59], [48, 52, 55], [50, 53, 57], [47, 51, 54]], scale: [64, 66, 67, 69, 71, 72, 74, 76], lead: "square", drums: [1, 0, 3, 0, 2, 0, 3, 0, 1, 0, 3, 1, 2, 0, 3, 3], arp: 1 },
    boss: { bpm: 156, prog: [[45, 48, 51], [46, 49, 53], [45, 48, 51], [44, 47, 50]], scale: [57, 58, 60, 63, 64, 66, 69, 70], lead: "sawtooth", drums: [1, 3, 3, 1, 2, 3, 1, 3, 1, 3, 3, 1, 2, 3, 2, 2], arp: 1 },
    victory: { bpm: 120, prog: [[60, 64, 67], [65, 69, 72], [67, 71, 74], [60, 64, 67]], scale: [72, 74, 76, 79, 81, 84], lead: "square", drums: [1, 0, 0, 0, 2, 0, 0, 0, 1, 0, 1, 0, 2, 0, 0, 0], arp: 1 },
  };
  let melI = 3;
  function musicChange() { if (live()) { Snd.stepI = 0; if (S.mode === "victory") sfx("fanfare"); } }
  function audioUpdate(dt) {
    if (!live()) return;
    const ac = Snd.ac, n = Snd.n, t = ac.currentTime;
    n.rain.gain.setTargetAtTime(S.rain * 0.08, t, 0.3); n.wind.gain.setTargetAtTime(0.012 + 0.008 * Math.sin(S.time * 0.3), t, 0.5);

    const song = SONGS[S.mode], st = 60 / song.bpm / 4;
    while (Snd.next < t + 0.15) {
      const tt = Snd.next, i = Snd.stepI % 16, bar = Math.floor(Snd.stepI / 16) % 4, ch = song.prog[bar], m = n.music;
      if (i % 4 === 0 || (S.mode !== "explore" && i % 2 === 0)) osc("triangle", mf(ch[0] - 12), tt, st * 1.8, envG(tt, 0.005, 0.22, st * 1.8, m));
      if (Math.random() < song.arp || i % 2 === 0) { const a = ch[(i >> (S.mode === "explore" ? 1 : 0)) % 3] + 12; osc("square", mf(a), tt, st * 0.8, envG(tt, 0.002, 0.03, st * 0.8, m)); }
      const dr = song.drums[i];
      if (dr === 1) { const o = osc("sine", 120, tt, 0.15, envG(tt, 0.002, 0.3, 0.15, m)); o.frequency.exponentialRampToValueAtTime(45, tt + 0.12); }
      if (dr === 2) noise(tt, 0.12, 0.12, "bandpass", 1800, m);
      if (dr === 3) noise(tt, 0.03, 0.05, "highpass", 7000, m);
      if (i % 4 === 0 && Math.random() < 0.75) { melI = clamp(melI + pick([-2, -1, 1, 1, 2, 0]), 0, song.scale.length - 1); const len = st * pick([2, 4, 4, 6]); osc(song.lead, mf(song.scale[melI]), tt, len, envG(tt, 0.01, song.lead === "triangle" ? 0.09 : 0.035, len, m)); }
      Snd.next += st; Snd.stepI++;
    }
  }
  function sfx(k) {
    if (!live()) return;
    const ac = Snd.ac, t = ac.currentTime, m = Snd.n.master;
    const sweep = (type, f0, f1, dur, vol) => { const o = osc(type, f0, t, dur, envG(t, 0.002, vol, dur, m)); o.frequency.exponentialRampToValueAtTime(f1, t + dur); };
    switch (k) {
      case "bolt": sweep("square", 1400, 300, 0.12, 0.06); break;
      case "fire": noise(t, 0.4, 0.15, "lowpass", 1200); sweep("sawtooth", 300, 80, 0.3, 0.08); break;
      case "boom": noise(t, 0.6, 0.35, "lowpass", 700); sweep("sine", 90, 30, 0.5, 0.4); break;
      case "hit": noise(t, 0.06, 0.2, "bandpass", 2500); sweep("square", 500, 200, 0.06, 0.05); break;
      case "edie": sweep("square", 700, 60, 0.35, 0.07); noise(t, 0.25, 0.1, "bandpass", 900); break;
      case "bossdie": for (let i = 0; i < 6; i++) { noise(t + i * 0.25, 0.6, 0.3, "lowpass", 600); } sweep("sawtooth", 200, 30, 2.5, 0.2); break;
      case "hurt": sweep("sawtooth", 220, 80, 0.25, 0.12); break;
      case "die": for (const [f, d] of [[392, 0], [330, 0.3], [262, 0.6], [196, 0.9]]) osc("triangle", f, t + d, 0.5, envG(t + d, 0.01, 0.12, 0.5, m)); break;
      case "pickup": for (const [f, d] of [[880, 0], [1175, 0.06], [1568, 0.12]]) osc("square", f, t + d, 0.1, envG(t + d, 0.002, 0.05, 0.1, m)); break;
      case "coin": for (const [f, d] of [[1319, 0], [1976, 0.07]]) osc("square", f, t + d, 0.2, envG(t + d, 0.002, 0.05, 0.2, m)); break;
      case "chest": sweep("sawtooth", 120, 200, 0.3, 0.05); for (const [f, d] of [[659, 0.25], [784, 0.35], [1047, 0.45]]) osc("square", f, t + d, 0.2, envG(t + d, 0.002, 0.05, 0.2, m)); break;
      case "levelup": for (const [f, d] of [[523, 0], [659, 0.1], [784, 0.2], [1047, 0.3], [784, 0.45], [1047, 0.55]]) osc("square", f, t + d, 0.18, envG(t + d, 0.002, 0.07, 0.18, m)); break;
      case "fanfare": for (const [f, d, l] of [[523, 0, 0.15], [523, 0.15, 0.15], [523, 0.3, 0.15], [659, 0.45, 0.5], [587, 1, 0.2], [659, 1.2, 0.2], [784, 1.4, 0.8]]) osc("square", f, t + d, l, envG(t + d, 0.005, 0.07, l, m)); break;
      case "heal": for (let i = 0; i < 8; i++) osc("sine", 1200 + i * 180, t + i * 0.05, 0.3, envG(t + i * 0.05, 0.002, 0.04, 0.3, Snd.n.conv)); break;
      case "door": noise(t, 1.4, 0.3, "lowpass", 200); sweep("sawtooth", 60, 40, 1.4, 0.15); break;
      case "step": noise(t, 0.05, 0.03, "bandpass", S.rain > 0.3 ? 1400 : 700); break;
      case "arrow": noise(t, 0.15, 0.08, "highpass", 3000); break;
      case "spore": noise(t, 0.2, 0.08, "bandpass", 600); break;
      case "roar": { const o = osc("sawtooth", 90, t, 1.8, envG(t, 0.1, 0.3, 1.8, m)); o.frequency.linearRampToValueAtTime(60, t + 1.8); const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = 18; lg.gain.value = 20; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t + 1.8); noise(t, 1.5, 0.2, "lowpass", 400); break; }
      case "slam": sweep("sine", 80, 30, 0.5, 0.5); noise(t, 0.4, 0.3, "lowpass", 300); break;
      case "howl": { const o = osc("sine", 400, t, 1.6, envG(t, 0.3, 0.06, 1.6, Snd.n.conv)); o.frequency.linearRampToValueAtTime(700, t + 0.6); o.frequency.linearRampToValueAtTime(500, t + 1.6); break; }
      case "screech": for (let i = 0; i < 5; i++) sweep("square", 2600 + i * 200, 1800, 0.08, 0.02); break;
      case "thunder": noise(t, 3, 0.4, "lowpass", 250); break;
    }
  }

  // ---------- GIF ----------
  const PALETTE = new Uint8Array(768);
  for (let i = 0; i < 216; i++) { PALETTE[i * 3] = LEVELS[(i / 36) | 0]; PALETTE[i * 3 + 1] = LEVELS[((i / 6) | 0) % 6]; PALETTE[i * 3 + 2] = LEVELS[i % 6]; }
  function lzw(ix, out) {
    let size = 9, next = 258, cur = 0, bits = 0; const dict = new Map(), bytes = [];
    const emit = c => { cur |= c << bits; bits += size; while (bits >= 8) { bytes.push(cur & 255); cur >>>= 8; bits -= 8; } };
    emit(256); let prefix = ix[0];
    for (let i = 1; i < ix.length; i++) { const k = ix[i], key = prefix * 256 + k, v = dict.get(key); if (v !== undefined) { prefix = v; continue; } emit(prefix); if (next < 4095) { dict.set(key, next++); if (next > (1 << size) && size < 12) size++; } else { emit(256); dict.clear(); size = 9; next = 258; } prefix = k; }
    emit(prefix); emit(257); if (bits > 0) bytes.push(cur & 255);
    out.push(8); for (let i = 0; i < bytes.length; i += 255) { const n = Math.min(255, bytes.length - i); out.push(n); for (let j = 0; j < n; j++) out.push(bytes[i + j]); } out.push(0);
  }
  function upscale(ix, k) { if (k === 1) return ix.slice(); const w = W * k, o = new Uint8Array(w * H * k); for (let y = 0; y < H * k; y++) { const sy = ((y / k) | 0) * W, row = y * w; for (let x = 0; x < w; x++) o[row + x] = ix[sy + ((x / k) | 0)]; } return o; }
  async function makeGif(seconds = 8, scale = 2, fps = 15, onProgress) {
    const n = Math.round(seconds * fps), w = W * scale, h = H * scale, delay = Math.round(100 / fps);
    const out = []; for (const ch of "GIF89a") out.push(ch.charCodeAt(0));
    out.push(w & 255, w >> 8, h & 255, h >> 8, 0xf7, 0, 0); for (let i = 0; i < 768; i++) out.push(PALETTE[i]);
    out.push(0x21, 0xff, 0x0b); for (const ch of "NETSCAPE2.0") out.push(ch.charCodeAt(0)); out.push(3, 1, 0, 0, 0);
    const was = S.paused; S.paused = false;
    for (let i = 0; i < n; i++) { const ix = frame(1 / fps); out.push(0x21, 0xf9, 4, 4, delay & 255, delay >> 8, 0, 0, 0x2c, 0, 0, 0, 0, w & 255, w >> 8, h & 255, h >> 8, 0); lzw(upscale(ix, scale), out); if (i % 4 === 3) { onProgress && onProgress(i + 1, n); await new Promise(r => setTimeout(r, 0)); } }
    S.paused = was; out.push(0x3b); return new Uint8Array(out);
  }

  // ---------- UI ----------
  let last = performance.now(), perfT = 0;
  const perf = document.getElementById("perf"), status = document.getElementById("status"), outEl = document.getElementById("out");
  function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; if (!busy) frame(dt); perfT += dt; if (perfT > 1) { perfT = 0; perf.textContent = `描画 ${msAvg.toFixed(1)} ms/フレーム`; } requestAnimationFrame(loop); }
  const mBtn = document.getElementById("music");
  mBtn.addEventListener("click", async () => { if (!Snd.ac && !audioInit()) { status.textContent = "このブラウザでは音を鳴らせません。"; return; } Snd.on = !Snd.on; if (Snd.on) { await Snd.ac.resume(); Snd.next = Snd.ac.currentTime + 0.1; } else await Snd.ac.suspend(); mBtn.setAttribute("aria-pressed", String(Snd.on)); mBtn.textContent = Snd.on ? "音を止める" : "音を出す"; });
  const bgmBtn = document.getElementById("bgm"); bgmBtn.addEventListener("click", () => { Snd.bgm = !Snd.bgm; bgmBtn.setAttribute("aria-pressed", String(Snd.bgm)); });
  const autoBtn = document.getElementById("auto"); autoBtn.addEventListener("click", () => { S.auto = !S.auto; S.manualT = 0; autoBtn.setAttribute("aria-pressed", String(S.auto)); status.textContent = S.auto ? "自動プレイ中。操作すると8秒間だけ手動になります。" : "手動プレイ。WASDで移動、矢印キーかドラッグで見回し、スペースかクリックで撃ちます。"; });
  document.getElementById("restart").addEventListener("click", () => newGame((Math.random() * 1e9) | 0));
  document.getElementById("vol").addEventListener("input", e => { Snd.vol = e.target.value / 100; if (Snd.n) Snd.n.master.gain.setTargetAtTime(Snd.vol, Snd.ac.currentTime, 0.05); });
  const wButtons = [...document.querySelectorAll("[data-w]")];
  wButtons.forEach(b => b.addEventListener("click", () => { S.weather = b.dataset.w; wButtons.forEach(x => x.setAttribute("aria-pressed", String(x === b))); }));
  document.querySelectorAll("[data-ev]").forEach(b => b.addEventListener("click", () => startEvent(b.dataset.ev)));
  const pBtn = document.getElementById("pause");
  function togglePause() { S.paused = !S.paused; pBtn.setAttribute("aria-pressed", String(S.paused)); pBtn.textContent = S.paused ? "再生" : "一時停止"; }
  pBtn.addEventListener("click", togglePause);
  const GAMEKEYS = ["KeyW", "KeyA", "KeyS", "KeyD", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"];
  const inGame = e => e.target === document.body || e.target === view;
  window.addEventListener("keydown", e => {
    if (!inGame(e)) return;
    if (GAMEKEYS.includes(e.code)) { e.preventDefault(); S.keys[e.code] = true; S.manualT = 8; }
    if (e.code === "Digit1") { P.weapon = 0; S.manualT = 8; } if (e.code === "Digit2") { P.weapon = 1; S.manualT = 8; }
    if (e.code === "KeyH") drink(); if (e.code === "KeyM") S.bigMap = !S.bigMap; if (e.code === "KeyP") togglePause();
  });
  window.addEventListener("keyup", e => { S.keys[e.code] = false; });
  let dragX = null, downT = 0;
  view.addEventListener("pointerdown", e => { dragX = e.clientX; downT = performance.now(); view.setPointerCapture(e.pointerId); view.focus(); S.manualT = 8; S.fire = true; });
  view.addEventListener("pointermove", e => { if (dragX === null) return; const dx = e.clientX - dragX; if (Math.abs(dx) > 2) S.fire = false; S.drag += dx * 0.006; dragX = e.clientX; S.manualT = 8; });
  const up = () => { dragX = null; S.fire = false; };
  view.addEventListener("pointerup", up); view.addEventListener("pointercancel", up);
  // touch pad
  document.querySelectorAll(".pad [data-k]").forEach(b => {
    const k = b.dataset.k;
    const on = e => { e.preventDefault(); S.manualT = 8; if (k === "Digit1") P.weapon = P.weapon ? 0 : 1; else S.keys[k] = true; };
    const off = () => { S.keys[k] = false; };
    b.addEventListener("pointerdown", on); b.addEventListener("pointerup", off); b.addEventListener("pointerleave", off); b.addEventListener("pointercancel", off);
  });
  const gifBtn = document.getElementById("gif");
  gifBtn.addEventListener("click", async () => {
    busy = true; gifBtn.disabled = true;
    try { const bytes = await makeGif(+document.getElementById("gifsec").value, +document.getElementById("gifscale").value, 15, (i, n) => { status.textContent = `GIF 生成中… ${i}/${n} フレーム`; }); const im = new Image(); im.src = URL.createObjectURL(new Blob([bytes], { type: "image/gif" })); im.alt = "書き出した森の迷宮のGIF"; outEl.prepend(im); status.textContent = `GIF ができました（${(bytes.length / 1048576).toFixed(1)} MB）。右クリック／長押しで保存できます。`; }
    catch (err) { status.textContent = `GIF の生成に失敗しました: ${err.message}`; }
    finally { busy = false; gifBtn.disabled = false; last = performance.now(); }
  });
  const webmBtn = document.getElementById("webm"); let rec = null;
  webmBtn.addEventListener("click", () => {
    if (rec) { rec.stop(); return; }
    if (!view.captureStream || typeof MediaRecorder === "undefined") { status.textContent = "このブラウザは動画録画に対応していません。GIF をお使いください。"; return; }

    rec.onstop = () => { const v = document.createElement("video"); v.src = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType || "video/webm" })); v.controls = v.loop = v.muted = v.autoplay = true; outEl.prepend(v); status.textContent = "録画しました（映像のみ）。動画の右クリック／長押しで保存できます。"; rec = null; webmBtn.textContent = "動画を録画"; };
    rec.start(); webmBtn.textContent = "録画を止める"; status.textContent = "録画中… もう一度押すと停止します。";
  });

  newGame(20260925);
  window.Mori = { S, P, get W() { return WORLD; }, frame, makeGif, startEvent, newGame, msAvg: () => msAvg };
  requestAnimationFrame(loop);
})();
