<!doctype html>
<title>Inn Window</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
  :root { color-scheme: dark; --ink: #f0ece2; --dim: #a8a092; --ground: #120e10; --panel: #1c1618; --line: #3a2e2c; --accent: #f2c46a; --cool: #8fc8e8;
    --font: "DotGothic16", "MS Gothic", "Osaka-Mono", ui-monospace, monospace; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 15px; padding-inline: 16px; padding-block: 16px 24px; box-sizing: border-box; }
  .wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .screen { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--line); }
  #view { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  h1 { margin: 0; font-size: 22px; font-weight: 400; letter-spacing: 0.08em; color: var(--accent); }
  .sub { color: var(--dim); font-size: 13px; margin: 4px 0 0; }
  .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .label { color: var(--dim); font-size: 12px; letter-spacing: 0.1em; }
  button, select { font-family: var(--font); font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); padding: 6px 10px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  button.play { border-color: #7a5a30; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--cool); outline-offset: 2px; }
  button:disabled { opacity: 0.5; cursor: wait; }
  input[type="range"] { accent-color: var(--accent); width: 110px; }
  .log { margin: 0; padding: 10px 12px; list-style: none; background: var(--panel); border: 1px solid var(--line); min-height: 120px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .log li { display: flex; gap: 8px; } .log time { color: var(--dim); font-variant-numeric: tabular-nums; flex: none; }
  .log li.st { color: var(--cool); } .log li.ev { color: var(--accent); }
  #status { color: var(--accent); font-size: 13px; min-height: 1.2em; }
  .out { display: flex; flex-direction: column; gap: 8px; } .out img, .out video { max-width: 100%; image-rendering: pixelated; border: 1px solid var(--line); }
  .hint { color: var(--dim); font-size: 12px; line-height: 1.7; margin: 0; }
</style>
<body>
<div class="wrap">
  <div class="screen"><canvas id="view" width="1440" height="810" aria-label="宿屋の二階の窓から見える、城のある町の広場"></canvas></div>
  <div>
    <h1>宿屋の窓から ― はじまりの町の一日</h1>
    <p class="sub">480×270 ピクセル / 手で選んだ色で描いた、お城と噴水広場のある小さな町</p>
  </div>
  <div class="group">
    <button id="music" class="play" aria-pressed="false">音を出す</button><label class="label" for="vol">音量</label><input id="vol" type="range" min="0" max="100" value="70">
    <button id="bgm" aria-pressed="true">音楽</button><button id="msg" aria-pressed="true">メッセージ</button><button id="pause" aria-pressed="false">一時停止</button>
    <span class="label">速さ</span><button data-sp="1" aria-pressed="true">ふつう</button><button data-sp="3" aria-pressed="false">3倍</button>
  </div>
  <div class="group" role="group" aria-label="時間帯と天気"><span class="label">時間帯</span><button data-t="auto" aria-pressed="true">自動</button><button data-t="0.115" aria-pressed="false">朝</button><button data-t="0.36" aria-pressed="false">昼</button><button data-t="0.573" aria-pressed="false">夕焼け</button><button data-t="0.76" aria-pressed="false">夜</button>
    <span class="label">天気</span><button data-w="clear" aria-pressed="true">晴れ</button><button data-w="rain" aria-pressed="false">雨</button><button data-w="snow" aria-pressed="false">雪</button></div>
  <div class="group"><label class="label" for="gifsec">GIF</label>
    <select id="gifsec"><option value="4">4秒</option><option value="8" selected>8秒</option><option value="12">12秒</option></select>
    <select id="gifscale" aria-label="GIFサイズ"><option value="1" selected>480×270</option><option value="2">960×540</option></select>
    <button id="gif">GIFを作る</button><button id="webm">動画を録画</button><span class="label" id="perf"></span></div>
  <ul class="log" id="log" aria-live="polite"></ul>
  <p class="hint">旅の宿の二階、窓辺の机から眺める町の一日です。丘の上のお城と風車、城門、鐘楼のある教会、武器屋と道具屋と酒場、噴水の広場。町の人が行き交い、ハトが舞い、ときどき勇者の一行が通りかかり、スライムも迷いこみます。朝に鐘が鳴り、夕方には灯り守りが街灯をともし、夜は見回りの兵士のたいまつが揺れます。遠い山の向こうをドラゴンが越えていくことも。「音を出す」で町の音と音楽が鳴ります（すべてブラウザ内で合成）。</p>
  <div id="status" role="status"></div><div class="out" id="out"></div>
</div>
<script>
(async () => {
  "use strict";
  try { await Promise.all([document.fonts.load('12px "DotGothic16"')]); } catch (e) { /* fall back to the system font */ }
  const W = 480, H = 270;
  const view = document.getElementById("view"), vctx = view.getContext("2d"); vctx.imageSmoothingEnabled = false;
  const PF = '"DotGothic16", "MS Gothic", monospace';

  // ---------- helpers ----------
  function canvas(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d", { willReadFrequently: true }); x.imageSmoothingEnabled = false; return [c, x]; }
  function hash(i) { let h = Math.imul((i | 0) ^ 0x9e3779b9, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
  const h2 = (x, y) => hash(Math.imul(x | 0, 73856093) ^ Math.imul(y | 0, 19349663));
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const mul = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
  const col = c => typeof c === "string" ? c : `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${clamp(a, 0, 1).toFixed(3)})`;
  const mod = (a, n) => ((a % n) + n) % n;
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  function rng(seed) { let a = seed | 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const vn = (x, s, seed) => { const i = Math.floor(x / s), f = x / s - i, u = f * f * (3 - 2 * f); return lerp(hash(i + seed * 1013), hash(i + 1 + seed * 1013), u); };
  const bump = (x, c, r) => Math.abs(x - c) < r ? 0.5 + 0.5 * Math.cos(Math.PI * (x - c) / r) : 0;
  const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const dith = (x, y, t) => t * 16 > BAY[(x & 3) + ((y & 3) << 2)];
  const pick = (r, a) => a[(r() * a.length) | 0];
  const F5 = { A: "010101111101101", B: "110101110101110", E: "111100110100111", I: "111010010010111", N: "110101101101101", O: "010101101101010", S: "011100010001110", " ": "000000000000000" };
  const [tc, tcx] = canvas(300, 24);
  const ROOFCOL = new Set(); const ck = c => ((c[0] | 0) << 16) | ((c[1] | 0) << 8) | (c[2] | 0);

  // a painter that writes straight into an ImageData so every pixel is exact
  function mk(w, h, fn) {
    const [c, x] = canvas(w, h), img = x.createImageData(w, h), d = img.data;
    const P = (a, b, cc) => { a = Math.round(a); b = Math.round(b); if (a < 0 || b < 0 || a >= w || b >= h) return; const o = (b * w + a) * 4; d[o] = cc[0]; d[o + 1] = cc[1]; d[o + 2] = cc[2]; d[o + 3] = 255; };
    const G = (a, b) => { a = Math.round(a); b = Math.round(b); if (a < 0 || b < 0 || a >= w || b >= h) return null; const o = (b * w + a) * 4; return d[o + 3] ? [d[o], d[o + 1], d[o + 2]] : null; };
    const B = (a, b, cc, t) => { const g = G(a, b); if (g) P(a, b, mixc(g, cc, t)); };
    const R = (a, b, ww, hh, cc) => { a = Math.round(a); b = Math.round(b); for (let yy = b; yy < b + Math.round(hh); yy++) for (let xx = a; xx < a + Math.round(ww); xx++) P(xx, yy, cc); };
    const E = (cx, cy, rx, ry, cc) => { for (let y = -Math.ceil(ry); y <= Math.ceil(ry); y++) { const q = 1 - (y * y) / ((ry + 0.5) * (ry + 0.5)); if (q < 0) continue; const ww = Math.round(rx * Math.sqrt(q)); R(Math.round(cx) - ww, Math.round(cy) + y, ww * 2 + 1, 1, cc); } };
    const D = (cx, cy, r, cc) => E(cx, cy, r, r, cc);
    const poly = (pts, cc) => { let y0 = 1e9, y1 = -1e9; for (const [, y] of pts) { y0 = Math.min(y0, y); y1 = Math.max(y1, y); } for (let y = Math.floor(y0); y < Math.ceil(y1); y++) { const yc = y + 0.5, xs = []; for (let i = 0; i < pts.length; i++) { const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length]; if ((ay <= yc && by > yc) || (by <= yc && ay > yc)) xs.push(ax + (yc - ay) / (by - ay) * (bx - ax)); } xs.sort((a, b) => a - b); for (let k = 0; k + 1 < xs.length; k += 2) { const a = Math.round(xs[k]), b = Math.round(xs[k + 1]); for (let xx = a; xx < b; xx++) P(xx, y, cc); } } };
    const line = (x0, y0, x1, y1, cc, wd = 1) => { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1); for (let i = 0; i <= n; i++) { const xx = Math.round(lerp(x0, x1, i / n)), yy = Math.round(lerp(y0, y1, i / n)); R(xx, yy, wd, wd, cc); } };
    const T = (s, a, b, cc, size = 12, center = false) => { tcx.clearRect(0, 0, 300, 24); tcx.font = `${size}px ${PF}`; tcx.textBaseline = "top"; tcx.fillStyle = "#000"; tcx.fillText(s, 0, 0); const ww = Math.ceil(tcx.measureText(s).width), dd = tcx.getImageData(0, 0, 300, 24).data, ox = center ? Math.round(a - ww / 2) : a; for (let j = 0; j < 24; j++) for (let i = 0; i < 300; i++) if (dd[(j * 300 + i) * 4 + 3] > 110) P(ox + i, b + j, cc); };
    const t5 = (s, a, b, cc) => { [...s].forEach((ch, i) => { const f = F5[ch] || F5[" "]; for (let k = 0; k < 15; k++) if (f[k] === "1") P(a + i * 4 + k % 3, b + ((k / 3) | 0), cc); }); };
    const p = { P, G, B, R, E, D, poly, line, T, t5, w, h };
    fn(p, w, h); x.putImageData(img, 0, 0); c.img = img; return c;
  }

  // ---------- palette ----------
  const C = {
    trunk: [104, 74, 50], trunkD: [76, 54, 40],
    leafD: [44, 92, 60], leaf: [70, 128, 70], leafL: [108, 160, 82], leafH: [156, 196, 106],
    stone: [182, 174, 162], stoneD: [146, 138, 128], stoneL: [210, 204, 192], mortar: [118, 110, 104],
    beam: [86, 60, 44], beamL: [116, 84, 60], iron: [52, 50, 56], ironL: [96, 94, 104],
    glass: [48, 60, 84], glassL: [104, 124, 152], frame: [70, 50, 38],
    gold: [226, 186, 84], goldD: [170, 126, 50],
  };
  const TILE_R = [[192, 94, 60], [150, 64, 44], [226, 132, 88]], TILE_B = [[84, 96, 120], [60, 68, 88], [120, 132, 156]], TILE_BR = [[150, 92, 60], [112, 64, 44], [184, 124, 82]], TILE_BL = [[74, 96, 168], [52, 68, 128], [112, 136, 204]], TILE_S = [[66, 74, 96], [46, 52, 70], [98, 108, 132]];
  const WARM = [[255, 204, 120], [255, 188, 100], [252, 218, 150]];

  // ---------- lit windows, lamps and flags that the scene remembers ----------
  const WINS = [], LAMPS = [], FLAGS = [], SMOKE_SRC = [];
  const HOURS = { home: [17.4, 19.2, 21, 25.5], pub: [16.4, 16.8, 26, 27], shop: [17, 17.6, 19.6, 20.8], church: [17.8, 18.2, 21.5, 22.5], castle: [17.2, 18, 30, 30], farm: [17.6, 18.8, 20.5, 23] };
  function addPane(x, y, w, h, kind, seed) { const r = hash(seed * 7 + 3), hr = HOURS[kind]; WINS.push({ x, y, w, h, on: lerp(hr[0], hr[1], r), off: lerp(hr[2], hr[3], hash(seed * 13 + 1)), morn: kind === "home" && hash(seed * 5) > 0.55 ? 5 + hash(seed) : 0, c: WARM[(r * 3) | 0], kind }); }

  // ---------- small shared drawings ----------
  function tree(p, x, base, r, rnd, pal = [C.leafD, C.leaf, C.leafL, C.leafH]) {
    p.R(x - 1, base - r - 1, 2, r + 1, C.trunk); p.P(x, base - r - 1, C.trunkD);
    const cy = base - r * 1.6, bl = []; for (let i = 0; i < 6; i++) bl.push([x + (rnd() - 0.5) * r * 1.3, cy + (rnd() - 0.5) * r * 0.9, r * 0.5 + rnd() * r * 0.3]);
    for (const [bx, by, br] of bl) p.D(bx, by + 1, br, pal[0]);
    for (const [bx, by, br] of bl) p.D(bx - 0.5, by, br - 0.8, pal[1]);
    for (const [bx, by, br] of bl) if (br > 2) p.D(bx - 1, by - 1, br - 2, pal[2]);
    for (const [bx, by, br] of bl) if (br > 2.6) p.P(bx - 1.5, by - br * 0.55, pal[3]);
  }
  function tiny(p, x, y, dark) { p.R(x - 1, y - 1, 3, 3, dark ? [52, 92, 60] : [70, 116, 70]); p.P(x - 1, y - 1, [108, 150, 88]); p.P(x, y + 2, C.trunkD); }
  function stones(p, x, y, w, h, base, seed, bh = 4) {
    const r = rng(seed); for (let yy = y, row = 0; yy < y + h; yy += bh, row++) { let xx = x - ((row * 5) % 9); while (xx < x + w) { const bw = 6 + (r() * 6 | 0), c = mixc(base, mul(base, 0.86), r()); for (let j = 0; j < bh; j++) for (let i = 0; i < bw; i++) { const px = xx + i, py = yy + j; if (px < x || px >= x + w || py >= y + h) continue; let cc = c; if (j === bh - 1 || i === bw - 1) cc = mul(base, 0.72); else if (j === 0) cc = mixc(c, [255, 250, 240], 0.18); p.P(px, py, cc); } xx += bw; } }
  }
  function plaster(p, x, y, w, h, c, seed) { p.R(x, y, w, h, c); for (let i = 0; i < w * h / 14; i++) { const a = x + hash(seed + i * 3) * w, b = y + hash(seed + i * 7 + 1) * h; p.P(a, b, hash(i + seed) > 0.5 ? mul(c, 0.93) : mixc(c, [255, 255, 255], 0.2)); } }
  function timber(p, x, y, w, h, c, seed, diag = true) {
    const bm = C.beam; p.R(x, y, w, 2, bm); p.R(x, y + h - 2, w, 2, bm); p.R(x, y, 2, h, bm); p.R(x + w - 2, y, 2, h, bm);
    const n = Math.max(1, Math.round(w / 13)); for (let i = 1; i < n; i++) p.R(x + Math.round(i * w / n) - 1, y, 2, h, bm);
    if (diag) for (let i = 0; i < n; i += 2) { const x0 = x + Math.round(i * w / n) + 1, x1 = x + Math.round((i + 1) * w / n) - 1; p.line(x0, y + h - 3, x1, y + 2, bm); p.line(x0 + 1, y + h - 3, x1 + 1, y + 2, bm); }
    for (let i = 0; i < w; i++) p.P(x + i, y, C.beamL);
  }
  function win(p, x, y, w, h, o = {}) {
    const fr = o.frame || C.frame;
    if (o.sh) { const sc = o.sh, sd = mul(sc, 0.7); for (const sx of [x - 4, x + w + 1]) { p.R(sx, y - 1, 3, h + 2, sc); for (let yy = y; yy < y + h + 1; yy += 2) p.R(sx, yy, 3, 1, sd); p.R(sx, y - 1, 3, 1, mixc(sc, [255, 255, 255], 0.25)); p.R(sx + 2, y - 1, 1, h + 2, sd); } }
    if (o.arch) { p.D(x + (w - 1) / 2, y + (w - 1) / 2, (w + 1) / 2, fr); }
    p.R(x - 1, y - 1, w + 2, h + 2, fr);
    if (o.arch) { p.D(x + (w - 1) / 2, y + (w - 1) / 2, (w - 1) / 2, o.glass || C.glass); p.R(x, y + (w - 1) / 2, w, h - (w - 1) / 2, o.glass || C.glass); } else p.R(x, y, w, h, o.glass || C.glass);
    if (!o.glass) { p.R(x, y, w, 1, C.glassL); p.P(x, y + 1, C.glassL); for (let i = 0; i < Math.min(w, h) - 2; i += 3) p.P(x + w - 2 - i, y + 2 + i, [72, 88, 116]); }
    const mx = x + (w >> 1), my = y + (h >> 1);
    if (!o.noMull) { p.R(mx, y, 1, h, fr); if (h > 7) p.R(x, my, w, 1, fr); }
    p.R(x - 2, y + h + 1, w + 4, 1, [200, 188, 166]); p.R(x - 2, y + h + 2, w + 4, 1, mul([200, 188, 166], 0.6));
    if (o.fl) { p.R(x - 1, y + h + 2, w + 2, 3, [120, 78, 48]); p.R(x - 1, y + h + 4, w + 2, 1, [90, 56, 36]); for (let i = 0; i < w + 2; i++) { const f = hash(x * 7 + i + y * 131); p.P(x - 1 + i, y + h + 1, f > 0.45 ? o.fl : [70, 130, 60]); if (f > 0.7) p.P(x - 1 + i, y + h, f > 0.85 ? mixc(o.fl, [255, 255, 255], 0.4) : [84, 146, 70]); } }
    if (o.lt) { const sd = o.seed || (x * 31 + y); if (o.noMull) addPane(x, y, w, h, o.lt, sd); else { const hs = h > 7 ? [[y, my - y], [my + 1, y + h - my - 1]] : [[y, h]]; for (const [py, ph] of hs) { addPane(x, py, mx - x, ph, o.lt, sd); addPane(mx + 1, py, x + w - mx - 1, ph, o.lt, sd); } } }
  }
  function door(p, x, y, w, h, c) {
    const d = mul(c, 0.72), l = mixc(c, [255, 255, 255], 0.18), r = w / 2;
    p.R(x - 1, y + r - 1, w + 2, h - r + 1, C.frame); p.D(x + (w - 1) / 2, y + r, r + 0.5, C.frame);
    p.D(x + (w - 1) / 2, y + r, r - 0.5, c); p.R(x, y + r, w, h - r, c);
    for (let i = 2; i < w; i += 3) p.R(x + i, y + 2, 1, h - 2, d);
    p.R(x, y + r + 2, w, 1, C.iron); p.R(x, y + h - 4, w, 1, C.iron); p.P(x + w - 3, y + h * 0.6, C.gold); p.R(x, y + r, 1, h - r, l);
  }
  function roof(p, x0, x1, y0, y1, sl, sr, pal) {
    const [b, d, l] = pal; ROOFCOL.add(ck(b)); ROOFCOL.add(ck(d)); ROOFCOL.add(ck(l));
    for (let y = y0; y <= y1; y++) {
      const xl = Math.round(x0 + (y1 - y) * sl), xr = Math.round(x1 - (y1 - y) * sr), r = y - y0, row = Math.floor(r / 3), ry = r % 3;
      for (let x = xl; x <= xr; x++) { let c = b; const k = (x + row * 2) & 3; if (ry === 2) c = d; else if (k === 0) c = ry === 0 ? d : mixc(b, d, 0.5); else if (ry === 0 && k === 2) c = l; if (x === xl || x === xr || y === y0) c = y === y0 ? l : d; p.P(x, y, c); }
    }
    p.R(x0, y1 + 1, x1 - x0 + 1, 1, mul(d, 0.6));
  }

      case "laugh": { const fl = ac.createBiquadFilter(); fl.type = "bandpass"; fl.frequency.value = 800; fl.Q.value = 1.5; fl.connect(envG(t0, 0.05, 0.012, 1.2, m)); for (let i = 0; i < 5; i++) osc("sawtooth", 210 - i * 8, t0 + i * 0.16, 0.1, fl); break; }
      case "bird": { const f0 = 2800 + Math.random() * 1400; for (let i = 0; i < 2 + (Math.random() * 3 | 0); i++) { const o = osc("sine", f0, t0 + i * 0.11, 0.08, envG(t0 + i * 0.11, 0.005, 0.012, 0.08, m)); o.frequency.exponentialRampToValueAtTime(f0 * 0.75, t0 + i * 0.11 + 0.08); } break; }
      case "owl": for (const [d, l] of [[0, 0.35], [0.5, 0.2], [0.75, 0.5]]) { const o = osc("sine", 380, t0 + d, l, envG(t0 + d, 0.05, 0.03, l, m)); o.frequency.linearRampToValueAtTime(340, t0 + d + l); } break;
      case "dog": for (const d of [0, 0.22]) { noiseHit(t0 + d, "bandpass", 700, 1.5, 0.1, 0.03, m); const o = osc("sawtooth", 320, t0 + d, 0.1, envG(t0 + d, 0.005, 0.012, 0.1, m)); o.frequency.exponentialRampToValueAtTime(200, t0 + d + 0.1); } break;
      case "meow": { const fl = ac.createBiquadFilter(); fl.type = "bandpass"; fl.frequency.value = 1200; fl.Q.value = 3; fl.connect(envG(t0, 0.05, 0.03, 0.6, m)); const o = osc("sawtooth", 520, t0, 0.6, fl); o.frequency.linearRampToValueAtTime(760, t0 + 0.2); o.frequency.linearRampToValueAtTime(480, t0 + 0.55); break; }
      case "drip": noiseHit(t0, "bandpass", 2600 + Math.random() * 1200, 6, 0.03, 0.04, m); break;
    }
  }

  // ---------- GIF (a local 256-colour table per frame) ----------
  function quantize(d) {
    const n = W * H, key = new Uint16Array(n), cnt = new Uint32Array(32768), sr = new Float64Array(32768), sg = new Float64Array(32768), sb = new Float64Array(32768);
    for (let p = 0, o = 0; p < n; p++, o += 4) { const k = ((d[o] >> 3) << 10) | ((d[o + 1] >> 3) << 5) | (d[o + 2] >> 3); key[p] = k; cnt[k]++; sr[k] += d[o]; sg[k] += d[o + 1]; sb[k] += d[o + 2]; }
    const used = []; for (let k = 0; k < 32768; k++) if (cnt[k]) used.push(k); used.sort((a, b) => cnt[b] - cnt[a]);
    const pal = new Uint8Array(768), map = new Int16Array(32768).fill(-1), m = Math.min(256, used.length);
    for (let i = 0; i < m; i++) { const k = used[i]; pal[i * 3] = sr[k] / cnt[k]; pal[i * 3 + 1] = sg[k] / cnt[k]; pal[i * 3 + 2] = sb[k] / cnt[k]; map[k] = i; }
    for (let j = m; j < used.length; j++) { const k = used[j], r = sr[k] / cnt[k], g = sg[k] / cnt[k], b = sb[k] / cnt[k]; let best = 0, bd = 1e9; for (let i = 0; i < m; i++) { const dr = pal[i * 3] - r, dg = pal[i * 3 + 1] - g, db = pal[i * 3 + 2] - b, dd = dr * dr * 2 + dg * dg * 3 + db * db; if (dd < bd) { bd = dd; best = i; } } map[k] = best; }
    const idx = new Uint8Array(n); for (let p = 0; p < n; p++) idx[p] = map[key[p]]; return { pal, idx };
  }
  function lzw(ix, out) {
    let size = 9, next = 258, cur = 0, bits = 0; const dict = new Map(), bytes = [];
    const emit = c => { cur |= c << bits; bits += size; while (bits >= 8) { bytes.push(cur & 255); cur >>>= 8; bits -= 8; } };
    emit(256); let prefix = ix[0];
    for (let i = 1; i < ix.length; i++) { const k = ix[i], key = prefix * 256 + k, v = dict.get(key); if (v !== undefined) { prefix = v; continue; } emit(prefix); if (next < 4095) { dict.set(key, next++); if (next > (1 << size) && size < 12) size++; } else { emit(256); dict.clear(); size = 9; next = 258; } prefix = k; }

    out.push(8); for (let i = 0; i < bytes.length; i += 255) { const n = Math.min(255, bytes.length - i); out.push(n); for (let j = 0; j < n; j++) out.push(bytes[i + j]); } out.push(0);

  function upscale(ix, k) { if (k === 1) return ix; const w = W * k, o = new Uint8Array(w * H * k); for (let y = 0; y < H * k; y++) { const sy = ((y / k) | 0) * W, row = y * w; for (let x = 0; x < w; x++) o[row + x] = ix[sy + ((x / k) | 0)]; } return o; }
  async function makeGif(seconds = 8, scale = 1, fps = 15, onProgress) {
    const n = Math.round(seconds * fps), w = W * scale, h = H * scale, delay = Math.round(100 / fps), out = [];
    for (const ch of "GIF89a") out.push(ch.charCodeAt(0)); out.push(w & 255, w >> 8, h & 255, h >> 8, 0x70, 0, 0);
    out.push(0x21, 0xff, 0x0b); for (const ch of "NETSCAPE2.0") out.push(ch.charCodeAt(0)); out.push(3, 1, 0, 0, 0);
    const was = S.paused; S.paused = false;
    for (let i = 0; i < n; i++) { frame(1 / fps); const q = quantize(lctx.getImageData(0, 0, W, H).data); out.push(0x21, 0xf9, 4, 4, delay & 255, delay >> 8, 0, 0, 0x2c, 0, 0, 0, 0, w & 255, w >> 8, h & 255, h >> 8, 0x87); for (let j = 0; j < 768; j++) out.push(q.pal[j]); lzw(upscale(q.idx, scale), out); if (i % 3 === 2) { onProgress && onProgress(i + 1, n); await new Promise(r => setTimeout(r, 0)); } }
    S.paused = was; out.push(0x3b); return new Uint8Array(out);
  }

  // ---------- loop & UI ----------
  let msAvg = 0;
  function frame(dt) { if (!S.paused) { for (let i = 0; i < S.speed; i++) step(dt); audioUpdate(dt); } const t0 = performance.now(); render(); msAvg = lerp(msAvg, performance.now() - t0, 0.05); vctx.drawImage(low, 0, 0, view.width, view.height); }
  let last = performance.now(), perfT = 0;
  const perf = document.getElementById("perf"), status = document.getElementById("status"), outEl = document.getElementById("out");
  function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; if (!busy) frame(dt); perfT += dt; if (perfT > 1) { perfT = 0; perf.textContent = `${clock()} ／ 描画 ${msAvg.toFixed(1)} ms`; } requestAnimationFrame(loop); }
  const mBtn = document.getElementById("music");
  mBtn.addEventListener("click", async () => { if (!Snd.ac && !audioInit()) { status.textContent = "このブラウザでは音を鳴らせません。"; return; } Snd.on = !Snd.on; if (Snd.on) { await Snd.ac.resume(); Snd.nextStep = Snd.ac.currentTime + 0.1; } else await Snd.ac.suspend(); mBtn.setAttribute("aria-pressed", String(Snd.on)); mBtn.textContent = Snd.on ? "音を止める" : "音を出す"; });
  const bgmBtn = document.getElementById("bgm"); bgmBtn.addEventListener("click", () => { Snd.bgm = !Snd.bgm; bgmBtn.setAttribute("aria-pressed", String(Snd.bgm)); });
  const msgBtn = document.getElementById("msg"); msgBtn.addEventListener("click", () => { S.msgOn = !S.msgOn; if (!S.msgOn) { S.msg = null; S.msgs.length = 0; } msgBtn.setAttribute("aria-pressed", String(S.msgOn)); });
  document.getElementById("vol").addEventListener("input", e => { Snd.vol = e.target.value / 100; if (Snd.n) Snd.n.master.gain.setTargetAtTime(Snd.vol, Snd.ac.currentTime, 0.05); });
  const pBtn = document.getElementById("pause"); pBtn.addEventListener("click", () => { S.paused = !S.paused; pBtn.setAttribute("aria-pressed", String(S.paused)); pBtn.textContent = S.paused ? "再生" : "一時停止"; });
  const tB = [...document.querySelectorAll("[data-t]")]; tB.forEach(b => b.addEventListener("click", () => { S.todFix = b.dataset.t === "auto" ? null : +b.dataset.t; if (S.todFix != null) S.tod = S.todFix; S.lastH = hourOf(S.tod); tB.forEach(x => x.setAttribute("aria-pressed", String(x === b))); }));
  const WX = { clear: "雨があがった。", rain: "雨が降りだした。\n石畳がしっとり濡れていく。", snow: "雪が降ってきた。\n町が白く染まっていく。" };
  const wB = [...document.querySelectorAll("[data-w]")]; wB.forEach(b => b.addEventListener("click", () => { if (S.weather !== b.dataset.w) { const was = S.weather; S.weather = b.dataset.w; say(b.dataset.w === "clear" ? (was === "snow" ? "雪がやんだ。" : WX.clear) : WX[b.dataset.w], "st"); } wB.forEach(x => x.setAttribute("aria-pressed", String(x === b))); }));
  const sB = [...document.querySelectorAll("[data-sp]")]; sB.forEach(b => b.addEventListener("click", () => { S.speed = +b.dataset.sp; sB.forEach(x => x.setAttribute("aria-pressed", String(x === b))); }));
  const gifBtn = document.getElementById("gif");
  gifBtn.addEventListener("click", async () => {
    busy = true; gifBtn.disabled = true;
    try { const bytes = await makeGif(+document.getElementById("gifsec").value, +document.getElementById("gifscale").value, 15, (i, n) => { status.textContent = `GIF 生成中… ${i}/${n} フレーム`; }); const im = new Image(); im.src = URL.createObjectURL(new Blob([bytes], { type: "image/gif" })); im.alt = "書き出した宿屋の窓のGIF"; outEl.prepend(im); status.textContent = `GIF ができました（${(bytes.length / 1048576).toFixed(1)} MB）。右クリック／長押しで保存できます。`; }
    catch (err) { status.textContent = `GIF の生成に失敗しました: ${err.message}`; }
    finally { busy = false; gifBtn.disabled = false; last = performance.now(); }
  });
  const webmBtn = document.getElementById("webm"); let rec = null;
  webmBtn.addEventListener("click", () => {
    if (rec) { rec.stop(); return; }
    if (!view.captureStream || typeof MediaRecorder === "undefined") { status.textContent = "このブラウザは動画録画に対応していません。GIF をお使いください。"; return; }
    const chunks = [], type = ["video/webm;codecs=vp9", "video/webm", "video/mp4"].find(t => MediaRecorder.isTypeSupported(t)) || "";
    rec = new MediaRecorder(view.captureStream(30), type ? { mimeType: type, videoBitsPerSecond: 8e6 } : undefined);
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => { const v = document.createElement("video"); v.src = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType || "video/webm" })); v.controls = v.loop = v.muted = v.autoplay = true; outEl.prepend(v); status.textContent = "録画しました（映像のみ）。動画の右クリック／長押しで保存できます。"; rec = null; webmBtn.textContent = "動画を録画"; };
    rec.start(); webmBtn.textContent = "録画を止める"; status.textContent = "録画中… もう一度押すと停止します。";
  });
  S.tod = 0.12; S.lastH = hourOf(S.tod); S.msgOn = false; S.quiet = true; for (let i = 0; i < 30 * 45; i++) step(1 / 30); S.quiet = false; S.party = null; S.next.party = 12; S.msgOn = true; S.msgs.length = 0; S.msg = null; logEl.textContent = "";
  say("宿屋の二階で 目がさめた。\n窓の外は はじまりの町。", "st");
  window.Inn = { S, frame, makeGif, render, step, msAvg: () => msAvg, startParty };
  requestAnimationFrame(loop);
})();
